[package]
name         = "mako-as4"
version.workspace     = true
description  = "BDEW AS4-Profil 1.2 for German energy market communication on asx-rs: partners, services, file names and the retry window"
authors.workspace     = true
edition.workspace     = true
license.workspace     = true
repository.workspace  = true
homepage.workspace     = true
rust-version.workspace = true
keywords     = ["as4", "ebms", "energy", "mako", "bdew"]
categories   = ["network-programming", "encoding"]

[dependencies]
asx-rs = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
asx-rs = { workspace = true, features = ["test-util"] }

[lints]
workspace = true

# The package `asx-rs` is imported under its library name `asx`, which
# cargo-machete does not map back to the package.
[package.metadata.cargo-machete]
ignored = ["asx-rs"]
