[package]
name             = "mako-obs"
version.workspace = true
description      = "Business-process observability for German energy market communication: process projections, KPIs and BNetzA reports. No I/O"
categories       = ["data-structures"]
keywords         = ["observability", "kpi", "energy", "mako", "bnetza"]
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace     = true
rust-version.workspace = true

[features]
default = []
## Enables in-memory repository implementations for tests.
testing = []

[dependencies]
mako-events  = { workspace = true }
thiserror    = { workspace = true }
serde        = { workspace = true }
time         = { workspace = true }
uuid         = { workspace = true }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }

[lints]
workspace = true
