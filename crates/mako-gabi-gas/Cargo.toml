[package]
name         = "mako-gabi-gas"
version.workspace     = true
description  = "GaBi Gas workflows for German gas balancing: allocation, MMM settlement and capacity invoices (BK7-24-01-008)"
homepage.workspace     = true
authors.workspace     = true
edition.workspace     = true
license.workspace     = true
repository.workspace  = true
rust-version.workspace = true
keywords     = ["gabi-gas", "gas", "balancing", "mako", "dvgw"]
categories   = ["data-structures"]

[dependencies]
mako-events  = { workspace = true }
dvgw-edi     = { workspace = true }
mako-engine  = { workspace = true }
mako-fristen = { workspace = true }
mako-invoic  = { workspace = true }
rust_decimal = { workspace = true }
serde        = { workspace = true, features = ["derive"] }
serde_json   = { workspace = true }
time         = { workspace = true }

[dev-dependencies]
mako-engine         = { workspace = true, features = ["testing"] }
serde_json          = { workspace = true }
tokio               = { version = "1", features = ["full"] }

[lints]
workspace = true
