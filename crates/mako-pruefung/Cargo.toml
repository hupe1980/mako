[package]
name             = "mako-pruefung"
version.workspace = true
description      = "Decides the Antwortnachricht a German energy market participant owes — the BDEW answer rules for GPKE and GeLi Gas, as a pure library"
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace     = true
rust-version.workspace = true
readme           = "README.md"
keywords         = ["energy", "mako", "bdew", "gpke", "edifact"]
categories       = ["data-structures"]

[features]
default = ["role-nb", "role-lf", "role-msb", "role-esa", "role-mabis", "role-emob"]
## The trees whose prüfende Rolle is the Netzbetreiber (`E_0622`, `E_0607`).
role-nb = ["dep:mako-markt"]
## The trees whose prüfende Rolle is the Lieferant (`E_0609`, `E_0624`, `E_0614`,
## and the Gas Codelisten `E_3001`, `E_3002`, `E_3020`).
role-lf = []
## The WiM Messstellenbetrieb trees (`E_0200`, `E_0201`, `E_0202`, `E_0203`)
## and the ESA-Bestellung trees the MSB answers (`E_0252`, `E_0254`, `E_0256`,
## `E_0257`). Two of them are answered by the MSB and two by the NB, so the
## feature names the process family rather than one Marktrolle.
##
## Implies `role-esa`: the MSB's own answers to an ESA Wertebestellung live
## there, with the rest of that relationship.
role-msb = ["role-esa"]
## Every tree of the ESA relationship (WiM Strom Teil 2 Kap. 4): the
## Wertebestellung the MSB answers (`E_0252`, `E_0254`, `E_0256`, `E_0257`) and
## the UC 4.5 billing round trip the ESA answers (`E_0264`–`E_0267`).
##
## Its own feature because a pure ESA deployment needs it *without* the WiM
## Messstellenbetrieb trees of `role-msb` — the ESA has no Messstellenbetrieb.
role-esa = []
## The MaBiS (BK6-24-174 Anlage 3) and Redispatch-Ausfallarbeit trees. Both the
## NB-side and the LF-side trees, because MaBiS keys its trees on the
## *Summenzeitreihe* rather than on one Marktrolle and a combined deployment
## checks both.
role-mabis = []
## The NZR-EMob / Modell 2 trees (`E_0510`–`E_0513`, EBD 4.3 Kap. 17): the VNB's
## answers to an Anmeldung/Abmeldung in Modell 2 and the LF's answer to the
## Beendigung der Zuordnung. Both sides, because the VNB's `E_0510` Prüfschritt 1
## reads the LF's `E_0511` answer and a combined deployment walks both.
##
## The Zuordnung ZP der NGZ zur NZR (55235–55237) is answered from `role-mabis`
## (`E_0102`/`E_0103`), so a full Modell-2 deployment enables both features.
role-emob = []
## Enable in-memory test doubles. Must never appear in production builds.
testing = []

[dependencies]
mako-fristen = { workspace = true }
mako-markt  = { workspace = true, optional = true }

# Exact percent arithmetic for the E_0623 Tranchen-Prüfschritte: shares are
# summed and compared against the share the LFN registered, and a binary float
# cannot hold 33.3 % — a comparison that is off by an ulp refuses a valid
# Anmeldung (A54) on arithmetic rather than on the market's facts.
rust_decimal = { workspace = true }
serde        = { workspace = true }
serde_json   = { workspace = true }
thiserror    = { workspace = true }
time         = { workspace = true }
time-tz      = { workspace = true }
uuid         = { workspace = true }

[dev-dependencies]
serde_json   = { workspace = true }
time         = { workspace = true }
# Test-only, and deliberately not a real dependency: the trees here decide
# *which* Antwortcodes oblige a `SG4 STS+Z35`, and `edi-energy` enforces it at
# render time. Neither may depend on the other — a domain crate that pulled in
# the wire library would make every role build carry it — so the two lists are
# pinned together by a test instead.
edi-energy   = { workspace = true, features = ["utilmd"] }
