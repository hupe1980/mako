[package]
name         = "energy-billing"
description  = "Pure multi-product retail utility billing for German markets. STROM, GAS, WAERME, WASSER (Trinkwasser + gesplittete Abwassergebühr), SOLAR, EEG, EINSPEISUNG, §14a WAERMEPUMPE/WALLBOX, HEMS, EMOBILITY, ENERGIEDIENSTLEISTUNG, §41a EPEX dynamic. Regulatory rates: §3 StromStG, §2 EnergieStG, BEHG CO₂. BO4E Rechnung JSON. Zero I/O, zero async, no float money."
version.workspace      = true
authors.workspace      = true
edition.workspace      = true
license.workspace      = true
repository.workspace   = true
rust-version.workspace = true

[dependencies]
# BO4E bridge (feature `bo4e`): typed Rechnung/Steuerbetrag construction.
rubo4e = { workspace = true, optional = true }
billing             = { workspace = true }
# EN 16931 semantic model bridge (feature `en16931`): `Invoice::to_en16931()`.
en16931             = { workspace = true, optional = true }
eeg-billing         = { workspace = true, features = ["serde"], optional = true }
rust_decimal        = { workspace = true }
serde               = { workspace = true, features = ["derive"] }
thiserror           = { workspace = true }
serde_json          = { workspace = true }
time                = { workspace = true }
time-tz             = { version = "2", features = ["db"] }
tracing             = { version = "0.1", default-features = false }

[features]
## Enable EEG settlement delegation to `eeg-billing`.
## Required for `EegProvider` full-accuracy path (`quantities.eeg_full`).
eeg = ["dep:eeg-billing"]
## BO4E bridge: `Invoice::to_rechnung()`/`to_rechnung_json()`,
## `TaxSubtotal::to_bo4e()`, `InvoiceType::rechnungstyp()`. Off by default so
## the core billing engine stays rubo4e-free (billing-crate policy).
bo4e = ["dep:rubo4e"]
## EN 16931 bridge: `Invoice::to_en16931(seller, buyer)` → `en16931::Invoice`,
## the semantic model that `en16931-formats` renders to XRechnung/CII/UBL/ZUGFeRD.
## The mapping is at this layer (full per-position fidelity) rather than via BO4E.
en16931 = ["dep:en16931"]
## Enable all optional features.
full = ["eeg", "bo4e", "en16931"]

[dev-dependencies]
time = { workspace = true, features = ["macros"] }
serde_json = { workspace = true }
proptest   = "1"
# Test-only: the BO4E gate (see grid-billing for the reasoning, including why
# this is path-only rather than `workspace = true`).
mako-markt = { path = "../mako-markt" }

[[test]]
name = "calculator_tests"
path = "tests/calculator_tests.rs"
required-features = ["bo4e"]

[[test]]
name = "proptest_invoice"
path = "tests/proptest_invoice.rs"

[[test]]
name = "golden_scenarios"
path = "tests/golden_scenarios.rs"
required-features = ["bo4e"]

[[test]]
name = "en16931_conformance"
path = "tests/en16931_conformance.rs"
required-features = ["en16931"]
