[package]
name         = "mako-mabis"
version.workspace     = true
description  = "MABIS process engine for German electricity market balance group accounting (Marktprozesse Bilanzkreisverantwortlicher)"
authors.workspace     = true
edition.workspace     = true
license.workspace     = true
repository.workspace  = true
rust-version.workspace = true
keywords     = ["mabis", "bilanzkreis", "edifact", "energy", "mako"]
categories   = ["data-structures"]

[dependencies]
mako-fristen = { workspace = true }
mako-engine  = { workspace = true }
metering     = { workspace = true, features = ["serde"] }
# The validated BDEW/ENTSO-E identifier types. A Bilanzkreis (EIC type `X`)
# and a Bilanzierungsgebiet (type `Y`) are told apart here rather than by
# convention — MSCONS carries both as free text.
rubo4e       = { workspace = true }
rust_decimal = { workspace = true }
serde        = { workspace = true }
serde_json   = { workspace = true }
thiserror    = { workspace = true }
time         = { workspace = true }

[dev-dependencies]
# edi-energy is only needed for integration tests.
# Production code uses only mako-engine's ProfileRequirement for startup checks.
edi-energy  = { workspace = true, features = ["mscons"] }
# testing feature enables InMemoryXxx stores and EngineBuilder::new().
mako-engine = { workspace = true, features = ["testing"] }
serde_json  = { workspace = true }
time        = { workspace = true }
tokio       = { version = "1", features = ["full"] }
