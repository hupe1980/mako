[package]
name        = "grid-billing"
description = "Role-neutral German grid invoice calculation — NNE, Konzessionsabgabe, Mehr-/Mindermengen and Messstellenbetrieb. Zero I/O, no float money."
version.workspace     = true
authors.workspace     = true
edition.workspace     = true
license.workspace     = true
repository.workspace  = true
homepage.workspace     = true
rust-version.workspace = true

[dependencies]
billing        = { workspace = true }
rust_decimal   = { workspace = true }
serde          = { workspace = true, features = ["derive"] }
serde_json     = { workspace = true, optional = true }
thiserror      = { workspace = true }
time           = { workspace = true }
rubo4e         = { workspace = true, optional = true }

[features]
default = []
# BO4E bridge: renders an InvoiceDocument as a rubo4e Rechnung (positions,
# Artikelnummern, calculation traces, legal references, settlement warnings).
# Off by default so the core settlement engine stays rubo4e-free.
bo4e = ["dep:rubo4e", "dep:serde_json"]

[dev-dependencies]
proptest            = "1"
# The unit tests assert the serde shape of the settlement value objects, which
# the `bo4e` feature otherwise supplies. As a dev-dependency the test suite
# builds with default features too, not only under `--all-features`.
serde_json          = { workspace = true }
# Test-only: the BO4E gate, so every Rechnung this crate emits is asserted
# against the same rules mako applies to one it receives. A dev-dependency
# keeps the shipped engine as rubo4e-light as the `bo4e` feature makes it.
# Test-only, and **path-only on purpose**: the release workflow publishes this
# crate *before* `mako-markt`, and a dev-dependency carrying a version
# requirement has to resolve on crates.io at publish time. Cargo strips a
# dev-dependency with no version, so this compiles the tests locally and
# disappears from the published manifest.
mako-markt          = { path = "../mako-markt" }

