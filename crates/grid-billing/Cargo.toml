[package]
name        = "grid-billing"
description = "Role-neutral grid invoice calculation: NNE/KA/MMM/MSB (PIDs 31001/31002/31005/31006/31009/31011) — used by netzbilanzd (NB) and invoicd (LF selbstausstellen). §14a ToU HT/NT. Zero I/O, no float money. Optional `bo4e` feature renders the InvoiceDocument as a rubo4e Rechnung."
version.workspace     = true
authors.workspace     = true
edition.workspace     = true
license.workspace     = true
repository.workspace  = true
rust-version.workspace = true

[dependencies]
billing        = { workspace = true }
rust_decimal   = { workspace = true }
serde          = { workspace = true, features = ["derive"] }
serde_json     = { workspace = true, optional = true }
thiserror      = { workspace = true }
time           = { workspace = true }
rubo4e         = { workspace = true, optional = true }

[features]
default = []
# BO4E bridge: renders an InvoiceDocument as a rubo4e Rechnung (positions,
# Artikelnummern, calculation traces, legal references, settlement warnings).
# Off by default so the core settlement engine stays rubo4e-free.
bo4e = ["dep:rubo4e", "dep:serde_json"]

[dev-dependencies]
proptest            = "1"

