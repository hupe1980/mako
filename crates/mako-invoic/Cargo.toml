[package]
name         = "mako-invoic"
version.workspace      = true
description  = "The INVOIC settle/dispute state machine shared by the German energy market billing processes"
authors.workspace      = true
edition.workspace      = true
license.workspace      = true
repository.workspace   = true
homepage.workspace     = true
rust-version.workspace = true
keywords     = ["invoic", "remadv", "comdis", "mako", "bdew"]
categories   = ["data-structures"]

[dependencies]
mako-engine = { workspace = true }
rubo4e      = { workspace = true }
# The REMADV `SG5 MOA` amounts are copied from the answered invoice, and money
# is never a float.
rust_decimal = { workspace = true }
serde       = { workspace = true }
serde_json  = { workspace = true }

[dev-dependencies]
mako-engine = { workspace = true, features = ["testing"] }
serde_json  = { workspace = true }
tokio       = { version = "1", features = ["full"] }

[lints]
workspace = true
