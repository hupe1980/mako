[package]
name         = "energy-api"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace     = true
rust-version.workspace = true
description  = "BDEW API-Webdienste Strom: typed REST and WebSocket clients and an Axum server for the German energy market"
keywords     = ["bdew", "energy", "api", "ims", "mako"]
categories   = ["web-programming", "api-bindings"]

# ── Feature flags ────────────────────────────────────────────────────────────
#
#  client    — MaLo-Ident and directory HTTP clients (reqwest + rustls)
#  server    — Axum-based server router factories
#  websocket — WebSocket subscription client (tokio-tungstenite)
#
#  The ECDSA P-256 content signing (`transport::content_security`) and the
#  directory JWS (`transport::jws`) are always compiled: they are not optional.
#
[features]
default   = []
client    = ["dep:reqwest"]
server    = ["dep:axum"]
websocket = ["dep:tokio-tungstenite", "dep:futures-util", "dep:tokio"]

[dependencies]
serde      = { version = "1", features = ["derive"] }
# Validated BDEW identifiers (MaLo/MeLo/NeLo/SR/TR/Marktpartner). The
# `identifiers` feature pulls only the identifier types and their serde impls,
# not the BO4E schema. Deserialization enforces the check digit, so an
# invalid ID is rejected at the API boundary rather than propagating.
rubo4e     = { workspace = true }
serde_json = { workspace = true }
thiserror  = { workspace = true }
time       = { workspace = true, features = ["serde", "formatting", "parsing"] }
uuid       = { version = "1", features = ["v4", "serde"] }
url        = { version = "2", features = ["serde"] }

# ── client feature ───────────────────────────────────────────────────────────
reqwest = { version = "0.13", features = ["json", "rustls", "query"], default-features = false, optional = true }

# ── server feature ───────────────────────────────────────────────────────────
axum  = { version = "0.8", optional = true }

# ── websocket feature ────────────────────────────────────────────────────────
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-native-roots"], optional = true }
futures-util      = { version = "0.3", optional = true }
tokio             = { version = "1", features = ["rt", "sync"], optional = true }

# ── Content signing and directory JWS (always compiled) ──────────────────────
p256      = { version = "0.13", features = ["ecdsa", "pem"] }
sha2      = { version = "0.10" }
base64ct  = { version = "1", features = ["alloc"] }
serde_jcs = { version = "0.1" }

[dev-dependencies]
serde_json = { workspace = true }
tokio      = { version = "1", features = ["full"] }

[lints]
workspace = true
