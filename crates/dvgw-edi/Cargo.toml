[package]
name         = "dvgw-edi"
version.workspace     = true
description  = "DVGW EDIFACT parser, validator and writer for the German gas transport and balancing market (ALOCAT, NOMINT, NOMRES, SSQNOT)"
authors.workspace     = true
edition.workspace     = true
license.workspace     = true
repository.workspace  = true
rust-version.workspace = true
keywords     = ["dvgw", "edifact", "gas", "alocat", "nomint"]
categories   = ["parser-implementations", "encoding"]

[dependencies]
edifact-rs   = { workspace = true }
rust_decimal = { workspace = true }
time         = { workspace = true }
serde        = { workspace = true, optional = true }
thiserror    = { workspace = true }
tracing      = { version = "0.1", default-features = false, features = ["log", "attributes"], optional = true }

[features]
default  = []
## Enables `serde::Serialize` / `Deserialize` on all public value types.
serde    = ["dep:serde", "time/serde-well-known"]
## Enables structured tracing spans.
tracing  = ["dep:tracing"]
