[package]
name        = "eeg-billing"
description = "EEG and KWKG feed-in settlement for German renewable plants, EEG 2000 to EEG 2023. No I/O, no float money"
categories  = ["finance"]
keywords    = ["eeg", "kwkg", "renewables", "settlement", "energy"]
version.workspace     = true
authors.workspace     = true
edition.workspace     = true
license.workspace     = true
repository.workspace  = true
homepage.workspace     = true
rust-version.workspace = true

[dependencies]
billing             = { workspace = true }
grid-billing        = { workspace = true }
rubo4e              = { workspace = true, optional = true }
rust_decimal        = { workspace = true }
serde               = { workspace = true, features = ["derive"], optional = true }
time                = { workspace = true }
thiserror           = { workspace = true }

[features]
default = []
serde   = ["dep:serde", "rust_decimal/serde"]
## BO4E bridge: render an EEG settlement as a §14 UStG Gutschrift
## (`rubo4e::current::Rechnung`). Same per-crate pattern as
## `energy-billing`/`grid-billing` — no shared bridge crate.
bo4e    = ["dep:rubo4e"]

[dev-dependencies]
proptest = "1"
time = { workspace = true, features = ["macros"] }
# Test-only: the BO4E gate (see grid-billing for the reasoning, including why
# this is path-only rather than `workspace = true`).
mako-markt = { path = "../mako-markt" }

[lints]
workspace = true
