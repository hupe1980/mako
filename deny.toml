[graph]
# CI runs `cargo deny check --all-features`, and a local run that does not is a
# different graph: an optional feature (agentd's `bedrock`, which pulls the AWS
# SDK) can add duplicates that only the CI graph sees. Declared here so both
# resolve the same set.
all-features = true
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "aarch64-unknown-linux-gnu" },
    { triple = "x86_64-apple-darwin" },
    { triple = "aarch64-apple-darwin" },
    { triple = "x86_64-pc-windows-msvc" },
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CDLA-Permissive-2.0",
    "MIT-0",
    # 0BSD: public-domain-like permissive license, used by mailparse and quoted_printable
    # (transitive deps via asx-rs). Acceptable for commercial use — effectively no conditions.
    "0BSD",
    # bzip2-1.0.6: bzip2 compression library license — BSD-like, no restrictions.
    # Introduced as a transitive dep via parquet/iceberg compression codecs.
    "bzip2-1.0.6",
    # CC0-1.0: Creative Commons Zero — public domain dedication.
    # Used by some data/test crates as transitive deps.
    "CC0-1.0",
    # The identifiers below are introduced by the Desk's npm tree (desk/), which
    # `cargo xtask check-desk` holds to this same list.
    # MPL-2.0: file-level copyleft — obligations attach to modified MPL files
    # only. lightningcss, the CSS transformer of vite 8 and @tailwindcss/vite: a
    # build tool, not in the Desk bundle.
    "MPL-2.0",
    # Unlicense: public-domain dedication. isbot, via @tanstack/react-router.
    "Unlicense",
    # BlueOak-1.0.0: permissive. lru-cache, via jsdom (Desk unit tests).
    "BlueOak-1.0.0",
    # Python-2.0 / PSF-2.0: permissive. argparse, via js-yaml via
    # json-schema-to-typescript (the Desk's type generation).
    "Python-2.0",
    "PSF-2.0",
]
confidence-threshold = 0.9

[bans]
# Hard-deny multiple major-version duplicates. Any new duplicate requires an
# explicit `skip` entry with a justification comment. This prevents silent
# binary-size bloat and version-skew bugs in serialization/crypto crates.
multiple-versions = "deny"
# Deny wildcard version constraints for external (registry) dependencies.
# Path-only workspace-internal deps are exempt (`allow-wildcard-paths = true`)
# because they have no semver version to specify.
wildcards = "deny"
allow-wildcard-paths = true
deny = [
    # openssl-sys (and its peers openssl, openssl-macros) is banned for general
    # TLS use. The workspace uses rustls-tls for its HTTP clients (reqwest,
    # object_store). openssl is an ACCEPTED exception inside asx-rs, the AS4
    # layer: its WS-Security XML cryptography (ECDSA signing, ECDH-ES, X.509
    # handling) and, since 0.17, its built-in AS4 HTTPS client — mutual TLS on
    # BrainpoolP256r1 under BSI TR-03116-3 (BDEW AS4-Profil 1.2 Kap. 2.2.6.1),
    # which rustls cannot negotiate.
    #
    # The `wrappers` field permits a banned crate when it is pulled only by the
    # listed direct parents.  Provenance chain:
    #   asx-rs → openssl → openssl-sys
    #   asx-rs → tokio-openssl → openssl, openssl-sys (the client's async TLS stream)
    #   asx-rs → openssl → openssl-macros (proc-macro companion)
    # If any OTHER crate pulls openssl into the tree, cargo deny will still fail.
    { name = "openssl",        wrappers = ["asx-rs", "tokio-openssl"], reason = "C-linked OpenSSL forbidden for general TLS; permitted only inside asx-rs — WS-Security crypto and the AS4 Brainpool mutual-TLS client" },
    { name = "openssl-sys",    wrappers = ["openssl", "tokio-openssl"], reason = "C-binding companion to openssl 0.10; same asx-rs exception" },
    { name = "openssl-macros", wrappers = ["openssl"],      reason = "proc-macro companion to openssl 0.10; same asx-rs exception" },
]

# ── Skip entries for unavoidable transitive duplicates ───────────────────────
# Each entry names the crates that pull the older copy and what would resolve
# it. `cargo deny check` warns on a skip that no longer matches, so an entry is
# removed when its duplicate goes.

# ── jsonwebtoken (mako-service OIDC) on the 2022 RustCrypto generation ──────
# jsonwebtoken 11.1 verifies on p256 0.13 / ed25519-dalek 2 / rsa 0.9, which
# pull the sha2 0.10 / digest 0.10 chain; energy-api signs on the patched p256
# 0.14, asx-rs, lopdf and agentplane are on sha2 0.11 / digest 0.11. The two
# chains share no key material. Resolves when jsonwebtoken moves to
# elliptic-curve 0.14.
[[bans.skip-tree]]
name    = "p256"
version = "0.13"
reason  = "jsonwebtoken 11.1 verifies on p256 0.13 while energy-api signs on the patched 0.14; the old subtree is verification-only."

[[bans.skip]]
name    = "ed25519-dalek"
version = "2.2"
reason  = "jsonwebtoken 11 (JWT verification) pins ed25519-dalek 2; agentplane's journal signing (agentd) uses 3."

[[bans.skip]]
name    = "ed25519"
version = "2.2"
reason  = "Transitive of ed25519-dalek 2 — see the ed25519-dalek skip."

[[bans.skip]]
name    = "curve25519-dalek"
version = "4.1"
reason  = "Transitive of ed25519-dalek 2 — see the ed25519-dalek skip."

[[bans.skip]]
name    = "signature"
version = "2.2"
reason  = "ecdsa 0.16, ed25519 2 and rsa 0.9 (jsonwebtoken's verifiers) use signature 2; the p256 0.14 / ed25519-dalek 3 chain uses 3."

[[bans.skip]]
name    = "pem"
version = "=3"
reason  = "jsonwebtoken 11 (mako-service JWT/OIDC) pins pem 3; reqsign-azure-storage (opendal → meterstore/edmd cold tier) pulls pem 4. Both only parse PEM at their own boundary. Resolves when jsonwebtoken bumps to pem 4."

[[bans.skip]]
name    = "sha2"
version = "0.10"
reason  = "sqlx, jsonwebtoken, krafka, meterstore and mako's own crates use sha2 0.10; asx-rs, lopdf, agentplane and p256 0.14 use 0.11."

[[bans.skip]]
name    = "sha2"
version = "0.11"
reason  = "asx-rs, lopdf, agentplane and p256 0.14 (RustCrypto 2024 generation) use sha2 0.11 — see the sha2 0.10 entry."

[[bans.skip]]
name    = "digest"
version = "0.10"
reason  = "Companion to sha2 0.10, hmac 0.12 and ecdsa 0.16; the sha2 0.11 chain uses digest 0.11."

[[bans.skip]]
name    = "block-buffer"
version = "0.10"
reason  = "Companion to digest 0.10; digest 0.11 uses block-buffer 0.12."

[[bans.skip]]
name    = "crypto-common"
version = "0.1"
reason  = "Companion to digest 0.10 and cipher 0.4; the 2024 generation uses crypto-common 0.2."

[[bans.skip]]
name    = "cpufeatures"
version = "0.2"
reason  = "sha2 0.10, sha1 0.10, aes 0.8 and curve25519-dalek 4 use cpufeatures 0.2; their 2024-generation successors use 0.3."

[[bans.skip]]
name    = "hmac"
version = "0.12"
reason  = "jsonwebtoken, krafka, meterstore, mako-service and rfc6979 0.4 (p256 0.13) use hmac 0.12; sqlx-postgres 0.9, reqsign, agentplane and rfc6979 0.6 (p256 0.14) use 0.13."

[[bans.skip]]
name    = "hmac"
version = "0.13"
reason  = "The 2024-generation side of the hmac 0.12 entry."

[[bans.skip]]
name    = "const-oid"
version = "0.9"
reason  = "der 0.7, rsa 0.9, x509-cert and digest 0.10 use const-oid 0.9; der 0.8 and digest 0.11 use 0.10."

[[bans.skip]]
name    = "sha1"
version = "0.10"
reason  = "tungstenite 0.29 (energy-api, makod), aws-config and sqlx-mysql 0.8 use sha1 0.10; reqsign (opendal, edmd cold tier) uses 0.11."

