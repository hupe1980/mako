version = "0.1"
reason  = "miette 7 depends directly on unicode-width 0.1 and pulls 0.2 via textwrap. Resolves when miette moves fully to 0.2."

[[bans.skip]]
name    = "syn"
version = "2.0"
reason  = "async-trait, clap_derive, serde_derive, thiserror-impl and most current proc macros use syn 3; the rest of the proc-macro graph is still on syn 2."

[[bans.skip]]
name    = "spin"
version = "=0.9"
reason  = "flume, lazy_static and wasmi use spin 0.9; crc-fast uses 0.10."

[[bans.skip]]
name    = "lz4_flex"
version = "0.11"
reason  = "krafka (edmd Kafka ingest) pins lz4_flex 0.11; arrow-ipc and parquet use 0.13."

[[bans.skip]]
name    = "dashmap"
version = "5"
reason  = "governor 0.6 (mako-service rate limit) pins dashmap 5; datafusion and iceberg-datafusion use dashmap 6."

[[bans.skip]]
name    = "object"
version = "0.39"
reason  = "ar_archive_writer 0.5 (build dependency of psm, via stacker → cedar) pins object 0.39; backtrace uses 0.40."

[[bans.skip]]
name    = "base64"
version = "0.23"
reason  = "reqwest 0.13, rmcp, agentplane, object_store and opendal use base64 0.23; mako's own crates, sqlx, jsonwebtoken and arrow use 0.22."

# ── rustix 0.38 / socket2 0.5 (prometheus, krafka) ───────────────────────────
[[bans.skip]]
name    = "rustix"
version = "0.38"
reason  = "prometheus 0.14 → procfs 0.17 (mako-service metrics) pins rustix 0.38; the rest of the graph uses rustix 1."

[[bans.skip]]
name    = "linux-raw-sys"
version = "0.4"
reason  = "Companion to rustix 0.38; rustix 1 uses linux-raw-sys 0.12."

[[bans.skip]]
name    = "socket2"
version = "0.5"
reason  = "krafka (edmd Kafka ingest) pins socket2 0.5; tokio uses 0.6."

[[bans.skip]]
name    = "windows-sys"
version = "0.52"
reason  = "socket2 0.5 (krafka) and ring use windows-sys 0.52; the rest of the graph uses 0.59/0.61."

[[bans.skip]]
name    = "windows-sys"
version = "0.59"
reason  = "rustix 0.38 (prometheus), fd-lock and fs4 use windows-sys 0.59; tokio and rustix 1 use 0.61."

[[bans.skip]]
name    = "windows-link"
version = "0.1"
reason  = "The windows 0.61 crate family uses windows-link 0.1; newer Windows crates use 0.2."

[advisories]
# Every ID below carries one statement in `release/vex.json` (OpenVEX), the
# machine-readable form of the reason beside it; `cargo xtask check-vex` holds
# the two lists equal and refuses a statement naming another crate than the
# advisory does.
ignore = [
    # RUSTSEC-2025-0141: bincode 1.x unmaintained.
    # Pulled transitively by slatedb → foyer and by typst → syntect. The crate is
    # functionally complete (the authors declared v1.3.3 final); it serializes
    # foyer's internal cache entries and syntect's bundled syntax sets, never
    # user-controlled input. Resolve when both move to bincode 2.x or away.
    { id = "RUSTSEC-2025-0141", reason = "bincode 1.x pulled by slatedb/foyer and typst/syntect; functionally complete, no CVE, no user-controlled input" },
    # RUSTSEC-2024-0436: paste macro unmaintained (dtolnay archived the repo).
    # The crate is syntactically stable; no security surface. Used by foyer
    # (slatedb), parquet and typst's hayagriva/biblatex at compile time. Resolve
    # when those migrate away.
    { id = "RUSTSEC-2024-0436", reason = "paste macro pulled by foyer (slatedb), parquet and hayagriva (typst); no CVE, compile-time only, no runtime security surface" },
    # RUSTSEC-2026-0192: ttf-parser unmaintained (harfbuzz team migrating to skrifa).
    # No CVE, no security vulnerability — maintenance announcement only.
    # Pulled by outputd → typst: Typst's font reader. The fonts it reads are the
    # bundled typst-assets set; no template or request can supply one.
    # Resolution: drops out when typst moves to skrifa.
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser maintenance announcement only (no CVE); Typst's font reader in outputd, fed only the bundled typst-assets fonts" },
    # RUSTSEC-2026-0194 / RUSTSEC-2026-0195: quick-xml O(N²) attribute-dedup scan
    # and unbounded namespace-declaration allocation, both patched in 0.41.
    # Every path that parses XML with quick-xml from a counterparty is on 0.41 or
    # later: mako's own crates (redispatch-xml), sepa, object_store and opendal (cloud API
    # responses). What remains on an affected version is typst's citation
    # tooling (0.38), which parses bundled assets while rendering our own
    # document templates.
    # Resolution: drops out when hayagriva reaches quick-xml ≥ 0.41.
    { id = "RUSTSEC-2026-0194", reason = "quick-xml O(N²) DoS, patched in 0.41 — every counterparty-facing parser here is on 0.41; the affected version remains only under typst (bundled assets)" },
    { id = "RUSTSEC-2026-0195", reason = "quick-xml NsReader memory-exhaustion DoS; same version constraint and same usage analysis as RUSTSEC-2026-0194." },
    # Drops out with a jsonwebtoken on elliptic-curve 0.14.
    { id = "RUSTSEC-2026-0387", reason = "crypto-bigint 0.5.5 timing; the signing path (energy-api JWS) is on patched 0.7.10 — 0.5.5 remains only under jsonwebtoken's public-key verification and the unshipped bedrock feature" },
    # RUSTSEC-2024-0320: yaml-rust unmaintained — syntect loads syntax
    # definitions with it. Unreachable from an invoice render (no code blocks),
    # and non-optional in typst-library.
    { id = "RUSTSEC-2024-0320", reason = "yaml-rust unmaintained; reached only by syntect's syntax-definition loading via typst-library, which an invoice template never enters" },
    # RUSTSEC-2026-0206: rustybuzz unmaintained. NOTE this one IS on the render
    # path — it is Typst's text shaper. Accepted because the inputs are not
    # attacker-controlled: the fonts are the bundled typst-assets set, which
    # `outputd::document::world` is the only source of (there is deliberately no
    # way for a template to supply one), and the text is mako's own EN 16931
    # model plus the operator's template literals — never a counterparty's.
    # Revisit if operator-supplied font files are ever accepted.
    { id = "RUSTSEC-2026-0206", reason = "rustybuzz unmaintained (no CVE); Typst's text shaper, on the render path but fed only bundled fonts, mako's own invoice model and the operator's own template — no counterparty-controlled input" },
    # RUSTSEC-2026-0440: astral-tokio-tar unmaintained (every version; no safe
    # upgrade). Pulled by testcontainers 0.27, and 0.28 still depends on it.
    # Dev-only dependency (integration tests only); not present in any production
    # binary, and it never reads a user-supplied archive. Resolve when
    # testcontainers moves off it.
    { id = "RUSTSEC-2026-0440", reason = "astral-tokio-tar unmaintained; dev-only dep via testcontainers — not in production binaries, no user-supplied archive input" },
    # RUSTSEC-2023-0071: rsa Marvin Attack timing side-channel.
    # The Marvin Attack recovers a private key from the timing of many
    # private-key operations an attacker can trigger and observe. Two paths
    # reach rsa: mako-service → jsonwebtoken verifies OIDC tokens against the
    # identity provider's public JWKS (public key only); edmd's `gs://` cold tier
    # → opendal → reqsign-google signs a service-account JWT with the operator's
    # key, locally, about once per access-token lifetime, over a request no
    # attacker shapes or times — and not at all under workload identity. AS4
    # cryptography runs on OpenSSL through asx-rs. Resolve when rsa ships a
    # constant-time implementation.
    { id = "RUSTSEC-2023-0071", reason = "rsa Marvin timing attack; jsonwebtoken verifies with public keys only, and edmd's GCS cold tier signs a service-account JWT locally on a schedule no attacker can trigger or time" },
    # RUSTSEC-2024-0449: unsafe-libyaml unmaintained (no fixed version).
    # slatedb 0.14 turns on figment's `yaml` feature (figment → serde_yaml 0.9 →
    # unsafe-libyaml), and feature unification puts it in every graph that holds
    # slatedb. It parses a `SlateDb.yaml` only when `slatedb::config::Settings`
    # loads one from a file; no crate here calls those loaders — makod builds
    # slatedb's settings in code from its own TOML config — so no YAML reaches it.
    # Resolution: drops out when slatedb stops enabling figment's `yaml`.
    { id = "RUSTSEC-2024-0449", reason = "unsafe-libyaml unmaintained (no CVE); enabled by slatedb through figment `yaml`, reached only by slatedb's Settings file loaders, which nothing here calls" },
]
