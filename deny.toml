[graph]
# CI runs `cargo deny check --all-features`, and a local run that does not is a
# different graph: an optional feature (agentd's `bedrock`, which pulls the AWS
# SDK) can add duplicates that only the CI graph sees. Declared here so both
# resolve the same set.
all-features = true
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "aarch64-unknown-linux-gnu" },
    { triple = "x86_64-apple-darwin" },
    { triple = "aarch64-apple-darwin" },
    { triple = "x86_64-pc-windows-msvc" },
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CDLA-Permissive-2.0",
    "MIT-0",
    # 0BSD: public-domain-like permissive license, used by mailparse and quoted_printable
    # (transitive deps via asx-rs). Acceptable for commercial use — effectively no conditions.
    "0BSD",
    # bzip2-1.0.6: bzip2 compression library license — BSD-like, no restrictions.
    # Introduced as a transitive dep via parquet/iceberg compression codecs.
    "bzip2-1.0.6",
    # CC0-1.0: Creative Commons Zero — public domain dedication.
    # Used by some data/test crates as transitive deps.
    "CC0-1.0",
]
confidence-threshold = 0.9

[bans]
# Hard-deny multiple major-version duplicates. Any new duplicate requires an
# explicit `skip` entry with a justification comment. This prevents silent
# binary-size bloat and version-skew bugs in serialization/crypto crates.
multiple-versions = "deny"
# Deny wildcard version constraints for external (registry) dependencies.
# Path-only workspace-internal deps are exempt (`allow-wildcard-paths = true`)
# because they have no semver version to specify.
wildcards = "deny"
allow-wildcard-paths = true
deny = [
    # openssl-sys (and its peers openssl, openssl-macros) is banned for general
    # TLS use. The workspace uses rustls-tls exclusively for HTTP clients
    # (reqwest, object_store). However, openssl is an ACCEPTED exception for
    # WS-Security XML cryptography (RSA/ECDSA signing and X.509 handling) via
    # `asx-rs/crypto`, which has no pure-Rust equivalent with the same X.509
    # PEM handling surface.
    #
    # The `wrappers` field permits a banned crate when it is pulled only by the
    # listed direct parents.  Provenance chain:
    #   asx-rs → openssl → openssl-sys
    #   asx-rs → openssl → openssl-macros (proc-macro companion)
    # Only top-level `openssl` is directly pulled by `asx-rs`.
    # If any OTHER crate pulls openssl into the tree, cargo deny will still fail.
    { name = "openssl",        wrappers = ["asx-rs"],       reason = "C-linked OpenSSL forbidden for TLS; permitted only via asx-rs WS-Security XML crypto" },
    { name = "openssl-sys",    wrappers = ["openssl"],      reason = "C-binding companion to openssl 0.10; same asx-rs WS-Security exception" },
    { name = "openssl-macros", wrappers = ["openssl"],      reason = "proc-macro companion to openssl 0.10; same asx-rs WS-Security exception" },
]

# ── Skip entries for unavoidable transitive duplicates ───────────────────────
#
# Each entry documents WHY the duplicate exists and what would resolve it.
# Review and tighten on every annual dependency update pass.

# ── AWS SDK, behind agentd's optional `bedrock` feature ──────────────────────
# The Bedrock Converse driver is off by default (`--features bedrock`), but this
# graph resolves every feature, so the AWS SDK is present here. `aws-smithy-*`
# and every `aws-sdk-*` crate still build on `http` 0.2 while the workspace
# (axum 0.8, reqwest, hyper 1) is on 1.x. Nothing crosses the boundary: the SDK
# builds its own requests and mako never hands it a `http::Request`.
# Resolve when the AWS SDK migrates to http 1.
[[bans.skip]]
name    = "http"
version = "0.2"
reason  = "aws-smithy-runtime / aws-sdk-* pin http 0.2; the workspace is on http 1. Only reachable with agentd's optional `bedrock` feature."

[[bans.skip]]
name    = "http-body"
version = "0.4"
reason  = "companion of http 0.2 on the AWS SDK chain; hyper 1 uses http-body 1."

# ── Typst document renderer ──────────────────────────────────────────────────
# `outputd` compiles operator document templates with Typst. Its syntax
# highlighter (`syntect` → `two-face`) is a NON-optional dependency of
# `typst-library` — there is no feature that trims it — so these four duplicates
# arrive with the renderer and cannot be resolved by configuration. An invoice
# template contains no code blocks, so the highlighting path is never entered.
[[bans.skip]]
name    = "fancy-regex"
version = "0.16"
reason  = "syntect (via typst-library) pins fancy-regex 0.16; jsonschema uses 0.19. Syntax highlighting is unreachable from an invoice render."

[[bans.skip]]
name    = "phf_generator"
reason  = "duplicate major pulled by the typst syntax-highlighting chain; build-time only."

[[bans.skip]]
name    = "roxmltree"
reason  = "typst parses SVG with a different roxmltree major than en16931-formats uses for CII/UBL. Both parse trusted input (bundled assets / our own rendered XML)."

[[bans.skip]]
name    = "weezl"
reason  = "GIF/LZW decoder duplicated across the typst image stack; not reachable from an invoice render."

[[bans.skip]]
name    = "chacha20"
version = "0.9"
reason  = "agentplane's keyring AEAD (chacha20poly1305 0.10, its latest release) pins chacha20 0.9; our rand 0.10 (mako-engine, lopdf) uses 0.10. Not unifiable from here — resolve when chacha20poly1305 bumps."

# ── agentplane crypto chain ───────────────────────────────────────────────────
# agentplane's `signing` feature uses the ed25519-dalek 3 line for journal record
# attestation; our JWT verification (jsonwebtoken 11, via mako-service) still
# pulls the 2 line. Both are maintained and the two chains never exchange types —
# one signs journal records, the other verifies bearer tokens. Resolve when
# jsonwebtoken bumps to ed25519-dalek 3.
[[bans.skip]]
name    = "ed25519-dalek"
version = "2.2"
reason  = "jsonwebtoken 11 (JWT verification) pins ed25519-dalek 2; agentplane signing uses 3."

[[bans.skip]]
name    = "ed25519"
version = "2.2"
reason  = "Transitive of ed25519-dalek 2 — see the ed25519-dalek skip."

[[bans.skip]]
name    = "curve25519-dalek"
version = "4.1"
reason  = "Transitive of ed25519-dalek 2 — see the ed25519-dalek skip."

[[bans.skip]]
name    = "signature"
version = "2.2"
reason  = "Transitive of ed25519-dalek 2 — see the ed25519-dalek skip."

