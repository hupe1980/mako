# The one port table. Every `deploy/demo/<service>.toml` listens on
# `[http] addr = "0.0.0.0:<port>"` with the port named here, and every
# `http://<service>:<port>` URL in those files reaches the service it names on
# that service's port. `just dev` runs the same files on the host with each
# `<service>` host moved to 127.0.0.1, so the port is the whole address there.
# The xtask `demo_configs` tests hold the files to this table, so a port changed
# here and not there — or there and not here — fails `just test`.

[services]
makod       = 8080
marktd      = 8180
invoicd     = 8280
edmd        = 8380
processd    = 8580
netzbilanzd = 8680
productd    = 9080
einsd       = 9180
billingd    = 9280
accountingd = 9380
portald     = 9480
agentd      = 9580
vertragd    = 9780
outputd     = 9880

# Local addresses outside a service's own port that a demo config names: a
# process mako calls, and the demo's one published edge (the Desk, and the
# public „Rechnung nachrechnen" page a letter links to).
[external]
ollama = 11434
edge   = 8000
