# processd.toml — the demo configuration: what `just demo` runs in Docker and
# `just dev` runs on this machine (deploy/dev/up.sh moves every
# `http://<service>:<port>` peer and the database host to loopback). One
# Stadtwerk — Stadtwerke Musterstadt, NB, LF and MSB — whose world
# tools/mako-seed fills. Authentication is the demo's and every secret is a
# development literal. DO NOT use in production.
#
# Every key can be overridden by an environment variable — `PROCESSD_<KEY>`,
# nested keys joined with `__`. `processd --help` lists the conventions.

allow_insecure_no_auth = true

[http]
addr = "0.0.0.0:8580"

[database]
url = "postgres://mako:mako@postgres:5432/processd"

[identity]
own_mp_id = "9900357000004"
# Musterstadt Energievertrieb, the Stadtwerk's own supplier: its Anmeldungen
# are held for a person (§ 20 Abs. 1 EnWG), which is how the seeded world has a
# Freigabe waiting in the Desk.
verbundene_lieferanten = ["9912345000005"]

# processd's own key: makod grants it `ActOnBehalf`, so an approved answer is
# attributed to the person who approved it.
[makod]
url     = "http://makod:8080"
api_key = "dev-processd-key"

[marktd]
url     = "http://marktd:8180"
api_key = "dev-marktd-key"

[webhook]

# processd registers itself with marktd at startup and receives
# de.mako.process.initiated from its fan-out.
[subscription]
webhook_url   = "http://processd:8580/webhook"
subscriber_id = "processd-demo"

# Answer every Anmeldung whose mako-pruefung checks all pass, without a person.
[nb]
auto_accept = true

# Answer the NB-initiated processes (55007, 55010) from the VersorgungsStatus.
[lf]
auto_respond = true

# Answer an MSB-Wechsel the checks accept.
[msb]
auto_accept = true

# The demo sign-in: a token from `just token <persona>` or the Desk's persona
# switcher is answered as that persona by Cedar; a request without one is the
# dev principal. Reported as a warning by `--check-config`.
[oidc]
mode = "demo"
