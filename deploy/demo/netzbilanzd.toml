# netzbilanzd.toml — the demo configuration: what `just demo` runs in Docker and
# `just dev` runs on this machine (deploy/dev/up.sh moves every
# `http://<service>:<port>` peer and the database host to loopback). One
# Stadtwerk — Stadtwerke Musterstadt, NB, LF and MSB — whose world
# tools/mako-seed fills. Authentication is the demo's and every secret is a
# development literal. DO NOT use in production.
#
# Every key can be overridden by an environment variable — `NETZBILANZD_<KEY>`,
# nested keys joined with `__`. `netzbilanzd --help` lists the conventions.

allow_insecure_no_auth = true

tenant         = "9900357000004"
marktd_url     = "http://marktd:8180"
marktd_api_key = "dev-marktd-key"
makod_url      = "http://makod:8080"
makod_api_key  = "dev-netzbilanzd-makod-key"
edmd_url       = "http://edmd:8380"
edmd_api_key   = "dev-edmd-key"

# The Netzbetreiber's payment term, in Werktage after the Rechnungsdatum, for an
# invoice whose request states no due_date. No default: at least 10 (GPKE Teil 2
# Kap. 3.3.2 Nr. 1); a Rückerstattung is capped at 10 after the Rechnungsdatum.
zahlungsziel_werktage = 14

[http]
addr = "0.0.0.0:8680"

[database]
url = "postgres://mako:mako@postgres:5432/netzbilanzd"

# MaBiS Summenzeitreihen: the Netzbetreiber filing, the ÜNB receiving, and the
# Bilanzierungsgebiet the Summenzeitreihen are for — synthetic codes, EIC check
# character included. Remove the section to run without MaBiS filing.
[mabis]
sender_mp_id           = "9900357000004"
receiver_mp_id         = "9900077000006"
bilanzierungsgebiet_id = "11YMAKO-TEST-01U"

# Webhook endpoints registered through /api/v1/webhooks/endpoints may name a
# receiver on this machine (`just dev`). Reported as a warning by `--check-config`.
[subscriptions]
allow_loopback = true

# The demo sign-in: a token from `just token <persona>` or the Desk's persona
# switcher is answered as that persona by Cedar; a request without one is the
# dev principal. Reported as a warning by `--check-config`.
[oidc]
mode = "demo"
