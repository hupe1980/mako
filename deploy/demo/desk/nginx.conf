# The Desk of `just demo`: the bundle, served as desk/deploy/nginx.conf serves
# it, and the one door to every service — `/svc/<service>/…` goes to that
# service on the compose network with the token of the persona the Desk's
# `mako_persona` cookie names (`$mako_authorization`, mapped in
# 00-personas.conf, generated from deploy/demo/personas.json). makod is reached
# with its demo API key, as the other services reach it. A demonstration, not a
# deployment: production puts the OIDC gateway (desk/deploy/gateway.yaml) here.
server {
    listen 8080;
    root /usr/share/nginx/html;
    server_tokens off;

    # Docker's resolver, read per request: the edge starts before the services
    # do, and a service that restarts keeps its name, not its address.
    resolver 127.0.0.11 valid=10s ipv6=off;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'nonce-$request_id'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    # agentd streams a run's answer sentence by sentence.
    proxy_buffering off;
    proxy_read_timeout 300s;

    location /assets/ {
        expires max;
        try_files $uri =404;
    }

    location / {
        expires -1;
        sub_filter_once off;
        sub_filter "__CSP_NONCE__" $request_id;
        try_files $uri /index.html;
    }

    location /svc/makod/ {
        set $upstream makod:8080;
        rewrite ^/svc/makod/(.*)$ /$1 break;
        proxy_set_header Authorization "Bearer dev-makod-key";
        proxy_pass http://$upstream;
    }

    location /svc/processd/ {
        set $upstream processd:8580;
        rewrite ^/svc/processd/(.*)$ /$1 break;
        proxy_set_header Authorization $mako_authorization;
        proxy_pass http://$upstream;
    }

    location /svc/vertragd/ {
        set $upstream vertragd:9780;
        rewrite ^/svc/vertragd/(.*)$ /$1 break;
        proxy_set_header Authorization $mako_authorization;
        proxy_pass http://$upstream;
    }

    location /svc/marktd/ {
        set $upstream marktd:8180;
        rewrite ^/svc/marktd/(.*)$ /$1 break;
        proxy_set_header Authorization $mako_authorization;
        proxy_pass http://$upstream;
    }

    location /svc/einsd/ {
        set $upstream einsd:9180;
        rewrite ^/svc/einsd/(.*)$ /$1 break;
        proxy_set_header Authorization $mako_authorization;
        proxy_pass http://$upstream;
    }

    location /svc/productd/ {
        set $upstream productd:9080;
        rewrite ^/svc/productd/(.*)$ /$1 break;
        proxy_set_header Authorization $mako_authorization;
        proxy_pass http://$upstream;
    }

    location /svc/invoicd/ {
        set $upstream invoicd:8280;
        rewrite ^/svc/invoicd/(.*)$ /$1 break;
        proxy_set_header Authorization $mako_authorization;
        proxy_pass http://$upstream;
    }

    location /svc/edmd/ {
        set $upstream edmd:8380;
        rewrite ^/svc/edmd/(.*)$ /$1 break;
        proxy_set_header Authorization $mako_authorization;
        proxy_pass http://$upstream;
    }

    location /svc/netzbilanzd/ {
        set $upstream netzbilanzd:8680;
        rewrite ^/svc/netzbilanzd/(.*)$ /$1 break;
        proxy_set_header Authorization $mako_authorization;
        proxy_pass http://$upstream;
    }

    # The public „Rechnung nachrechnen" page: portald answers it without a
    # sign-in, so the edge sends no persona token and drops the client's own.
    location /nachrechnen/ {
        set $upstream portald:9480;
        proxy_set_header Authorization "";
        proxy_pass http://$upstream;
    }

    location /svc/billingd/ {
        set $upstream billingd:9280;
        rewrite ^/svc/billingd/(.*)$ /$1 break;
        proxy_set_header Authorization $mako_authorization;
        proxy_pass http://$upstream;
    }

    location ~ ^/svc/outputd/(api/v1/openapi\.json|api/v1/documents/by-subject/INVOICE)$ {
        set $upstream outputd:9880;
        rewrite ^/svc/outputd/(.*)$ /$1 break;
        proxy_set_header Authorization $mako_authorization;
        proxy_pass http://$upstream;
    }

    location /svc/accountingd/ {
        set $upstream accountingd:9380;
        rewrite ^/svc/accountingd/(.*)$ /$1 break;
        proxy_set_header Authorization $mako_authorization;
        proxy_pass http://$upstream;
    }

    location /svc/agentd/ {
        set $upstream agentd:9580;
        rewrite ^/svc/agentd/(.*)$ /$1 break;
        proxy_set_header Authorization $mako_authorization;
        proxy_pass http://$upstream;
    }
}
