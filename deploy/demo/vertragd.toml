# vertragd.toml — the demo configuration: what `just demo` runs in Docker and
# `just dev` runs on this machine (deploy/dev/up.sh moves every
# `http://<service>:<port>` peer and the database host to loopback). One
# Stadtwerk — Stadtwerke Musterstadt, NB, LF and MSB — whose world
# tools/mako-seed fills. Authentication is the demo's and every secret is a
# development literal. DO NOT use in production.
#
# Every key can be overridden by an environment variable — `VERTRAGD_<KEY>`,
# nested keys joined with `__`. `vertragd --help` lists the conventions.

allow_insecure_no_auth = true

tenant   = "9900357000004"
lf_mp_id = "9900357000004"

processd_url    = "http://processd:8580"
accountingd_url = "http://accountingd:9380"
edmd_url        = "http://edmd:8380"
outputd_url     = "http://outputd:9880"
# The online order checks the frozen Endkunden-Angebot productd serves.
productd_url    = "http://productd:9080"

[http]
addr = "0.0.0.0:9780"

[database]
url = "postgres://mako:mako@postgres:5432/vertragd"

# The Stadtwerk's AGB make the offer binding: the online order concludes the
# contract and starts the Widerrufsfrist (§ 356 Abs. 2 Nr. 2 BGB).
[policy]
vertragsschluss = "mit_bestellung"

[absender]
name         = "Stadtwerke Musterstadt GmbH"
line1        = "Am Markt 1"
post_code    = "12345"
city         = "Musterstadt"
vat_id       = "DE123456789"
contact_name = "Kundenservice"
phone        = "+49 30 123456"
email        = "service@stadtwerke-musterstadt.example"

# The demo sign-in: a token from `just token <persona>` or the Desk's persona
# switcher is answered as that persona by Cedar; a request without one is the
# dev principal. Reported as a warning by `--check-config`.
[oidc]
mode = "demo"
