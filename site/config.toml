# Zola configuration — mako documentation & landing site.
# https://www.getzola.org/documentation/getting-started/configuration/

base_url = "https://hupe1980.github.io/mako"
# English is the site; German is a curated subset under /de/, each page pinned
# to the English source it was translated from (`cargo xtask
# check-translations`). A Zola section has no fallback across languages, so a
# German page needs the German `_index.de.md` of every section above it.
default_language = "en"
title = "mako — AI-first German Energy Market Platform in Rust"
# Search engines show roughly 155-160 characters and `base.html` truncates at
# 180. This is the fallback for every page without its own front-matter
# `description`, the landing page included, so it has to fit unabridged.
description = "Open-source, AI-first German energy-market platform in Rust: BDEW MaKo from raw EDIFACT to production, typed MCP tools for agents, NNE/EEG settlement and AS4."

# Pretty URLs (/page/ → /page/index.html); no trailing-slash 404s on GitHub Pages.
compile_sass = true
# Search is Pagefind, run over `public/` by `tools/postbuild.mjs` after the
# build: it fetches only the index chunks a query needs and stems each page in
# its own `<html lang>`. Zola's own index would be a second, unread download.
build_search_index = false
generate_feeds = true
feed_filenames = ["atom.xml"]

taxonomies = []

[languages.de]
title = "mako — KI-first Plattform für die deutsche Marktkommunikation in Rust"
description = "Open-Source-Plattform in Rust für die Marktkommunikation von Strom und Gas: BDEW-MaKo von EDIFACT bis Produktion, MCP-Werkzeuge für Agenten, Abrechnung und AS4."
generate_feeds = true
feed_filenames = ["atom.xml"]
build_search_index = false        # Pagefind owns search; see above
taxonomies = []

