# Zola configuration — mako documentation & landing site.
# https://www.getzola.org/documentation/getting-started/configuration/

base_url = "https://hupe1980.github.io/mako"
title = "mako — German Energy Market Platform in Rust"
description = """
Open-source, full-stack German energy-market operations platform in Rust: BDEW \
MaKo / EDI@Energy market communication over all 17 EDIFACT message types, an \
event-sourced process runtime, NNE/EEG settlement, retail billing, AS4 \
transport and BO4E integration — each process an auditable, replayable \
workflow."""

# Pretty URLs (/page/ → /page/index.html); no trailing-slash 404s on GitHub Pages.
compile_sass = true
build_search_index = true
generate_feeds = true
feed_filenames = ["atom.xml"]

taxonomies = []

[markdown]
render_emoji = true
# Deep-linkable headings; the markup comes from `templates/anchor-link.html`
# (a `#`, not Zola's default 🔗), styled as `a.zola-anchor`.
insert_anchor_links = "right"
external_links_target_blank = true
external_links_no_follow = false
smart_punctuation = false
bottom_footnotes = true
github_alerts = true              # > [!NOTE] / [!WARNING] callouts

[markdown.highlighting]
theme = "nord"

[link_checker]
# Internal links use Zola's `@/…` resolution and are validated at build time —
# a broken doc link or dead `#anchor` fails the build. External links stay at
# warn (network-dependent; not worth flaking CI over).
internal_level = "error"
external_level = "warn"

[search]
# `fuse_json`, not `elasticlunr_json`: `static/js/search.js` scans the documents
# itself, so an inverted index would be downloaded and never read. 1.3 MB,
# fetched lazily on first focus of the search box.
index_format = "fuse_json"
include_title = true
include_description = true
include_path = true
include_content = true

[extra]
# Every key here must be read by a template: a value nothing reads still looks
# like the source of truth while the real one drifts elsewhere. The Mermaid
# major is pinned in `static/js/mermaid-init.js`; the hero copy lives in
# `templates/index.html`.
#
# ── Branding ──────────────────────────────────────────────────────────────────
repo = "https://github.com/hupe1980/mako"
edi_energy_url = "https://www.edi-energy.de/"
crates = [
  { name = "edi-energy", url = "https://crates.io/crates/edi-energy" },
  { name = "mako-engine", url = "https://crates.io/crates/mako-engine" },
]
# Latest supported BDEW EDI@Energy format versions (shown in the footer).
format_versions = "FV2025-04-01 → FV2026-10-01"
# ── SEO / social ─────────────────────────────────────────────────────────────
author = "hupe1980"
# 1200 × 630. Declaring the dimensions lets Slack/X/LinkedIn reserve the card
# before the image loads, so summary_large_image renders on first paste.
og_image = "img/og-card.png"
og_image_width = "1200"
og_image_height = "630"
og_image_alt = "mako — German energy-market operations in Rust"
og_locale = "en_US"
# Matches --bg in sass/style.scss for each theme; drives the mobile browser
# chrome so the sticky header does not sit against a white bar in dark mode.
theme_color_light = "#ffffff"
theme_color_dark = "#0d1117"
# Shown on the landing page, so a reader sizes the project before the features.
status = "Experimental · pre-1.0"
