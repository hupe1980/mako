# productd.toml — order-to-cash demo (auth disabled)
# DO NOT use in production.

# Demo only. Without this, productd refuses to start when no [oidc] section is
# present: the disabled verifier admits every request as `dev-admin` holding
# every market role, which is enough to rewrite any supplier's live prices.
allow_insecure_no_auth = true

port   = 9080
tenant = "9912345000005"

# What the catalogue's products are sold under. The same string as `tenant` in
# this single-mandant demo, and a different one wherever a platform holds
# several suppliers' catalogues.
lf_mp_id = "9912345000005"

erp_webhook_url = "http://webhook:8000/events"

[database]
url = "postgres://demo:demo-secret@postgres/productd"
