# processd.toml — demo configuration (PostgreSQL, auth disabled, auto_accept on)
# DO NOT use in production.
#
# processd is the **process decision engine**:
#   - NB module: evaluates each Anmeldung (55001/55077/44001, EBD E_0622) and
#     Abmeldung (55004/44004, E_0607 / G_0007) via mako-pruefung
#   - LF module: answers the NB-initiated GPKE processes (55007, 55010) within
#     their per-PID business Frist
#
# It subscribes to marktd for de.mako.process.initiated events and self-registers
# on startup — no manual curl call is required.

# Demo only. Without it processd refuses to start with no `[oidc]` and no
# `[webhook] inbound_secret`, which is the correct production posture: the
# decision queues and the market answer are behind both doors.
allow_insecure_no_auth = true

[http]
addr = "0.0.0.0:8580"

[database]
# Created by init-db.sh on first boot; docker-compose.yml overrides this with
# PROCESSD_DATABASE__URL.
url       = "postgres://demo:demo-secret@postgres/processd"
pool_size = 10

[identity]
# Operator primary MP-ID — must match makod.toml [[party]] primary = true.
# Used for §20 EnWG parity: when the initiating LF MP-ID equals own_mp_id,
# the decision is flagged as affiliate-initiated in anmeldung_decisions.
own_mp_id = "9900357000004"
# tenant defaults to own_mp_id when empty.

[makod]
url     = "http://makod:8080"
api_key = "demo-secret-change-me"  # matches makod --auth-key

[marktd]
url     = "http://marktd:8180"
api_key = "demo-processd-key"  # any value accepted (OIDC disabled)

[webhook]
# No inbound_secret: events are accepted without HMAC verification. In
# production this must match the marktd subscription secret.

[subscription]
# processd self-registers with marktd on startup, authenticating with
# `[marktd] api_key`.
webhook_url   = "http://processd:8580/webhook"
subscriber_id = "processd-demo"
# event_types stays at the code default — the full set the compiled modules
# need. Narrowing it here disables a module with no other signal.

[nb]
# Dispatch bestaetigen automatically when every mako-pruefung check passes.
# Safe here because smoke.sh pre-seeds all master data; in production, verify
# grid record and partner coverage first.
auto_accept = true

[lf]
# Answer the NB-initiated processes automatically from VersorgungsStatus, without
# ERP involvement. The queue deadline comes from the process's own Antwortfrist
# (05:00 Uhr des 1. WT nach dem ÜT for 55007, 09:00 for 55010 — GPKE Teil 2),
# less an hour of headroom. There is no separate TTL knob.
auto_respond = true

[msb]
# MSB-Wechsel auto-accept — when false (the default), an Accept verdict goes to
# the approval queue with its WiM Antwortfrist attached instead of dispatching
# the Bestätigung. Enabled here so the demo runs end to end unattended.
auto_accept = true

# REQOTE auto-response — on an inbound Preisanfrage (35001/35002/35004/35005;
# 35003 is the ESA Werteanfrage and is NOT a Preisanfrage), processd dispatches
# QUOTES from the current PreisblattMessung. When no PreisblattMessung is in
# force — or when this is false — the REQOTE lands in the approval queue with
# its 5-Werktage Frist, never as a bare log line.
auto_preisanfrage = true

# No [oidc]: authentication is disabled and every request is admitted with
# synthetic dev-admin claims.
#
# [oidc]
# issuer   = "https://login.microsoftonline.com/{tenant-id}/v2.0"
# audience = "api://mako-processd"

# OTLP export is off in the demo: set OTEL_EXPORTER_OTLP_ENDPOINT to turn it on.
