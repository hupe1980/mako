# makod.toml — demo configuration (NB role, in-memory store, no OIDC)
# DO NOT use in production.

# Authorization is default-deny. This demo ships no policy set, so it takes the
# built-in permit-all baseline instead — every authenticated caller is full
# admin. A real deployment points authz.cedar_policy_dir at its own grants.
[authz]
permit_all = true

[logging]
level  = "info"
format = "json"

[storage]
allow_volatile = true   # in-memory only — data is lost on restart

[[party]]
mp_id   = "9900357000004"
roles   = ["NB"]
primary = true

[http]
addr = "0.0.0.0:8080"

[erp]
# Process lifecycle CloudEvents go to marktd, which fans them out — processd
# receives ProcessInitiated and decides bestaetigen/ablehnen from master data.
#
# `webhook_secret` is deliberately absent: an empty value here would win over
# MAKOD_ERP_WEBHOOK_SECRET and sign every delivery with an empty key.
webhook_url = "http://marktd:8180/api/v1/events"
