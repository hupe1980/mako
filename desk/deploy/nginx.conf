# The Desk's static bundle, served to the gateway (oauth2-proxy) on :8080.
# Every path that is not a file is the app, so a deep link such as /freigaben
# opens the Desk and the router takes it from there.
server {
    listen 8080;
    root /usr/share/nginx/html;
    server_tokens off;

    # The bundle loads its own script and stylesheet and nothing else; the
    # services are reached through the gateway on the same origin. React Aria
    # injects its own <style>, admitted by a nonce fresh on every request
    # ($request_id, 128 random bits) and written into index.html below.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'nonce-$request_id'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    # Hashed file names: a new build is a new name.
    location /assets/ {
        expires max;
        try_files $uri =404;
    }

    location / {
        expires -1;
        sub_filter_once off;
        sub_filter "__CSP_NONCE__" $request_id;
        try_files $uri /index.html;
    }
}
