# oauth2-proxy settings the alpha config (gateway.yaml) cannot carry.
# Run: oauth2-proxy --alpha-config=gateway.yaml --config=oauth2-proxy.cfg
#
# The session cookie is SameSite=Strict, Secure and HttpOnly: with the
# JSON-only write routes, Strict is what keeps a cross-site page from deciding
# a Freigabe in a signed-in person's name.
#
# Provider, client id/secret, cookie secret and redirect URL are the
# deployment's own — set them here or as OAUTH2_PROXY_* variables; none ships.
cookie_samesite = "strict"
cookie_secure   = true
cookie_httponly = true
