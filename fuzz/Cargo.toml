[package]
name = "edi-energy-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

# This crate is `exclude`d from the workspace (see the root `Cargo.toml`), so it
# cannot inherit `[workspace.dependencies]`. Every version and feature list below
# mirrors the root manifest — a fuzz target that compiles against a different
# release of a dependency than the services do is not testing the shipped code.
[dependencies]
libfuzzer-sys = { version = "0.4", features = ["arbitrary-derive"] }
rust_decimal = { version = "1", features = ["db-postgres", "macros", "serde-str"] }
serde_json = "1"
time = { version = "0.3", features = ["std", "macros", "serde-well-known", "serde-human-readable", "parsing", "formatting"] }
metering = { version = "0.25" }
# `test-util` supplies the test SM-PKI the fuzzed inbox is built with.
asx-rs = { version = "0.16.2", default-features = false, features = ["as4", "http-client", "test-util"] }
tokio = { version = "1", features = ["rt"] }
http = "1"
bytes = "1"
http-body-util = "0.1"
tower-service = "0.3"

[dependencies.edi-energy]
path = "../crates/edi-energy"
features = ["utilmd", "mscons", "aperak", "contrl", "invoic", "remadv", "orders", "iftsta", "insrpt", "reqote", "partin", "ordchg", "ordrsp", "quotes", "comdis", "pricat", "utilts"]

[dependencies.mako-engine]
path = "../crates/mako-engine"
default-features = false

[dependencies.energy-billing]
path = "../crates/energy-billing"
features = ["eeg"]

[[bin]]
name = "fuzz_parse_validate"
path = "fuzz_targets/fuzz_parse_validate.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_interchange"
path = "fuzz_targets/fuzz_interchange.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_builder"
path = "fuzz_targets/fuzz_builder.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_format_version"
path = "fuzz_targets/fuzz_format_version.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_as4_inbound"
path = "fuzz_targets/fuzz_as4_inbound.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_tariff_input"
path = "fuzz_targets/fuzz_tariff_input.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_obis_code"
path = "fuzz_targets/fuzz_obis_code.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_validation_engine"
path = "fuzz_targets/fuzz_validation_engine.rs"
test = false
doc = false
bench = false

# The package `asx-rs` is imported under its library name `asx`, which
# cargo-machete does not map back to the package.
[package.metadata.cargo-machete]
ignored = ["asx-rs"]
