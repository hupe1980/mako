# Every action in .github/workflows/ is pinned to a commit SHA with its tag in a
# comment, and every Dockerfile base image to a digest (`cargo xtask
# check-action-pins`). Dependabot proposes the next SHA or digest — and moves the
# comment with it — so a pin is a reviewed diff rather than a frozen version.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
