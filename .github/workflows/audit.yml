name: Fuzz

# A time-boxed run of the fuzz targets that guard the untrusted-input boundary,
# started by hand (Actions → Fuzz → Run workflow). ci.yml compiles every target
# and checks advisories on every push and pull request; only a *run* can find a
# panic, and a run worth anything costs minutes per target, so it is not a gate.
#
# The targets under `fuzz/` cover the boundaries where bytes from outside the
# trust perimeter first meet mako's parsers: EDIFACT interchanges from trading
# partners, AS4 messages arriving pre-authentication, OBIS codes and metering
# series out of MSCONS, and retail-catalogue JSONB. The property is the same
# everywhere — arbitrary input returns `Err`, never a panic.
#
# `fuzz/corpus/` is gitignored, so each run starts from an empty corpus and
# keeps nothing. Two minutes per target keeps the job inside its timeout.

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fuzz:
    name: Fuzz the untrusted-input boundary
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # libFuzzer needs `-Z sanitizer`, which is nightly-only. The `+nightly`
      # in the run step overrides the repository's `rust-toolchain.toml` pin.
      - name: Install nightly
        run: rustup toolchain install nightly --profile minimal
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: "fuzz"
      - uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2.87.24
        with:
          tool: cargo-fuzz@0.13.2

      - name: Run each target for two minutes
        working-directory: fuzz
        run: |
          set -euo pipefail
          for target in $(cargo +nightly fuzz list); do
            echo "==> $target"
            cargo +nightly fuzz run "$target" -- \
              -max_total_time=120 -rss_limit_mb=4096
          done

      # A crash writes the reproducing input to `fuzz/artifacts/<target>/`.
      # Without it the failure log names a file nobody can retrieve.
      - name: Upload crash reproducers
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts/
          if-no-files-found: ignore
