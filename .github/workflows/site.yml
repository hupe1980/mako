name: site

# Build the Zola documentation + landing site and deploy it to GitHub Pages.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/site.yml"
  pull_request:
    paths:
      - "site/**"
      - ".github/workflows/site.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One in-flight deploy at a time; let a running deploy finish.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  # 0.23 ported Zola from Tera 1 to Tera 2, which removed macros in favour of
  # components. The templates avoid the constructs that differ between the two
  # (no `{% import %}`/macro calls, no positionally-argued tests, every optional
  # variable guarded with `is defined`), so they render on either engine.
  ZOLA_VERSION: "0.23.2"

jobs:
  # Everything `just check-site` runs, on pull requests too: a heading renamed
  # in one page and linked with an `#anchor` from another is only visible to the
  # link checker, and `deploy` runs too late to be that check.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Zola
        run: |
          curl -sSfL "https://github.com/getzola/zola/releases/download/v${ZOLA_VERSION}/zola-v${ZOLA_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar xz -C /usr/local/bin zola
          zola --version

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Zola validates links but never parses diagram source, so a broken
      # diagram would publish as an error box. This also fails if the renderer
      # regresses to `startOnLoad`, which silently stops rendering on a cold
      # CDN cache — see site/tools/check-mermaid.mjs.
      - name: Check Mermaid diagrams
        working-directory: site
        run: |
          npm install --no-audit --no-fund
          npm run check:mermaid

      # `zola check` resolves `@/docs/…` links and their `#anchor` fragments;
      # a plain relative `[text](page.md)` is invisible to it, which is what
      # site/tools/check-links.mjs refuses.
      - name: Check links
        working-directory: site
        run: |
          node tools/check-links.mjs
          zola check --skip-external-links

  build:
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Zola
        run: |
          curl -sSfL "https://github.com/getzola/zola/releases/download/v${ZOLA_VERSION}/zola-v${ZOLA_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar xz -C /usr/local/bin zola
          zola --version

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build
        working-directory: site
        # `--base-url` from the Pages deployment ensures correct absolute URLs.
        run: zola build --base-url "${{ steps.pages.outputs.base_url }}"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/public

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
