name: site

# Build the Zola documentation + landing site and deploy it to GitHub Pages.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/site.yml"
      # The validator's module is built from these; a validator change
      # redeploys it.
      - "crates/edi-energy/**"
      - "crates/mako-fristen/**"
      - "tools/mako-wasm/**"
  pull_request:
    paths:
      - "site/**"
      - ".github/workflows/site.yml"
      # The validator's module is built from these; a validator change
      # redeploys it.
      - "crates/edi-energy/**"
      - "crates/mako-fristen/**"
      - "tools/mako-wasm/**"
  workflow_dispatch:

# Every job reads; `deploy` alone may write to Pages, and only it mints an
# OIDC token.
permissions:
  contents: read

# One in-flight deploy at a time; let a running deploy finish.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  # 0.23 ported Zola from Tera 1 to Tera 2, which removed macros in favour of
  # components. The templates avoid the constructs that differ between the two
  # (no `{% import %}`/macro calls, no positionally-argued tests, every optional
  # variable guarded with `is defined`), so they render on either engine.
  ZOLA_VERSION: "0.23.2"

jobs:
  # Everything `just check-site` runs, on pull requests too: a heading renamed
  # in one page and linked with an `#anchor` from another is only visible to the
  # link checker, and `deploy` runs too late to be that check.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Zola
        run: |
          curl -sSfL "https://github.com/getzola/zola/releases/download/v${ZOLA_VERSION}/zola-v${ZOLA_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar xz -C /usr/local/bin zola
          zola --version

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      # The validator's WebAssembly module (site/static/validator/mako.wasm,
      # not committed), held to the native build's answers and its budget.
      - uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2.87.24
        with:
          tool: just@1.58.0
      - name: Build the validator module
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/mako-site-target
        run: just wasm

      # Zola validates links but never parses diagram source, so a broken
      # diagram would publish as an error box. This also fails if the renderer
      # regresses to `startOnLoad`, which silently stops rendering on a cold
      # CDN cache — see site/tools/check-mermaid.mjs.
      - name: Check Mermaid diagrams
        working-directory: site
        run: |
          npm ci --no-audit --no-fund
          npm run check:mermaid

      # `zola check` resolves `@/docs/…` links and their `#anchor` fragments;
      # a plain relative `[text](page.md)` is invisible to it, which is what
      # site/tools/check-links.mjs refuses.
      - name: Check links
        working-directory: site
        run: |
          node tools/check-links.mjs
          zola check --skip-external-links

      # The post-build step refuses a content page with no built HTML, a
      # section with no `llms.txt` group and a search index that holds a
      # different number of pages than the content tree — see
      # site/tools/postbuild.mjs.
      - name: Build and post-build
        working-directory: site
        run: |
          zola build
          node tools/postbuild.mjs

      - name: Check English and German landing page reflow
        working-directory: site
        run: |
          npx playwright install --with-deps --only-shell chromium
          npm run check:layout

  build:
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      pages: read     # configure-pages reads the site's base URL
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Zola
        run: |
          curl -sSfL "https://github.com/getzola/zola/releases/download/v${ZOLA_VERSION}/zola-v${ZOLA_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar xz -C /usr/local/bin zola
          zola --version

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      # The validator's WebAssembly module (site/static/validator/mako.wasm,
      # not committed), held to the native build's answers and its budget.
      - uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2.87.24
        with:
          tool: just@1.58.0
      - name: Build the validator module
        run: just wasm

      - name: Build
        working-directory: site
        # `--base-url` from the Pages deployment ensures correct absolute URLs;
        # the post-build step reads it back from the built home page, so the
        # twins, `llms.txt` and the search index carry the same one.
        env:
          BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          npm ci --no-audit --no-fund
          zola build --base-url "$BASE_URL"
          node tools/postbuild.mjs

      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: site/public

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
