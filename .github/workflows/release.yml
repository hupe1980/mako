name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

# Every job reads the repository and nothing else unless it says so: `publish`
# mints OIDC tokens for crates.io, the image jobs push to ghcr.io and attest,
# and `release` alone writes — it creates the GitHub Release.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # A hosted runner has ~14 GB free and a debug build of this workspace with
  # every feature does not fit — `preflight` alone runs clippy, test and check
  # over `--all-features`, three full builds into one target directory. It died
  # on `No space left on device` linking `typenum`. Same settings and same
  # reasoning as `ci.yml`, which carries the measurements.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only
  CARGO_INCREMENTAL: 0

jobs:
  # ── Pre-flight checks ────────────────────────────────────────────────────────
  preflight:
    name: Pre-flight (fmt / clippy / test)
    runs-on: ubuntu-latest
    env:
      PYO3_PYTHON: python3
      # One value for the whole job. cargo fingerprints on RUSTFLAGS, so setting
      # it on the warning gate alone made that step rebuild the entire workspace
      # into the same target directory — a second complete set of artefacts, and
      # the reason this job ran the runner out of disk. Job-scoped rather than
      # workflow-scoped: `publish` must not deny warnings it does not own.
      RUSTFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Toolchain is rust-toolchain.toml's
        shell: bash
        run: |
          want=$(sed -n 's/^channel *= *"\([^"]*\)".*/\1/p' rust-toolchain.toml)
          have=$(rustc --version | cut -d' ' -f2)
          case "$have" in "$want"|"$want".*) echo "rustc $have = rust-toolchain.toml $want" ;;
            *) echo "::error::rustc $have, but rust-toolchain.toml pins $want"; exit 1 ;; esac

      - name: Cache Cargo registry
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # `makotest` binds PyO3 with `abi3-py311`, so every workspace-wide cargo
      # command needs an interpreter >= 3.11. `.cargo/config.toml` points
      # PYO3_PYTHON at the developer's `.venv`, which does not exist here — and
      # cargo leaves an already-set variable alone, so naming the runner's
      # interpreter here is what makes the workspace build.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install protoc
        run: sudo apt-get update -y && sudo apt-get install -y protobuf-compiler

      - name: Reclaim runner disk
        run: |
          df -h /
          sudo rm -rf /opt/hostedtoolcache/CodeQL /usr/local/lib/android \
                      /usr/share/dotnet /opt/ghc /usr/local/share/powershell
          df -h /

      # The tag names the release; the workspace version names the artifacts.
      # `makotest`'s wheel version is `dynamic`, so maturin takes it from
      # `Cargo.toml` and never sees the tag — a mismatch publishes the workspace
      # version under the tag's release, and `skip-existing` turns that into a
      # silent success when the wrong version is already on PyPI.
      - name: Tag matches workspace version
        run: |
          workspace="$(awk '/^\[workspace\.package\]/{f=1;next} /^\[/{f=0} f && /^version/{gsub(/[^0-9.]/,"");print;exit}' Cargo.toml)"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$workspace" != "$tag" ]; then
            echo "::error::tag v$tag does not match workspace version $workspace —"
            echo "::error::bump [workspace.package] version in Cargo.toml, or retag."
            exit 1
          fi
          echo "tag v$tag matches workspace version $workspace"

      # The publish job runs one `cargo publish` per crate, so their order is the
      # contract: cargo resolves each dependency against crates.io, not the tree.
      - name: Publish order resolves on crates.io
        run: cargo xtask check-publish-order

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Tests
        # Mirror the CI test-workspace job: makod's suite has a job of its own.
        run: cargo test --workspace --all-features --exclude makod

      - name: Warning gate
        run: cargo check --workspace --all-targets --all-features

  # ── Profile validation ───────────────────────────────────────────────────────
  validate-profiles:
    name: Validate profiles
    runs-on: ubuntu-latest
    needs: preflight
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Toolchain is rust-toolchain.toml's
        shell: bash
        run: |
          want=$(sed -n 's/^channel *= *"\([^"]*\)".*/\1/p' rust-toolchain.toml)
          have=$(rustc --version | cut -d' ' -f2)
          case "$have" in "$want"|"$want".*) echo "rustc $have = rust-toolchain.toml $want" ;;
            *) echo "::error::rustc $have, but rust-toolchain.toml pins $want"; exit 1 ;; esac
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Build xtask
        run: cargo build -p xtask
      - name: validate-profiles
        run: cargo xtask validate-profiles

  # ── Publish to crates.io ─────────────────────────────────────────────────────
  #
  # crates.io Trusted Publishing: no registry token is stored anywhere. Each
  # `cargo publish` reads a token `rust-lang/crates-io-auth-action` mints from
  # this job's OIDC identity — trusted on crates.io for repository
  # `hupe1980/mako`, workflow `release.yml`, environment `crates-io` — and the
  # action's post step revokes it when the job ends. crates.io issues such a
  # token for 30 minutes (`ACCESS_TOKEN_LIFETIME`,
  # `src/controllers/trustpub/tokens/exchange/mod.rs` in the crates.io source),
  # and 24 verified publishes take longer than that, so every crate mints its
  # own immediately before it publishes.
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    needs: [validate-profiles]
    environment: crates-io
    permissions:
      contents: read
      id-token: write   # the OIDC token crates.io exchanges for a publish token
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # semver needs the previous release tag

      - name: Toolchain is rust-toolchain.toml's
        shell: bash
        run: |
          want=$(sed -n 's/^channel *= *"\([^"]*\)".*/\1/p' rust-toolchain.toml)
          have=$(rustc --version | cut -d' ' -f2)
          case "$have" in "$want"|"$want".*) echo "rustc $have = rust-toolchain.toml $want" ;;
            *) echo "::error::rustc $have, but rust-toolchain.toml pins $want"; exit 1 ;; esac

      - name: Cache Cargo registry
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: cargo-semver-checks,just

      # A public-API break the new version number does not admit stops the
      # release before any crate is published.
      - name: Published API admitted by the version (cargo-semver-checks)
        run: just semver

      # 25 `cargo publish` runs share one target directory, and each verifies by
      # building the packaged crate.
      - name: Reclaim runner disk
        run: |
          df -h /
          sudo rm -rf /opt/hostedtoolcache/CodeQL /usr/local/lib/android \
                      /usr/share/dotnet /opt/ghc /usr/local/share/powershell
          df -h /

      # Trusted Publishing can only take over a crate that exists: crates.io
      # creates a crate on its first publish, and a trusted publisher is
      # configured per existing crate. A crate added to the list below is
      # refused here, by name, before anything is uploaded.
      - name: Every crate already exists on crates.io
        run: |
          set -euo pipefail
          missing=0
          while read -r crate; do
            code=$(curl -s -o /dev/null -w '%{http_code}' \
                     -A 'mako-release (https://github.com/hupe1980/mako)' \
                     "https://crates.io/api/v1/crates/${crate}")
            if [ "$code" = 404 ]; then
              echo "::error::${crate} has never been published — publish it once by hand with a personal token, then configure its trusted publisher (hupe1980/mako, release.yml, environment crates-io) on crates.io"
              missing=1
            elif [ "$code" != 200 ]; then
              echo "::error::crates.io answered ${code} for ${crate}"
              missing=1
            fi
          done < <(grep -oE 'cargo publish -p [a-z0-9_-]+' .github/workflows/release.yml | awk '{print $4}')
          exit "$missing"

      - name: crates.io token for edi-energy
        id: auth-edi-energy
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Publish edi-energy
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth-edi-energy.outputs.token }}
        run: |
          out=$(cargo publish -p edi-energy 2>&1) && rc=0 || rc=$?
          echo "$out"
          if [ "$rc" -ne 0 ] && ! echo "$out" | grep -qE "already uploaded|already exists on crates\.io"; then exit "$rc"; fi

      - name: crates.io token for energy-api
        id: auth-energy-api
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Publish energy-api
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth-energy-api.outputs.token }}
        run: |
          out=$(cargo publish -p energy-api 2>&1) && rc=0 || rc=$?
          echo "$out"
          if [ "$rc" -ne 0 ] && ! echo "$out" | grep -qE "already uploaded|already exists on crates\.io"; then exit "$rc"; fi

      - name: crates.io token for redispatch-xml
        id: auth-redispatch-xml
