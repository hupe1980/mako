          echo "$out"
          if [ "$rc" -ne 0 ] && ! echo "$out" | grep -qE "already uploaded|already exists on crates\.io"; then exit "$rc"; fi

  # ── Docker build + push ──────────────────────────────────────────────────────
  #
  # Improved pipeline — three stages, two key changes vs. the old design:
  #
  # 1. docker-builder now runs in PARALLEL with `publish` (needs: preflight, not publish).
  #    Previously it waited ~10-15 min for crates.io publishing before starting.
  #
  # 2. docker-builder now PUSHES the builder image to ghcr.io instead of push: false.
  #    Runtime jobs use it as cache-from=type=registry, guaranteeing a cache hit
  #    (no Rust recompilation in runtime stages, even on cache-size-eviction).
  #
  # 3. docker-bake replaces the per-service docker jobs with 2 bake jobs (one per
  #    platform). docker buildx bake shares the builder stage across all 17
  #    service targets, so the builder compiles once per platform instead of once
  #    per service.
  #
  # Wall-clock time target: ~25–30 min total (vs. 2+ h before).
  #
  # The service list appears twice below — the digest-export loop and the
  # `docker-manifest` matrix — and both must hold every target in
  # `docker-bake.hcl`'s `default` group.

  # ── makotest (Python wheels -> PyPI) ────────────────────────────────────────
  #
  # abi3-py311: one wheel per platform serves every Python >= 3.11, so the
  # matrix is over target platforms only — not over interpreter versions.
  #
  # Publication uses PyPI Trusted Publishing (OIDC): no API token is stored.
  # The `id-token: write` permission below is what mints the short-lived
  # credential, and PyPI is configured to trust
  # `hupe1980/mako` + workflow `release.yml`.
  makotest-wheels:
    name: makotest wheel (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: macos-latest
            target: aarch64-apple-darwin
          # Intel macOS is cross-compiled from the Apple Silicon runner. The
          # `macos-13` Intel image was retired by GitHub, and a job requesting
          # it queues forever instead of failing — which blocks `makotest-publish`
          # and with it the whole PyPI release. Cross-compiling needs no Intel
          # runner at all: the wheel is abi3 and `pyo3/extension-module` leaves
          # Python symbols undefined, so nothing here links against libpython.
          - runner: macos-latest
            target: x86_64-apple-darwin
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Toolchain is rust-toolchain.toml's
        shell: bash
        run: |
          want=$(sed -n 's/^channel *= *"\([^"]*\)".*/\1/p' rust-toolchain.toml)
          have=$(rustc --version | cut -d' ' -f2)
          case "$have" in "$want"|"$want".*) echo "rustc $have = rust-toolchain.toml $want" ;;
            *) echo "::error::rustc $have, but rust-toolchain.toml pins $want"; exit 1 ;; esac
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"   # the abi3 floor

      # `manylinux: auto` builds Linux wheels inside a manylinux container so
      # the resulting wheel is installable on distros older than the runner.
      #
      # `target` must be passed explicitly: without it maturin builds for the
      # runner's host architecture and the matrix entry only renames the
      # artifact. Two entries now share `macos-latest`, so an implicit host
      # build would produce the same arm64 wheel twice — and because both would
      # carry an identical filename, the `merge-multiple` download in
      # `makotest-publish` would silently collapse them into one.
      - name: Build wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: build
          target: ${{ matrix.target }}
          args: --release --manifest-path makotest/Cargo.toml --out dist
          manylinux: auto

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: makotest-wheel-${{ matrix.target }}
          path: dist/*.whl

  makotest-sdist:
    name: makotest sdist
    runs-on: ubuntu-latest
    needs: preflight
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build sdist
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: sdist
          args: --manifest-path makotest/Cargo.toml --out dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: makotest-sdist
          path: dist/*.tar.gz

  makotest-publish:
    name: Publish makotest to PyPI
    runs-on: ubuntu-latest
    needs: [makotest-wheels, makotest-sdist]
    environment: pypi
    permissions:
      # Required for PyPI Trusted Publishing — mints the OIDC token in place
      # of a long-lived API token. Nothing else in this job needs write access.
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: makotest-*
          merge-multiple: true
          path: dist

      - name: List artifacts
        run: ls -l dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist
          # The tag may be re-run after a partial failure; skipping files that
          # already exist makes the job idempotent instead of hard-failing.
          skip-existing: true

  docker-builder:
    name: Docker — builder (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    needs: preflight          # CHANGED: parallel with publish (was: needs publish)
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            tag: linux-amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            tag: linux-arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # A hosted runner has ~14 GB free and this workspace does not compile into
      # it alongside Docker's layer store. The failure arrives as
      # `No space left on device` mid-compile, or as a linker SIGBUS — `rust-lld`
      # mmaps its output, so a write to a full disk is not reported as ENOSPC.
      # Neither reads as "out of disk".
      - name: Reclaim runner disk
        run: |
          df -h /
          sudo rm -rf /opt/hostedtoolcache/CodeQL /usr/local/lib/android \
                      /usr/share/dotnet /opt/ghc /usr/local/share/powershell
          df -h /

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build the shared `builder` stage on native hardware and PUSH it to GHCR.
      # Pushing (instead of push: false) lets the docker-bake jobs restore the
      # fully-compiled builder image via cache-from=type=registry — no Rust
      # recompilation in the runtime stage, even when the GHA cache is evicted.
      - name: Build and push Rust builder stage (${{ matrix.platform }})
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: builder
          platforms: ${{ matrix.platform }}
          push: true                            # CHANGED: was push: false
          tags: ghcr.io/${{ github.repository_owner }}/mako-builder:${{ matrix.tag }}
          build-args: |
            OCI_REVISION=${{ github.sha }}
            OCI_CREATED=${{ github.event.head_commit.timestamp }}
          cache-from: type=gha,scope=mako-builder-${{ matrix.platform }}
          cache-to:   type=gha,scope=mako-builder-${{ matrix.platform }},mode=max

      # `demo-builder` is the second builder stage, and `makod`, `marktd` and
      # `processd` copy their binaries from it — so a cache covering only
      # `builder` leaves those three to compile from scratch in every bake.
      # The two stages are siblings on `chef`, not a chain, so building
      # `--target builder` never populates the other's cargo layers.
      - name: Build and push demo builder stage (${{ matrix.platform }})
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: demo-builder
          platforms: ${{ matrix.platform }}
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/mako-demo-builder:${{ matrix.tag }}
          build-args: |
            OCI_REVISION=${{ github.sha }}
            OCI_CREATED=${{ github.event.head_commit.timestamp }}
          cache-from: type=gha,scope=mako-demo-builder-${{ matrix.platform }}
          cache-to:   type=gha,scope=mako-demo-builder-${{ matrix.platform }},mode=max

  # One bake invocation per platform builds all 17 service images from one build
  # graph, sharing the builder stage. Digests are exported for manifest merging.
  docker-bake:
    name: Docker — bake ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    needs: [docker-builder, publish]    # publish provides the semver version tag
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            tag: linux-amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            tag: linux-arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # A hosted runner has ~14 GB free and this workspace does not compile into
      # it alongside Docker's layer store. The failure arrives as
      # `No space left on device` mid-compile, or as a linker SIGBUS — `rust-lld`
      # mmaps its output, so a write to a full disk is not reported as ENOSPC.
      # Neither reads as "out of disk".
      - name: Reclaim runner disk
        run: |
          df -h /
          sudo rm -rf /opt/hostedtoolcache/CodeQL /usr/local/lib/android \
                      /usr/share/dotnet /opt/ghc /usr/local/share/powershell
          df -h /

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # Build all 17 runtime images in one bake invocation.
      # cache-from=type=registry restores from the pushed builder image — guaranteed hit.
      # --metadata-file captures per-service OCI digests for the manifest job.
      - name: Bake all service images (${{ matrix.platform }})
        uses: docker/bake-action@018cb6412ab401ebaa809aa5f85966b74628600f # v7.4.0
        id: bake
        with:
          files: docker-bake.hcl
          push: true
          set: |
            *.platform=${{ matrix.platform }}
            *.cache-from=type=registry,ref=ghcr.io/${{ github.repository_owner }}/mako-builder:${{ matrix.tag }}
            *.cache-from=type=registry,ref=ghcr.io/${{ github.repository_owner }}/mako-demo-builder:${{ matrix.tag }}
            *.cache-from=type=gha,scope=mako-builder-${{ matrix.platform }}
            *.cache-from=type=gha,scope=mako-demo-builder-${{ matrix.platform }}
            *.cache-to=
          # SLSA build provenance and an SBOM per image — Cyber Resilience Act
          # Annex I Part II(1), which market surveillance may ask for from
          # 11.12.2027. `mode=max` records the build arguments and the base
          # images, not only the invocation.
          #
          # This changes the shape of what is pushed: with attestations each
          # per-platform build produces an **OCI index** (the image manifest plus
          # the attestation manifests) rather than a bare manifest, so
          # `containerimage.digest` below is that index's digest.
          # `docker buildx imagetools create` takes index sources and carries
          # their manifests into the merged index, so the digest export and the
          # manifest-merge job need no change — but they now depend on that
          # behaviour, which is why the merge job asserts it.
          provenance: mode=max
          sbom: true
        env:
          REGISTRY: ghcr.io/${{ github.repository_owner }}
          VERSION: ${{ steps.version.outputs.version }}
          OCI_REVISION: ${{ github.sha }}
          OCI_CREATED:  ${{ github.event.head_commit.timestamp }}

      # Extract one digest artifact per service for the manifest merge step.
      # `BAKE_METADATA` is passed through the environment, never interpolated
      # into the script. `${{ steps.bake.outputs.metadata }}` inside `run:` is
      # substituted as *text* before bash parses the line, so one `'` anywhere in
      # the blob ends the quoted string and the remainder is executed — which
      # with `provenance: mode=max` is a megabyte of SLSA material, base64 source
      # maps and build arguments for 17 targets. That is a shell-injection shape
      # as much as a syntax one, and an environment variable cannot have it: the
      # value never reaches the parser.
      - name: Export per-service digests
        env:
          BAKE_METADATA: ${{ steps.bake.outputs.metadata }}
        run: |
          platform_safe="${{ matrix.platform }}"
          platform_safe="${platform_safe//\//-}"
          mkdir -p /tmp/digests
          printf '%s' "$BAKE_METADATA" > /tmp/bake-metadata.json
          jq -e 'type == "object" and length > 0' /tmp/bake-metadata.json >/dev/null \
            || { echo "::error::bake produced no metadata — nothing to tag"; exit 1; }
          # Every target in `docker-bake.hcl`'s `default` group. A service the
          # bake builds but this loop omits is pushed by digest and then never
          # tagged: no manifest job runs for it, so the image exists in the
          # registry under no name anyone can pull. `outputd` shipped that way.
          for service in makod marktd processd invoicd edmd obsd \
                        netzbilanzd sperrd einsd \
                        productd billingd outputd accountingd vertragd \
                        portald agentd mabis-syncd; do
            digest=$(jq -r --arg svc "$service" '.[$svc]["containerimage.digest"] // empty' \
                        /tmp/bake-metadata.json)
            # An empty digest means the bake did not produce that image. Writing
            # it anyway uploads a blank artifact, and the manifest job then tags
            # nothing while reporting success.
            if [ -z "$digest" ]; then
              echo "::error::no containerimage.digest for ${service} in the bake metadata"
              exit 1
            fi
            echo "${digest#sha256:}" > "/tmp/digests/${service}"
            echo "${service}: ${digest}"
          done
          echo "PLATFORM_SAFE=${platform_safe}" >> "$GITHUB_ENV"

      - name: Upload digest artifacts (${{ matrix.platform }})
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digests-${{ env.PLATFORM_SAFE }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  docker-manifest:
    name: Docker — manifest ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: [docker-bake, sbom]
    permissions:
      contents: read
      packages: write       # the merged index and its attestations go to ghcr.io
      id-token: write       # Sigstore signs each attestation with this job's identity
      attestations: write   # and GitHub stores it against the repository
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: makod
            description: "Mako process engine daemon — German energy market communication (MaKo/BDEW EDI@Energy)"
          - service: marktd
            description: "Market Data Hub daemon — MaLo/MeLo/VersorgungsStatus/preisblaetter/EventBus fan-out"
          - service: processd
            description: "Process Decision Engine — NB STP (mako-pruefung) + LF E_0624 auto-response"
          - service: invoicd
            description: "INVOIC plausibility-check daemon — LF role, § 147 AO / GoBD receipt retention"
          - service: edmd
            description: "Energy Data Management daemon — MSCONS meter readings, MeterBillingPeriod"
          - service: obsd
            description: "Business-process observability daemon — KPI reports, §20 EnWG parity"
          - service: netzbilanzd
            description: "NNE/KA/MMM/MSB/AWH billing daemon — NB role, GridSettlement, CalculationTrace"
          - service: sperrd
            description: "Sperrung execution tracking daemon — NB role, IFTSTA 21039 auto-dispatch"
          - service: einsd
            description: "Einspeiser Registry + EEG/KWKG Settlement daemon — 10 settlement schemes, EEG/KWKG Gutschrift"
          - service: productd
            description: "Product & Tariff Catalog daemon — LF role, EPEX §41a, B2B Angebote"
          - service: billingd
            description: "Energy Billing Engine daemon — LF role, 12 categories, XRechnung 3.0, §14a, §41a"
          - service: outputd
            description: "Customer-communications daemon — Typst templates, ZUGFeRD PDF/A-3, issued-document store, per-channel delivery evidence"
          - service: accountingd
            description: "Customer Account Ledger daemon — LF role, SEPA pain.008/001, auto-dunning, GDPR Art.17"
          - service: vertragd
            description: "Contract & Customer Management daemon — LF role, B2C+B2B, OIDC→MaLo auth gateway"
          - service: portald
            description: "Customer Portal gateway — LF role, REST+SSE, §41 EnWG self-service"
          - service: agentd
            description: "Multi-agent LLM orchestration daemon — 28 declarative specialist manifests on the agentplane durable runtime, MCP tools"
          - service: mabis-syncd
            description: "MaBiS UTILTS synchronisation daemon — ÜNB/NB role, Summenzeitreihe day-3/day-8"
    steps:
      - name: Download amd64 digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: digests-linux-amd64
          path: /tmp/digests/amd64

      - name: Download arm64 digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: digests-linux-arm64
          path: /tmp/digests/arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/mako-${{ matrix.service }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=${{ matrix.service }}
            org.opencontainers.image.description=${{ matrix.description }}
            org.opencontainers.image.licenses=MIT OR Apache-2.0

      # `META_JSON` through the environment for the same reason the bake's
      # metadata is: interpolated into `run:` it is substituted as text before
      # bash parses, and this blob carries the OCI descriptions — free prose,
      # already holding parentheses, one apostrophe away from ending the quoted
      # string and handing the rest to the shell.
      - name: Create and push multi-arch manifest for ${{ matrix.service }}
        env:
          META_JSON: ${{ steps.meta.outputs.json }}
        run: |
          amd64=$(cat /tmp/digests/amd64/${{ matrix.service }})
          arm64=$(cat /tmp/digests/arm64/${{ matrix.service }})
          tags=$(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$META_JSON")
          # shellcheck disable=SC2086
          docker buildx imagetools create $tags \
            "ghcr.io/${{ github.repository_owner }}/mako-${{ matrix.service }}@sha256:${amd64}" \
            "ghcr.io/${{ github.repository_owner }}/mako-${{ matrix.service }}@sha256:${arm64}"

      # The merge above carries the attestation manifests across only because
      # `imagetools create` flattens an index source. Nothing in the build fails
      # if it stops doing so, or if `provenance`/`sbom` are turned off upstream —
      # the images would simply publish without the evidence a market
      # surveillance authority may request under CRA Annex I Part II(1), and the
      # release would look entirely ordinary. So the release asserts it.
      - name: Assert provenance and SBOM survived the merge
        env:
          META_JSON: ${{ steps.meta.outputs.json }}
        run: |
          tag=$(jq -r '.tags[0]' <<< "$META_JSON")
          raw=$(docker buildx imagetools inspect --raw "$tag")
          # An attestation rides the index as its own manifest, tagged by the
          # `vnd.docker.reference.type` annotation BuildKit writes. Counting
          # those is independent of the `--format` field names, which differ
          # between `.Provenance`, `.SLSA` and `.SBOM` and between buildx
          # versions.
          attestations=$(jq '[.manifests[]
            | select(.annotations["vnd.docker.reference.type"] == "attestation-manifest")]
            | length' <<< "$raw")
          platforms=$(jq '[.manifests[]
            | select(.platform.architecture != "unknown")] | length' <<< "$raw")
          echo "$tag: $platforms platform manifest(s), $attestations attestation manifest(s)"
          if [ "$platforms" -ne 2 ]; then
            echo "::error::$tag has $platforms platform manifests, expected amd64 and arm64"
            exit 1
          fi
          if [ "$attestations" -lt "$platforms" ]; then
            echo "::error::$tag carries $attestations attestation manifest(s) for $platforms platforms — provenance or the SBOM did not survive the merge"
            exit 1
          fi

      # ── Attestations ──────────────────────────────────────────────────────
      #
      # GitHub artifact attestations (Sigstore bundles, keyless): a build
      # provenance and a CycloneDX SBOM for the merged image index, and the
      # same two for each binary inside it. Provenance says how a thing was
      # built; an attestation says which workflow at which commit vouches for
      # it, and `gh attestation verify` checks that offline of this repository.
      - name: Resolve the merged index digest
        id: index
        env:
          META_JSON: ${{ steps.meta.outputs.json }}
        run: |
          tag=$(jq -r '.tags[0]' <<< "$META_JSON")
          digest=$(docker buildx imagetools inspect "$tag" --format '{{json .Manifest}}' | jq -r .digest)
          case "$digest" in
            sha256:*) echo "digest=$digest" >> "$GITHUB_OUTPUT"; echo "$tag -> $digest" ;;
            *) echo "::error::no index digest for $tag"; exit 1 ;;
          esac

      - name: Download the CycloneDX SBOMs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sbom
          path: sbom

      - name: Attest image provenance
        id: attest-image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/mako-${{ matrix.service }}
          subject-digest: ${{ steps.index.outputs.digest }}
          push-to-registry: true

      - name: Attest image SBOM
        id: attest-image-sbom
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/mako-${{ matrix.service }}
          subject-digest: ${{ steps.index.outputs.digest }}
          sbom-path: sbom/${{ matrix.service }}_bin.cdx.json
          push-to-registry: true

      # The binary an operator copies out of the image is byte-identical to the
      # one extracted here, so its attestation verifies against that copy.
      - name: Extract the binaries
        run: |
          set -euo pipefail
          mkdir -p bin
          for arch in amd64 arm64; do
            digest=$(cat "/tmp/digests/${arch}/${{ matrix.service }}")
            ctr=$(docker create --platform "linux/${arch}" \
                    "ghcr.io/${{ github.repository_owner }}/mako-${{ matrix.service }}@sha256:${digest}")
            docker cp "${ctr}:/usr/local/bin/${{ matrix.service }}" "bin/${{ matrix.service }}-linux-${arch}"
            docker rm "$ctr" > /dev/null
          done
          sha256sum bin/*

      # The builder stage already refuses a binary without its `cargo
      # auditable` manifest; this reads it again from what was pushed, so a
      # change to the Dockerfile that bypasses the builder check still fails
      # the release.
      - name: Every binary carries its dependency manifest
        run: |
          set -euo pipefail
          cargo install --locked rust-audit-info@0.5.4
          for f in bin/*; do
            if ! rust-audit-info "$f" > /dev/null; then
              echo "::error::$f carries no cargo-auditable dependency manifest"
              exit 1
            fi
            echo "$f: $(rust-audit-info "$f" | jq '.packages | length') packages in the manifest"
          done

      - name: Attest binary provenance
        id: attest-bin
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: bin/*

      - name: Attest binary SBOM
        id: attest-bin-sbom
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: bin/*
          sbom-path: sbom/${{ matrix.service }}_bin.cdx.json

      - name: Verify the attestations
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_DIGEST: ${{ steps.index.outputs.digest }}
        run: |
          set -euo pipefail
          image="oci://ghcr.io/${{ github.repository_owner }}/mako-${{ matrix.service }}@${IMAGE_DIGEST}"
          gh attestation verify "$image" --repo "${{ github.repository }}"
          gh attestation verify "$image" --repo "${{ github.repository }}" \
            --predicate-type https://cyclonedx.org/bom
          for f in bin/*; do
            gh attestation verify "$f" --repo "${{ github.repository }}"
            gh attestation verify "$f" --repo "${{ github.repository }}" \
              --predicate-type https://cyclonedx.org/bom
          done

      # One record per service for the evidence pack.
      - name: Record the attestations
        env:
          IMAGE_DIGEST: ${{ steps.index.outputs.digest }}
          IMAGE_PROVENANCE: ${{ steps.attest-image.outputs.attestation-url }}
          IMAGE_SBOM: ${{ steps.attest-image-sbom.outputs.attestation-url }}
          BIN_PROVENANCE: ${{ steps.attest-bin.outputs.attestation-url }}
          BIN_SBOM: ${{ steps.attest-bin-sbom.outputs.attestation-url }}
        run: |
          set -euo pipefail
          mkdir -p attestations
          binaries=$(sha256sum bin/* | jq -Rn '[inputs | split("  ") | {file: (.[1] | ltrimstr("bin/")), sha256: .[0]}]')
          jq -n \
            --arg service "${{ matrix.service }}" \
            --arg digest "$IMAGE_DIGEST" \
            --arg image_provenance "$IMAGE_PROVENANCE" \
            --arg image_sbom "$IMAGE_SBOM" \
            --arg bin_provenance "$BIN_PROVENANCE" \
            --arg bin_sbom "$BIN_SBOM" \
            --argjson binaries "$binaries" \
            '{service: $service,
              image: {digest: $digest, provenance: $image_provenance, sbom: $image_sbom},
              binaries: {files: $binaries, provenance: $bin_provenance, sbom: $bin_sbom}}' \
            > "attestations/${{ matrix.service }}.json"
          cat "attestations/${{ matrix.service }}.json"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: attestations-${{ matrix.service }}
          path: attestations/${{ matrix.service }}.json
          if-no-files-found: error

  # ── CycloneDX SBOMs ──────────────────────────────────────────────────────────
  #
  # One CycloneDX document per service binary, from the lockfile's resolved
  # graph — the dependency inventory Regulation (EU) 2024/2847 Annex I Part II
  # point (1) asks a manufacturer to draw up „in a commonly used and
  # machine-readable format covering at the very least the top-level
  # dependencies". Build-time dependencies are left out: they ship in no
  # binary. `processd` is described with `integrated`, the feature the
  # Dockerfile builds it with.
  sbom:
    name: CycloneDX SBOMs
    runs-on: ubuntu-latest
    needs: preflight
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Toolchain is rust-toolchain.toml's
        shell: bash
        run: |
          want=$(sed -n 's/^channel *= *"\([^"]*\)".*/\1/p' rust-toolchain.toml)
          have=$(rustc --version | cut -d' ' -f2)
          case "$have" in "$want"|"$want".*) echo "rustc $have = rust-toolchain.toml $want" ;;
            *) echo "::error::rustc $have, but rust-toolchain.toml pins $want"; exit 1 ;; esac

      - name: Install cargo-cyclonedx
        run: cargo install --locked cargo-cyclonedx@0.5.9

      - name: One SBOM per service binary
        run: |
          set -euo pipefail
          opts=(--format json --spec-version 1.5 --describe binaries --no-build-deps)
          cargo cyclonedx "${opts[@]}"
          cargo cyclonedx --manifest-path services/processd/Cargo.toml -F integrated "${opts[@]}"
          mkdir -p sbom
          cp services/*/*_bin.cdx.json sbom/
          ls -l sbom

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: sbom/*.cdx.json
          if-no-files-found: error

  # ── GitHub Release with the evidence pack ───────────────────────────────────
  #
  # The last job: it runs after everything was published and attested, and
  # creates the GitHub Release carrying what a third party checks the release
  # by — `evidence-vX.Y.Z.json`, the CycloneDX SBOMs and the VEX document for
  # the advisories `deny.toml` accepts. `cargo xtask evidence-pack` writes the
  # pack from the inputs collected below; a section whose producer did not run
  # reads `not measured`, and `--check` refuses a pack with a section absent
  # or a guard that failed, so no Release is created from one.
  release:
    name: GitHub Release with the evidence pack
    runs-on: ubuntu-latest
    needs: [publish, makotest-publish, docker-manifest, sbom]
    permissions:
      contents: write       # creates the GitHub Release
      id-token: write       # attests the evidence pack
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Toolchain is rust-toolchain.toml's
        shell: bash
        run: |
          want=$(sed -n 's/^channel *= *"\([^"]*\)".*/\1/p' rust-toolchain.toml)
          have=$(rustc --version | cut -d' ' -f2)
          case "$have" in "$want"|"$want".*) echo "rustc $have = rust-toolchain.toml $want" ;;
            *) echo "::error::rustc $have, but rust-toolchain.toml pins $want"; exit 1 ;; esac

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

      - name: Reclaim runner disk
        run: |
          df -h /
          sudo rm -rf /opt/hostedtoolcache/CodeQL /usr/local/lib/android \
                      /usr/share/dotnet /opt/ghc /usr/local/share/powershell
          df -h /

      # The test exits non-zero over budget; its output is kept either way,
      # and the pack check refuses an over-budget figure.
      - name: Fidelity, measured
        run: |
          mkdir -p evidence
          cargo test -p edi-energy --test it -- --nocapture --test-threads=1 \
            extraction_fidelity::condition_damage_stays_within_budget \
            extraction_fidelity::the_silent_permit_is_measured_per_pruefidentifikator \
            > evidence/fidelity.log 2>&1 || true
          grep -E 'distinct conditions|unreadable Voraussetzung' evidence/fidelity.log || true

      # Every `just ci` recipe that is one `cargo xtask` call runs here and
      # leaves its exit status; the recipes that build the whole workspace ran
      # as `preflight` and read `not measured` in the pack.
      - name: Guard verdicts
        run: |
          mkdir -p evidence/guards
          for recipe in $(cargo xtask evidence-pack --xtask-recipes); do
            just "$recipe" > "evidence/guards/${recipe}.log" 2>&1 && code=0 || code=$?
            echo "$code" > "evidence/guards/${recipe}.exit"
            echo "${recipe}: exit $(cat "evidence/guards/${recipe}.exit")"
          done

      - name: Download the CycloneDX SBOMs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sbom
          path: evidence/sbom

      - name: Download the attestation records
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: attestations-*
          merge-multiple: true
          path: evidence/attestations

      - name: Assemble and check the evidence pack
        run: |
          set -euo pipefail
          cargo xtask evidence-pack --inputs evidence --out "evidence-${GITHUB_REF_NAME}.json"
          cargo xtask evidence-pack --check "evidence-${GITHUB_REF_NAME}.json"

      - name: Attest the evidence pack
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: evidence-${{ github.ref_name }}.json

      - name: Create the GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          fail_on_unmatched_files: true
          files: |
            evidence-${{ github.ref_name }}.json
            evidence/sbom/*.cdx.json
            release/vex.json
