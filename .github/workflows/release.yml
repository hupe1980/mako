          echo "$out"
          if [ "$rc" -ne 0 ] && ! echo "$out" | grep -qE "already uploaded|already exists on crates\.io"; then exit "$rc"; fi

      - name: crates.io token for energy-billing
        id: auth-energy-billing
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Publish energy-billing
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth-energy-billing.outputs.token }}
        run: |
          out=$(cargo publish -p energy-billing 2>&1) && rc=0 || rc=$?
          echo "$out"
          if [ "$rc" -ne 0 ] && ! echo "$out" | grep -qE "already uploaded|already exists on crates\.io"; then exit "$rc"; fi
      
      - name: crates.io token for mako-as4
        id: auth-mako-as4
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Publish mako-as4
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth-mako-as4.outputs.token }}
        run: |
          out=$(cargo publish -p mako-as4 2>&1) && rc=0 || rc=$?
          echo "$out"
          if [ "$rc" -ne 0 ] && ! echo "$out" | grep -qE "already uploaded|already exists on crates\.io"; then exit "$rc"; fi
      
      # Leaf crate (no internal deps) — depended on by mako-engine, mako-markt,
      # mako-obs, mako-gabi-gas. Must be published before any of them.
      - name: crates.io token for mako-events
        id: auth-mako-events
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

