name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write   # needed to create GitHub Releases
  packages: write   # needed to push to ghcr.io

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ── Pre-flight checks ────────────────────────────────────────────────────────
  preflight:
    name: Pre-flight (fmt / clippy / test)
    runs-on: ubuntu-latest
    env:
      PYO3_PYTHON: python3
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo registry
        uses: Swatinem/rust-cache@v2

      # `makotest` binds PyO3 with `abi3-py311`, so every workspace-wide cargo
      # command needs an interpreter >= 3.11. `.cargo/config.toml` points
      # PYO3_PYTHON at the developer's `.venv`, which does not exist here — and
      # cargo leaves an already-set variable alone, so naming the runner's
      # interpreter here is what makes the workspace build.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install protoc
        run: sudo apt-get update -y && sudo apt-get install -y protobuf-compiler

      # The tag names the release; the workspace version names the artifacts.
      # `makotest`'s wheel version is `dynamic`, so maturin takes it from
      # `Cargo.toml` and never sees the tag — a mismatch publishes the workspace
      # version under the tag's release, and `skip-existing` turns that into a
      # silent success when the wrong version is already on PyPI.
      - name: Tag matches workspace version
        run: |
          workspace="$(awk '/^\[workspace\.package\]/{f=1;next} /^\[/{f=0} f && /^version/{gsub(/[^0-9.]/,"");print;exit}' Cargo.toml)"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$workspace" != "$tag" ]; then
            echo "::error::tag v$tag does not match workspace version $workspace —"
            echo "::error::bump [workspace.package] version in Cargo.toml, or retag."
            exit 1
          fi
          echo "tag v$tag matches workspace version $workspace"

      # The publish job runs one `cargo publish` per crate, so their order is the
      # contract: cargo resolves each dependency against crates.io, not the tree.
      - name: Publish order resolves on crates.io
        run: cargo xtask check-publish-order

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Tests
        # Mirror the CI test-workspace exclusions: edi-energy is covered by its
        # own feature-matrix job and makod requires runtime-only features.
        run: cargo test --workspace --all-features --exclude edi-energy --exclude makod

      - name: Warning gate
        env:
          RUSTFLAGS: "-D warnings"
        run: cargo check --all-targets --all-features

  # ── Profile validation ───────────────────────────────────────────────────────
  validate-profiles:
    name: Validate profiles
    runs-on: ubuntu-latest
    needs: preflight
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build xtask
        run: cargo build -p xtask
      - name: validate-profiles
        run: cargo xtask validate-profiles

  # ── Publish to crates.io ─────────────────────────────────────────────────────
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    needs: [validate-profiles]
    environment: crates-io
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry
        uses: Swatinem/rust-cache@v2

      - name: Publish edi-energy
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          out=$(cargo publish -p edi-energy 2>&1) && rc=0 || rc=$?
          echo "$out"
          if [ $rc -ne 0 ] && ! echo "$out" | grep -qE "already uploaded|already exists on crates\.io"; then exit $rc; fi

      - name: Publish energy-api
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          out=$(cargo publish -p energy-api 2>&1) && rc=0 || rc=$?
          echo "$out"
          if [ $rc -ne 0 ] && ! echo "$out" | grep -qE "already uploaded|already exists on crates\.io"; then exit $rc; fi

      - name: Publish redispatch-xml
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          out=$(cargo publish -p redispatch-xml 2>&1) && rc=0 || rc=$?
          echo "$out"
          if [ $rc -ne 0 ] && ! echo "$out" | grep -qE "already uploaded|already exists on crates\.io"; then exit $rc; fi

      - name: Publish dvgw-edi
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          out=$(cargo publish -p dvgw-edi 2>&1) && rc=0 || rc=$?
          echo "$out"
          if [ $rc -ne 0 ] && ! echo "$out" | grep -qE "already uploaded|already exists on crates\.io"; then exit $rc; fi

      # Pure calculation libraries with no internal workspace lib deps — publish early.
      - name: Publish grid-billing
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          out=$(cargo publish -p grid-billing 2>&1) && rc=0 || rc=$?
          echo "$out"
          if [ $rc -ne 0 ] && ! echo "$out" | grep -qE "already uploaded|already exists on crates\.io"; then exit $rc; fi

      - name: Publish eeg-billing
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          out=$(cargo publish -p eeg-billing 2>&1) && rc=0 || rc=$?
          echo "$out"
          if [ $rc -ne 0 ] && ! echo "$out" | grep -qE "already uploaded|already exists on crates\.io"; then exit $rc; fi

      - name: Publish energy-billing
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          out=$(cargo publish -p energy-billing 2>&1) && rc=0 || rc=$?
          echo "$out"
          if [ $rc -ne 0 ] && ! echo "$out" | grep -qE "already uploaded|already exists on crates\.io"; then exit $rc; fi
      
      - name: Publish mako-as4
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          out=$(cargo publish -p mako-as4 2>&1) && rc=0 || rc=$?
          echo "$out"
          if [ $rc -ne 0 ] && ! echo "$out" | grep -qE "already uploaded|already exists on crates\.io"; then exit $rc; fi
      
      # Leaf crate (no internal deps) — depended on by mako-engine, mako-markt,
      # mako-obs, mako-gabi-gas. Must be published before any of them.
      - name: Publish mako-events
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          out=$(cargo publish -p mako-events 2>&1) && rc=0 || rc=$?
          echo "$out"
          if [ $rc -ne 0 ] && ! echo "$out" | grep -qE "already uploaded|already exists on crates\.io"; then exit $rc; fi

      # mako-fristen has no workspace dependency of its own and everything that
      # computes a Frist needs it — publish it before mako-engine.
      - name: Publish mako-fristen
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          out=$(cargo publish -p mako-fristen 2>&1) && rc=0 || rc=$?
          echo "$out"
          if [ $rc -ne 0 ] && ! echo "$out" | grep -qE "already uploaded|already exists on crates\.io"; then exit $rc; fi

      # Depends only on `mako-fristen` (published above) and crates.io `rubo4e`.
      - name: Publish mako-nbw
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          out=$(cargo publish -p mako-nbw 2>&1) && rc=0 || rc=$?
          echo "$out"
          if [ $rc -ne 0 ] && ! echo "$out" | grep -qE "already uploaded|already exists on crates\.io"; then exit $rc; fi

      - name: Publish mako-engine
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          out=$(cargo publish -p mako-engine 2>&1) && rc=0 || rc=$?
          echo "$out"
          if [ $rc -ne 0 ] && ! echo "$out" | grep -qE "already uploaded|already exists on crates\.io"; then exit $rc; fi

      - name: Publish mako-markt
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          out=$(cargo publish -p mako-markt 2>&1) && rc=0 || rc=$?
          echo "$out"
          if [ $rc -ne 0 ] && ! echo "$out" | grep -qE "already uploaded|already exists on crates\.io"; then exit $rc; fi

      # mako-pruefung depends on mako-markt and mako-fristen, and invoic-checker
      # depends on mako-pruefung — so it sits between them.
      - name: Publish mako-pruefung
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          out=$(cargo publish -p mako-pruefung 2>&1) && rc=0 || rc=$?
          echo "$out"
          if [ $rc -ne 0 ] && ! echo "$out" | grep -qE "already uploaded|already exists on crates\.io"; then exit $rc; fi

      - name: Publish invoic-checker
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          out=$(cargo publish -p invoic-checker 2>&1) && rc=0 || rc=$?
          echo "$out"
          if [ $rc -ne 0 ] && ! echo "$out" | grep -qE "already uploaded|already exists on crates\.io"; then exit $rc; fi


      - name: Publish mako-obs
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          out=$(cargo publish -p mako-obs 2>&1) && rc=0 || rc=$?
          echo "$out"
          if [ $rc -ne 0 ] && ! echo "$out" | grep -qE "already uploaded|already exists on crates\.io"; then exit $rc; fi

      # The shared INVOIC settle/dispute state machine. mako-gpke, mako-wim,
      # mako-gabi-gas and mako-geli-gas each register a family against it, so it
      # must be published before all four.
      - name: Publish mako-invoic
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          out=$(cargo publish -p mako-invoic 2>&1) && rc=0 || rc=$?
          echo "$out"
          if [ $rc -ne 0 ] && ! echo "$out" | grep -qE "already uploaded|already exists on crates\.io"; then exit $rc; fi

      - name: Publish mako-gpke
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          out=$(cargo publish -p mako-gpke 2>&1) && rc=0 || rc=$?
          echo "$out"
          if [ $rc -ne 0 ] && ! echo "$out" | grep -qE "already uploaded|already exists on crates\.io"; then exit $rc; fi

      - name: Publish mako-wim
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          out=$(cargo publish -p mako-wim 2>&1) && rc=0 || rc=$?
          echo "$out"
          if [ $rc -ne 0 ] && ! echo "$out" | grep -qE "already uploaded|already exists on crates\.io"; then exit $rc; fi

      - name: Publish mako-geli-gas
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          out=$(cargo publish -p mako-geli-gas 2>&1) && rc=0 || rc=$?
          echo "$out"
          if [ $rc -ne 0 ] && ! echo "$out" | grep -qE "already uploaded|already exists on crates\.io"; then exit $rc; fi

      - name: Publish mako-mabis
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          out=$(cargo publish -p mako-mabis 2>&1) && rc=0 || rc=$?
          echo "$out"
          if [ $rc -ne 0 ] && ! echo "$out" | grep -qE "already uploaded|already exists on crates\.io"; then exit $rc; fi

      - name: Publish mako-emob
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          out=$(cargo publish -p mako-emob 2>&1) && rc=0 || rc=$?
          echo "$out"
          if [ $rc -ne 0 ] && ! echo "$out" | grep -qE "already uploaded|already exists on crates\.io"; then exit $rc; fi

      - name: Publish mako-redispatch
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          out=$(cargo publish -p mako-redispatch 2>&1) && rc=0 || rc=$?
          echo "$out"
          if [ $rc -ne 0 ] && ! echo "$out" | grep -qE "already uploaded|already exists on crates\.io"; then exit $rc; fi

      
      - name: Publish mako-gabi-gas
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          out=$(cargo publish -p mako-gabi-gas 2>&1) && rc=0 || rc=$?
          echo "$out"
          if [ $rc -ne 0 ] && ! echo "$out" | grep -qE "already uploaded|already exists on crates\.io"; then exit $rc; fi

  # ── Docker build + push ──────────────────────────────────────────────────────
  #
  # Improved pipeline — three stages, two key changes vs. the old design:
  #
  # 1. docker-builder now runs in PARALLEL with `publish` (needs: preflight, not publish).
  #    Previously it waited ~10-15 min for crates.io publishing before starting.
  #
  # 2. docker-builder now PUSHES the builder image to ghcr.io instead of push: false.
  #    Runtime jobs use it as cache-from=type=registry, guaranteeing a cache hit
  #    (no Rust recompilation in runtime stages, even on cache-size-eviction).
  #
  # 3. docker-bake replaces the per-service docker jobs with 2 bake jobs (one per
  #    platform). docker buildx bake shares the builder stage across all 17
  #    service targets, so the builder compiles once per platform instead of once
  #    per service.
  #
  # Wall-clock time target: ~25–30 min total (vs. 2+ h before).
  #
  # The service list appears twice below — the digest-export loop and the
  # `docker-manifest` matrix — and both must hold every target in
  # `docker-bake.hcl`'s `default` group.

  # ── makotest (Python wheels -> PyPI) ────────────────────────────────────────
  #
  # abi3-py311: one wheel per platform serves every Python >= 3.11, so the
  # matrix is over target platforms only — not over interpreter versions.
  #
  # Publication uses PyPI Trusted Publishing (OIDC): no API token is stored.
  # The `id-token: write` permission below is what mints the short-lived
  # credential, and PyPI is configured to trust
  # `hupe1980/mako` + workflow `release.yml`.
  makotest-wheels:
    name: makotest wheel (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: macos-latest
            target: aarch64-apple-darwin
          # Intel macOS is cross-compiled from the Apple Silicon runner. The
          # `macos-13` Intel image was retired by GitHub, and a job requesting
          # it queues forever instead of failing — which blocks `makotest-publish`
          # and with it the whole PyPI release. Cross-compiling needs no Intel
          # runner at all: the wheel is abi3 and `pyo3/extension-module` leaves
          # Python symbols undefined, so nothing here links against libpython.
          - runner: macos-latest
            target: x86_64-apple-darwin
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"   # the abi3 floor

      # `manylinux: auto` builds Linux wheels inside a manylinux container so
      # the resulting wheel is installable on distros older than the runner.
      #
      # `target` must be passed explicitly: without it maturin builds for the
      # runner's host architecture and the matrix entry only renames the
      # artifact. Two entries now share `macos-latest`, so an implicit host
      # build would produce the same arm64 wheel twice — and because both would
      # carry an identical filename, the `merge-multiple` download in
      # `makotest-publish` would silently collapse them into one.
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          command: build
          target: ${{ matrix.target }}
          args: --release --manifest-path makotest/Cargo.toml --out dist
          manylinux: auto

      - uses: actions/upload-artifact@v4
        with:
          name: makotest-wheel-${{ matrix.target }}
          path: dist/*.whl

  makotest-sdist:
    name: makotest sdist
    runs-on: ubuntu-latest
    needs: preflight
    steps:
      - uses: actions/checkout@v4
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --manifest-path makotest/Cargo.toml --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: makotest-sdist
          path: dist/*.tar.gz

  makotest-publish:
    name: Publish makotest to PyPI
    runs-on: ubuntu-latest
    needs: [makotest-wheels, makotest-sdist]
    environment: pypi
    permissions:
      # Required for PyPI Trusted Publishing — mints the OIDC token in place
      # of a long-lived API token. Nothing else in this job needs write access.
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: makotest-*
          merge-multiple: true
          path: dist

      - name: List artifacts
        run: ls -l dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          # The tag may be re-run after a partial failure; skipping files that
          # already exist makes the job idempotent instead of hard-failing.
          skip-existing: true

  docker-builder:
    name: Docker — builder (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    needs: preflight          # CHANGED: parallel with publish (was: needs publish)
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            tag: linux-amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            tag: linux-arm64
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build the shared `builder` stage on native hardware and PUSH it to GHCR.
      # Pushing (instead of push: false) lets the docker-bake jobs restore the
      # fully-compiled builder image via cache-from=type=registry — no Rust
      # recompilation in the runtime stage, even when the GHA cache is evicted.
      - name: Build and push Rust builder stage (${{ matrix.platform }})
        uses: docker/build-push-action@v6
        with:
          context: .
          target: builder
          platforms: ${{ matrix.platform }}
          push: true                            # CHANGED: was push: false
          tags: ghcr.io/${{ github.repository_owner }}/mako-builder:${{ matrix.tag }}
          build-args: |
            OCI_REVISION=${{ github.sha }}
            OCI_CREATED=${{ github.event.head_commit.timestamp }}
          cache-from: type=gha,scope=mako-builder-${{ matrix.platform }}
          cache-to:   type=gha,scope=mako-builder-${{ matrix.platform }},mode=max

  # One bake invocation per platform builds all 17 service images from one build
  # graph, sharing the builder stage. Digests are exported for manifest merging.
  docker-bake:
    name: Docker — bake ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    needs: [docker-builder, publish]    # publish provides the semver version tag
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            tag: linux-amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            tag: linux-arm64
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # Build all 17 runtime images in one bake invocation.
      # cache-from=type=registry restores from the pushed builder image — guaranteed hit.
      # --metadata-file captures per-service OCI digests for the manifest job.
      - name: Bake all service images (${{ matrix.platform }})
        uses: docker/bake-action@v6
        id: bake
        with:
          files: docker-bake.hcl
          push: true
          set: |
            *.platform=${{ matrix.platform }}
            *.cache-from=type=registry,ref=ghcr.io/${{ github.repository_owner }}/mako-builder:${{ matrix.tag }}
            *.cache-from=type=gha,scope=mako-builder-${{ matrix.platform }}
            *.cache-to=
          provenance: false
        env:
          REGISTRY: ghcr.io/${{ github.repository_owner }}
          VERSION: ${{ steps.version.outputs.version }}
          OCI_REVISION: ${{ github.sha }}
          OCI_CREATED:  ${{ github.event.head_commit.timestamp }}

      # Extract one digest artifact per service for the manifest merge step.
      - name: Export per-service digests
        run: |
          platform_safe="${{ matrix.platform }}"
          platform_safe="${platform_safe//\//-}"
          mkdir -p /tmp/digests
          # Every target in `docker-bake.hcl`'s `default` group. A service the
          # bake builds but this loop omits is pushed by digest and then never
          # tagged: no manifest job runs for it, so the image exists in the
          # registry under no name anyone can pull. `outputd` shipped that way.
          for service in makod marktd processd invoicd edmd obsd \
                        netzbilanzd sperrd einsd \
                        productd billingd outputd accountingd vertragd \
                        portald agentd mabis-syncd; do
            digest=$(echo '${{ steps.bake.outputs.metadata }}' | jq -r --arg svc "$service" '.[$svc]["containerimage.digest"]')
            echo "${digest#sha256:}" > "/tmp/digests/${service}"
            echo "${service}: ${digest}"
          done
          echo "PLATFORM_SAFE=${platform_safe}" >> "$GITHUB_ENV"

      - name: Upload digest artifacts (${{ matrix.platform }})
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ env.PLATFORM_SAFE }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  docker-manifest:
    name: Docker — manifest ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: docker-bake
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: makod
            description: "Mako process engine daemon — German energy market communication (MaKo/BDEW EDI@Energy)"
          - service: marktd
            description: "Market Data Hub daemon — MaLo/MeLo/VersorgungsStatus/preisblaetter/EventBus fan-out"
          - service: processd
            description: "Process Decision Engine — NB STP (mako-pruefung) + LF E_0624 auto-response"
          - service: invoicd
            description: "INVOIC plausibility-check daemon — LF role, § 147 AO / GoBD receipt retention"
          - service: edmd
            description: "Energy Data Management daemon — MSCONS meter readings, MeterBillingPeriod"
          - service: obsd
            description: "Business-process observability daemon — KPI reports, §20 EnWG parity"
          - service: netzbilanzd
            description: "NNE/KA/MMM/MSB/AWH billing daemon — NB role, GridSettlement, CalculationTrace"
          - service: sperrd
            description: "Sperrung execution tracking daemon — NB role, IFTSTA 21039 auto-dispatch"
          - service: einsd
            description: "Einspeiser Registry + EEG/KWKG Settlement daemon — 10 settlement schemes, EEG/KWKG Gutschrift"
          - service: productd
            description: "Product & Tariff Catalog daemon — LF role, EPEX §41a, B2B Angebote"
          - service: billingd
            description: "Energy Billing Engine daemon — LF role, 12 categories, XRechnung 3.0, §14a, §41a"
          - service: outputd
            description: "Customer-communications daemon — Typst templates, ZUGFeRD PDF/A-3, issued-document store, per-channel delivery evidence"
          - service: accountingd
            description: "Customer Account Ledger daemon — LF role, SEPA pain.008/001, auto-dunning, GDPR Art.17"
          - service: vertragd
            description: "Contract & Customer Management daemon — LF role, B2C+B2B, OIDC→MaLo auth gateway"
          - service: portald
            description: "Customer Portal gateway — LF role, REST+SSE, §41 EnWG self-service"
          - service: agentd
            description: "Multi-agent LLM orchestration daemon — 28 declarative specialist manifests on the agentplane durable runtime, MCP tools"
          - service: mabis-syncd
            description: "MaBiS UTILTS synchronisation daemon — ÜNB/NB role, Summenzeitreihe day-3/day-8"
    steps:
      - name: Download amd64 digests
        uses: actions/download-artifact@v4
        with:
          name: digests-linux-amd64
          path: /tmp/digests/amd64

      - name: Download arm64 digests
        uses: actions/download-artifact@v4
        with:
          name: digests-linux-arm64
          path: /tmp/digests/arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/mako-${{ matrix.service }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=${{ matrix.service }}
            org.opencontainers.image.description=${{ matrix.description }}
            org.opencontainers.image.licenses=MIT OR Apache-2.0

      - name: Create and push multi-arch manifest for ${{ matrix.service }}
        run: |
          amd64=$(cat /tmp/digests/amd64/${{ matrix.service }})
          arm64=$(cat /tmp/digests/arm64/${{ matrix.service }})
          tags=$(jq -cr '.tags | map("-t " + .) | join(" ")' <<< '${{ steps.meta.outputs.json }}')
          # shellcheck disable=SC2086
          docker buildx imagetools create $tags \
            "ghcr.io/${{ github.repository_owner }}/mako-${{ matrix.service }}@sha256:${amd64}" \
            "ghcr.io/${{ github.repository_owner }}/mako-${{ matrix.service }}@sha256:${arm64}"
