name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  # A hosted runner has ~14 GB free, and a debug build of this workspace with
  # every feature no longer fits: the test job died on
  # `couldn't create a temp dir: No space left on device`, and the linker
  # failures beside it are the same cause — `rust-lld` mmaps its output, so a
  # write to a full disk arrives as SIGBUS rather than ENOSPC.
  #
  # `line-tables-only` keeps file and line in panics and backtraces — all CI
  # needs from a failing test — and drops the rest of the DWARF. Measured at
  # ~16% of the target directory on macOS, where debuginfo lives in split `.o`
  # files; on Linux it is embedded and the share is larger. Set per-profile via
  # the environment rather than in `Cargo.toml`, so a local debugger session
  # still gets complete debuginfo. `Swatinem/rust-cache` keys on `CARGO_*`
  # variables, so this starts a fresh cache rather than mixing artefacts.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only
  # Incremental compilation is a dev-loop optimisation and a one-shot job
  # recompiles from scratch anyway, so its artefacts are pure disk cost. They
  # are also the *largest* single share: an isolated `just ci` target directory
  # measured 126 GB, of which `debug/incremental` was 75 GB — the feature
  # permutations `clippy-roles` and `test-features` build each keep their own.
  CARGO_INCREMENTAL: 0

jobs:
  # ── Lockfile freshness ──────────────────────────────────────────────────────
  lockfile:
    name: Lockfile up-to-date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify Cargo.lock is up-to-date
        run: cargo update --locked
        # `cargo update --locked` fails if Cargo.lock is stale (i.e., any
        # dependency in Cargo.toml does not match what is recorded in Cargo.lock).
        # This catches accidental Cargo.toml edits that weren't followed by a
        # `cargo update` / `cargo build` to refresh the lockfile.

  # ── Formatting ──────────────────────────────────────────────────────────────
  fmt:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  # ── Clippy ──────────────────────────────────────────────────────────────────
  clippy:
    name: Clippy (-D warnings, all targets)
    runs-on: ubuntu-latest
    env:
      PYO3_PYTHON: python3
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # `makotest` binds PyO3 with `abi3-py311`, so every workspace-wide cargo
      # command needs an interpreter >= 3.11. `.cargo/config.toml` points
      # PYO3_PYTHON at the developer's `.venv`, which does not exist here — and
      # cargo leaves an already-set variable alone, so naming the runner's
      # interpreter here is what makes the workspace build.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install protoc
        run: sudo apt-get update -y && sudo apt-get install -y protobuf-compiler
      - name: Reclaim runner disk
        run: |
          df -h /
          sudo rm -rf /opt/hostedtoolcache/CodeQL /usr/local/lib/android \
                      /usr/share/dotnet /opt/ghc /usr/local/share/powershell
          df -h /
      # -D warnings: clippy lints are hard errors. RUSTFLAGS='-D warnings' (from
      # the top-level env) already promotes compiler warnings to errors; the
      # '-- -D warnings' suffix promotes clippy lints to errors as well.
      - run: cargo clippy --all-targets --all-features -- -D warnings

  # ── Tests ───────────────────────────────────────────────────────────────────
  test:
    name: Test (${{ matrix.features }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features:
          - --all-features
          - --no-default-features
          - --features utilmd
          - --features mscons
          - --features aperak
          - --features contrl
          - --features invoic
          - --features orders
          - --features partin
          - --features remadv
          - --features reqote
          - --features iftsta
          - --features insrpt
          - --features ordchg
          - --features ordrsp
          - --features comdis
          - --features pricat
          - --features utilts
          - --features quotes
          - --features diagnostics
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p edi-energy ${{ matrix.features }}

  # ── Workspace tests (all crates except edi-energy feature matrix) ───────────
  test-workspace:
    name: Test workspace crates
    runs-on: ubuntu-latest
    env:
      PYO3_PYTHON: python3
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # `makotest` binds PyO3 with `abi3-py311`, so every workspace-wide cargo
      # command needs an interpreter >= 3.11. `.cargo/config.toml` points
      # PYO3_PYTHON at the developer's `.venv`, which does not exist here — and
      # cargo leaves an already-set variable alone, so naming the runner's
      # interpreter here is what makes the workspace build.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install protoc
        run: sudo apt-get update -y && sudo apt-get install -y protobuf-compiler
      # This is the job that ran out of disk. The runner ships ~25 GB of
      # toolchains none of this build uses; dropping them buys back more than
      # the whole target directory needs.
      - name: Reclaim runner disk
        run: |
          df -h /
          sudo rm -rf /opt/hostedtoolcache/CodeQL /usr/local/lib/android \
                      /usr/share/dotnet /opt/ghc /usr/local/share/powershell
          df -h /
      # Exclude edi-energy (covered by the feature-matrix job above) and the
      # binary daemon (makod) which requires runtime-only feature flags.
      - run: cargo test --workspace --all-features --exclude edi-energy --exclude makod

  # ── makod binary and integration tests ──────────────────────────────────────
  test-makod:
    name: Test makod (binary + integration)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Run all makod unit and integration tests. The slatedb feature is
      # enabled transitively via the production dep on mako-engine. The
      # `testing` feature of mako-engine is available via dev-dependencies
      # so integration tests can use InMemory stores.
      - name: Reclaim runner disk
        run: |
          df -h /
          sudo rm -rf /opt/hostedtoolcache/CodeQL /usr/local/lib/android \
                      /usr/share/dotnet /opt/ghc /usr/local/share/powershell
          df -h /
      - name: cargo test makod
        run: cargo test -p makod --all-targets

  # ── energy-api feature-matrix ────────────────────────────────────────────────
  test-energy-api:
    name: Test energy-api (${{ matrix.features }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features:
          - --features crypto
          - --features crypto,client,server
          - --features crypto,client,server,websocket
          - --no-default-features
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p energy-api ${{ matrix.features }}


  # ── Regulatory mirror ───────────────────────────────────────────────────────
  #
  # Offline: the PDFs are not in the repository (400 MB of third-party
  # copyright), but `regulatories/bdew-mako/manifest.json` is, so CI can still
  # check that every profile cites a source document the mirror records.
  # Untracked, the `validate-profiles` citation guard finds no mirror and
  # silently passes.
  regulatories:
    name: Regulatory mirror (offline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo xtask sync-regulatories --offline


  # ── Examples ────────────────────────────────────────────────────────────────
  #
  # `cargo check --all-targets` compiles the examples but never runs them, which
  # is how three of six rotted: `05_validate` — the one demonstrating a *valid*
  # message — shipped a fixture missing a mandatory segment group and exited
  # non-zero, and two workflow examples drove their state machine into a
  # transition the domain refuses. An example is copied by whoever reads it, so
  # the gate is a real run.
  examples:
    name: Examples (run, not just compile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: extractions/setup-just@v2
      - run: just examples


  # ── Documentation ───────────────────────────────────────────────────────────
  doc:
    name: Documentation
    runs-on: ubuntu-latest
    env:
      PYO3_PYTHON: python3
      RUSTDOCFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # `makotest` binds PyO3 with `abi3-py311`, so every workspace-wide cargo
      # command needs an interpreter >= 3.11. `.cargo/config.toml` points
      # PYO3_PYTHON at the developer's `.venv`, which does not exist here — and
      # cargo leaves an already-set variable alone, so naming the runner's
      # interpreter here is what makes the workspace build.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install protoc
        run: sudo apt-get update -y && sudo apt-get install -y protobuf-compiler
      - run: cargo doc --no-deps --all-features

  # ── MSRV ────────────────────────────────────────────────────────────────────
  msrv:
    name: Minimum Supported Rust Version (1.94)
    runs-on: ubuntu-latest
    env:
      PYO3_PYTHON: python3
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94"
      - uses: Swatinem/rust-cache@v2
      # `makotest` binds PyO3 with `abi3-py311`, so every workspace-wide cargo
      # command needs an interpreter >= 3.11. `.cargo/config.toml` points
      # PYO3_PYTHON at the developer's `.venv`, which does not exist here — and
      # cargo leaves an already-set variable alone, so naming the runner's
      # interpreter here is what makes the workspace build.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install protoc
        run: sudo apt-get update -y && sudo apt-get install -y protobuf-compiler
      - run: cargo check --workspace --all-features

  # ── Deny ────────────────────────────────────────────────────────────────────
  deny:
    name: Licenses & Advisories (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --all-features

  # ── xtask smoke ─────────────────────────────────────────────────────────────
  xtask:
    name: xtask builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p xtask
      - run: cargo run -p xtask -- help
      # axum 0.7 `/:param` route literals panic at startup under 0.8, and no
      # test builds those routers — so this is the only thing that catches them.
      - run: cargo run -p xtask -- check-routes
      # A read grant declared mutating stops for a human on every call; a
      # mutating one declared read-only is dispatched unattended.
      - run: cargo run -p xtask -- check-tool-grants
      # A PID routed to a command makod never registered fails only when a real
      # invoice arrives — the check runs, the verdict is persisted, the dispatch
      # 404s, and the Antwortfrist expires on a process that looked healthy.
      - run: cargo run -p xtask -- check-answer-commands

  codegen-check:
    name: Codegen check (generated files are up-to-date)
    runs-on: ubuntu-latest
    env:
      PYO3_PYTHON: python3
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      # `makotest` binds PyO3 with `abi3-py311`, so every workspace-wide cargo
      # command needs an interpreter >= 3.11. `.cargo/config.toml` points
      # PYO3_PYTHON at the developer's `.venv`, which does not exist here — and
      # cargo leaves an already-set variable alone, so naming the runner's
      # interpreter here is what makes the workspace build.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: cargo xtask codegen --check

  makotest:
    name: makotest (Python toolkit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"   # the abi3 floor — the wheel must work here

      # Use the action rather than `pip install maturin`: this workflow sets
      # RUSTFLAGS="-D warnings" globally, and pip builds maturin from source,
      # so maturin's own lint warnings become hard errors. The action downloads
      # a prebuilt binary and sidesteps that entirely.
      #
      # `maturin build` (not `develop`) also avoids needing a virtualenv, while
      # still enabling pyo3/extension-module via `[tool.maturin] features` —
      # plain `cargo test --workspace` deliberately does not, so both paths are
      # exercised.
      - name: Build the extension wheel
        uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --manifest-path makotest/Cargo.toml --out dist

      # `hypothesis` is an optional extra, but the strategy tests
      # `importorskip` it — without it installed they would silently skip and
      # the property-based surface would go untested in CI.
      - name: Install the wheel and run the Python suite
        run: |
          pip install pytest hypothesis ruff dist/*.whl
          cd makotest && pytest -q
          python -c "import makotest.strategies"   # the extra really is importable

      # `makotest` is published to PyPI, so its Python surface gets the same
      # gate the Rust side does — a consumer reads these files.
      - name: Lint the Python layer
        working-directory: makotest
        run: |
          ruff check .
          ruff format --check .

      # The sdist is only exercised at release time otherwise, and it is the
      # artifact pip falls back to when no wheel matches. It must build
      # standalone: makotest depends on workspace crates by `path`, so maturin
      # has to vendor them into the tarball. Verify that here, not on the tag.
      - name: Build the sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --manifest-path makotest/Cargo.toml --out sdist-out

      - name: Verify the sdist builds standalone
        # RUSTFLAGS is cleared for this step only: the sdist build compiles our
        # crates from scratch under pip, and a warning in a transitive build
        # script must not fail the check.
        env:
          RUSTFLAGS: ""
        run: |
          python -m venv /tmp/sdist-venv
          /tmp/sdist-venv/bin/pip install --no-binary :all: sdist-out/*.tar.gz
          /tmp/sdist-venv/bin/python -c "
          import makotest
          assert makotest.malo_from_base('5123869601') == '51238696012'
          assert makotest.add_werktage('2026-12-24', 2) == '2026-12-29'
          assert makotest.antwort_obligation(55001).clock_time == '11:00'
          print('sdist OK', makotest.__version__)
          "

  validate-profiles:
    name: Validate profiles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo xtask validate-profiles
      # Every format version a counterparty can still send must have a fixture
      # carrying its UNH 0057 code, so a BDEW release bump cannot land in
      # mig.json without a message that exercises it.
      - run: cargo xtask validate-release-codes

  validate-pruefids:
    name: Validate Pruefidentifikator coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Full informational scan (MISSING PIDs are warnings, not failures).
      - name: Coverage scan (informational)
        run: cargo xtask validate-pruefids
      # Hard gates: all message types currently have 100% PID fixture coverage.
      # These gates prevent regressions when new PIDs are added in future AHB
      # releases. Add new types here once their fixture coverage reaches 100%.
      - name: Coverage gate — aperak (strict)
        run: cargo xtask validate-pruefids --message-type aperak --strict
      - name: Coverage gate — comdis (strict)
        run: cargo xtask validate-pruefids --message-type comdis --strict
      - name: Coverage gate — iftsta (strict)
        run: cargo xtask validate-pruefids --message-type iftsta --strict
      - name: Coverage gate — insrpt (strict)
        run: cargo xtask validate-pruefids --message-type insrpt --strict
      - name: Coverage gate — invoic (strict)
        run: cargo xtask validate-pruefids --message-type invoic --strict
      - name: Coverage gate — mscons (strict)
        run: cargo xtask validate-pruefids --message-type mscons --strict
      - name: Coverage gate — ordchg (strict)
        run: cargo xtask validate-pruefids --message-type ordchg --strict
      - name: Coverage gate — orders (strict)
        run: cargo xtask validate-pruefids --message-type orders --strict
      - name: Coverage gate — ordrsp (strict)
        run: cargo xtask validate-pruefids --message-type ordrsp --strict
      - name: Coverage gate — partin (strict)
        run: cargo xtask validate-pruefids --message-type partin --strict
      - name: Coverage gate — pricat (strict)
        run: cargo xtask validate-pruefids --message-type pricat --strict
      - name: Coverage gate — quotes (strict)
        run: cargo xtask validate-pruefids --message-type quotes --strict
      - name: Coverage gate — remadv (strict)
        run: cargo xtask validate-pruefids --message-type remadv --strict
      - name: Coverage gate — reqote (strict)
        run: cargo xtask validate-pruefids --message-type reqote --strict
      - name: Coverage gate — utilmd (strict)
        run: cargo xtask validate-pruefids --message-type utilmd --strict
      - name: Coverage gate — utilts (strict)
        run: cargo xtask validate-pruefids --message-type utilts --strict
      # CONTRL is pid_exempt (no Prüfidentifikatoren) — the strict gate here
      # verifies that both fv20251001 and fv20260101 profiles exist and are valid
      # (prevents the FV2025-10-01 profile gap from reoccurring, see F-032).
      - name: Coverage gate — contrl (strict)
        run: cargo xtask validate-pruefids --message-type contrl --strict

  release-diff-smoke:
    name: release-diff smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        # Use a real cross-release diff so a broken diff tool is detected.
        # The pair is read from the profile directories rather than hardcoded:
        # an fv name is the Anwendungszeitpunkt and moves when a release does.
        # release-diff exits 1 when differences are found (expected here); use
        # `|| true` so bash -e does not abort on the expected non-zero exit.
      - run: |
          # Bash expands a glob in lexicographic order, so the oldest and newest
          # profile directories are the first and last elements.
          FVS=()
          for d in crates/edi-energy/profiles/mscons/*/; do FVS+=("$(basename "$d")"); done
          LAST=$(( ${#FVS[@]} - 1 ))
          echo "diffing mscons ${FVS[0]} -> ${FVS[$LAST]}"
          out=$(cargo xtask release-diff --message-type mscons \
            --from "${FVS[0]}" --to "${FVS[$LAST]}" || true)
          echo "$out"
          echo "$out" | grep -q '##' || { echo 'ERROR: release-diff produced no section headers'; exit 1; }

  check-release-coverage:
    name: Release coverage check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo xtask check-release-coverage

  # ── Dockerfile lint ─────────────────────────────────────────────────────────
  # Validates all nine Dockerfile stages (makod, marktd, processd, invoicd,
  # edmd, obsd, plus the chef/planner/builder stages) without running a
  # full Rust compilation.  Catches syntax errors, broken COPY paths, and
  # invalid --target references before they reach the release pipeline.
  dockerfile-lint:
    name: Dockerfile lint (all targets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # --check performs Dockerfile linting + build-graph validation without
      # invoking the builder backend or compiling any Rust code.
      # Each target is checked independently so failures are isolated.
      - name: Lint runtime (makod)
        run: docker buildx build --check --target runtime .

      - name: Lint marktd-runtime
        run: docker buildx build --check --target marktd-runtime .

      - name: Lint processd-runtime
        run: docker buildx build --check --target processd-runtime .

      - name: Lint invoicd-runtime
        run: docker buildx build --check --target invoicd-runtime .

      - name: Lint edmd-runtime
        run: docker buildx build --check --target edmd-runtime .

      - name: Lint obsd-runtime
        run: docker buildx build --check --target obsd-runtime .
