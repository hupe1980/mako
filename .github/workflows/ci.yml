name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# No CI job writes anything back to the repository or a registry.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  # Debug info is `line-tables-only` (dependencies none) through `[profile.dev]`
  # in the workspace manifest, which is what keeps a debug build of this
  # workspace inside a hosted runner's ~14 GB.
  #
  # Incremental compilation is a dev-loop optimisation and a one-shot job
  # recompiles from scratch anyway, so its artefacts are pure disk cost — and
  # the largest single share: an isolated `just ci` target directory measured
  # 126 GB, of which `debug/incremental` was 75 GB.
  CARGO_INCREMENTAL: 0
  # `makotest` binds PyO3 with `abi3-py311`, so every workspace-wide cargo
  # command needs an interpreter >= 3.11. `.cargo/config.toml` points
  # PYO3_PYTHON at the developer's `.venv`, which does not exist here, and cargo
  # leaves an already-set variable alone. The runner image's `python3` is above
  # the floor; only the `makotest` job pins the floor itself.
  PYO3_PYTHON: python3

# The toolchain is `rust-toolchain.toml`'s in every job: rustup reads the file
# on the first cargo call. `guards` asserts it once for the runner image.
jobs:
  # ── Source checks ───────────────────────────────────────────────────────────
  #
  # Everything that needs no workspace build: the lockfile, formatting, unused
  # dependencies, licences and advisories, every xtask guard of `just ci`, the
  # fuzz targets, the Dockerfile and the SQL. One job, because each is seconds
  # to minutes and the setup would otherwise be paid once per check.
  guards:
    name: Guards, lints and SQL
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # mako uses `sqlx::query`, which prepares at run time, so a statement
    # Postgres will not accept compiles and ships. `just ci` cannot run
    # `check-sql` (it would start a container); here a service container gives
    # it a server and `MAKO_CHECK_SQL_URL` points the check at it.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: check-sql
        ports:
          - 5432:5432
        # Without this the check races the server's first boot and reports
        # every statement broken.
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Toolchain is rust-toolchain.toml's
        run: |
          want=$(sed -n 's/^channel *= *"\([^"]*\)".*/\1/p' rust-toolchain.toml)
          have=$(rustc --version | cut -d' ' -f2)
          case "$have" in "$want"|"$want".*) echo "rustc $have = rust-toolchain.toml $want" ;;
            *) echo "::error::rustc $have, but rust-toolchain.toml pins $want"; exit 1 ;; esac
      # `fuzz/` is excluded from the workspace and carries its own lockfile and
      # target directory, so it is cached as a workspace of its own.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            .
            fuzz
      - uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2.87.24
        with:
          tool: just@1.58.0,cargo-machete@0.9.2
      # Fails when a Cargo.toml edit was not followed by a lockfile refresh.
      - name: Cargo.lock is up to date
        run: cargo update --locked
      - run: just fmt-check
      - run: just machete
      # Every `just ci` recipe whose body is one xtask call, read out of the
      # justfile's `_ci` prerequisites rather than restated here: a guard added
      # to `just ci` is in the pull-request gate the moment it is added, and
      # `check-ci-guards` (one of them) refuses this workflow without this
      # step. Every recipe runs, and the step fails naming each one that failed.
      - name: Every xtask guard among the `_ci` prerequisites
        run: |
          set -uo pipefail
          recipes=$(cargo xtask evidence-pack --xtask-recipes)
          test -n "$recipes" || { echo "::error::no xtask recipe found in the justfile's _ci"; exit 1; }
          failed=""
          for recipe in $recipes; do
            echo "::group::just $recipe"
            just "$recipe" || failed="$failed $recipe"
            echo "::endgroup::"
          done
          echo "$(echo "$recipes" | wc -w | tr -d ' ') xtask recipes run"
          if [ -n "$failed" ]; then
            for recipe in $failed; do echo "::error::just $recipe failed"; done
            exit 1
          fi
      - run: just no-version-alias
      - run: cargo xtask check-sql
        env:
          MAKO_CHECK_SQL_URL: postgres://postgres:check-sql@localhost:5432/postgres
      # `fuzz/` restates each dependency version by hand (an excluded crate
      # cannot inherit `[workspace.dependencies]`), so a bump on the workspace
      # side is only proved compatible here. A `cargo check`, not `cargo fuzz
      # build`, which needs nightly and the sanitiser runtime; `audit.yml`
      # runs the targets.
      - run: just check-fuzz
      # Same `deny.toml` for both locks; `fuzz/Cargo.lock` gets advisories only.
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          arguments: --all-features
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          manifest-path: fuzz/Cargo.toml
          command: check advisories
          arguments: --all-features
      # Every runtime stage `docker-bake.hcl` releases is linted and its build
      # graph validated without compiling anything, so a broken COPY or
      # `--target` is found here and not by the release tag. The output is
      # overridden because the bake file's push-by-digest is no lint's concern.
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Lint every released Dockerfile stage
        run: docker buildx bake --check --set '*.output=type=cacheonly'

  clippy:
    name: Clippy (-D warnings, all targets)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install protoc
        run: sudo apt-get update -y && sudo apt-get install -y protobuf-compiler
      - name: Reclaim runner disk
        run: |
          sudo rm -rf /opt/hostedtoolcache/CodeQL /usr/local/lib/android \
                      /usr/share/dotnet /opt/ghc /usr/local/share/powershell
          df -h /
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  # Every feature of every crate, each built alone — and each crate with its
  # default features, which is the build `cargo publish` verifies. The list
  # comes from the manifests, so a feature added to a crate is built here with
  # no edit to this file. Two shards keep each under the timeout.
  features:
    name: Each feature alone (cargo hack ${{ matrix.partition }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        partition: ["1/2", "2/2"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install protoc
        run: sudo apt-get update -y && sudo apt-get install -y protobuf-compiler
      - name: Reclaim runner disk
        run: |
          sudo rm -rf /opt/hostedtoolcache/CodeQL /usr/local/lib/android \
                      /usr/share/dotnet /opt/ghc /usr/local/share/powershell
          df -h /
      - uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2.87.24
        with:
          tool: just@1.58.0,cargo-hack@0.6.45
      - run: just check-features --partition ${{ matrix.partition }}

  # makod has its own job below. nextest runs every test in its own process and
  # no doctests, which the `doc` job runs. The examples run after the suite on
  # the same build: `cargo check --all-targets` compiles an example and never
  # runs it, and an example is copied by whoever reads it.
  test:
    name: Test workspace crates and run the examples
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install protoc
        run: sudo apt-get update -y && sudo apt-get install -y protobuf-compiler
      - name: Reclaim runner disk
        run: |
          sudo rm -rf /opt/hostedtoolcache/CodeQL /usr/local/lib/android \
                      /usr/share/dotnet /opt/ghc /usr/local/share/powershell
          df -h /
      - uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2.87.24
        with:
          tool: just@1.58.0,cargo-nextest@0.9.146
      - run: cargo nextest run --workspace --all-features --all-targets --exclude makod
      - run: just examples

  test-makod:
    name: Test makod (binary + integration)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Reclaim runner disk
        run: |
          sudo rm -rf /opt/hostedtoolcache/CodeQL /usr/local/lib/android \
                      /usr/share/dotnet /opt/ghc /usr/local/share/powershell
          df -h /
      - uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2.87.24
        with:
          tool: cargo-nextest@0.9.146
      - run: cargo nextest run -p makod --all-targets

  # What CONTRIBUTING.md promises: every service starts from its
  # dev/config/<service>.toml against dev/docker-compose.yml and reaches
  # /health/ready. Then makod boots once per `[deployment] rollen` declaration
  # and passes `--check`, which runs the startup assertions (adapter coverage,
  # dispatch completeness) only a start can.
  dev-smoke:
    name: Every service starts; makod starts in every role
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install protoc
        run: sudo apt-get update -y && sudo apt-get install -y protobuf-compiler
      - name: Reclaim runner disk
        run: |
          sudo rm -rf /opt/hostedtoolcache/CodeQL /usr/local/lib/android \
                      /usr/share/dotnet /opt/ghc /usr/local/share/powershell
          df -h /
      - uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2.87.24
        with:
          tool: just@1.58.0
      - run: just smoke-dev
      - run: just smoke-roles

  doc:
    name: Documentation and doc examples
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RUSTDOCFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install protoc
        run: sudo apt-get update -y && sudo apt-get install -y protobuf-compiler
      - name: Reclaim runner disk
        run: |
          sudo rm -rf /opt/hostedtoolcache/CodeQL /usr/local/lib/android \
                      /usr/share/dotnet /opt/ghc /usr/local/share/powershell
          df -h /
      - run: cargo doc --workspace --no-deps --all-features
      # Every test job passes `--all-targets`, which excludes doctests, and
      # `cargo doc` only renders them; this is the step that compiles and runs
      # every `/// ```rust` block.
      - run: cargo test --workspace --all-features --doc

  # `--all-features` turns on every role at once, which is the one
  # configuration in which a misplaced `#[cfg(feature = "role-…")]` cannot
  # show. Each role-scoped build of processd, mako-pruefung and agentd is
  # linted on its own.
  roles:
    name: Role-scoped builds
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install protoc
        run: sudo apt-get update -y && sudo apt-get install -y protobuf-compiler
      - uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2.87.24
        with:
          tool: just@1.58.0
      - run: just clippy-roles

  makotest:
    name: makotest (Python toolkit)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"   # the abi3 floor — the wheel must work here

      # The action rather than `pip install maturin`: RUSTFLAGS="-D warnings"
      # is set workflow-wide and pip builds maturin from source, so maturin's
      # own lint warnings would become hard errors. `maturin build` enables
      # pyo3/extension-module via `[tool.maturin] features`, which plain
      # `cargo test --workspace` deliberately does not, so both paths run.
      - name: Build the extension wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: v1.15.0
          command: build
          args: --manifest-path makotest/Cargo.toml --out dist

      # `hypothesis` is an optional extra, but the strategy tests
      # `importorskip` it — without it they would silently skip. Every package
      # from the index is pinned by hash; the wheel built above is installed
      # alone (`--no-deps`), so nothing else is resolved from PyPI.
      - name: Install the wheel and run the Python suite
        run: |
          pip install --require-hashes -r .github/requirements/makotest-ci.txt
          pip install --no-deps dist/*.whl
          cd makotest && pytest -q
          python -c "import makotest.strategies"   # the extra really is importable

      # `makotest` is published to PyPI, so a consumer reads these files.
      - name: Lint the Python layer
        working-directory: makotest
        run: |
          ruff check .
          ruff format --check .

      # The sdist is what pip falls back to when no wheel matches, and it must
      # build standalone: makotest depends on workspace crates by `path`, so
      # maturin has to vendor them into the tarball.
      - name: Build the sdist
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: v1.15.0
          command: sdist
          args: --manifest-path makotest/Cargo.toml --out sdist-out

      - name: Verify the sdist builds standalone
        # RUSTFLAGS is cleared for this step only: the sdist build compiles our
        # crates from scratch under pip, and a warning in a transitive build
        # script must not fail the check. The build backend comes from a
        # hash-pinned file and the sdist builds without build isolation, so pip
        # fetches nothing unpinned.
        env:
          RUSTFLAGS: ""
        run: |
          python -m venv /tmp/sdist-venv
          /tmp/sdist-venv/bin/pip install --require-hashes -r .github/requirements/makotest-sdist.txt
          /tmp/sdist-venv/bin/pip install --no-deps --no-build-isolation --no-binary :all: sdist-out/*.tar.gz
          /tmp/sdist-venv/bin/python -c "
          import makotest
          assert makotest.malo_from_base('5123869601') == '51238696012'
          assert makotest.add_werktage('2026-12-24', 2) == '2026-12-29'
          assert makotest.antwort_obligation(55001).clock_time == '11:00'
          print('sdist OK', makotest.__version__)
          "
