[package]
name             = "makod"
version.workspace          = true
description = "Protocol daemon for German energy market communication: EDIFACT, AS4, REST and the mako process engine"
authors.workspace          = true
edition.workspace          = true
license.workspace          = true
repository.workspace       = true
rust-version.workspace     = true
publish          = false

[[bin]]
name = "makod"
path = "src/main.rs"

[lib]
name = "makod"
path = "src/lib.rs"

[dependencies]
mako-fristen = { workspace = true }
mako-events = { workspace = true }
mako-engine      = { path = "../../crates/mako-engine", features = ["slatedb"] }
mako-gpke        = { path = "../../crates/mako-gpke" }
mako-invoic      = { path = "../../crates/mako-invoic" }
# The Antwortcode catalogue: a code is validated against the Entscheidungsbaum
# that publishes it before the answer can reach the wire.
# `role-msb` implies `role-esa`, and both are used directly here (the WiM
# adapters resolve Antwortcodes, the ESA ones the Wertebestellung trees).
# Naming them is the point: inherited through `mako-wim` they would leave makod
# depending on another crate's feature choice, and dropping it there would break
# this crate with an error pointing somewhere else entirely.
mako-pruefung      = { workspace = true, features = ["role-msb", "role-emob"] }
mako-wim         = { path = "../../crates/mako-wim" }
mako-geli-gas    = { path = "../../crates/mako-geli-gas" }
dvgw-edi         = { path = "../../crates/dvgw-edi" }
mako-gabi-gas    = { path = "../../crates/mako-gabi-gas" }
mako-mabis       = { workspace = true }
# NZR-EMob / Modell 2 — the three UTILMD legs (55238–55243) that move a
# Marktlokation into and out of the LPB's Bilanzierungsgebiet. Loaded for a
# VNB, an LF and an LPB deployment alike: all three answer one of the legs.
mako-emob        = { workspace = true }
mako-redispatch  = { path = "../../crates/mako-redispatch" }
# The format half of the Redispatch transport boundary — parses the nine
# BDEW XML document types the AS4 leg carries (mirrors edi-energy for
# EDIFACT). makod is the only crate depending on both halves; the canonical
# DocumentType → RedispatchDocumentKind mapping lives in redispatch_xml_ingest.
redispatch-xml   = { path = "../../crates/redispatch-xml" }
edifact-rs       = { workspace = true }
mako-as4     = { path = "../../crates/mako-as4", features = ["server"] }
energy-api   = { path = "../../crates/energy-api", features = ["server", "client"] }
rubo4e       = { workspace = true }
mako-markt   = { path = "../../crates/mako-markt", features = ["marktd-client"] }
rust_decimal = { workspace = true }
asx-rs       = { workspace = true, features = ["as4", "client", "interop-strict", "server"] }
# Structured logging + optional OTLP span export (OTEL_EXPORTER_OTLP_ENDPOINT).
mako-service = { workspace = true, features = ["otel", "oidc", "cedar"] }
edi-energy   = { path = "../../crates/edi-energy", default-features = false, features = [
    "utilmd", "mscons", "aperak", "contrl", "invoic", "remadv",
    "orders", "iftsta", "insrpt", "reqote", "partin", "ordchg", "ordrsp",
    "quotes", "comdis", "pricat", "utilts",
    "tracing",
] }

anyhow             = { workspace = true }
axum               = { version = "0.8", features = [] }
clap               = { version = "4", features = ["derive", "env"] }
fd-lock            = "4"
object_store       = { version = "0.14", features = ["aws", "gcp", "azure"] }
serde              = { version = "1", features = ["derive"] }
toml               = { version = "0.8", default-features = false, features = ["parse"] }
serde_json         = { workspace = true }
cedar-policy       = "4"
time               = { workspace = true }
tokio              = { version = "1", features = ["full"] }
tokio-util         = { version = "0.7", features = ["rt"] }
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
uuid               = { workspace = true }
reqwest            = { version = "0.13", default-features = false, features = ["json", "rustls", "query"] }
secrecy            = "0.10"
sha2               = "0.10"
# Decodes a partner signing certificate from PEM to DER so its SHA-256
# fingerprint can be pinned on the inbound AS4 session.
base64             = { version = "0.22" }
utoipa             = { version = "5", features = ["axum_extras", "uuid", "time"] }
utoipa-swagger-ui  = { version = "9", features = ["axum"] }
rmcp = { workspace = true }
schemars = { version = "1.2.1", features = ["chrono04"] }
governor = "0.6"

[dev-dependencies]
# Adds the "testing" feature on top of the production "slatedb" dep,
# enabling InMemoryEventStore, NoopDeadLetterSink, InMemoryInboxStore.
# Must never appear in a production build.
mako-engine  = { path = "../../crates/mako-engine", features = ["testing"] }
mako-as4     = { path = "../../crates/mako-as4", features = ["testing"] }
tempfile     = "3"
tokio        = { version = "1", features = ["full"] }
serde_json   = { workspace = true }
time         = { workspace = true }
# Router-level exercise of the :8090 auth layer (ServiceExt::oneshot).
tower        = "0.5"
http-body-util = "0.1"

[lints]
workspace = true
