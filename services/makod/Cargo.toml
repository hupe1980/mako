[package]
name             = "makod"
version.workspace          = true
description      = "Main binary for running the Mako process engine"
authors.workspace          = true
edition.workspace          = true
license.workspace          = true
repository.workspace       = true
rust-version.workspace     = true
publish          = false

[[bin]]
name = "makod"
path = "src/main.rs"

[lib]
name = "makod"
path = "src/lib.rs"

[dependencies]
mako-fristen = { workspace = true }
mako-events = { workspace = true }
mako-engine      = { path = "../../crates/mako-engine", features = ["slatedb"] }
mako-gpke        = { path = "../../crates/mako-gpke" }
mako-invoic      = { path = "../../crates/mako-invoic" }
# The Antwortcode catalogue: a code is validated against the Entscheidungsbaum
# that publishes it before the answer can reach the wire.
# `role-msb` implies `role-esa`, and both are used directly here (the WiM
# adapters resolve Antwortcodes, the ESA ones the Wertebestellung trees).
# Naming them is the point: they used to arrive only because `mako-wim` enables
# them, so dropping that would have broken makod with an error pointing
# somewhere else entirely.
mako-pruefung      = { workspace = true, features = ["role-msb", "role-emob"] }
mako-wim         = { path = "../../crates/mako-wim" }
mako-geli-gas    = { path = "../../crates/mako-geli-gas" }
dvgw-edi         = { path = "../../crates/dvgw-edi" }
mako-gabi-gas    = { path = "../../crates/mako-gabi-gas" }
mako-mabis       = { path = "../../crates/mako-mabis" }
# NZR-EMob / Modell 2 — the three UTILMD legs (55238–55243) that move a
# Marktlokation into and out of the LPB's Bilanzierungsgebiet. Loaded for a
# VNB, an LF and an LPB deployment alike: all three answer one of the legs.
mako-emob        = { workspace = true }
mako-redispatch  = { path = "../../crates/mako-redispatch" }
# The format half of the Redispatch transport boundary — parses the nine
# BDEW XML document types the AS4 leg carries (mirrors edi-energy for
# EDIFACT). makod is the only crate depending on both halves; the canonical
# DocumentType → RedispatchDocumentKind mapping lives in redispatch_xml_ingest.
redispatch-xml   = { path = "../../crates/redispatch-xml" }
edifact-rs       = { workspace = true }
mako-as4     = { path = "../../crates/mako-as4", features = ["server"] }
energy-api   = { path = "../../crates/energy-api", features = ["server", "client"] }
rubo4e       = { workspace = true }
mako-markt   = { path = "../../crates/mako-markt", features = ["marktd-client"] }
rust_decimal = { workspace = true }
asx-rs       = { workspace = true, features = ["as4", "client", "interop-strict", "server"] }
# Structured logging + optional OTLP span export (OTEL_EXPORTER_OTLP_ENDPOINT).
mako-service = { workspace = true, features = ["otel", "oidc", "cedar"] }
edi-energy   = { path = "../../crates/edi-energy", default-features = false, features = [
    "utilmd", "mscons", "aperak", "contrl", "invoic", "remadv",
    "orders", "iftsta", "insrpt", "reqote", "partin", "ordchg", "ordrsp",
    "quotes", "comdis", "pricat", "utilts",
] }

anyhow             = { workspace = true }
axum               = { version = "0.8", features = [] }
clap               = { version = "4", features = ["derive", "env"] }
fd-lock            = "4"
object_store       = { version = "0.14", features = ["aws", "gcp", "azure"] }
serde              = { version = "1", features = ["derive"] }
toml               = { version = "0.8", default-features = false, features = ["parse"] }
serde_json         = { workspace = true }
cedar-policy       = "4"
thiserror          = { workspace = true }
time               = { workspace = true }
tokio              = { version = "1", features = ["full"] }
tokio-util         = { version = "0.7", features = ["rt"] }
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
uuid               = { workspace = true }
reqwest            = { version = "0.13", default-features = false, features = ["json", "rustls", "query"] }
hmac               = { version = "0.12", features = ["std"] }
secrecy            = "0.10"
sha2               = "0.10"
utoipa             = { version = "5", features = ["axum_extras", "uuid", "time"] }
utoipa-axum        = "0.2"
utoipa-swagger-ui  = { version = "9", features = ["axum"] }
rmcp = { workspace = true }
schemars = { version = "1.2.1", features = ["chrono04"] }
governor = "0.6"

[dev-dependencies]
# Adds the "testing" feature on top of the production "slatedb" dep,
# enabling InMemoryEventStore, NoopDeadLetterSink, InMemoryInboxStore.
# Must never appear in a production build.
mako-engine  = { path = "../../crates/mako-engine", features = ["testing"] }
mako-as4     = { path = "../../crates/mako-as4", features = ["testing"] }
tempfile     = "3"
tokio        = { version = "1", features = ["full"] }
serde_json   = { workspace = true }
time         = { workspace = true }
# Router-level exercise of the :8090 auth layer (ServiceExt::oneshot).
tower        = "0.5"
http-body-util = "0.1"

# ── Role-isolation feature flags ─────────────────────────────────────────────
#
# Build purpose-specific binaries that exclude the code for roles the operator
# does not deploy. This cuts binary size, keeps unwanted PIDs out of the router,
# and gives legal traceability — the binary SHA identifies the role scope for a
# BNetzA audit.
#
# `default` enables every role, so a plain `cargo build -p makod` is the
# all-roles binary. A role-scoped build turns the default off:
#
#   cargo build -p makod --no-default-features --features role-lf
#
# Deployment profiles (all with --no-default-features):
#   lf-only       = role-lf                        # pure LF supplier
#   nb-only       = role-nb                        # pure DSO/GNB
#   nb-strom-only = role-nb-strom                  # Strom DSO only
#   nb-gas-only   = role-nb-gas                    # Gas GNB only
#   msb-only      = role-msb                       # pure MSB
#   esa-only      = role-esa-strom                 # pure ESA (WiM Strom Teil 2)
#   integrated    = role-lf,role-nb,role-msb       # Stadtwerk / VIU
#
# Selecting no role at all is a build error rather than a silently all-roles
# binary: `--features role-esa-strom` alone used to satisfy the old
# "no role flags means every role" convention and shipped every module.
[features]
default = ["role-lf", "role-nb", "role-msb", "role-esa-strom"]

# ── Per-Sparte, per-role granular flags ──────────────────────────────────────
# Strom roles
role-lf-strom  = []  # LF Strom: gpke-* LF-side, wim LF-affected
role-nb-strom  = []  # NB/DSO Strom: gpke-* NB-side, Sperrung, Konfiguration,
                     #   UTILTS, MSCONS, WiM NB-side, PARTIN 37000-37006,
                     #   INVOIC 31001/31002/31005/31006, MaBiS, Redispatch 2.0
role-msb-strom = []  # MSB Strom: wim-* auf den 55xxx-Prüfidentifikatoren
role-esa-strom = []  # ESA Strom: wim-wertebestellung ESA-side (WiM Teil 2 Kap. 4)
# Gas roles
role-lf-gas    = []  # LF Gas (LFG): geli-gas-* LF-side
role-nb-gas    = []  # GNB: geli-gas-* NB-side, Sperrung Gas, PARTIN 37008-37014,
                     #   INVOIC 31007/31008/31011, gabi-gas-mmma (13013)
role-msb-gas   = []  # gMSB: dieselben wim-* Workflows auf den 44xxx-PIDs
# ── Composite convenience flags ───────────────────────────────────────────────
role-lf  = ["role-lf-strom",  "role-lf-gas"]    # dual-fuel LF (most common)
role-nb  = ["role-nb-strom",  "role-nb-gas"]    # combined DSO+GNB
role-msb = ["role-msb-strom", "role-msb-gas"]   # combined MSB
