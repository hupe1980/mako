[package]
name             = "processd"
version.workspace = true
description      = "Process decision engine for German energy market (LF auto-response + NB Anmeldung STP)"
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish          = false

# ── Role-gated feature flags ──────────────────────────────────────────────────
# Compile with exactly the Marktrolle(n) you operate.
#
# What these features are and are not. They select which **decision paths** are
# compiled and registered, so a deployment carries only the answers it is meant
# to give and an operator can read its obligations off the build. They are not a
# regulatory artefact: §7 EnWG requires a separate *legal entity* for a VNB with
# 100 000 or more connected customers (§7 Abs. 2 is the de-minimis threshold),
# §7a operational and §6a informational separation — none of them speaks about
# binaries, and no BNetzA procedure inspects a build hash. The separation that
# matters legally happens above this file; what happens here is that a
# `nb-only` binary cannot accidentally answer as an LF.
#
# Nor is the compiled artefact hermetic: `mako-gpke`, `mako-geli-gas` and
# `mako-wim` are unconditional dependencies and each pins the `mako-pruefung`
# trees it needs, so a role-gated build still *links* those catalogues. What the
# feature gates is the handler that would use them.
#
# Features:
#   role-lf-strom  — LF answers to the nine GPKE processes it is asked about,
#                    plus the LFN bootstrap
#   role-lf-gas    — LF answers to the GeLi Gas processes it is asked about
#   role-nb-strom  — GPKE Anmeldung STP (55001, 55016) via `mako-pruefung`;
#                    EoG gap closure; the MSB-Wechsel PIDs the *NB* answers
#   role-nb-gas    — GeLi Gas Anmeldung STP (44001) via `mako-pruefung`
#   role-msb       — the MSB's own obligations: REQOTE→QUOTES, §14a
#                    Steuerungsauftrag ORDRSP, the MSB-Wechsel PIDs the *MSB*
#                    answers, and the ESA Wertebestellung (WiM Teil 2 Kap. 4 —
#                    35003/17007/17008/39002), a mandatory Zusatzleistung under
#                    §34 Abs. 2 S. 2 Nr. 10 MsbG
#
# The MSB role is its own feature because its work is its own: a Kündigung MSB
# (55039) is MSBN → MSBA and never reaches the NB, and a Steuerungsauftrag
# ORDRSP is the MSB's answer. Before it existed a pure MSB could not deploy the
# automation at all, and an `nb-only` build answered messages the NB never
# receives.
#
# Compound feature flags:
#   lf-only    = ["role-lf-strom", "role-lf-gas"]
#   nb-only    = ["role-nb-strom", "role-nb-gas"]
#   msb-only   = ["role-msb"]
#   integrated = every role (one operator holding several Marktrollen)
[features]
default = []

## LF answers to the NB- and LFN-initiated GPKE processes (`E_0609`, `E_0624`,
## `E_0614`, `E_0615`, `E_0603`–`E_0606`) + LFN Strom bootstrap.
role-lf-strom = ["mako-pruefung/role-lf"]
## LF answers to the NB- and LFN-initiated GeLi Gas processes (`E_3001`,
## `E_3002`, `E_3008`, `E_3020`).
role-lf-gas   = ["mako-pruefung/role-lf"]
## GPKE Anmeldung/Abmeldung STP for Strom (`E_0622`, `E_0607`) via `mako-pruefung`.
role-nb-strom = ["mako-pruefung/role-nb"]
## GeLi Gas Anmeldung STP (PID 44001) via `mako-pruefung`.
role-nb-gas   = ["mako-pruefung/role-nb"]
## MSB obligations: REQOTE→QUOTES, §14a Steuerungsauftrag ORDRSP, the
## MSB-answered MSB-Wechsel PIDs in **both Sparten** (55039/55168 and
## 44039/44168 — AWH WiM Gas 2.0 restates WiM Strom Teil 1 use-case for
## use-case, so one handler serves both), and the ESA Wertebestellung.
role-msb  = ["mako-pruefung/role-msb"]

## Pure LF deployment — no NB or MSB decision path registered.
lf-only    = ["role-lf-strom", "role-lf-gas"]
## Pure NB deployment — no LF or MSB decision path registered.
nb-only    = ["role-nb-strom", "role-nb-gas"]
## Pure MSB deployment, both Sparten.
msb-only   = ["role-msb"]
## One operator holding several Marktrollen — every decision path in one binary.
integrated = ["role-lf-strom", "role-lf-gas", "role-nb-strom", "role-nb-gas", "role-msb"]

[[bin]]
name = "processd"
path = "src/main.rs"

[lib]
name = "processd"
path = "src/lib.rs"

[dependencies]
mako-fristen = { workspace = true }
mako-events = { workspace = true }
mako-markt    = { workspace = true, features = ["makod-client", "marktd-client"] }
# The GPKE / GeLi Gas answer-Frist tables. The operator queue must expire on the
# same instant makod registers on the process, so both read one table.
# The UTILMD wire-code tables. `mako-gpke` already pulls it in, and the NB
# module reads `SG4 STS+7` DE 9013 directly, so it is named rather than
# re-spelled as string literals beside the ones edi-energy defines.
edi-energy    = { workspace = true }
mako-gpke     = { path = "../../crates/mako-gpke" }
mako-geli-gas = { path = "../../crates/mako-geli-gas" }
mako-wim      = { workspace = true }
# The role features above select which Entscheidungsbäume compile in, so a
# role features above select which decision paths compile in — see the header.
mako-pruefung  = { workspace = true }

anyhow             = { workspace = true }
thiserror          = { workspace = true }
axum               = { version = "0.8", features = [] }
# Exact percent arithmetic for the E_0623 Tranchen-Prüfschritte: the shares are
# summed and compared against the one the LFN registered.
rust_decimal       = { workspace = true }
serde              = { workspace = true }
serde_json         = { workspace = true }
toml               = { version = "0.8", default-features = false, features = ["parse"] }
time               = { workspace = true }
time-tz            = { workspace = true }
uuid               = { workspace = true }
tokio              = { version = "1", features = ["full"] }
tokio-util         = { workspace = true }
tracing            = "0.1"
mako-service       = { workspace = true, features = ["otel", "cedar", "oidc", "metrics"] }
rmcp               = { workspace = true }
schemars           = { workspace = true }
secrecy            = "0.10"
subtle             = "2"
reqwest            = { workspace = true }
prometheus         = "0.14"
sqlx               = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "uuid", "time", "json"] }

[dev-dependencies]
mako-markt   = { workspace = true }
# The LF answer path is a contract between two producers (`mako-gpke`,
# `mako-geli-gas`) and one consumer. The round-trip tests build the event with
# the real builder rather than by hand — which is how the two drifted.
mako-engine  = { workspace = true }
# `role-nb` only: the SQL integration test builds a `Marktlokationsart` for the
# `E_0608` Prüflauf. A bare path dependency here would pull the crate's default
# features — every Marktrolle's trees — back into the test builds and quietly
# undo what the workspace-level `default-features = false` is for.
mako-pruefung = { workspace = true, features = ["role-nb"] }
# The PID-contract guard compares processd's trigger PIDs against the canonical
# workflow constants that drive makod's spawn table.
tokio        = { version = "1", features = ["full"] }
serde_json   = { workspace = true }
testcontainers = { workspace = true }
testcontainers-modules = { workspace = true }
