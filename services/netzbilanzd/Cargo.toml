[package]
name        = "netzbilanzd"
description = "Grid operator daemon: issues INVOIC 31001, 31002, 31005, 31009 and 31011, tracks REMADV, computes Redispatch Kostenblätter and files MaBiS Summenzeitreihen (MSCONS 13003) with the BIKO"
version.workspace     = true
authors.workspace     = true
edition.workspace     = true
license.workspace     = true
repository.workspace  = true
rust-version.workspace = true
publish         = false

[lib]
name = "netzbilanzd"
path = "src/lib.rs"

[[bin]]
name = "netzbilanzd"
path = "src/main.rs"
test = false

[dependencies]
mako-fristen = { workspace = true }
mako-events = { workspace = true }
grid-billing    = { workspace = true, features = ["bo4e"] }
# The arithmetic core, for `proportional_split` — a GGV share vector has to
# add to exactly 100 %, which per-share rounding does not give.
billing = { workspace = true }
mako-redispatch = { path = "../../crates/mako-redispatch" }
# MaBiS: the Summenzeitreihe builder, the Prüfidentifikator type and the
# metering interval model the aggregate sums.
mako-mabis      = { workspace = true }
mako-engine     = { workspace = true }
metering        = { workspace = true, features = ["serde"] }
futures         = "0.3"
mako-markt      = { workspace = true, features = ["makod-client", "marktd-client"] }
mako-service    = { workspace = true, features = ["oidc", "cedar", "otel", "metrics"] }
invoic-checker  = { workspace = true }
axum            = { version = "0.8" }
sqlx            = { version = "0.8", features = ["postgres", "runtime-tokio-rustls", "time", "uuid", "json", "rust_decimal"] }
tokio           = { version = "1", features = ["full"] }
serde           = { workspace = true, features = ["derive"] }
serde_json      = { workspace = true }
rust_decimal    = { workspace = true }
reqwest         = { workspace = true }
time            = { workspace = true }
uuid            = { workspace = true, features = ["v4", "serde"] }
tracing         = "0.1"
anyhow          = "1"
thiserror       = { workspace = true }
secrecy         = { version = "0.10" }
rubo4e          = { workspace = true }
rmcp            = { workspace = true }
tokio-util      = { workspace = true }

[dev-dependencies]
mako-service = { workspace = true, features = ["testing"] }
testcontainers = { workspace = true }
testcontainers-modules = { workspace = true }

[lints]
workspace = true
