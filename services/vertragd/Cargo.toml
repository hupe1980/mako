[package]
name        = "vertragd"
description = "Contract and customer daemon: supply contracts, Kündigungsfristen, GGV and aggregator contracts"
version.workspace     = true
authors.workspace     = true
edition.workspace     = true
license.workspace     = true
repository.workspace  = true
rust-version.workspace = true
publish         = false

[lib]
name = "vertragd"
path = "src/lib.rs"

[[bin]]
name = "vertragd"
path = "src/main.rs"
test = false

[dependencies]
mako-fristen = { workspace = true }
mako-events = { workspace = true }
mako-service  = { path = "../../crates/mako-service", features = ["otel","oidc","cedar", "metrics"] }
mako-markt    = { path = "../../crates/mako-markt" }
axum          = { version = "0.8" }
strsim        = { workspace = true }
tokio         = { version = "1", features = ["full"] }
serde         = { workspace = true, features = ["derive"] }
serde_json    = { workspace = true }
sqlx          = { version = "0.8", features = ["postgres","uuid","time","runtime-tokio-rustls","json","rust_decimal"] }
uuid          = { workspace = true, features = ["v4","serde"] }
time          = { workspace = true }
reqwest       = { workspace = true }
rubo4e        = { workspace = true }
rust_decimal  = { workspace = true }
sepa          = { workspace = true }
tracing       = "0.1"
anyhow        = { workspace = true }
secrecy       = { version = "0.10" }
rmcp          = { workspace = true, features = ["transport-streamable-http-server","transport-io"] }
tokio-util    = { workspace = true }

[dev-dependencies]
mako-service = { path = "../../crates/mako-service", features = ["testing"] }
toml       = "0.8"
testcontainers = { workspace = true }
testcontainers-modules = { workspace = true }

[lints]
workspace = true
