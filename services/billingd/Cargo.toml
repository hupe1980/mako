[package]
name        = "billingd"
description = "Retail billing daemon (LF): invoices as BO4E Rechnung and EN 16931, Abschlagspläne, § 41a dynamic tariffs and § 14a modules"
version.workspace     = true
authors.workspace     = true
edition.workspace     = true
license.workspace     = true
repository.workspace  = true
rust-version.workspace = true
publish         = false

[lib]
name = "billingd"
path = "src/lib.rs"

[[bin]]
name = "billingd"
path = "src/main.rs"

[dependencies]
mako-fristen = { workspace = true }
mako-events = { workspace = true }
mako-service = { workspace = true, features = ["oidc", "cedar", "otel", "metrics"] }
energy-billing = { workspace = true, features = ["eeg", "bo4e", "en16931"] }
rmcp         = { workspace = true }
schemars     = { workspace = true }
mako-markt   = { workspace = true, features = ["marktd-client"] }
# The single gas-quality normaliser; see `mako_geli_gas::gas_quality`.
mako-geli-gas = { path = "../../crates/mako-geli-gas" }
rubo4e       = { workspace = true }
axum         = { version = "0.8" }
sqlx         = { version = "0.8", features = ["postgres", "runtime-tokio-rustls", "time", "uuid", "json", "rust_decimal"] }
tokio        = { version = "1", features = ["full"] }
serde        = { workspace = true, features = ["derive"] }
serde_json   = { workspace = true }
time         = { workspace = true }
thiserror    = { workspace = true }
uuid         = { workspace = true, features = ["v4", "serde"] }
rust_decimal = { workspace = true }
reqwest      = { workspace = true }
tracing      = "0.1"
anyhow       = "1"
secrecy      = { version = "0.10" }
tokio-util   = { workspace = true }
en16931         = { workspace = true }
en16931-formats = { workspace = true }


[dev-dependencies]
mako-service = { workspace = true, features = ["testing"] }
toml       = "0.8"
testcontainers = { workspace = true }
testcontainers-modules = { workspace = true }
time = { workspace = true }

[lints]
workspace = true
