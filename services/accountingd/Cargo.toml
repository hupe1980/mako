[package]
name        = "accountingd"
description = "Supplier sub-ledger daemon: customer accounts, open items, payment matching, dunning and SEPA direct debit on a double-entry ledger"
version.workspace     = true
authors.workspace     = true
edition.workspace     = true
license.workspace     = true
repository.workspace  = true
rust-version.workspace = true
publish         = false

[lib]
name = "accountingd"
path = "src/lib.rs"

[[bin]]
name = "accountingd"
path = "src/main.rs"
# The binary is the one-line runner call; the daemon is tested through the library.
test = false

[dependencies]
mako-fristen = { workspace = true }
mako-events = { workspace = true }
mako-markt  = { workspace = true, features = ["makod-client"] }
mako-service = { workspace = true, features = ["oidc", "cedar", "otel", "metrics"] }
rmcp         = { workspace = true }
schemars     = { workspace = true }
axum         = { version = "0.8" }
sqlx         = { version = "0.8", features = ["postgres", "runtime-tokio-rustls", "time", "uuid", "json", "rust_decimal"] }
tokio        = { version = "1", features = ["full"] }
serde        = { workspace = true, features = ["derive"] }
serde_json   = { workspace = true }
time         = { workspace = true }
uuid         = { workspace = true, features = ["v4", "serde"] }
rust_decimal = { workspace = true }
rubo4e       = { workspace = true }
sepa         = { workspace = true, features = ["time"] }
# Tamper-evident double-entry ledger kernel — accountingd's accounting/storage base.
doubleentry  = { workspace = true, features = ["postgres", "serde"] }
# Keyed hashing for the IBAN lookup key (app-layer, replaces pgcrypto digest()).
blake3       = "1"
tracing      = "0.1"
tokio-util   = { workspace = true }
anyhow       = "1"
thiserror    = { workspace = true }
secrecy      = { version = "0.10", features = ["serde"] }

[dev-dependencies]
mako-service = { workspace = true, features = ["testing"] }
toml       = "0.8"
testcontainers = { workspace = true }
testcontainers-modules = { workspace = true }
sqlx = { version = "0.8", features = ["postgres", "runtime-tokio-rustls", "time", "uuid", "json", "rust_decimal", "migrate", "macros"] }
tokio = { version = "1", features = ["full", "test-util"] }

[lints]
workspace = true
