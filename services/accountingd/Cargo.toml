[package]
name        = "accountingd"
description = "Massenkontokorrent / Customer Account Ledger daemon (LF role). Kundenkonto running ledger, Offene Posten AR, Zahlungszuordnung, Abschlagsforderungen against Erhaltene Anzahlungen, Mahnwesen (Mahnstufe 1-3) rendered and delivered through outputd, SEPA-Lastschrift pain.008 XML, Bankruecklast, Jahresabschluss on demand or from the para.40b Abs. 1 worker. Ingest de.billing.rechnung.erstellt + de.invoic.receipt.settled + de.eeg.verguetung.berechnet. Port :9380."
version.workspace     = true
authors.workspace     = true
edition.workspace     = true
license.workspace     = true
repository.workspace  = true
rust-version.workspace = true
publish         = false

[lib]
name = "accountingd"
path = "src/lib.rs"

[[bin]]
name = "accountingd"
path = "src/main.rs"

[dependencies]
mako-fristen = { workspace = true }
mako-events = { workspace = true }
mako-markt  = { workspace = true, features = ["makod-client"] }
mako-service = { workspace = true, features = ["oidc", "cedar", "otel"] }
rmcp         = { workspace = true }
schemars     = { workspace = true }
axum         = { version = "0.8" }
sqlx         = { version = "0.8", features = ["postgres", "runtime-tokio-rustls", "time", "uuid", "json", "rust_decimal"] }
tokio        = { version = "1", features = ["full"] }
serde        = { workspace = true, features = ["derive"] }
serde_json   = { workspace = true }
time         = { workspace = true }
uuid         = { workspace = true, features = ["v4", "serde"] }
rust_decimal = { workspace = true }
rubo4e       = { workspace = true }
reqwest      = { workspace = true }
sepa         = { workspace = true, features = ["time"] }
# Tamper-evident double-entry ledger kernel — accountingd's accounting/storage base.
doubleentry  = { workspace = true, features = ["postgres", "serde"] }
# Keyed hashing for the IBAN lookup key (app-layer, replaces pgcrypto digest()).
blake3       = "1"
tracing      = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tower-http   = { version = "0.6" }
tokio-util   = { workspace = true }
anyhow       = "1"
thiserror    = { workspace = true }
secrecy      = { version = "0.10", features = ["serde"] }

[features]
# Enable integration tests that require a live PostgreSQL database.
# Usage: cargo test -p accountingd --test integration_tests --features integration-tests
# Requires: DATABASE_URL env var pointing to a PostgreSQL admin connection.
integration-tests = []

[dev-dependencies]
testcontainers = { workspace = true }
testcontainers-modules = { workspace = true }
sqlx = { version = "0.8", features = ["postgres", "runtime-tokio-rustls", "time", "uuid", "json", "rust_decimal", "migrate", "macros"] }
tokio = { version = "1", features = ["full", "test-util"] }
