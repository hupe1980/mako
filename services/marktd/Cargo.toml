[package]
name             = "marktd"
version.workspace = true
description      = "Market data hub daemon: MaLo, MeLo, supply status, partner registries and durable CloudEvents fan-out"
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish          = false

[[bin]]
name = "marktd"
path = "src/main.rs"
# The binary is the one-line `run` call; the daemon is tested through the library.
test = false

[lib]
name = "marktd"
path = "src/lib.rs"

[dependencies]
mako-fristen = { workspace = true }
mako-events = { workspace = true }
mako-markt = { path = "../../crates/mako-markt", features = ["makod-client"] }
# The Kapitel-4.6 Messprodukt catalogue: the ESA product registry refuses a
# code the Marktrolle may not order, and folds in the dated Pflicht rule.
mako-wim   = { workspace = true }
metering   = { workspace = true, features = ["serde"] }
rubo4e    = { workspace = true }

anyhow             = { workspace = true }
axum               = { version = "0.8", features = [] }
serde              = { version = "1", features = ["derive"] }
serde_json         = { workspace = true }
toml               = { version = "0.8", default-features = false, features = ["parse"] }
time               = { workspace = true }
uuid               = { workspace = true }
tokio              = { version = "1", features = ["full"] }
tokio-util         = { workspace = true }
tracing            = "0.1"
mako-service       = { workspace = true, features = ["otel", "cedar", "oidc", "metrics", "mcp"] }
rmcp               = { workspace = true }
schemars           = { workspace = true }
reqwest            = { workspace = true }
rust_decimal       = { workspace = true }
# The Referenzreihen import is idempotent on the file's SHA-256.
sha2               = "0.10"
thiserror          = { workspace = true }
utoipa             = { workspace = true }
utoipa-axum        = { workspace = true }
prometheus         = "0.14"
sqlx               = { workspace = true, features = ["rust_decimal"] }

[dev-dependencies]
tower          = { workspace = true }
http-body-util = "0.1"
mako-service = { workspace = true, features = ["testing"] }
testcontainers = { workspace = true }
testcontainers-modules = { workspace = true }
# (no `testing` feature: every marktd repository is exercised against a real
# PostgreSQL via testcontainers in tests/*_integration.rs)
tokio      = { version = "1", features = ["full"] }
serde_json = { workspace = true }
# The NB's answer to an Anmeldung, built by its workflow, is the event the
# supply projection is held against.
mako-engine   = { workspace = true }
mako-gpke     = { workspace = true }
mako-geli-gas = { workspace = true }
# A 55071 / 55072 reaches the store as the outbox entry its workflow writes,
# and the NB's `E_0622` walk is held against what the store then answers.
mako-mabis    = { workspace = true }
mako-pruefung = { workspace = true, features = ["role-nb"] }

[lints]
workspace = true
