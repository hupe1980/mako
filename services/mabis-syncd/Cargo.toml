[package]
name         = "mabis-syncd"
version.workspace     = true
description  = "MaBiS daemon: aggregates per-MaLo load profiles from edmd and files Summenzeitreihen (MSCONS 13003) with the BIKO through makod"
authors.workspace     = true
edition.workspace     = true
license.workspace     = true
repository.workspace  = true
rust-version.workspace = true
publish      = false
keywords     = ["mabis", "mscons", "bilanzkreis", "energy", "mako"]
categories   = ["network-programming"]

[lib]
name = "mabis_syncd"
path = "src/lib.rs"

[[bin]]
name = "mabis-syncd"
path = "src/main.rs"

[dependencies]
mako-fristen = { workspace = true }
anyhow           = { workspace = true }
futures          = "0.3"
axum             = { version = "0.8" }
mako-engine      = { workspace = true }
mako-events      = { workspace = true }
mako-mabis       = { workspace = true }
# The command-name catalogue, so the name this service posts to `makod` is the
# one `makod` registers rather than a literal the two can drift apart on.
mako-markt       = { workspace = true }
mako-service     = { workspace = true, features = ["otel", "oidc", "cedar", "metrics"] }
metering         = { workspace = true, features = ["serde"] }
rubo4e           = { workspace = true }
rust_decimal     = { workspace = true }
secrecy          = "0.10"
serde            = { workspace = true }
serde_json       = { workspace = true }
sqlx             = { version = "0.8", features = ["postgres", "runtime-tokio-rustls", "time", "uuid", "json", "rust_decimal"] }
thiserror        = { workspace = true }
time             = { workspace = true }
tokio            = { version = "1", features = ["full"] }
tokio-util       = { workspace = true }
toml             = { version = "0.8", default-features = false, features = ["parse"] }
tracing          = "0.1"
uuid             = { workspace = true }
rmcp             = { workspace = true }
schemars         = { workspace = true }

[dev-dependencies]
mako-service = { workspace = true, features = ["testing"] }
anyhow = { workspace = true }
testcontainers = { workspace = true }
testcontainers-modules = { workspace = true }

[lints]
workspace = true
