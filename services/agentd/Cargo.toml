[package]
name        = "agentd"
description = "Auditable advisory agent plane for mako"
version.workspace     = true
authors.workspace     = true
edition.workspace     = true
license.workspace     = true
repository.workspace  = true
rust-version.workspace = true
publish         = false

[lib]
name = "agentd"
path = "src/lib.rs"

[[bin]]
name = "agentd"
path = "src/main.rs"

[dependencies]
mako-fristen = { workspace = true }
mako-events = { workspace = true }
# The BDEW MaKo Werktage calendar, so an agent's approval window and the
# regulatory window it guards resolve through the same holiday table.
mako-service = { workspace = true, features = ["otel", "oidc", "cedar", "metrics"] }
axum         = { version = "0.8" }
tokio        = { version = "1", features = ["full"] }
serde        = { workspace = true, features = ["derive"] }
serde_json   = { workspace = true }
time         = { workspace = true }
uuid         = { workspace = true, features = ["v4", "serde"] }
rubo4e       = { workspace = true }
tracing      = "0.1"
# The bridge from agentplane's instrument catalogue to `GET /metrics`.
# agentplane emits every metric as a `tracing` event on its own target and picks
# no exporter, so the embedder supplies the collector — `plane::metrics`.
tracing-subscriber = { workspace = true }
prometheus   = "0.14"
anyhow       = "1"
reqwest      = { workspace = true }
tokio-util   = { workspace = true }
secrecy      = { version = "0.10", features = ["serde"] }
# Ed25519 seeds and witness public keys arrive as standard base64, the encoding
# `openssl rand -base64 32` produces and the one C2SP `signed-note` uses on the
# wire. Same version `mako-service` verifies Standard Webhooks signatures with.
base64       = { version = "0.22" }
agentplane = { version = "0.25", features = [
    # The declaration, and the wires that reach a model and a tool server.
    "manifest", "mcp", "providers",
    # Both journal backends: an embedded file, or one database several
    # instances share.
    "redb", "postgres",
    # The gate every effect passes, and the signature on every record —
    # `plane::attest` is what applies the second, on both the store (records)
    # and the runtime (outward claims). The feature alone signs nothing.
    "cedar", "signing",
    # Submitting checkpoints to a party that is not us, over C2SP
    # `tlog-witness`. What closes the split-view gap: a hash chain proves
    # nobody edited *this* history and says nothing about a second one.
    "witness-http",
    # Envelope encryption, with the wrapping key held by Vault rather than us.
    "keyring", "keyring-vault",
    # The operator surface: worklist, run views, case history, event delivery.
    "http",
    # Durable outbound delivery for an operator-configured destination: the
    # journal is the outbox, and a cursor advances only on 2xx.
    "push",
] }
# The client transport that reaches mako's MCP servers. agentplane takes an
# already-initialised rmcp service rather than a connection string, so which
# transport carries a call stays a deployment decision.
rmcp = { version = "3.1", default-features = false, features = [
    "client", "transport-streamable-http-client", "transport-streamable-http-client-reqwest",
] }
async-trait = "0.1.91"

[dev-dependencies]
# testkit brings FakeProvider, Faulty and the replay assertions. It carries no
# reqwest dependency, so it resolves independently of the provider drivers.
agentplane = { version = "0.25", features = [
    "manifest", "mcp", "providers", "redb", "postgres", "cedar", "signing",
    "keyring", "keyring-vault", "http", "push", "witness-http", "testkit",
] }
tokio = { version = "1", features = ["full"] }
toml  = "0.9"

# ── Role-isolation feature flags (§§ 6a, 7a EnWG) ───────────────────────────
#
# Mirrors the flags every other daemon carries. An `role-lf` build compiles no
# NB or MSB specialist and configures no NB or MSB MCP endpoint — structural
# separation rather than a policy decision at request time.
#
# Default (no flags): all roles, matching the other services.
[features]
# Amazon Bedrock Converse, off by default. The AWS SDK is a substantial
# dependency tree — and pulls `http` 0.2 alongside the workspace's 1.x, which
# costs two cargo-deny skips — so a deployment that does not run on Bedrock
# does not pay for it. Everything else agentd speaks (Anthropic, OpenAI,
# Gemini, and the OpenAI-compatible wire for TGI/vLLM/Ollama) is unconditional.
bedrock  = ["agentplane/bedrock"]

role-lf  = []
role-nb  = []
role-msb = []
