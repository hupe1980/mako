[package]
name        = "agentd"
description = "Multi-agent LLM orchestration daemon for mako"
version.workspace     = true
authors.workspace     = true
edition.workspace     = true
license.workspace     = true
repository.workspace  = true
rust-version.workspace = true
publish         = false

[lib]
name = "agentd"
path = "src/lib.rs"

[[bin]]
name = "agentd"
path = "src/main.rs"

[dependencies]
mako-events = { workspace = true }
mako-service = { workspace = true, features = ["otel", "oidc", "cedar"] }
axum         = { version = "0.8" }
tokio        = { version = "1", features = ["full"] }
serde        = { workspace = true, features = ["derive"] }
serde_json   = { workspace = true }
time         = { workspace = true }
uuid         = { workspace = true, features = ["v4", "serde"] }
tracing      = "0.1"
anyhow       = "1"
reqwest      = { workspace = true }
tokio-util   = { workspace = true }
secrecy      = { version = "0.10", features = ["serde"] }
agentplane = { version = "0.9", features = ["manifest", "mcp", "providers", "postgres", "cedar", "signing", "keyring"] }
# The client transport that reaches mako's MCP servers. agentplane takes an
# already-initialised rmcp service rather than a connection string, so which
# transport carries a call stays a deployment decision.
rmcp = { version = "3.1", default-features = false, features = [
    "client", "transport-streamable-http-client", "transport-streamable-http-client-reqwest",
] }
async-trait = "0.1.91"

[dev-dependencies]
# testkit brings FakeProvider, Faulty and the replay assertions. It carries no
# reqwest dependency, so it resolves independently of the provider drivers.
agentplane = { version = "0.9", features = [
    "manifest", "mcp", "providers", "postgres", "cedar", "signing", "keyring", "testkit",
] }
tokio = { version = "1", features = ["full"] }
toml  = "0.9"

# ── Role-isolation feature flags (§ 9 EnWG informatorisches Unbundling) ──────
#
# Mirrors the flags every other daemon carries. An `role-lf` build compiles no
# NB or MSB specialist and configures no NB or MSB MCP endpoint — structural
# separation rather than a policy decision at request time.
#
# Default (no flags): all roles, matching the other services.
[features]
role-lf  = []
role-nb  = []
role-msb = []
