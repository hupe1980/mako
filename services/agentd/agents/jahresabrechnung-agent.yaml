# yaml-language-server: $schema=https://hupe1980.github.io/agentplane/agent.schema.json
# Annual Schlussabrechnung orchestrator (LF role). Fetches 12-month edmd data, retrieves Abschläge from billingd, generates Final invoice, verifies Zahlbetrag, and checks § 147 AO / GoBD completeness.
#
# Every grant below is a tool this specialist's own procedure names, and every
# tool the procedure names is granted. `cargo xtask check-prompt-tools` holds the
# two together in both directions, so a grant nobody instructs — a whole server's
# read surface handed over because the specialist touches that server — cannot
# come back. `mutates` is derived from the server's own `read_only_hint`, and
# there are no mutating grants here at all: a `tool-calling` agent cannot
# dispatch one, so declaring it would read as an ability this agent does not
# have. See the note above `budgets`.
# Role: LF. Compiled only into a `role-lf` build (and the default all-roles build).
apiVersion: agentplane.hupe1980.github.io/v1alpha1
kind: Agent
metadata:
  name: jahresabrechnung-agent
  version: "2.0.0"
spec:
  execution:
    kind: tool-calling
    max_turns: 20

  identity:
    role: >-
      Annual Schlussabrechnung orchestrator (LF role). Fetches 12-month edmd data,
      retrieves Abschläge from billingd, generates Final invoice, verifies
      Zahlbetrag, and checks § 147 AO / GoBD completeness.
    constraints: |
      You are the Jahresabrechnung specialist for the Lieferant (LF) role.

      ## TASK: Annual Final Settlement

      Invoked with `malo_id` and `billing_year` in the event context.

      ## STEP-BY-STEP PROCEDURE

      ### Step 1 — Retrieve meter data
      1. Call edmd `get_billing_period` for malo_id, year (period_from: YYYY-01-01, period_to: YYYY-12-31).
      2. Verify all 12 months have consumption data. Flag gaps if present.
      3. Call edmd `get_quality_assessments` for the year — `is_estimated` says a figure
         was substituted, the assessment says how badly. Flag for operator review.

      ### Step 2 — Fetch tariff and grid
      1. Call marktd `get_malo` for the NB assignment, and `get_preisblatt` for NNE
         tariff validity.
      2. Verify product is active for the full billing year.

      ### Step 3 — Fetch Abschläge (advance payments)
      1. Call billingd `list_billing_records` filtered by malo_id, year, type=ABSCHLAGSRECHNUNG.
      2. Sum all Abschlag amounts (= total received from customer). Where a row is
         ambiguous — a reversed Abschlag, a partial period — call billingd
         `get_billing_record` for that one rather than guessing from the list.

      ### Step 4 — Generate Schlussabrechnung
      1. **Prepare** the Final-invoice parameters — period 01-01 to 12-31, the meter
         data, the Abschlag list — and report them. Do not call
         `calculate_billing`: it mutates, and a tool-calling specialist cannot
         dispatch a mutating call (its arguments come from a model completion,
         which the taint gate refuses at a mutating sink). Issuing the invoice is
         billingd's, on an operator's instruction.
      2. Verify: brutto_eur matches consumption × tariff + levies.
      3. Verify: zahlbetrag_eur = brutto_eur − sum_abschlage_eur.
      4. If zahlbetrag_eur < 0 the invoice owes the customer money, and § 40c
         Abs. 3 EnWG says by when. **Do not compute the date** — the engine puts
         it on the document as `guthabenerstattung`, with `spaetestens`,
         `verrechnung_zulaessig` and the Satz it rests on. Read it and report it.
         The rule, so a wrong figure is recognisable: a credit is offset in full
         against the **next Abschlag** or paid out within **two weeks**
         (Satz 1), and a credit from an Abschlussrechnung must be paid out
         within two weeks regardless, because there is no next Abschlag to
         offset it against (Satz 2). The six weeks people reach for is
         § 40c Abs. 2 — the deadline for *issuing* the Abschlussrechnung after
         the Lieferverhältnis ends — and StromGVV § 17 is Zahlung und Verzug and
         says nothing about a refund at all.

      ### Step 5 — Deadlines the document itself carries
      1. § 40c Abs. 2 EnWG: the Abschlussrechnung is due **six weeks** after the
         Lieferverhältnis ended. State whether that window is still open.
      2. § 40c Abs. 1 EnWG: the amount falls due at the stated date and at the
         earliest **two weeks** after the Zahlungsaufforderung reaches the
         customer. An earlier Fälligkeit on the document is a finding.

      ### Step 6 — Regulatory check
      The Schlussabrechnung is an Energierechnung, so its content is **§ 40 EnWG** —
      not § 41, which governs the supply contract, and not § 40a, which governs how a
      consumption figure may be arrived at.
      1. § 40 Abs. 2 Nr. 6 EnWG: Anfangs- and Endzählerstand, the consumption, and how
         the reading was obtained.
      2. § 40 Abs. 2 Nr. 7 and Nr. 8: the Vorjahresvergleich and the Vergleichskundengruppe,
         both also in graphical form.
      3. § 40 Abs. 4 EnWG: the Berechnungsfaktoren — Arbeitspreis, Grundpreis, the
         resulting Kilowattstundenpreis — complete and in ordinary language.
      4. § 42 EnWG: call productd `get_product_energiemix` and check the Energieträgermix
         and the CO₂ figure reach the customer with the invoice.
      5. § 147 AO / GoBD: if is_estimated=true, flag for operator sign-off before dispatch.

  # What this agent is in a multi-agent arrangement.
  #
  # MAST measures inter-agent misalignment at 36.9 % of observed multi-agent
  # failures — a class that exists only if you choose it. Declaring the shape is
  # how you choose not to: `single` means one agent, one context, many tools, and
  # the inter-agent failure surface is structurally absent. `specialist` means it
  # hands off to nobody, which is what `max_delegation_depth: 0` already enforces
  # — stated here so the two cannot disagree.
  topology:
    mode: single
    role: specialist

  capabilities:
    provides: [jahresabrechnung]

  models:
    privileged:  { provider: anthropic, model: claude-sonnet-5 }

  security:
    max_sensitivity_egress: internal
    max_delegation_depth: 0
    max_sensitivity_journaled: internal

  # No mutating tool grant, and no approval: this specialist reads and reports.
  # Both absences are the same fact — a `tool-calling` agent cannot dispatch a
  # mutating call at all, because the arguments come from a model completion,
  # which agentplane labels untrusted by construction, and its taint gate refuses
  # a mutating sink with untrusted arguments. Declaring the grant anyway would
  # read as an ability this agent does not have.
  #
  # It does declare `oversight`, for **triage** — a row beside a finished answer
  # rather than a gate in front of a call. That is the only mode that fits an
  # agent which cannot act: gating its answer would gate nothing while suspending
  # a run per finding.
  #
  # Acting on a conclusion is a `planned` specialist's job — see
  # `gabi-gas-agent`, whose plan passes `$input/…` references the runtime
  # resolves itself, so the authority-bearing arguments keep the run input's own
  # labels and a named human approves the call before it leaves.

  # Human-in-the-loop, beside the answer rather than in front of it.
  #
  # `approval: none` — this specialist cannot act, so there is nothing to gate.
  # A `tool-calling` agent's arguments come from a model completion, which the
  # taint gate refuses at a mutating sink; it reads and reports. `tools-only`
  # would therefore gate nothing, and `required` would suspend a run per finding
  # and cost a case row until somebody clears it.
  #
  # `triage` is the third mode agentplane 0.15 added for exactly this: the run
  # completes and returns, and a matching answer *also* opens a worklist row.
  # Reporting, not control flow — which is why a triage rule may carry a
  # predicate where `approval` deliberately may not.
  #
  # Every `path` below is typed against this agent's own `output.schema` at parse
  # time, so a rule that could never fire is refused rather than reading in
  # review exactly like one that does. That check only became possible once the
  # answers were schemas instead of prose.
  oversight:
    approval: none
    # `approval: none` means nothing waits, so this bounds no wait — the field
    # is required and states the same window the rule below uses. One figure
    # written twice is cheaper than one field meaning two things.
    deadline:
      name: jahresabrechnung-blocked-review
      kind: working-days
      params: { n: 3 }
    # A triage row *is* the finding, so an unanswered one widens rather than
    # closes: `deny` would take it out of the worklist and delete the delivery
    # of a breach that was correctly detected. (gabi-gas-agent's dispatching
    # approval stays `deny` for the opposite reason — it gates, so it must fail
    # closed.)
    on_expiry: escalate
    escalate_to: [mako-operations]
    triage:
      - name: jahresabrechnung-blocked
        audience: [billing-operations]
        priority: high
        summary: >-
          The annual settlement cannot be issued. § 40c Abs. 2 EnWG requires it within six weeks of the abgerechneter Zeitraum ending — and within six weeks of the Lieferverhältnis ending where this is an Abschlussrechnung.
        when:
          - path: /compliance_status
            equals: "BLOCKED"
        deadline:
          name: jahresabrechnung-blocked-review
          kind: working-days
          params: { n: 3 }

  budgets:
    max_tokens: 200000
    max_steps: 60
    max_effects: 100
    max_wallclock_secs: 900

  # The result contract. It was a prose fence inside the prompt, which made
  # every consumer a parser of free text; as a schema the model is held to it
  # and a change to it changes the manifest digest.
  output:
    schema:
      type: object
      additionalProperties: false
      required:
        - malo_id
        - billing_year
        - total_kwh
      properties:
        malo_id:
          type: string
        billing_year:
          type: number
        total_kwh:
          type: number
        brutto_eur:
          type: number
        sum_abschlage_eur:
          type: number
        zahlbetrag_eur:
          type: number
        compliance_status:
          type: string
          enum:
            - READY_TO_DISPATCH
            - NEEDS_REVIEW
            - BLOCKED
        issues:
          type: array
          items:
            type: string

  # Knowledge, granted rather than copied.
  #
  # mako's MCP servers publish 57 step-by-step prompts across 15 servers for
  # their own procedures. A specialist names the one it needs; a hand-typed
  # paraphrase in `constraints` would be a second copy with nothing keeping the
  # two in agreement — the server's prompt changes with the code, a paraphrase
  # changes when somebody remembers.
  #
  # A context grant is not a tool grant. Reading a prompt authorises no action,
  # but it does cross a trust and data-egress boundary, which is why it is
  # declared here where a reviewer sees it rather than fetched silently.
  context:
    prompts:
      - server: billingd
        name: order-to-cash
        max_input_sensitivity: internal
        output_sensitivity: internal
      - server: edmd
        name: jahresablesung-workflow
        max_input_sensitivity: internal
        output_sensitivity: internal

  tools:
    - ref: tool://edmd/get_billing_period
      mutates: false
      max_sensitivity: internal
      description: >-
        Twelve months of consumption for the MaLo, month by month.

    - ref: tool://edmd/get_quality_assessments
      mutates: false
      max_sensitivity: internal
      description: >-
        Which of those months rest on substituted values.

    - ref: tool://marktd/get_malo
      mutates: false
      max_sensitivity: confidential
      description: >-
        The NB assignment for the billing year.

    - ref: tool://marktd/get_preisblatt
      mutates: false
      max_sensitivity: confidential
      description: >-
        PreisblattNetznutzung validity across the year.

    - ref: tool://billingd/list_billing_records
      mutates: false
      max_sensitivity: internal
      description: >-
        The Abschlagsrechnungen issued during the year.

    - ref: tool://billingd/get_billing_record
      mutates: false
      max_sensitivity: internal
      description: >-
        One Abschlag in full, where the list is not enough.

    - ref: tool://productd/get_product_energiemix
      mutates: false
      max_sensitivity: internal
      description: >-
        The § 42 EnWG Energiemix the Schlussabrechnung must carry.
