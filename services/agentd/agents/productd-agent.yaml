# yaml-language-server: $schema=https://hupe1980.github.io/agentplane/agent.schema.json
# Product catalog hygiene, § 41a EPEX price availability monitor, and § 42 Abs. 1 EnWG Stromkennzeichnung guard. Checks for missing EPEX daily prices, a Stromkennzeichnung that still shows the year before last after 1 July, and expired B2B quotations needing ERP follow-up.
#
# Every grant below is a tool this specialist's own procedure names, and every
# tool the procedure names is granted. `cargo xtask check-prompt-tools` holds the
# two together in both directions, so a grant nobody instructs — a whole server's
# read surface handed over because the specialist touches that server — cannot
# come back. `mutates` is derived from the server's own `read_only_hint`, and
# there are no mutating grants here at all: a `tool-calling` agent cannot
# dispatch one, so declaring it would read as an ability this agent does not
# have. See the note above `budgets`.
# Role: LF. Compiled only into a `role-lf` build (and the default all-roles build).
apiVersion: agentplane.hupe1980.github.io/v1alpha1
kind: Agent
metadata:
  name: productd-agent
  version: "2.0.0"
spec:
  execution:
    kind: tool-calling
    max_turns: 12

  identity:
    role: >-
      Product catalog hygiene, § 41a EPEX price availability monitor, and
      § 42 Abs. 1 EnWG Stromkennzeichnung guard. Checks for missing EPEX daily
      prices, a Stromkennzeichnung that still shows the year before last after
      1 July, and expired B2B quotations needing ERP follow-up.
    constraints: |
      You are the product catalog, EPEX price, and §42 EnWG Energiemix compliance specialist.

      ## TRIGGERED BY
      - `de.tarif.product.updated` — new/updated product in productd
      - `de.tarif.angebot.abgelaufen` — B2B quote expired, needs ERP follow-up
      - `de.tarif.epex.missing` — EPEX D-1 prices not imported by 18:00 CET
      - Annual cron — check the § 42 Abs. 1 Stromkennzeichnung of every active Strom product

      ## PROCEDURE

      ### On product update (de.tarif.product.updated)
      1. Extract `lf_mp_id` and `product_code` from event.
      2. Call productd `get_product` to fetch the current product definition.
      3. Call productd `validate_tariff_config` to verify BO4E schema correctness.
      4. Check the § 42 EnWG Stromkennzeichnung:
         - Call productd `get_product_energiemix`.
         - The disclosure duty is **§ 42 Abs. 1 EnWG**, and it is a *Strom*
           obligation: § 42 addresses Stromlieferanten. A Gas, Wärme or Solar
           product is outside it, and flagging one is a finding an operator
           cannot act on.
         - Nr. 1 is the Energieträgermix; Nr. 2 is the environmental impact
           *"zumindest in Bezug auf Kohlendioxidemissionen (CO2-Emissionen) und
           radioaktiven Abfall"*. Check that `anteilErneuerbareEnergien` (%),
           `co2Emission` (g/kWh) and `radioaktiverAbfall` (mg/kWh) are present.
         - Missing: emit finding SECT42_STROMKENNZEICHNUNG_INCOMPLETE.
      5. For dynamic products (`dyn_source = 'epex-spot-day-ahead'`):
         - Call productd `check_41a_epex_status` to verify D-1 prices are available.
         - Alert if tomorrow's prices are missing and it is past 14:00 CET.

      ### On Angebot expiry (de.tarif.angebot.abgelaufen)
      1. Extract `angebot_id` and `lf_mp_id` from event.
      2. Call productd `get_angebot` to retrieve customer and product details.
      3. Generate ERP follow-up recommendation: re-quote or mark as lost opportunity.
      Portfolio-level quotation summaries are an operator surface on productd, not a
      grant this specialist holds — it answers about the Angebot the event named.

      ### On EPEX missing alert (de.tarif.epex.missing)
      1. Call productd `check_41a_epex_status` for current coverage status.
      2. Determine gap severity (stale days).
      3. Report SECT41A_EPEX_MISSING and name the days uncovered: a dynamic
         product without day-ahead prices for the period cannot be billed on the
         § 41a Abs. 2 basis it was sold on.

      ### Annual §42 Energiemix sweep (January cron)
      1. Call productd `get_comparison_feed` to list all active PUBLISHED products.
      2. For each **STROM** product: call productd `get_product_energiemix`.
      3. The update duty is in § 42 Abs. 1 Nr. 1 itself and it is dated, not
         rolling: *"spätestens ab 1. Juli eines Jahres sind jeweils die Werte des
         vorangegangenen Kalenderjahres anzugeben"*. So the question is not
         whether a figure is twelve months old — it is whether, on or after
         1 July, the product still shows the year before last — report
         SECT42_STROMKENNZEICHNUNG_STALE for those. For a product with no
         Stromkennzeichnung at all, report SECT42_STROMKENNZEICHNUNG_INCOMPLETE.
      4. Generate the compliance report against § 42 Abs. 1 Nr. 1 EnWG.

      ## § 42 EnWG — WHICH ABSATZ CARRIES WHAT
      Getting these apart matters, because an operator handed the wrong one
      cannot find the rule they are said to have broken:
      - **Abs. 1 Nr. 1** — the Energieträgermix, and the dated update: from 1 July
        the previous calendar year's figures. Fields:
        `anteilErneuerbareEnergien`, `anteilKernenergie`, and the fossil shares
        `anteilFossilBraunkohle` / `anteilFossilSteinkohle` / `anteilFossilGas`.
      - **Abs. 1 Nr. 2** — the environmental impact, *at least* CO₂ and
        radioactive waste: `co2Emission` (g/kWh), `radioaktiverAbfall` (mg/kWh).
      - **Abs. 1 Nr. 3** — the origin of the renewable share.
      - **Abs. 2** — how it is shown: consumer-friendly, adequately sized, and in
        graphically visualised form, beside the German generation averages. A
        complete set of figures rendered as a table is a § 42 Abs. 2 finding, not
        an Abs. 1 one.
      Abs. 5 is about *when renewable electricity may be counted* in the
      Stromkennzeichnung at all (Herkunftsnachweise, EEG-geförderter Strom, the
      ENTSO-E residual mix) — it carries none of the fields above.

  # What this agent is in a multi-agent arrangement.
  #
  # MAST measures inter-agent misalignment at 36.9 % of observed multi-agent
  # failures — a class that exists only if you choose it. Declaring the shape is
  # how you choose not to: `single` means one agent, one context, many tools, and
  # the inter-agent failure surface is structurally absent. `specialist` means it
  # hands off to nobody, which is what `max_delegation_depth: 0` already enforces
  # — stated here so the two cannot disagree.
  topology:
    mode: single
    role: specialist

  capabilities:
    provides: [productd]

  models:
    privileged:  { provider: anthropic, model: claude-sonnet-5 }

  security:
    max_sensitivity_egress: internal
    max_delegation_depth: 0
    max_sensitivity_journaled: internal

  # No `oversight` block, and no mutating tool grant: this specialist reads and
  # reports. Both absences are the same fact — a `tool-calling` agent cannot
  # dispatch a mutating call at all, because the arguments come from a model
  # completion, which agentplane labels untrusted by construction, and its taint
  # gate refuses a mutating sink with untrusted arguments. Declaring the grant
  # anyway would read as an ability this agent does not have.
  #

  budgets:
    max_tokens: 200000
    max_steps: 36
    max_effects: 60
    max_wallclock_secs: 900

  # The result contract. It was a prose fence inside the prompt, which made
  # every consumer a parser of free text; as a schema the model is held to it
  # and a change to it changes the manifest digest.
  output:
    schema:
      type: object
      additionalProperties: false
      required:
        - catalog_status
        - product_code
        - angebot_followup
      properties:
        catalog_status:
          type: string
          enum:
            - VALID
            - WARNINGS
            - INVALID
        product_code:
          type: string
        angebot_followup:
          type: string
        issues:
          type: array
          items:
            type: string
            description: >-
              Free text for anything that is not one of the coded findings below.
        findings:
          type: array
          description: >-
            The coded findings this specialist raises. Coded rather than prose
            because a catalogue sweep is read by a job, not a person.
          items:
            type: object
            additionalProperties: false
            required: [code]
            properties:
              code:
                type: string
                enum:
                  - SECT42_STROMKENNZEICHNUNG_INCOMPLETE
                  - SECT42_STROMKENNZEICHNUNG_STALE
                  - SECT41A_EPEX_MISSING
              product_code:
                type: [string, "null"]
              detail:
                type: [string, "null"]

  # Knowledge, granted rather than copied.
  #
  # mako's MCP servers publish 57 step-by-step prompts across 15 servers for
  # their own procedures. A specialist names the one it needs; a hand-typed
  # paraphrase in `constraints` would be a second copy with nothing keeping the
  # two in agreement — the server's prompt changes with the code, a paraphrase
  # changes when somebody remembers.
  #
  # A context grant is not a tool grant. Reading a prompt authorises no action,
  # but it does cross a trust and data-egress boundary, which is why it is
  # declared here where a reviewer sees it rather than fetched silently.
  context:
    prompts:
      - server: productd
        name: assign-product
        max_input_sensitivity: internal
        output_sensitivity: internal
      - server: productd
        name: configure-41a-tariff
        max_input_sensitivity: internal
        output_sensitivity: internal

  tools:
    - ref: tool://productd/get_product
      mutates: false
      max_sensitivity: internal
      description: >-
        The product definition the event names.

    - ref: tool://productd/validate_tariff_config
      mutates: false
      max_sensitivity: internal
      description: >-
        Whether the definition is well-formed BO4E.

    - ref: tool://productd/get_product_energiemix
      mutates: false
      max_sensitivity: internal
      description: >-
        The § 42 EnWG Energiemix and CO₂ figures, and their age.

    - ref: tool://productd/check_41a_epex_status
      mutates: false
      max_sensitivity: internal
      description: >-
        Day-ahead price coverage for a dynamic § 41a product.

    - ref: tool://productd/get_angebot
      mutates: false
      max_sensitivity: internal
      description: >-
        The expired quotation and its customer, for the ERP follow-up.

    - ref: tool://productd/get_comparison_feed
      mutates: false
      max_sensitivity: internal
      description: >-
        Every published product, for the annual Energiemix sweep.
