# yaml-language-server: $schema=https://hupe1980.github.io/agentplane/agent.schema.json
# EEG/KWKG monthly auto-settlement orchestrator and §52 violation sweep. Triggers batch settlement for all active plants, detects §52 Pflichtzahlungen accrual, checks §44b biogas cap utilisation, and ensures post-EEG plants are on correct remuneration scheme.
#
# Generated from the compiled specialist definition during the agentplane
# cutover, and narrowed twice since. `mutates` is derived from the MCP server's
# own `read_only_hint` — the cutover inherited it from servers that declared
# nothing, so 91 plain reads were marked mutating and would have stopped for an
# approval on every call. The mutating grants are gone entirely, because a
# `tool-calling` agent cannot dispatch one: see the note above `budgets`.
#
# Narrowing the read set further per specialist is domain review, not mechanical
# work.
# Role: NB. Compiled only into a `role-nb` build (and the default all-roles build).
apiVersion: agentplane.hupe1980.github.io/v1alpha1
kind: Agent
metadata:
  name: einsd-batch-agent
  version: "1.1.0"
spec:
  execution:
    kind: tool-calling
    max_turns: 20

  identity:
    role: >-
      EEG/KWKG monthly auto-settlement orchestrator and §52 violation sweep.
      Triggers batch settlement for all active plants, detects §52
      Pflichtzahlungen accrual, checks §44b biogas cap utilisation, and ensures
      post-EEG plants are on correct remuneration scheme.
    constraints: |
      You are the monthly EEG batch settlement and compliance sweep specialist.

      ## TRIGGERED BY
      - `de.eeg.settlement.batch-due`   — monthly auto-settle trigger (1st of month)
      - `de.eeg.anlage.foerderung-auslaufend` — with >0 plants in expiry window
      - Manual / cron                   — on-demand §52 violation sweep

      ## STEP-BY-STEP PROCEDURE

      ### Monthly settlement batch (run by 1st of month)
      1. Call einsd `list_unsettled_plants` — plants not yet settled for the billing month.
      2. For each returned plant:
         a. Fetch edmd `get_billing_period` for prior month meter data.
         b. Call einsd `POST /settlements/batch` — triggers auto-settle pipeline.
         c. Verify `settlement_state` transitioned to SETTLED or NEEDS_REVIEW.
      3. Plants in NEEDS_REVIEW: call einsd `get_plant` to read violation flags,
         `einspeisemanagement_kwh`, and `foerderendedatum`.
      4. Flag plants whose payment fell because §51 reduced the anzulegender Wert to null.
         Which §51 Fassung applies depends on the plant's Inbetriebnahmedatum, not its
         eeg_gesetz year — the Solarspitzengesetz cut in on 25.02.2025.

      ### §52 Pflichtzahlungen sweep
      1. Call einsd `check_direktvermarktung_compliance` — lists plants >100 kW NOT in Direktvermarktung.
      2. For each violation: calculate penalty exposure:
         - EEG 2023: §52 Abs. 3 Nr. 4: 10 EUR/kW/month from `mastr_violation_start`.
         - EEG 2017: §52 old-regime (SanktionAlt) — read the `fernsteuerbarkeit_violation_start` field.
      3. Call einsd `check_sect44b_quota` for all active BIOGAS plants:
         - Alert at 75% of annual cap (leistung_kw × 0.45 × 8760 kWh).
         - Escalate at 90%.
      4. List plants approaching `foerderendedatum` within 90 days.

      ### Post-EEG transition check
      1. Plants with `settlement_state = post_eeg` — verify post_eeg_price_floor is configured.
      2. Plants with EEG Förderung expiring this calendar year: notify operator to configure
         post-EEG product in tarifbd/billingd.

      ## §52 PENALTY REFERENCE (EEG 2023)
      Abs. 1 lists the Pflichtverstöße, Abs. 2 sets the rate, Abs. 3 reduces it.
      | Violation | Paragraph | Penalty |
      |---|---|---|
      | No Fernsteuerbarkeit (§9) | §52 Abs. 1 Nr. 1 i.V.m. Abs. 2 | 10 EUR/kW/month |
      | Not in Direktvermarktung though required | §52 Abs. 1 Nr. 4 i.V.m. Abs. 2 | 10 EUR/kW/month |
      | No MaStR registration | §52 Abs. 1 Nr. 11 i.V.m. Abs. 2 | 10 EUR/kW/month |
      | Any of the above, obligation later fulfilled | §52 Abs. 3 | retroactively 2 EUR/kW/month |
      For EEG ≤2021 plants the old regime applies instead via §100: a missing MaStR entry
      reduces the Vergütung to zero rather than charging a separate Pflichtzahlung.
      §52 Abs. 5 cap: multiple simultaneous violations are capped at 10 EUR/kW/month in total.
      §52 Abs. 6: the NB may net the Pflichtzahlung against the Vergütung.

  # What this agent is in a multi-agent arrangement.
  #
  # MAST measures inter-agent misalignment at 36.9 % of observed multi-agent
  # failures — a class that exists only if you choose it. Declaring the shape is
  # how you choose not to: `single` means one agent, one context, many tools, and
  # the inter-agent failure surface is structurally absent. `specialist` means it
  # hands off to nobody, which is what `max_delegation_depth: 0` already enforces
  # — stated here so the two cannot disagree.
  topology:
    mode: single
    role: specialist

  capabilities:
    provides: [einsd.batch]

  models:
    privileged:  { provider: anthropic, model: claude-sonnet-5 }

  security:
    max_sensitivity_egress: internal
    max_delegation_depth: 0
    max_sensitivity_journaled: internal

  # No `oversight` block, and no mutating tool grant: this specialist reads and
  # reports. Both absences are the same fact — a `tool-calling` agent cannot
  # dispatch a mutating call at all, because the arguments come from a model
  # completion, which agentplane labels untrusted by construction, and its taint
  # gate refuses a mutating sink with untrusted arguments. Declaring the grant
  # anyway would read as an ability this agent does not have.
  #
  # Acting on a conclusion is a `planned` specialist's job — see
  # `gabi-gas-agent`, whose plan passes `$input/…` references the runtime
  # resolves itself, so the authority-bearing arguments keep the run input's own
  # labels and a named human approves the call before it leaves.

  budgets:
    max_tokens: 200000
    max_steps: 60
    max_effects: 100
    max_wallclock_secs: 900

  # The result contract. It was a prose fence inside the prompt, which made
  # every consumer a parser of free text; as a schema the model is held to it
  # and a change to it changes the manifest digest.
  output:
    schema:
      type: object
      additionalProperties: false
      required:
        - batch_period
        - settled_count
        - needs_review_count
      properties:
        batch_period:
          type: string
        settled_count:
          type: number
        needs_review_count:
          type: number
        sect52_violations:
          type: number
        sect44b_alerts:
          type: array
          items:
            type: object
            properties:
              plant_id:
                type: string
              quota_pct:
                type: number
        expiring_foerderung_count:
          type: number
        negative_price_triggered_count:
          type: number
        action_required:
          type: string

  # Knowledge, granted rather than copied.
  #
  # Every mako MCP server publishes step-by-step prompts for its own procedures —
  # fifty of them across thirteen servers — and not one manifest reached a single
  # one. Each specialist instead carried a hand-typed paraphrase in its
  # `constraints`, which is a second copy of a procedure with nothing keeping the
  # two in agreement: the server's prompt changes with the code, the paraphrase
  # changes when somebody remembers.
  #
  # A context grant is not a tool grant. Reading a prompt authorises no action,
  # but it does cross a trust and data-egress boundary, which is why it is
  # declared here where a reviewer sees it rather than fetched silently.
  context:
    prompts:
      - server: einsd
        name: settle-monthly
        max_input_sensitivity: internal
        output_sensitivity: internal
      - server: einsd
        name: ausschreibung-workflow
        max_input_sensitivity: internal
        output_sensitivity: internal

