# yaml-language-server: $schema=https://hupe1980.github.io/agentplane/agent.schema.json
# EEG/KWKG monthly auto-settlement orchestrator and §52 violation sweep. Triggers batch settlement for all active plants, detects §52 Pflichtzahlungen accrual, checks §44b biogas cap utilisation, and ensures post-EEG plants are on correct remuneration scheme.
#
# Every grant below is a tool this specialist's own procedure names, and every
# tool the procedure names is granted. `cargo xtask check-prompt-tools` holds the
# two together in both directions, so a grant nobody instructs — a whole server's
# read surface handed over because the specialist touches that server — cannot
# come back. `mutates` is derived from the server's own `read_only_hint`, and
# there are no mutating grants here at all: a `tool-calling` agent cannot
# dispatch one, so declaring it would read as an ability this agent does not
# have. See the note above `budgets`.
# Role: NB. Compiled only into a `role-nb` build (and the default all-roles build).
apiVersion: agentplane.hupe1980.github.io/v1alpha1
kind: Agent
metadata:
  name: einsd-batch-agent
  version: "2.0.0"
spec:
  execution:
    kind: tool-calling
    max_turns: 20

  identity:
    role: >-
      EEG/KWKG monthly auto-settlement orchestrator and §52 violation sweep.
      Triggers batch settlement for all active plants, detects §52
      Pflichtzahlungen accrual, checks §44b biogas cap utilisation, and ensures
      post-EEG plants are on correct remuneration scheme.
    constraints: |
      You are the monthly EEG batch settlement and compliance sweep specialist.

      ## TRIGGERED BY
      - `de.eeg.settlement.batch-due`   — monthly auto-settle trigger (1st of month)
      - `de.eeg.anlage.foerderung-auslaufend` — with >0 plants in expiry window
      - Manual / cron                   — on-demand §52 violation sweep

      ## STEP-BY-STEP PROCEDURE

      ### Monthly settlement batch (run by 1st of month)
      1. Call einsd `list_unsettled_plants` — plants not yet settled for the billing month.
      2. For each returned plant:
         a. Call edmd `get_billing_period` for prior month meter data.
         b. Report the batch as ready. Running it is `POST /settlements/batch` on einsd,
            an operator surface and not a tool — a tool-calling specialist cannot
            dispatch a mutating call, so this one prepares and reports.
         c. Read `settlement_state` back once the operator has run it.
      3. Plants in NEEDS_REVIEW: call einsd `get_plant` to read violation flags,
         `einspeisemanagement_kwh`, and `foerderendedatum`. Call einsd
         `get_settlement_state_history` to confirm the state actually moved — a batch
         that reports success against a state that never changed is the failure this
         step exists to catch.
      4. Flag plants whose payment fell because §51 reduced the anzulegender Wert to null.
         Which §51 Fassung applies depends on the plant's Inbetriebnahmedatum, not its
         eeg_gesetz year — the Solarspitzengesetz cut in on 25.02.2025.

      ### § 52 Pflichtzahlungen sweep
      1. Call einsd `check_direktvermarktung_compliance` — plants above 100 kW whose
         Veräußerungsform no longer carries a claim.
      2. For each violation: calculate penalty exposure at **10 EUR/kW installierter
         Leistung and Kalendermonat** (§ 52 Abs. 2), from the month the Pflichtverstoß
         began. Which Nummer of § 52 Abs. 1 applies decides the *start date* the exposure
         runs from, so read it off the plant rather than assuming:
         `mastr_violation_start` for Nr. 11 and `fernsteuerbarkeit_violation_start` for
         Nr. 1. For an EEG 2017 plant the old regime applies through § 100 instead: a
         missing MaStR entry reduces the Vergütung to zero rather than charging a
         separate Pflichtzahlung, so never add both.
      3. Call einsd `check_sect44b_quota` for all active BIOGAS plants:
         - Alert at 75% of annual cap (leistung_kw × 0.45 × 8760 kWh).
         - Escalate at 90%.
      4. Call einsd `list_expiring` for plants approaching `foerderendedatum` within
         90 days.

      ### Post-EEG transition check
      1. Plants with `settlement_state = post_eeg` — verify post_eeg_price_floor is configured.
      2. Plants with EEG Förderung expiring this calendar year: call productd
         `get_product` for the post-EEG product they are meant to be paid on, and notify
         the operator when there is none. A plant past Förderende with no product behind
         it is a plant that feeds in for nothing.

      ## § 52 EEG 2023 PENALTY REFERENCE
      Abs. 1 lists the Pflichtverstöße by Nummer, Abs. 2 sets the rate, Abs. 3 reduces
      it, Abs. 4 extends the months it is owed for, Abs. 5 caps it and Abs. 6 makes it
      due and offsettable. The Nummer is not decoration: it decides which extension of
      Abs. 4 applies.
      | Violation | Paragraph | Penalty |
      |---|---|---|
      | No Fernsteuerbarkeit (§ 9 Abs. 1 or Abs. 2) | § 52 Abs. 1 Nr. 1 i.V.m. Abs. 2 | 10 EUR/kW/month |
      | Ausfallvergütung beyond the § 21 Abs. 1 Satz 1 Nr. 3 Höchstdauer | § 52 Abs. 1 Nr. 5 i.V.m. Abs. 2 | 10 EUR/kW/month |
      | Veräußerungsform or its change not notified (§ 21b Abs. 1, § 21c) | § 52 Abs. 1 Nr. 9 i.V.m. Abs. 2 | 10 EUR/kW/month, **plus the following month** (Abs. 4 Nr. 2) |
      | Ist-Einspeisung not measured and balanced quarter-hourly (§ 21b Abs. 3) | § 52 Abs. 1 Nr. 8 i.V.m. Abs. 2 | 10 EUR/kW/month |
      | No MaStR registration | § 52 Abs. 1 Nr. 11 i.V.m. Abs. 2 | 10 EUR/kW/month |
      | Any of the above, obligation later fulfilled | § 52 Abs. 3 | 2 EUR/kW/month, back to the start of the Verstoß |
      For an EEG ≤ 2021 plant the old regime applies instead through § 100: a missing
      MaStR entry reduces the Vergütung to zero rather than charging a separate
      Pflichtzahlung, so the two are alternatives and never additive.
      § 52 Abs. 5: several Pflichtverstöße in one Kalendermonat are capped at 10 EUR/kW
      in total — an exposure figure that adds them up is wrong by however many there are.
      § 52 Abs. 6: due on the 15th of the month after the one it is owed for, and the NB
      may set it off against the operator's § 19 Abs. 1 claims and their Abschläge.

  # What this agent is in a multi-agent arrangement.
  #
  # MAST measures inter-agent misalignment at 36.9 % of observed multi-agent
  # failures — a class that exists only if you choose it. Declaring the shape is
  # how you choose not to: `single` means one agent, one context, many tools, and
  # the inter-agent failure surface is structurally absent. `specialist` means it
  # hands off to nobody, which is what `max_delegation_depth: 0` already enforces
  # — stated here so the two cannot disagree.
  topology:
    mode: single
    role: specialist

  capabilities:
    provides: [einsd.batch]

  models:
    privileged:  { provider: anthropic, model: claude-sonnet-5 }

  security:
    max_sensitivity_egress: internal
    max_delegation_depth: 0
    max_sensitivity_journaled: internal

  # No `oversight` block, and no mutating tool grant: this specialist reads and
  # reports. Both absences are the same fact — a `tool-calling` agent cannot
  # dispatch a mutating call at all, because the arguments come from a model
  # completion, which agentplane labels untrusted by construction, and its taint
  # gate refuses a mutating sink with untrusted arguments. Declaring the grant
  # anyway would read as an ability this agent does not have.
  #

  budgets:
    max_tokens: 200000
    max_steps: 60
    max_effects: 100
    max_wallclock_secs: 900

  # The result contract. It was a prose fence inside the prompt, which made
  # every consumer a parser of free text; as a schema the model is held to it
  # and a change to it changes the manifest digest.
  output:
    schema:
      type: object
      additionalProperties: false
      required:
        - batch_period
        - settled_count
        - needs_review_count
      properties:
        batch_period:
          type: string
        settled_count:
          type: number
        needs_review_count:
          type: number
        sect52_violations:
          type: number
        sect44b_alerts:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              plant_id:
                type: string
              quota_pct:
                type: number
        expiring_foerderung_count:
          type: number
        negative_price_triggered_count:
          type: number
        action_required:
          type: string

  # Knowledge, granted rather than copied.
  #
  # mako's MCP servers publish 57 step-by-step prompts across 15 servers for
  # their own procedures. A specialist names the one it needs; a hand-typed
  # paraphrase in `constraints` would be a second copy with nothing keeping the
  # two in agreement — the server's prompt changes with the code, a paraphrase
  # changes when somebody remembers.
  #
  # A context grant is not a tool grant. Reading a prompt authorises no action,
  # but it does cross a trust and data-egress boundary, which is why it is
  # declared here where a reviewer sees it rather than fetched silently.
  context:
    prompts:
      - server: einsd
        name: settle-monthly
        max_input_sensitivity: internal
        output_sensitivity: internal
      - server: einsd
        name: ausschreibung-workflow
        max_input_sensitivity: internal
        output_sensitivity: internal

  tools:
    - ref: tool://einsd/list_unsettled_plants
      mutates: false
      max_sensitivity: internal
      description: >-
        The batch's work list: plants not yet settled for the billing month.

    - ref: tool://einsd/get_plant
      mutates: false
      max_sensitivity: internal
      description: >-
        Violation flags, Einspeisemanagement and Förderende for a plant in
        NEEDS_REVIEW.

    - ref: tool://einsd/check_direktvermarktung_compliance
      mutates: false
      max_sensitivity: internal
      description: >-
        The § 52 Abs. 1 Nr. 4 sweep across the portfolio.

    - ref: tool://einsd/check_sect44b_quota
      mutates: false
      max_sensitivity: internal
      description: >-
        § 44b EEG 2023 cap utilisation for every active biogas plant.

    - ref: tool://einsd/list_expiring
      mutates: false
      max_sensitivity: internal
      description: >-
        Plants reaching Förderende inside the notice window.

    - ref: tool://einsd/get_settlement_state_history
      mutates: false
      max_sensitivity: internal
      description: >-
        Whether a plant's state actually moved to SETTLED after the batch ran.

    - ref: tool://edmd/get_billing_period
      mutates: false
      max_sensitivity: internal
      description: >-
        Prior-month meter data for the plant being settled.

    - ref: tool://productd/get_product
      mutates: false
      max_sensitivity: internal
      description: >-
        Whether a post-EEG plant has a product configured to be paid on.
