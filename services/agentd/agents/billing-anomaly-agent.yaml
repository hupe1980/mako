# Retail invoice anomaly detection. Rolling 3-month statistical deviation analysis (threshold: 20%). Investigates root causes: meter exchange, tariff change, quality substitution, or data error.
#
# Generated from the compiled specialist definition during the agentplane
# cutover, and narrowed twice since. `mutates` is derived from the MCP server's
# own `read_only_hint` — the cutover inherited it from servers that declared
# nothing, so 91 plain reads were marked mutating and would have stopped for an
# approval on every call. The mutating grants are gone entirely, because a
# `tool-calling` agent cannot dispatch one: see the note above `budgets`.
#
# Narrowing the read set further per specialist is domain review, not mechanical
# work.
# Role: LF. Compiled only into a `role-lf` build (and the default all-roles build).
apiVersion: agentplane.hupe1980.github.io/v1alpha1
kind: Agent
metadata:
  name: billing-anomaly-agent
  version: "1.0.0"
spec:
  execution:
    kind: tool-calling
    max_turns: 10

  identity:
    role: >-
      Retail invoice anomaly detection. Rolling 3-month statistical deviation
      analysis (threshold: 20%). Investigates root causes: meter exchange, tariff
      change, quality substitution, or data error.
    constraints: |
      You are the billing anomaly detection specialist.

      ## TRIGGERED BY
      - `de.billing.rechnung.erstellt` — new retail invoice dispatched

      ## STEP-BY-STEP PROCEDURE

      1. Extract `malo_id` and `brutto_eur` from CloudEvent payload.
      2. Call billingd `get_billing_record` first: every invoice carries the deterministic
         risk gate's output — `risk_score` (0-100), `risk_band`
         (AUTO_RELEASED/SAMPLE/REVIEW/HELD) and coded `risk_findings` (e.g.
         PERIOD_OVERLAP, CONSECUTIVE_ESTIMATES, TAX_BREAKDOWN_MISMATCH). Triage from
         those findings before any statistics; HELD records await analyst release via
         POST /api/v1/billing/{id}/release.
      3. Call billingd `check_billing_anomaly` with `malo_id` for the rolling baseline.
      4. If `risk_band` is REVIEW/HELD or `is_anomaly = true` (deviation > 20%):
         a. Call billingd `get_billing_record` for full position details.
         b. Call edmd `get_timeseries` to compare metered consumption.
         c. Determine likely cause: meter exchange, tariff change, quality substitution, data error.
      4. If deviation > 50%: CRITICAL — escalate immediately.

      ## ROOT CAUSE TAXONOMY
      - METER_EXCHANGE: zaehler_replaced=true in positions
      - TARIFF_CHANGE: arbeitspreis changed between periods
      - QUALITY_SUBSTITUTION: is_estimated=true, Ersatzwert used
      - DATA_ERROR: consumption implausibly high/low vs Vorjahr

      ## OUTPUT FORMAT
      ```
      ANOMALY_DETECTED: [YES|NO]
      DEVIATION_PCT: [percentage]
      SEVERITY: [CRITICAL|WARNING|OK]
      ROOT_CAUSE: [from taxonomy above or UNKNOWN]
      RECOMMENDED_ACTION: [specific step or NONE]
      ```

  capabilities:
    provides: [billing.anomaly]

  models:
    privileged:  { provider: anthropic, model: claude-sonnet-5 }

  security:
    max_sensitivity_egress: internal
    max_delegation_depth: 0
    max_sensitivity_journaled: internal

  # No `oversight` block, and no mutating tool grant: this specialist reads and
  # reports. Both absences are the same fact — a `tool-calling` agent cannot
  # dispatch a mutating call at all, because the arguments come from a model
  # completion, which agentplane labels untrusted by construction, and its taint
  # gate refuses a mutating sink with untrusted arguments. Declaring the grant
  # anyway would read as an ability this agent does not have.
  #
  # Acting on a conclusion is a `planned` specialist's job — see
  # `gabi-gas-agent`, whose plan passes `$input/…` references the runtime
  # resolves itself, so the authority-bearing arguments keep the run input's own
  # labels and a named human approves the call before it leaves.

  budgets:
    max_tokens: 200000
    max_steps: 30
    max_effects: 50
    max_wallclock_secs: 900

  tools:
    - ref: tool://billingd/list_billing_records
      mutates: false
      max_sensitivity: internal
      description: "list billing records via billingd"
    - ref: tool://billingd/get_billing_record
      mutates: false
      max_sensitivity: internal
      description: "get billing record via billingd"
    - ref: tool://billingd/preview_billing
      mutates: false
      max_sensitivity: internal
      description: "preview billing via billingd"
    - ref: tool://billingd/get_xrechnung
      mutates: false
      max_sensitivity: internal
      description: "get xrechnung via billingd"
    - ref: tool://billingd/check_billing_anomaly
      mutates: false
      max_sensitivity: internal
      description: "check billing anomaly via billingd"
    - ref: tool://billingd/list_vpp_settlements
      mutates: false
      max_sensitivity: internal
      description: "list vpp settlements via billingd"
    - ref: tool://billingd/list_corrections
      mutates: false
      max_sensitivity: internal
      description: "list corrections via billingd"
    - ref: tool://billingd/list_product_categories
      mutates: false
      max_sensitivity: internal
      description: "list product categories via billingd"
    - ref: tool://billingd/validate_tariff_config
      mutates: false
      max_sensitivity: internal
      description: "validate tariff config via billingd"
    - ref: tool://billingd/explain_invoice_position
      mutates: false
      max_sensitivity: internal
      description: "explain invoice position via billingd"
    - ref: tool://billingd/get_billing_summary
      mutates: false
      max_sensitivity: internal
      description: "get billing summary via billingd"
    - ref: tool://edmd/get_timeseries
      mutates: false
      max_sensitivity: internal
      description: "get timeseries via edmd"
    - ref: tool://edmd/get_imbalance
      mutates: false
      max_sensitivity: internal
      description: "get imbalance via edmd"
    - ref: tool://edmd/get_billing_period
      mutates: false
      max_sensitivity: internal
      description: "get billing period via edmd"
    - ref: tool://edmd/get_device_history
      mutates: false
      max_sensitivity: internal
      description: "get device history via edmd"
    - ref: tool://edmd/get_quality_warnings
      mutates: false
      max_sensitivity: internal
      description: "get quality warnings via edmd"
    - ref: tool://edmd/list_reading_orders
      mutates: false
      max_sensitivity: internal
      description: "list reading orders via edmd"
    - ref: tool://edmd/list_overdue_reading_orders
      mutates: false
      max_sensitivity: internal
      description: "list overdue reading orders via edmd"
    - ref: tool://edmd/get_correction_history
      mutates: false
      max_sensitivity: internal
      description: "get correction history via edmd"
    - ref: tool://edmd/validate_timeseries
      mutates: false
      max_sensitivity: internal
      description: "validate timeseries via edmd"
    - ref: tool://edmd/get_quality_assessments
      mutates: false
      max_sensitivity: internal
      description: "get quality assessments via edmd"
    - ref: tool://edmd/get_summenzeitreihe
      mutates: false
      max_sensitivity: internal
      description: "get summenzeitreihe via edmd"
    - ref: tool://edmd/get_annual_forecast
      mutates: false
      max_sensitivity: internal
      description: "get annual forecast via edmd"
    - ref: tool://edmd/get_gas_quality
      mutates: false
      max_sensitivity: internal
      description: "get gas quality via edmd"
