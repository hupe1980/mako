# yaml-language-server: $schema=https://hupe1980.github.io/agentplane/agent.schema.json
# EEG/KWKG regulatory compliance monitor. Checks the § 52 EEG Pflichtzahlungen, the § 44b Abs. 1 Biogas 45 % cap, the Direktvermarktungspflicht above 100 kW (§ 21 Abs. 1 Satz 1 Nr. 1/Nr. 3), the § 39i Abs. 1 Substratdeckel, and the lawful §§ 53–54 cuts to the anzulegender Wert that look like violations and are not.
#
# Every grant below is a tool this specialist's own procedure names, and every
# tool the procedure names is granted. `cargo xtask check-prompt-tools` holds the
# two together in both directions, so a grant nobody instructs — a whole server's
# read surface handed over because the specialist touches that server — cannot
# come back. `mutates` is derived from the server's own `read_only_hint`, and
# there are no mutating grants here at all: a `tool-calling` agent cannot
# dispatch one, so declaring it would read as an ability this agent does not
# have. See the note above `budgets`.
# Role: NB. Compiled only into a `role-nb` build (and the default all-roles build).
apiVersion: agentplane.hupe1980.github.io/v1alpha1
kind: Agent
metadata:
  name: eeg-compliance-agent
  version: "2.0.0"
spec:
  execution:
    kind: tool-calling
    max_turns: 12

  identity:
    role: >-
      EEG/KWKG regulatory compliance monitor. Checks the § 52 EEG Pflichtzahlungen, the
      § 44b Abs. 1 Biogas 45 % cap, the Direktvermarktungspflicht above 100 kW
      (§ 21 Abs. 1 Satz 1 Nr. 1/Nr. 3), the § 39i Abs. 1 Substratdeckel, and the lawful
      §§ 53–54 cuts to the anzulegender Wert that look like violations and are not.
    constraints: |
      You are the EEG compliance specialist.

      ## TRIGGERED BY
      - `de.eeg.anlage.*` — plant registration/update
      - `de.eeg.verguetung.*` / `de.eeg.marktpraemie.*` — settlement events
      - `de.eeg.veraeusserungsform.gewechselt` — the § 21b Abs. 1 assignment changed

      ## COMPLIANCE CHECKS

      ### Direktvermarktungspflicht above 100 kW — the two paragraphs that carry it
      There is no paragraph headed "Direktvermarktungspflicht". The duty is the shape of
      two rules read together, and citing either alone gets an operator sent to the wrong
      text:

      - **§ 21 Abs. 1 Satz 1 Nr. 1 EEG 2023** — the Einspeisevergütung exists only for
        Anlagen up to **100 kW** installierter Leistung whose anzulegender Wert is
        gesetzlich bestimmt. Above that there is no Einspeisevergütung to claim.
      - **§ 21 Abs. 1 Satz 1 Nr. 3 EEG 2023** — an Anlage above 100 kW may fall back on
        the **Ausfallvergütung**, but only for up to three consecutive Kalendermonate and
        six in a Kalenderjahr. It is a bridge, not a model.

      So a plant above 100 kW resting on VERGUETUNG is lawful for a bounded number of
      months and unlawful after them. Exceeding the Höchstdauer is the Pflichtverstoß of
      **§ 52 Abs. 1 Nr. 5**; failing to tell the Netzbetreiber which Veräußerungsform the
      plant is in, or that it changed (§ 21b Abs. 1, § 21c), is **§ 52 Abs. 1 Nr. 9**,
      and that one is payable for the following Kalendermonat as well (§ 52 Abs. 4 Nr. 2).
      einsd `check_direktvermarktung_compliance` decides which of the two applies.
      Pflichtzahlung: **10 EUR/kW/Kalendermonat** (§ 52 Abs. 2), falling to 2 EUR once the
      obligation is met (§ 52 Abs. 3), capped at 10 EUR/kW/Kalendermonat across all
      concurrent violations (§ 52 Abs. 5), due on the 15th of the following month and
      offsettable against the operator's own § 19 Abs. 1 claims (§ 52 Abs. 6).

      ### § 44b Abs. 1 EEG 2023 — Biogas, 45 % der installierten Leistung
      For Biogas above 100 kW installierter Leistung the § 19 Abs. 1 claim exists only
      for the share of a calendar year's generation corresponding to a Bemessungsleistung
      of 45 % of the installed figure. Everything above it is fed in without a payment
      claim, which is not a penalty and not a violation — it is generation the plant is
      not paid for. Track annual kWh against the cap (leistung_kw × 0.45 × 8760);
      alert at 75 %, flag at 90 %. einsd `check_sect44b_quota` computes it.

      ### § 39i Abs. 1 EEG 2023 — Mais- und Getreidekorn cap
      Applies **only** to a biogas plant whose claim rests on a Zuschlag from a Biomasse
      Ausschreibung, and the permitted mass percentage is keyed to the year the Zuschlag
      was awarded — not to the settlement year. A plant paid on a gesetzlich bestimmter
      Wert is outside this rule entirely, so report it only where the plant has a
      Zuschlag, and name the Zuschlagsjahr the percentage came from.

      ### §§53b–54 EEG — cuts to the anzulegender Wert
      These reduce the payment without changing the Einspeisemenge or the tariff
      table, so they look like a billing error to an operator. They are not
      violations — they are lawful deductions — and must be reported separately from
      VIOLATIONS so nobody chases a penalty that is not one.

      ## STEP-BY-STEP PROCEDURE

      1. Call einsd `get_plant` for plant details.
      2. Call einsd `get_compliance_status` for §52 violation check.
      3. If BIOGAS and > 100 kW: call einsd `check_sect44b_quota`.
      4. If > 100 kW on VERGUETUNG: call einsd `check_direktvermarktung_compliance`.
      5. If the question is about a payment being lower than expected, call einsd
         `get_aw_reduktionen` for the settlement date BEFORE reporting a violation:
         a §53b, §53c or §54 cut explains a smaller Gutschrift on its own.
      6. On `de.eeg.veraeusserungsform.gewechselt`: the change is only lawful from
         the first day of a Kalendermonat (§ 21b Abs. 1), and the Netzbetreiber has
         to have been told of it under § 21c. Call einsd `get_plant` for the
         installierte Leistung and the new Veräußerungsform, and einsd
         `check_direktvermarktung_compliance` for whether the new one carries a
         claim at that size. An unreported change is § 52 Abs. 1 Nr. 9, and it is
         owed for the following Kalendermonat as well (§ 52 Abs. 4 Nr. 2).

  # What this agent is in a multi-agent arrangement.
  #
  # MAST measures inter-agent misalignment at 36.9 % of observed multi-agent
  # failures — a class that exists only if you choose it. Declaring the shape is
  # how you choose not to: `single` means one agent, one context, many tools, and
  # the inter-agent failure surface is structurally absent. `specialist` means it
  # hands off to nobody, which is what `max_delegation_depth: 0` already enforces
  # — stated here so the two cannot disagree.
  topology:
    mode: single
    role: specialist

  capabilities:
    provides: [eeg.compliance]

  models:
    privileged:  { provider: anthropic, model: claude-sonnet-5 }

  security:
    max_sensitivity_egress: internal
    max_delegation_depth: 0
    max_sensitivity_journaled: internal

  # No mutating tool grant, and no approval: this specialist reads and reports.
  # Both absences are the same fact — a `tool-calling` agent cannot dispatch a
  # mutating call at all, because the arguments come from a model completion,
  # which agentplane labels untrusted by construction, and its taint gate refuses
  # a mutating sink with untrusted arguments. Declaring the grant anyway would
  # read as an ability this agent does not have.
  #
  # It does declare `oversight`, for **triage** — a row beside a finished answer
  # rather than a gate in front of a call. That is the only mode that fits an
  # agent which cannot act: gating its answer would gate nothing while suspending
  # a run per finding.
  #
  # Acting on a conclusion is a `planned` specialist's job — see
  # `gabi-gas-agent`, whose plan passes `$input/…` references the runtime
  # resolves itself, so the authority-bearing arguments keep the run input's own
  # labels and a named human approves the call before it leaves.

  # Human-in-the-loop, beside the answer rather than in front of it.
  #
  # `approval: none` — this specialist cannot act, so there is nothing to gate.
  # A `tool-calling` agent's arguments come from a model completion, which the
  # taint gate refuses at a mutating sink; it reads and reports. `tools-only`
  # would therefore gate nothing, and `required` would suspend a run per finding
  # and cost a case row until somebody clears it.
  #
  # `triage` is the third mode agentplane 0.15 added for exactly this: the run
  # completes and returns, and a matching answer *also* opens a worklist row.
  # Reporting, not control flow — which is why a triage rule may carry a
  # predicate where `approval` deliberately may not.
  #
  # Every `path` below is typed against this agent's own `output.schema` at parse
  # time, so a rule that could never fire is refused rather than reading in
  # review exactly like one that does. That check only became possible once the
  # answers were schemas instead of prose.
  oversight:
    approval: none
    # `approval: none` means nothing waits, so this bounds no wait — the field
    # is required and states the same window the rule below uses. One figure
    # written twice is cheaper than one field meaning two things.
    deadline:
      name: eeg-compliance-review
      kind: working-days
      params: { n: 2 }
    # A triage row *is* the finding, so an unanswered one widens rather than
    # closes: `deny` would take it out of the worklist and delete the delivery
    # of a breach that was correctly detected. (gabi-gas-agent's dispatching
    # approval stays `deny` for the opposite reason — it gates, so it must fail
    # closed.)
    on_expiry: escalate
    escalate_to: [mako-operations]
    triage:
      - name: eeg-compliance
        audience: [eeg-operations]
        priority: high
        summary: >-
          An EEG plant is in breach (§20/§44b/§51/§52). Penalty exposure accrues per month it stands.
        when:
          - path: /compliance_status
            equals: "VIOLATION"
        deadline:
          name: eeg-compliance-review
          kind: working-days
          params: { n: 2 }

  budgets:
    max_tokens: 200000
    max_steps: 36
    max_effects: 60
    max_wallclock_secs: 900

  # The result contract. It was a prose fence inside the prompt, which made
  # every consumer a parser of free text; as a schema the model is held to it
  # and a change to it changes the manifest digest.
  output:
    schema:
      type: object
      additionalProperties: false
      required:
        - compliance_status
        - plant_id
        - erzeugungsart
      properties:
        compliance_status:
          type: string
          enum:
            - OK
            - WARNING
            - VIOLATION
        plant_id:
          type: string
        erzeugungsart:
          type: string
        violations:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              paragraph:
                type: string
              description:
                type: string
              penalty_exposure_eur_month:
                type: number
        warnings:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              paragraph:
                type: string
              description:
                type: string
              threshold_pct:
                type: number
        aw_reduktionen:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              paragraph:
                type: string
              grund:
                type: string
              abzug_ct_kwh:
                type: number

  # Knowledge, granted rather than copied.
  #
  # mako's MCP servers publish 57 step-by-step prompts across 15 servers for
  # their own procedures. A specialist names the one it needs; a hand-typed
  # paraphrase in `constraints` would be a second copy with nothing keeping the
  # two in agreement — the server's prompt changes with the code, a paraphrase
  # changes when somebody remembers.
  #
  # A context grant is not a tool grant. Reading a prompt authorises no action,
  # but it does cross a trust and data-egress boundary, which is why it is
  # declared here where a reviewer sees it rather than fetched silently.
  context:
    prompts:
      - server: einsd
        name: settle-monthly
        max_input_sensitivity: internal
        output_sensitivity: internal

  tools:
    - ref: tool://einsd/get_plant
      mutates: false
      max_sensitivity: internal
      description: >-
        Plant master data: Leistung, Veräußerungsform, Energieträger.

    - ref: tool://einsd/get_compliance_status
      mutates: false
      max_sensitivity: internal
      description: >-
        einsd's own § 52 EEG violation verdict for the plant.

    - ref: tool://einsd/check_sect44b_quota
      mutates: false
      max_sensitivity: internal
      description: >-
        Biogas annual-cap utilisation under § 44b EEG 2023.

    - ref: tool://einsd/check_direktvermarktung_compliance
      mutates: false
      max_sensitivity: internal
      description: >-
        Plants above the Einspeisevergütung ceiling still on the Vergütung
        model.

    - ref: tool://einsd/get_aw_reduktionen
      mutates: false
      max_sensitivity: internal
      description: >-
        Lawful cuts to the anzulegender Wert, so a smaller Gutschrift is not
        reported as a violation.
