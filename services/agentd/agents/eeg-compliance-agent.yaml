# yaml-language-server: $schema=https://hupe1980.github.io/agentplane/agent.schema.json
# EEG/KWKG regulatory compliance monitor. Checks §52 Pflichtzahlungen, §44b Biogas 45% cap, §20 Direktvermarktungspflicht (>100 kW), §42a Holzbiomasse, and §43 Substratdeckel violations.
#
# Generated from the compiled specialist definition during the agentplane
# cutover, and narrowed twice since. `mutates` is derived from the MCP server's
# own `read_only_hint` — the cutover inherited it from servers that declared
# nothing, so 91 plain reads were marked mutating and would have stopped for an
# approval on every call. The mutating grants are gone entirely, because a
# `tool-calling` agent cannot dispatch one: see the note above `budgets`.
#
# Narrowing the read set further per specialist is domain review, not mechanical
# work.
# Role: NB. Compiled only into a `role-nb` build (and the default all-roles build).
apiVersion: agentplane.hupe1980.github.io/v1alpha1
kind: Agent
metadata:
  name: eeg-compliance-agent
  version: "1.1.0"
spec:
  execution:
    kind: tool-calling
    max_turns: 12

  identity:
    role: >-
      EEG/KWKG regulatory compliance monitor. Checks §52 Pflichtzahlungen, §44b
      Biogas 45% cap, §20 Direktvermarktungspflicht (>100 kW), §42a Holzbiomasse,
      and §43 Substratdeckel violations.
    constraints: |
      You are the EEG compliance specialist.

      ## TRIGGERED BY
      - `de.eeg.anlage.*` — plant registration/update
      - `de.eeg.verguetung.*` / `de.eeg.marktpraemie.*` — settlement events

      ## COMPLIANCE CHECKS

      ### §20 EEG + §52 Abs. 1 Nr. 4 — Direktvermarktungspflicht
      Plants > 100 kW must be in Direktvermarktung (§21 Abs. 1 Nr. 3 EEG 2023).
      A plant that size still on the VERGUETUNG model is a §52 Abs. 1 Nr. 4 violation.
      Penalty: €10/kW/month from violation date.

      ### §44b EEG 2023 — Biogas 45% annual cap
      Biogas plants > 100 kW: track annual kWh vs cap (leistung_kw × 0.45 × 8760).
      Alert at 75%, flag at 90%.

      ### §42a EEG — Holzbiomasse restriction
      Holzbiomasse plants: check compliance with emission limits.

      ### §43 EEG — Substratdeckel
      Biogas: verify substrate mix compliance if applicable.

      ### §§53b–54 EEG — cuts to the anzulegender Wert
      These reduce the payment without changing the Einspeisemenge or the tariff
      table, so they look like a billing error to an operator. They are not
      violations — they are lawful deductions — and must be reported separately from
      VIOLATIONS so nobody chases a penalty that is not one.

      ## STEP-BY-STEP PROCEDURE

      1. Call einsd `get_plant` for plant details.
      2. Call einsd `get_compliance_status` for §52 violation check.
      3. If BIOGAS and > 100 kW: call einsd `check_sect44b_quota`.
      4. If > 100 kW on VERGUETUNG: call einsd `check_direktvermarktung_compliance`.
      5. If the question is about a payment being lower than expected, call einsd
         `get_aw_reduktionen` for the settlement date BEFORE reporting a violation:
         a §53b, §53c or §54 cut explains a smaller Gutschrift on its own.

  # What this agent is in a multi-agent arrangement.
  #
  # MAST measures inter-agent misalignment at 36.9 % of observed multi-agent
  # failures — a class that exists only if you choose it. Declaring the shape is
  # how you choose not to: `single` means one agent, one context, many tools, and
  # the inter-agent failure surface is structurally absent. `specialist` means it
  # hands off to nobody, which is what `max_delegation_depth: 0` already enforces
  # — stated here so the two cannot disagree.
  topology:
    mode: single
    role: specialist

  capabilities:
    provides: [eeg.compliance]

  models:
    privileged:  { provider: anthropic, model: claude-sonnet-5 }

  security:
    max_sensitivity_egress: internal
    max_delegation_depth: 0
    max_sensitivity_journaled: internal

  # No `oversight` block, and no mutating tool grant: this specialist reads and
  # reports. Both absences are the same fact — a `tool-calling` agent cannot
  # dispatch a mutating call at all, because the arguments come from a model
  # completion, which agentplane labels untrusted by construction, and its taint
  # gate refuses a mutating sink with untrusted arguments. Declaring the grant
  # anyway would read as an ability this agent does not have.
  #
  # Acting on a conclusion is a `planned` specialist's job — see
  # `gabi-gas-agent`, whose plan passes `$input/…` references the runtime
  # resolves itself, so the authority-bearing arguments keep the run input's own
  # labels and a named human approves the call before it leaves.

  # Human-in-the-loop, beside the answer rather than in front of it.
  #
  # `approval: none` — this specialist cannot act, so there is nothing to gate.
  # A `tool-calling` agent's arguments come from a model completion, which the
  # taint gate refuses at a mutating sink; it reads and reports. `tools-only`
  # would therefore gate nothing, and `required` would suspend a run per finding
  # and cost a case row until somebody clears it.
  #
  # `triage` is the third mode agentplane 0.15 added for exactly this: the run
  # completes and returns, and a matching answer *also* opens a worklist row.
  # Reporting, not control flow — which is why a triage rule may carry a
  # predicate where `approval` deliberately may not.
  #
  # Every `path` below is typed against this agent's own `output.schema` at parse
  # time, so a rule that could never fire is refused rather than reading in
  # review exactly like one that does. That check only became possible once the
  # answers were schemas instead of prose.
  oversight:
    approval: none
    # `approval: none` means nothing waits, so this bounds no wait — the field
    # is required and states the same window the rule below uses. One figure
    # written twice is cheaper than one field meaning two things.
    deadline:
      name: eeg-compliance-review
      kind: working-days
      params: { n: 2 }
    # A triage row *is* the finding, so an unanswered one widens rather than
    # closes: `deny` would take it out of the worklist and delete the delivery
    # of a breach that was correctly detected. (gabi-gas-agent's dispatching
    # approval stays `deny` for the opposite reason — it gates, so it must fail
    # closed.)
    on_expiry: escalate
    escalate_to: [mako-operations]
    triage:
      - name: eeg-compliance
        audience: [eeg-operations]
        priority: high
        summary: >-
          An EEG plant is in breach (§20/§44b/§51/§52). Penalty exposure accrues per month it stands.
        when:
          - path: /compliance_status
            equals: "VIOLATION"
        deadline:
          name: eeg-compliance-review
          kind: working-days
          params: { n: 2 }

  budgets:
    max_tokens: 200000
    max_steps: 36
    max_effects: 60
    max_wallclock_secs: 900

  # The result contract. It was a prose fence inside the prompt, which made
  # every consumer a parser of free text; as a schema the model is held to it
  # and a change to it changes the manifest digest.
  output:
    schema:
      type: object
      additionalProperties: false
      required:
        - compliance_status
        - plant_id
        - erzeugungsart
      properties:
        compliance_status:
          type: string
          enum:
            - OK
            - WARNING
            - VIOLATION
        plant_id:
          type: string
        erzeugungsart:
          type: string
        violations:
          type: array
          items:
            type: object
            properties:
              paragraph:
                type: string
              description:
                type: string
              penalty_exposure_eur_month:
                type: number
        warnings:
          type: array
          items:
            type: object
            properties:
              paragraph:
                type: string
              description:
                type: string
              threshold_pct:
                type: number
        aw_reduktionen:
          type: array
          items:
            type: object
            properties:
              paragraph:
                type: string
              grund:
                type: string
              abzug_ct_kwh:
                type: number

  # Knowledge, granted rather than copied.
  #
  # Every mako MCP server publishes step-by-step prompts for its own procedures —
  # fifty of them across thirteen servers — and not one manifest reached a single
  # one. Each specialist instead carried a hand-typed paraphrase in its
  # `constraints`, which is a second copy of a procedure with nothing keeping the
  # two in agreement: the server's prompt changes with the code, the paraphrase
  # changes when somebody remembers.
  #
  # A context grant is not a tool grant. Reading a prompt authorises no action,
  # but it does cross a trust and data-egress boundary, which is why it is
  # declared here where a reviewer sees it rather than fetched silently.
  context:
    prompts:
      - server: einsd
        name: settle-monthly
        max_input_sensitivity: internal
        output_sensitivity: internal

  tools:
    - ref: tool://einsd/list_plants
      mutates: false
      max_sensitivity: internal
      description: "list plants via einsd"
    - ref: tool://einsd/get_plant
      mutates: false
      max_sensitivity: internal
      description: "get plant via einsd"
    - ref: tool://einsd/list_expiring
      mutates: false
      max_sensitivity: internal
      description: "list expiring via einsd"
    - ref: tool://einsd/list_settlements
      mutates: false
      max_sensitivity: internal
      description: "list settlements via einsd"
    - ref: tool://einsd/lookup_verguetungssatz
      mutates: false
      max_sensitivity: internal
      description: "lookup verguetungssatz via einsd"
    - ref: tool://einsd/list_unsettled_plants
      mutates: false
      max_sensitivity: internal
      description: "list unsettled plants via einsd"
    - ref: tool://einsd/get_epex_monthly_price
      mutates: false
      max_sensitivity: internal
      description: "get epex monthly price via einsd"
    - ref: tool://einsd/lookup_statutory_rate
      mutates: false
      max_sensitivity: internal
      description: "lookup statutory rate via einsd"
    - ref: tool://einsd/get_compliance_status
      mutates: false
      max_sensitivity: internal
      description: "get compliance status via einsd"
    - ref: tool://einsd/list_plants_without_mastr
      mutates: false
      max_sensitivity: internal
      description: "list plants without mastr via einsd"
    - ref: tool://einsd/check_direktvermarktung_compliance
      mutates: false
      max_sensitivity: internal
      description: "check direktvermarktung compliance via einsd"
    - ref: tool://einsd/check_sect44b_quota
      mutates: false
      max_sensitivity: internal
      description: "check sect44b quota via einsd"
    - ref: tool://einsd/get_jahresmarktwert
      mutates: false
      max_sensitivity: internal
      description: "get jahresmarktwert via einsd"
    - ref: tool://einsd/get_aw_reduktionen
      mutates: false
      max_sensitivity: internal
      description: "get aw reduktionen via einsd"
    - ref: tool://einsd/get_settlement_state_history
      mutates: false
      max_sensitivity: internal
      description: "get settlement state history via einsd"
    - ref: tool://einsd/explain_settlement
      mutates: false
      max_sensitivity: internal
      description: "explain settlement via einsd"
    - ref: tool://obsd/get_process
      mutates: false
      max_sensitivity: internal
      description: "get process via obsd"
    - ref: tool://obsd/list_overdue_processes
      mutates: false
      max_sensitivity: internal
      description: "list overdue processes via obsd"
    - ref: tool://obsd/get_kpi_report
      mutates: false
      max_sensitivity: internal
      description: "get kpi report via obsd"
    - ref: tool://obsd/get_parity_report
      mutates: false
      max_sensitivity: internal
      description: "get parity report via obsd"
    - ref: tool://obsd/get_stp_rate
