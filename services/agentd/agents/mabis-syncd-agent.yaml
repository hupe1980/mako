# MaBiS Summenzeitreihe submission monitor. Tracks the Werktag-based Erstaufschlag/Clearing windows (BK6-24-174 Anlage 3 §3.10), detects failed aggregations, and diagnoses BIKO delivery issues.
#
# Generated from the compiled specialist definition during the agentplane
# cutover, and narrowed twice since. `mutates` is derived from the MCP server's
# own `read_only_hint` — the cutover inherited it from servers that declared
# nothing, so 91 plain reads were marked mutating and would have stopped for an
# approval on every call. The mutating grants are gone entirely, because a
# `tool-calling` agent cannot dispatch one: see the note above `budgets`.
#
# Narrowing the read set further per specialist is domain review, not mechanical
# work.
# Role: NB. Compiled only into a `role-nb` build (and the default all-roles build).
apiVersion: agentplane.hupe1980.github.io/v1alpha1
kind: Agent
metadata:
  name: mabis-syncd-agent
  version: "1.0.0"
spec:
  execution:
    kind: tool-calling
    max_turns: 10

  identity:
    role: >-
      MaBiS Summenzeitreihe submission monitor. Tracks the Werktag-based
      Erstaufschlag/Clearing windows (BK6-24-174 Anlage 3 §3.10), detects failed
      aggregations, and diagnoses BIKO delivery issues.
    constraints: |
      You are the MaBiS Summenzeitreihe submission specialist.

      ## TRIGGERED BY
      - `de.messwert.reading.quality.warning` — quality issue may affect Summenzeitreihe accuracy

      ## MABIS WINDOWS (BK6-24-174 Anlage 3 §3.10, Werktage after month end)
      - Erstaufschlag (BKA): ≤ 10 Werktage — a new version becomes Abrechnungsdaten directly
      - Clearing (BKA): ≤ 30 Werktage — a new version starts as Prüfdaten and needs a positive Prüfmitteilung
      - After 30 Werktage: KBKA (korrigierte Bilanzkreisabrechnung)
      - mabis-syncd submits at 05:00 UTC on the configured Erstaufschlag-Werktag (default 10)

      ## PROCEDURE

      1. Call obsd `get_kpi_report` for MaBiS submission status.
      2. For each active MaLo with BKV assignment: check last submission run.
      3. If submission missing or failed: call edmd `get_billing_period` to verify data availability.
      4. Check `attempt_count < 3` guard — after 3 failures, escalate.
      5. Determine if BIKO acceptance was received.

      ## OUTPUT FORMAT
      ```
      SUBMISSION_STATUS: [ON_TIME|OVERDUE|FAILED|PENDING]
      SUBMISSION_TYPE: [VORLAEUFIG|ENDGUELTIG]
      DEADLINE_UTC: [datetime]
      FAILED_MALO_COUNT: [number]
      ACTION: [NONE|RETRY|ESCALATE]
      ```

  capabilities:
    provides: [mabis.syncd]

  models:
    privileged:  { provider: anthropic, model: claude-sonnet-5 }

  security:
    max_sensitivity_egress: internal
    max_delegation_depth: 0
    max_sensitivity_journaled: internal

  # No `oversight` block, and no mutating tool grant: this specialist reads and
  # reports. Both absences are the same fact — a `tool-calling` agent cannot
  # dispatch a mutating call at all, because the arguments come from a model
  # completion, which agentplane labels untrusted by construction, and its taint
  # gate refuses a mutating sink with untrusted arguments. Declaring the grant
  # anyway would read as an ability this agent does not have.
  #
  # Acting on a conclusion is a `planned` specialist's job — see
  # `gabi-gas-agent`, whose plan passes `$input/…` references the runtime
  # resolves itself, so the authority-bearing arguments keep the run input's own
  # labels and a named human approves the call before it leaves.

  budgets:
    max_tokens: 200000
    max_steps: 30
    max_effects: 50
    max_wallclock_secs: 900

