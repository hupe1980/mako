# yaml-language-server: $schema=https://hupe1980.github.io/agentplane/agent.schema.json
# BSI TR-03109 Smart Meter Gateway lifecycle diagnostics. Detects certificate expiry (TLS/SIG/ENC/KEY_AGREEMENT), CLS channel §14a compliance gaps, communication faults, and stalled iMSys rollout. Uses edmd SMGW registry API.
#
# Every grant below is a tool this specialist's own procedure names, and every
# tool the procedure names is granted. `cargo xtask check-prompt-tools` holds the
# two together in both directions, so a grant nobody instructs — a whole server's
# read surface handed over because the specialist touches that server — cannot
# come back. `mutates` is derived from the server's own `read_only_hint`, and
# there are no mutating grants here at all: a `tool-calling` agent cannot
# dispatch one, so declaring it would read as an ability this agent does not
# have. See the note above `budgets`.
# Role: MSB. Compiled only into a `role-msb` build (and the default all-roles build).
apiVersion: agentplane.hupe1980.github.io/v1alpha1
kind: Agent
metadata:
  name: smgw-diagnostics-agent
  version: "2.0.0"
spec:
  execution:
    kind: tool-calling
    max_turns: 12

  identity:
    role: >-
      BSI TR-03109 Smart Meter Gateway lifecycle diagnostics. Detects certificate
      expiry (TLS/SIG/ENC/KEY_AGREEMENT), CLS channel §14a compliance gaps,
      communication faults, and stalled iMSys rollout. Uses edmd SMGW registry
      API.
    constraints: |
      You are the Smart Meter Gateway (SMGW) diagnostics specialist.

      ## TRIGGERED BY
      - `de.messwert.cls.compliance-issue`    — compliance issue detected by daily worker
      - `de.messwert.smgw.cert.expiry-warning` — cert 90/30/7 days from expiry; escalate renewal to the MSB before §14a Fernsteuerbarkeit is lost
      - `de.messwert.reading.quality.warning` — SMGW may be cause of quality degradation
      - `de.messwert.reading.direct.stored`   — verify gateway session is healthy post-push
      - `de.mako.process.initiated`       — §14a Steuerungsauftrag (check CLS channel)
      - `de.markt.geraet.konfiguration.updated` — device config changed, re-check compliance

      ## PROCEDURE

      ### Step 1 — Read the triggering event
      The `de.messwert.cls.compliance-issue` / `de.messwert.smgw.cert.expiry-warning`
      CloudEvent that woke you carries the full finding in its `data`:
      `malo_id`, `device_id`, `issue_type`, `severity`, `cert_serial`, `cert_type`,
      `days_to_expiry`, `channel_id`, and a human-readable `description`. Assess from
      that payload — it is everything edmd's compliance sweep detected. If `severity`
      is `CRITICAL`, escalate immediately.

      ### Step 2 — Correlate with metering history
      Use the edmd MCP tools you hold — `get_device_history` for the MaLo's device/MSB
      timeline and `get_quality_warnings` for recent reading anomalies — to judge
      whether the gateway fault has already disrupted metering. Call edmd
      `list_overdue_reading_orders` as well: orders left outstanding are what a gateway
      that stopped answering looks like from the outside. (Fleet-wide status is an
      operator surface, `GET /api/v1/smgw/compliance`, not an agent tool.)

      ### Step 3 — Certificate triage
      Parse `session.certificates` from the response:
      - TLS cert valid? → check `valid_to` ≥ today + 30 days
      - SIG cert valid? → required for metering data integrity
      - Any cert `is_revoked = true`? → CRITICAL. The gateway no longer meets the
        § 22 MsbG minimum requirements. § 19 MsbG permits only technical systems
        and components that meet §§ 21 and 22 to be used at all, and § 22 is where
        conformity with the BSI Schutzprofile and Technischen Richtlinien is
        presumed from — a revoked certificate withdraws that presumption. § 22 states the
        requirement and is silent on the remedy, so say what is true: the gateway
        is out of conformity and the MSB decides between renewal and replacement.
        § 29 MsbG is the Einbaupflicht and has nothing to say about a gateway
        already installed.

      ### Step 4 — CLS §14a compliance
      For each CLS channel in `session.cls_channels`:
      - `channel_status = 'ACTIVE'` but `produktcode` is null → WARNING. The
        Konfigurationsprodukt a CLS channel needs before a Netzbetreiber may
        steer the load is **BK6-22-300** (27.11.2023, in force 01.01.2024).
        BK6-24-174 is GPKE and has nothing to do with it.
      - Channel `valid_to` expired → stale configuration
      Call marktd `get_steuerbare_ressource` for the resource the channel is meant to
      reach and marktd `get_technische_ressource` for the device behind it. A channel
      that is healthy but points at no registered steuerbare Ressource controls nothing,
      and reads from the gateway alone as compliant.

      ### Step 5 — Communication fault
      If `last_contact_at` is > 2 hours ago → `COMMUNICATION_FAULT`:
      - Trigger Sonderablesung via `POST /api/v1/reading-orders` (§ 60 Abs. 2 MsbG)
      - Alert MSB field service

      ### Step 6 — Trigger immediate re-scan if needed
      Call `POST /api/v1/smgw/compliance/scan` to run a side-effecting sweep that:
      - Logs all current issues to `cls_compliance_log`
      - Emits `de.messwert.cls.compliance-issue` CloudEvents to ERP

      ## WHAT BINDS, AND WHAT IS ONLY OUR SCHEDULE

      | Rule | Source |
      |---|---|
      | SMGW architecture, and the CLS channel a control command travels over | BSI TR-03109-1 |
      | SM-PKI: certificate **runtimes** | BSI TR-03109-4 |
      | The SM-PKI trust root the gateway certificates chain to | § 28 MsbG |
      | The Konfigurationsprodukt a CLS channel needs before a DSO may steer | BK6-22-300 |
      | Plausibilisierung und Ersatzwertbildung when a gateway goes silent | § 60 Abs. 2 MsbG |

      **The 90/30/7-day expiry ladder is edmd's operational warning schedule, not
      a deadline anybody published.** TR-03109-4 binds certificate *runtimes*; the
      renewal lead time and the Zertifikatswechsel overlap live in the Root-CP.
      Report the ladder as the operator's own, and never as "TR-03109-4 requires
      renewal 30 days before expiry" — the TR says no such thing, and a citation
      that points somewhere real but irrelevant is worse than none, because
      nobody re-checks it.

      Two more that were here and were wrong: **§ 21c MsbG does not exist** (the
      MsbG runs § 21 → § 22), and **§ 29 MsbG** is the Einbaupflicht with its 2032
      deadlines — it says nothing about certificates.

  # What this agent is in a multi-agent arrangement.
  #
  # MAST measures inter-agent misalignment at 36.9 % of observed multi-agent
  # failures — a class that exists only if you choose it. Declaring the shape is
  # how you choose not to: `single` means one agent, one context, many tools, and
  # the inter-agent failure surface is structurally absent. `specialist` means it
  # hands off to nobody, which is what `max_delegation_depth: 0` already enforces
  # — stated here so the two cannot disagree.
  topology:
    mode: single
    role: specialist

  capabilities:
    provides: [smgw.diagnostics]

  models:
    privileged:  { provider: anthropic, model: claude-sonnet-5 }

  security:
    max_sensitivity_egress: internal
    max_delegation_depth: 0
    max_sensitivity_journaled: internal

  # No mutating tool grant, and no approval: this specialist reads and reports.
  # Both absences are the same fact — a `tool-calling` agent cannot dispatch a
  # mutating call at all, because the arguments come from a model completion,
  # which agentplane labels untrusted by construction, and its taint gate refuses
  # a mutating sink with untrusted arguments. Declaring the grant anyway would
  # read as an ability this agent does not have.
  #
  # It does declare `oversight`, for **triage** — a row beside a finished answer
  # rather than a gate in front of a call. That is the only mode that fits an
  # agent which cannot act: gating its answer would gate nothing while suspending
  # a run per finding.
  #

  # Human-in-the-loop, beside the answer rather than in front of it.
  #
  # `approval: none` — this specialist cannot act (a `tool-calling` agent's
  # arguments come from a model completion, which the taint gate refuses at a
  # mutating sink), so there is nothing to gate. `triage` opens a worklist row
  # beside the returned answer instead. Every `path` is typed against this
  # agent's own `output.schema` at parse time.
  oversight:
    approval: none
    # `approval: none` means nothing waits, so this bounds no wait — the field
    # is required and states the same window the rule below uses.
    deadline:
      name: smgw-critical-review
      kind: hours
      params: { n: 8 }
    # A triage row *is* the finding, so an unanswered one widens rather than
    # closes: `deny` would take it out of the worklist and delete the delivery
    # of a breach that was correctly detected. (gabi-gas-agent's dispatching
    # approval stays `deny` for the opposite reason — it gates, so it must fail
    # closed.)
    on_expiry: escalate
    escalate_to: [mako-operations]
    triage:
      - name: smgw-critical
        audience: [metering]
        priority: high
        summary: >-
          A Smart-Meter-Gateway is in a critical state — an expiring TLS certificate or a broken CLS session stops §14a EnWG Steuerung and iMSys readings both.
        when:
          - path: /smgw_status
            equals: "CRITICAL"
        deadline:
          name: smgw-critical-review
          kind: hours
          params: { n: 8 }

  budgets:
    max_tokens: 200000
    max_steps: 36
    max_effects: 60
    max_wallclock_secs: 900

  # The result contract. It was a prose fence inside the prompt, which made
  # every consumer a parser of free text; as a schema the model is held to it
  # and a change to it changes the manifest digest.
  output:
    schema:
      type: object
      additionalProperties: false
      required:
        - smgw_status
        - tls_cert_expiry_days
        - cls_14a_compliant
      properties:
        smgw_status:
          type: string
          enum:
            - HEALTHY
            - WARNING
            - CRITICAL
        tls_cert_expiry_days:
          type: number
        cls_14a_compliant:
          type: string
        session_status:
          type: string
          enum:
            - OPERATIONAL
            - COMMUNICATION_FAULT
            - REVOKED
            - REPLACED
            - OTHER
        open_issues:
          type: number
        recommended_action:
          type: string

  # Knowledge, granted rather than copied.
  #
  # mako's MCP servers publish 57 step-by-step prompts across 15 servers for
  # their own procedures. A specialist names the one it needs; a hand-typed
  # paraphrase in `constraints` would be a second copy with nothing keeping the
  # two in agreement — the server's prompt changes with the code, a paraphrase
  # changes when somebody remembers.
  #
  # A context grant is not a tool grant. Reading a prompt authorises no action,
  # but it does cross a trust and data-egress boundary, which is why it is
  # declared here where a reviewer sees it rather than fetched silently.
  context:
    prompts:
      - server: edmd
        name: reading-order-lifecycle
        max_input_sensitivity: internal
        output_sensitivity: internal

  tools:
    - ref: tool://edmd/get_device_history
      mutates: false
      max_sensitivity: internal
      description: >-
        The MaLo's gateway and MSB timeline.

    - ref: tool://edmd/get_quality_warnings
      mutates: false
      max_sensitivity: internal
      description: >-
        Whether the gateway fault has already disrupted metering.

    - ref: tool://edmd/list_overdue_reading_orders
      mutates: false
      max_sensitivity: internal
      description: >-
        Reading orders left outstanding by a gateway that stopped answering.

    - ref: tool://marktd/get_technische_ressource
      mutates: false
      max_sensitivity: confidential
      description: >-
        The technical resource behind the gateway's CLS channel.

    - ref: tool://marktd/get_steuerbare_ressource
      mutates: false
      max_sensitivity: confidential
      description: >-
        The steuerbare Ressource a § 14a control channel must reach.
