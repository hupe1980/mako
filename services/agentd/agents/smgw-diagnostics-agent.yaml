# BSI TR-03109 Smart Meter Gateway lifecycle diagnostics. Detects certificate expiry (TLS/SIG/ENC/KEY_AGREEMENT), CLS channel §14a compliance gaps, communication faults, and stalled iMSys rollout. Uses edmd SMGW registry API.
#
# Generated from the compiled specialist definition during the agentplane
# cutover, and narrowed twice since. `mutates` is derived from the MCP server's
# own `read_only_hint` — the cutover inherited it from servers that declared
# nothing, so 91 plain reads were marked mutating and would have stopped for an
# approval on every call. The mutating grants are gone entirely, because a
# `tool-calling` agent cannot dispatch one: see the note above `budgets`.
#
# Narrowing the read set further per specialist is domain review, not mechanical
# work.
# Role: MSB. Compiled only into a `role-msb` build (and the default all-roles build).
apiVersion: agentplane.hupe1980.github.io/v1alpha1
kind: Agent
metadata:
  name: smgw-diagnostics-agent
  version: "1.1.0"
spec:
  execution:
    kind: tool-calling
    max_turns: 12

  identity:
    role: >-
      BSI TR-03109 Smart Meter Gateway lifecycle diagnostics. Detects certificate
      expiry (TLS/SIG/ENC/KEY_AGREEMENT), CLS channel §14a compliance gaps,
      communication faults, and stalled iMSys rollout. Uses edmd SMGW registry
      API.
    constraints: |
      You are the Smart Meter Gateway (SMGW) diagnostics specialist.

      ## TRIGGERED BY
      - `de.messwert.cls.compliance-issue`    — compliance issue detected by daily worker
      - `de.messwert.smgw.cert.expiry-warning` — cert 90/30/7 days from expiry; escalate renewal to the MSB before §14a Fernsteuerbarkeit is lost
      - `de.messwert.reading.quality.warning` — SMGW may be cause of quality degradation
      - `de.messwert.reading.direct.stored`   — verify gateway session is healthy post-push
      - `de.mako.process.initiated`       — §14a Steuerungsauftrag (check CLS channel)
      - `de.markt.geraet.konfiguration.updated` — device config changed, re-check compliance

      ## PROCEDURE

      ### Step 1 — Read the triggering event
      The `de.messwert.cls.compliance-issue` / `de.messwert.smgw.cert.expiry-warning`
      CloudEvent that woke you carries the full finding in its `data`:
      `malo_id`, `device_id`, `issue_type`, `severity`, `cert_serial`, `cert_type`,
      `days_to_expiry`, `channel_id`, and a human-readable `description`. Assess from
      that payload — it is everything edmd's compliance sweep detected. If `severity`
      is `CRITICAL`, escalate immediately.

      ### Step 2 — Correlate with metering history
      Use the edmd MCP tools you hold — `get_device_history` for the MaLo's device/MSB
      timeline and `get_quality_warnings` for recent reading anomalies — to judge
      whether the gateway fault has already disrupted metering. (Fleet-wide status is an
      operator surface, `GET /api/v1/smgw/compliance`, not an agent tool.)

      ### Step 3 — Certificate triage
      Parse `session.certificates` from the response:
      - TLS cert valid? → check `valid_to` ≥ today + 30 days
      - SIG cert valid? → required for metering data integrity
      - Any cert `is_revoked = true`? → CRITICAL: SMGW must be replaced (MsbG §29)

      ### Step 4 — CLS §14a compliance
      For each CLS channel in `session.cls_channels`:
      - `channel_status = 'ACTIVE'` but `produktcode` is null → WARNING (BK6-24-174 §4.3)
      - Channel `valid_to` expired → stale configuration

      ### Step 5 — Communication fault
      If `last_contact_at` is > 2 hours ago → `COMMUNICATION_FAULT`:
      - Trigger Sonderablesung via `POST /api/v1/reading-orders` (§ 60 Abs. 2 MsbG)
      - Alert MSB field service

      ### Step 6 — Trigger immediate re-scan if needed
      Call `POST /api/v1/smgw/compliance/scan` to run a side-effecting sweep that:
      - Logs all current issues to `cls_compliance_log`
      - Emits `de.messwert.cls.compliance-issue` CloudEvents to ERP

      ## BSI TR-03109 REQUIREMENTS
      - TLS certificate: issued by BSI-approved CA, renew ≥ 30 days before expiry (TR-03109-4 §6.3)
      - SMGW must maintain active session with MSB backend (TR-03109-1 §3.2)
      - CLS channel + Konfigurationsprodukt required for §14a load control (BK6-22-300)
      - Communication fault > 2h → § 60 Abs. 2 MsbG substitute values mandatory

  # What this agent is in a multi-agent arrangement.
  #
  # MAST measures inter-agent misalignment at 36.9 % of observed multi-agent
  # failures — a class that exists only if you choose it. Declaring the shape is
  # how you choose not to: `single` means one agent, one context, many tools, and
  # the inter-agent failure surface is structurally absent. `specialist` means it
  # hands off to nobody, which is what `max_delegation_depth: 0` already enforces
  # — stated here so the two cannot disagree.
  topology:
    mode: single
    role: specialist

  capabilities:
    provides: [smgw.diagnostics]

  models:
    privileged:  { provider: anthropic, model: claude-sonnet-5 }

  security:
    max_sensitivity_egress: internal
    max_delegation_depth: 0
    max_sensitivity_journaled: internal

  # No `oversight` block, and no mutating tool grant: this specialist reads and
  # reports. Both absences are the same fact — a `tool-calling` agent cannot
  # dispatch a mutating call at all, because the arguments come from a model
  # completion, which agentplane labels untrusted by construction, and its taint
  # gate refuses a mutating sink with untrusted arguments. Declaring the grant
  # anyway would read as an ability this agent does not have.
  #
  # Acting on a conclusion is a `planned` specialist's job — see
  # `gabi-gas-agent`, whose plan passes `$input/…` references the runtime
  # resolves itself, so the authority-bearing arguments keep the run input's own
  # labels and a named human approves the call before it leaves.

  # Human-in-the-loop, beside the answer rather than in front of it.
  #
  # `approval: none` — this specialist cannot act (a `tool-calling` agent's
  # arguments come from a model completion, which the taint gate refuses at a
  # mutating sink), so there is nothing to gate. `triage` opens a worklist row
  # beside the returned answer instead. Every `path` is typed against this
  # agent's own `output.schema` at parse time.
  oversight:
    approval: none
    # `approval: none` means nothing waits, so this bounds no wait — the field
    # is required and states the same window the rule below uses.
    deadline:
      name: smgw-critical-review
      kind: hours
      params: { n: 8 }
    triage:
      - name: smgw-critical
        audience: [metering]
        priority: high
        summary: >-
          A Smart-Meter-Gateway is in a critical state — an expiring TLS certificate or a broken CLS session stops §14a EnWG Steuerung and iMSys readings both.
        when:
          - path: /smgw_status
            equals: "CRITICAL"
        deadline:
          name: smgw-critical-review
          kind: hours
          params: { n: 8 }

  budgets:
    max_tokens: 200000
    max_steps: 36
    max_effects: 60
    max_wallclock_secs: 900

  # The result contract. It was a prose fence inside the prompt, which made
  # every consumer a parser of free text; as a schema the model is held to it
  # and a change to it changes the manifest digest.
  output:
    schema:
      type: object
      additionalProperties: false
      required:
        - smgw_status
        - tls_cert_expiry_days
        - cls_14a_compliant
      properties:
        smgw_status:
          type: string
          enum:
            - HEALTHY
            - WARNING
            - CRITICAL
        tls_cert_expiry_days:
          type: number
        cls_14a_compliant:
          type: string
        session_status:
          type: string
          enum:
            - OPERATIONAL
            - COMMUNICATION_FAULT
            - REVOKED
            - REPLACED
            - OTHER
        open_issues:
          type: number
        recommended_action:
          type: string

  # Knowledge, granted rather than copied.
  #
  # Every mako MCP server publishes step-by-step prompts for its own procedures —
  # fifty of them across thirteen servers — and not one manifest reached a single
  # one. Each specialist instead carried a hand-typed paraphrase in its
  # `constraints`, which is a second copy of a procedure with nothing keeping the
  # two in agreement: the server's prompt changes with the code, the paraphrase
  # changes when somebody remembers.
  #
  # A context grant is not a tool grant. Reading a prompt authorises no action,
  # but it does cross a trust and data-egress boundary, which is why it is
  # declared here where a reviewer sees it rather than fetched silently.
  context:
    prompts:
      - server: edmd
        name: reading-order-lifecycle
        max_input_sensitivity: internal
        output_sensitivity: internal

