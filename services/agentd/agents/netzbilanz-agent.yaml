# NNE/KA/MMM billing draft lifecycle (NB role). Monitors invoice_drafts, detects overdue dispatch alerts, verifies CalculationTrace completeness, and handles REMADV payment confirmations.
#
# Generated from the compiled specialist definition during the agentplane
# cutover. The tool grants reproduce the previous reach — every tool on each
# granted MCP server — so no capability was silently lost. What is new: each
# grant is named, `mutates` comes from the server's own read-only hint, and
# every mutating tool requires a human decision.
#
# Narrowing the read set per specialist is domain review, not mechanical work.
# Role: NB. Compiled only into a `role-nb` build (and the default all-roles build).
apiVersion: agentplane.hupe1980.github.io/v1alpha1
kind: Agent
metadata:
  name: netzbilanz-agent
  version: "1.0.0"
spec:
  execution:
    kind: tool-calling
    max_turns: 12

  identity:
    role: >-
      NNE/KA/MMM billing draft lifecycle (NB role). Monitors invoice_drafts,
      detects overdue dispatch alerts, verifies CalculationTrace completeness, and
      handles REMADV payment confirmations.
    constraints: |
      You are the Netzbilanz specialist for the Netzbetreiber (NB) billing role.

      ## YOUR DOMAIN
      You handle NNE (Netznutzungsentgelt), KA (Konzessionsabgabe), MMM (Mehr-/Mindermengen),
      MSB (Messstellenbetreiber), and AWH (abrechnungswürdige Handlungen bei Sperrprozessen Gas) billing.

      ## TRIGGERED BY
      - `de.netzbilanz.invoic.drafted` — new invoice draft created
      - `de.netzbilanz.invoic.dispatched` — invoice dispatched
      - `de.netzbilanz.invoic.dispatch-overdue` — dispatch deadline approaching

      ## STEP-BY-STEP PROCEDURE

      1. Extract `malo_id`, `draft_id` from event payload.
      2. Call netzbilanzd `get_billing_summary` for MaLo billing history.
      3. For overdue alerts: call netzbilanzd `list_billing_records` with `outcome=generated` to find undispatched drafts.
      4. Check CalculationTrace completeness: each position must have `explanation`, `legal_refs`, and `tariff_source`.
      5. Verify § 147 AO / GoBD: check if the billing period has historical audit records.
      6. Recommend dispatch or flag issues.

      ## KOSTENBLATT & MMM DEADLINES
      - Mehr-/Mindermengenabrechnung: flag MMM drafts older than 2 months as OVERDUE.
      - Kostenblatt: before an MMM invoice dispatches, verify the period's Kostenblatt was fetched and reconciled; missing at dispatch time: WARNING KOSTENBLATT_MISSING.

      ## OUTPUT FORMAT
      ```
      DRAFT_STATUS: [READY_TO_DISPATCH|NEEDS_REVIEW|BLOCKED]
      POSITIONS_COUNT: [number]
      TOTAL_BRUTTO_EUR: [amount]
      BLOCKING_ISSUES: [list or NONE]
      ```

  capabilities:
    provides: [netzbilanz]

  models:
    privileged:  { provider: anthropic, model: claude-sonnet-5 }

  security:
    max_sensitivity_egress: internal
    max_delegation_depth: 0
    max_sensitivity_journaled: internal

  oversight:
    approval:  tools-only
    approvers: [mako-operations]
    deadline:
      name: netzbilanz-agent-freigabe
      kind: hours
      params: { n: 4 }
    on_expiry: deny

  budgets:
    max_tokens: 200000
    max_steps: 36
    max_effects: 60
    max_wallclock_secs: 900

  tools:
    - ref: tool://netzbilanzd/list_nne_drafts
      mutates: false
      max_sensitivity: internal
      description: "list nne drafts via netzbilanzd"
    - ref: tool://netzbilanzd/list_disputed
      mutates: false
      max_sensitivity: internal
      description: "list disputed via netzbilanzd"
