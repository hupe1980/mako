# yaml-language-server: $schema=https://hupe1980.github.io/agentplane/agent.schema.json
# NNE/KA/MMM billing draft lifecycle (NB role). Monitors invoice_drafts, detects overdue dispatch alerts, verifies CalculationTrace completeness, and handles REMADV payment confirmations.
#
# Every grant below is a tool this specialist's own procedure names, and every
# tool the procedure names is granted. `cargo xtask check-prompt-tools` holds the
# two together in both directions, so a grant nobody instructs — a whole server's
# read surface handed over because the specialist touches that server — cannot
# come back. `mutates` is derived from the server's own `read_only_hint`, and
# there are no mutating grants here at all: a `tool-calling` agent cannot
# dispatch one, so declaring it would read as an ability this agent does not
# have. See the note above `budgets`.
# Role: NB. Compiled only into a `role-nb` build (and the default all-roles build).
apiVersion: agentplane.hupe1980.github.io/v1alpha1
kind: Agent
metadata:
  name: netzbilanz-agent
  version: "2.0.0"
spec:
  execution:
    kind: tool-calling
    max_turns: 12

  identity:
    role: >-
      NNE/KA/MMM billing draft lifecycle (NB role). Monitors invoice_drafts,
      detects overdue dispatch alerts, verifies CalculationTrace completeness, and
      handles REMADV payment confirmations.
    constraints: |
      You are the Netzbilanz specialist for the Netzbetreiber (NB) billing role.

      ## YOUR DOMAIN
      You handle NNE (Netznutzungsentgelt), KA (Konzessionsabgabe), MMM (Mehr-/Mindermengen),
      MSB (Messstellenbetreiber), and AWH (abrechnungswürdige Handlungen bei Sperrprozessen Gas) billing.

      ## TRIGGERED BY
      - `de.netzbilanz.invoic.drafted` — new invoice draft created
      - `de.netzbilanz.invoic.dispatched` — invoice dispatched
      - `de.netzbilanz.invoic.dispatch-overdue` — dispatch deadline approaching
      - `de.netzbilanz.invoic.disputed` — the counterparty rejected one of ours

      ## STEP-BY-STEP PROCEDURE

      1. Extract `draft_id` and `malo_id` from the event payload.
      2. Call `get_draft` for the invoice in full.
      3. Read `check_findings` and `settlement_warnings` FIRST. They are the
         service's own verdict on the document, and they say what is wrong before
         you look for it yourself. `KA_ABOVE_KAV_MAXIMUM` means the
         Konzessionsabgabe exceeds the KAV §2 Höchstbetrag for the customer group
         named on the settlement; `UMLAGE_RATE_MISSING` means a network levy was
         omitted for want of a published rate, so the invoice understates.
         Either is BLOCKED, not NEEDS_REVIEW.
      4. Check the trace: every position carries `mako:calculation_trace` with
         `explanation`, `legal_refs` and `tariff_source`. A position without one
         cannot be defended in a §20 EnWG audit. Where the trace names a Preisblatt,
         call marktd `get_preisblatt` and confirm it was valid for the billed period —
         a trace that cites a price sheet which had already expired documents the wrong
         number rather than justifying the right one.
      5. Sanity-check the Sparte. PID 31002 and 31005 are shared between Strom and
         Gas, so read `sparte` on the draft — a Gas invoice carrying the three EnFG
         network levies (§19 StromNEV, Offshore, KWKG) is billing electricity
         charges on gas. To sweep for that across a portfolio, call `list_drafts`
         with `sparte: "Gas"`: the Prüfidentifikator cannot make the distinction,
         so filtering on `pid` alone answers the wrong question.
      6. For overdue alerts: `list_undispatched` (drafts the checker disputed are
         already excluded — those are blocked, not overdue). Each row carries
         `zu_zahlen_eur_units` — what is still to collect after the Abschläge this
         invoice settles. Report that, not the gross: on a period billed on
         account the gross overstates the exposure.
      7. Before recommending dispatch, call `list_corrections` for the MaLo and period:
         a draft raised over a period a Storno has already reopened is a second invoice
         for the same consumption, and the correction is the document that governs.
      8. Recommend dispatch, or report the blocking issues.

      ## ON A DISPUTED INVOICE (de.netzbilanz.invoic.disputed)
      1. Call `get_draft` for the document the counterparty rejected. Its own
         `check_findings` come first: a dispute that agrees with our checker is a
         document we should not have dispatched, which is a different answer from
         a dispute we should defend.
      2. Call `list_disputed` for the period — one rejected invoice is a
         document, and a run of them against one counterparty is a systematic
         disagreement about a tariff or a Sparte.
      3. Call `list_corrections` to see whether a Storno already answers it.
      4. Name the position and the trace behind it. A dispute answered without
         `mako:calculation_trace` is an assertion, not a defence.

      ## KOSTENBLATT & MMM DEADLINES
      - Mehr-/Mindermengenabrechnung: flag MMM drafts older than 2 months as OVERDUE.
      - Kostenblatt: call `list_kostenblatt_gaps` for the period. A gap is an
        activation registered but never quantified, and it would be submitted to
        the ÜNB as zero cost. Also check `dispatch_source` on quantified records —
        `billing_period` means a monthly aggregate stood in for a 15-minute
        window and is wrong by orders of magnitude: report
        KOSTENBLATT_FALLBACK_QUANTITY. A gap the list returns and nobody
        quantified: report KOSTENBLATT_GAP_UNQUANTIFIED.
        **Do not quote a Festlegung for the submission date.** BK6-23-241
        (07.05.2026) repealed BK6-20-061 at Tenorziffer 3, and its replacement —
        the bundesweit einheitliche Prozessbeschreibungen of Tenorziffer 7 — is
        not published. The 15th of the following month is the operator's own
        Stichtag, historically the repealed figure, and mako holds it as
        configuration (`mako_redispatch::fristen::Betreiberfristen`). Report it
        as the operator's date; citing a repealed decision for it reads as
        authority, which is why nobody re-checks it.

  # What this agent is in a multi-agent arrangement.
  #
  # MAST measures inter-agent misalignment at 36.9 % of observed multi-agent
  # failures — a class that exists only if you choose it. Declaring the shape is
  # how you choose not to: `single` means one agent, one context, many tools, and
  # the inter-agent failure surface is structurally absent. `specialist` means it
  # hands off to nobody, which is what `max_delegation_depth: 0` already enforces
  # — stated here so the two cannot disagree.
  topology:
    mode: single
    role: specialist

  capabilities:
    provides: [netzbilanz]

  models:
    privileged:  { provider: anthropic, model: claude-sonnet-5 }

  security:
    max_sensitivity_egress: internal
    max_delegation_depth: 0
    max_sensitivity_journaled: internal

  # No mutating tool grant, and no approval: this specialist reads and reports.
  # Both absences are the same fact — a `tool-calling` agent cannot dispatch a
  # mutating call at all, because the arguments come from a model completion,
  # which agentplane labels untrusted by construction, and its taint gate refuses
  # a mutating sink with untrusted arguments. Declaring the grant anyway would
  # read as an ability this agent does not have.
  #
  # It does declare `oversight`, for **triage** — a row beside a finished answer
  # rather than a gate in front of a call. That is the only mode that fits an
  # agent which cannot act: gating its answer would gate nothing while suspending
  # a run per finding.
  #
  # Acting on a conclusion is a `planned` specialist's job — see
  # `gabi-gas-agent`, whose plan passes `$input/…` references the runtime
  # resolves itself, so the authority-bearing arguments keep the run input's own
  # labels and a named human approves the call before it leaves.

  # Human-in-the-loop, beside the answer rather than in front of it.
  #
  # `approval: none` — this specialist cannot act, so there is nothing to gate.
  # A `tool-calling` agent's arguments come from a model completion, which the
  # taint gate refuses at a mutating sink; it reads and reports. `tools-only`
  # would therefore gate nothing, and `required` would suspend a run per finding
  # and cost a case row until somebody clears it.
  #
  # `triage` is the third mode agentplane 0.15 added for exactly this: the run
  # completes and returns, and a matching answer *also* opens a worklist row.
  # Reporting, not control flow — which is why a triage rule may carry a
  # predicate where `approval` deliberately may not.
  #
  # Every `path` below is typed against this agent's own `output.schema` at parse
  # time, so a rule that could never fire is refused rather than reading in
  # review exactly like one that does. That check only became possible once the
  # answers were schemas instead of prose.
  oversight:
    approval: none
    # `approval: none` means nothing waits, so this bounds no wait — the field
    # is required and states the same window the rule below uses. One figure
    # written twice is cheaper than one field meaning two things.
    deadline:
      name: netzbilanz-blocked-review
      kind: working-days
      params: { n: 1 }
    # A triage row *is* the finding, so an unanswered one widens rather than
    # closes: `deny` would take it out of the worklist and delete the delivery
    # of a breach that was correctly detected. (gabi-gas-agent's dispatching
    # approval stays `deny` for the opposite reason — it gates, so it must fail
    # closed.)
    on_expiry: escalate
    escalate_to: [mako-operations]
    triage:
      - name: netzbilanz-blocked
        audience: [netzbilanz]
        priority: urgent
        summary: >-
          A Netzbetreiber invoice cannot be dispatched — its own pre-dispatch check disputes it. Every day it waits is a day of Netznutzungsentgelt unbilled.
        when:
          - path: /draft_status
            equals: "BLOCKED"
        deadline:
          name: netzbilanz-blocked-review
          kind: working-days
          params: { n: 1 }

  budgets:
    max_tokens: 200000
    max_steps: 36
    max_effects: 60
    max_wallclock_secs: 900

  # The result contract. It was a prose fence inside the prompt, which made
  # every consumer a parser of free text; as a schema the model is held to it
  # and a change to it changes the manifest digest.
  output:
    schema:
      type: object
      additionalProperties: false
      required:
        - draft_status
        - positions_count
        - total_brutto_eur
      properties:
        draft_status:
          type: string
          enum:
            - READY_TO_DISPATCH
            - NEEDS_REVIEW
            - BLOCKED
        positions_count:
          type: number
        total_brutto_eur:
          type: number
        blocking_issues:
          type: array
          items:
            type: string
        kostenblatt_warning:
          type: [string, "null"]
          description: >-
            The one finding this specialist raises itself rather than reading
            off the draft. `KOSTENBLATT_FALLBACK_QUANTITY` means a quantified
            record's `dispatch_source` is `billing_period`, so a monthly
            aggregate stood in for a 15-minute window and the figure is wrong by
            orders of magnitude. Null when neither applies.
          enum:
            - KOSTENBLATT_FALLBACK_QUANTITY
            - KOSTENBLATT_GAP_UNQUANTIFIED
            - null

  # Knowledge, granted rather than copied.
  #
  # mako's MCP servers publish 57 step-by-step prompts across 15 servers for
  # their own procedures. A specialist names the one it needs; a hand-typed
  # paraphrase in `constraints` would be a second copy with nothing keeping the
  # two in agreement — the server's prompt changes with the code, a paraphrase
  # changes when somebody remembers.
  #
  # A context grant is not a tool grant. Reading a prompt authorises no action,
  # but it does cross a trust and data-egress boundary, which is why it is
  # declared here where a reviewer sees it rather than fetched silently.
  context:
    prompts:
      - server: netzbilanzd
        name: nb-invoic-overview
        max_input_sensitivity: internal
        output_sensitivity: internal
      - server: netzbilanzd
        name: investigate-dispute
        max_input_sensitivity: internal
        output_sensitivity: internal

  tools:
    - ref: tool://netzbilanzd/get_draft
      mutates: false
      max_sensitivity: internal
      description: >-
        The invoice draft in full, including `check_findings` and the
        calculation trace.

    - ref: tool://netzbilanzd/list_drafts
      mutates: false
      max_sensitivity: internal
      description: >-
        Drafts across a portfolio, filtered by Sparte for the PID-sharing sweep.

    - ref: tool://netzbilanzd/list_disputed
      mutates: false
      max_sensitivity: internal
      description: >-
        Invoices a counterparty rejected, so one dispute can be read against the
        rest of the period rather than on its own.

    - ref: tool://netzbilanzd/list_undispatched
      mutates: false
      max_sensitivity: internal
      description: >-
        Drafts past their dispatch window, with what is still to collect.

    - ref: tool://netzbilanzd/list_kostenblatt_gaps
      mutates: false
      max_sensitivity: internal
      description: >-
        Activations registered but never quantified, which would go to the ÜNB
        as zero cost.

    - ref: tool://netzbilanzd/list_corrections
      mutates: false
      max_sensitivity: internal
      description: >-
        Storni and corrections already raised against a draft's period.

    - ref: tool://marktd/get_preisblatt
      mutates: false
      max_sensitivity: confidential
      description: >-
        The Preisblatt a position's `tariff_source` claims to have come from.
