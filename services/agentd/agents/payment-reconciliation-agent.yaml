# SEPA payment reconciliation and Mahnwesen escalation. Matches CAMT.054 bank returns against accountingd ledger, triggers Mahnstufe escalation (1→2→3), and generates Sperrauftrag when needed.
#
# Generated from the compiled specialist definition during the agentplane
# cutover, and narrowed twice since. `mutates` is derived from the MCP server's
# own `read_only_hint` — the cutover inherited it from servers that declared
# nothing, so 91 plain reads were marked mutating and would have stopped for an
# approval on every call. The mutating grants are gone entirely, because a
# `tool-calling` agent cannot dispatch one: see the note above `budgets`.
#
# Narrowing the read set further per specialist is domain review, not mechanical
# work.
# Role: LF. Compiled only into a `role-lf` build (and the default all-roles build).
apiVersion: agentplane.hupe1980.github.io/v1alpha1
kind: Agent
metadata:
  name: payment-reconciliation-agent
  version: "1.0.0"
spec:
  execution:
    kind: tool-calling
    max_turns: 10

  identity:
    role: >-
      SEPA payment reconciliation and Mahnwesen escalation. Matches CAMT.054 bank
      returns against accountingd ledger, triggers Mahnstufe escalation (1→2→3),
      and generates Sperrauftrag when needed.
    constraints: |
      You are the payment reconciliation specialist.

      ## TRIGGERED BY
      - `de.accounting.payment.due` — SEPA DD due date approaching
      - `de.accounting.bankruecklast` — SEPA direct debit returned by bank

      ## PROCEDURE

      1. Extract `malo_id` and `amount_eur` from event payload.
      2. Call accountingd `get_balance` for current balance.
      3. Call accountingd `get_open_items` for outstanding positions (FIFO).
      4. For Bankrücklast: identify which invoice triggered the return, check return code.
      5. Determine Mahnwesen level: Mahnstufe 1 (reminder) → 2 (fee) → 3 (Sperrauftrag).
      6. If Sperrauftrag required: emit `de.accounting.sperrauftrag` for sperrd processing.

      ## OUTPUT FORMAT
      ```
      PAYMENT_STATUS: [CURRENT|OVERDUE|RETURNED|SPERR_REQUIRED]
      OUTSTANDING_EUR: [amount]
      MAHNSTUFE: [0|1|2|3]
      RETURN_CODE: [R-code if applicable]
      ACTION: [NONE|MAHNUNG_1|MAHNUNG_2|SPERRAUFTRAG]
      ```

  capabilities:
    provides: [payment.reconciliation]

  models:
    privileged:  { provider: anthropic, model: claude-sonnet-5 }

  security:
    max_sensitivity_egress: internal
    max_delegation_depth: 0
    max_sensitivity_journaled: internal

  # No `oversight` block, and no mutating tool grant: this specialist reads and
  # reports. Both absences are the same fact — a `tool-calling` agent cannot
  # dispatch a mutating call at all, because the arguments come from a model
  # completion, which agentplane labels untrusted by construction, and its taint
  # gate refuses a mutating sink with untrusted arguments. Declaring the grant
  # anyway would read as an ability this agent does not have.
  #
  # Acting on a conclusion is a `planned` specialist's job — see
  # `gabi-gas-agent`, whose plan passes `$input/…` references the runtime
  # resolves itself, so the authority-bearing arguments keep the run input's own
  # labels and a named human approves the call before it leaves.

  budgets:
    max_tokens: 200000
    max_steps: 30
    max_effects: 50
    max_wallclock_secs: 900

  tools:
    - ref: tool://accountingd/get_balance
      mutates: false
      max_sensitivity: internal
      description: "get balance via accountingd"
    - ref: tool://accountingd/list_ledger
      mutates: false
      max_sensitivity: internal
      description: "list ledger via accountingd"
    - ref: tool://accountingd/list_dunning
      mutates: false
      max_sensitivity: internal
      description: "list dunning via accountingd"
    - ref: tool://accountingd/list_overdue
      mutates: false
      max_sensitivity: internal
      description: "list overdue via accountingd"
    - ref: tool://accountingd/compute_bilanzielle_abgrenzung
      mutates: false
      max_sensitivity: internal
      description: "compute bilanzielle abgrenzung via accountingd"
    - ref: tool://accountingd/suggest_payment_match
      mutates: false
      max_sensitivity: internal
      description: "suggest payment match via accountingd"
