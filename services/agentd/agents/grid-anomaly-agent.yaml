# NB grid-assignment and contract gap detection. Flags MaLos whose marktd malo_grid record is missing or lacks a valid NB contract (Vertrag), which would block NB STP auto-decisions (processd check 5).
#
# Generated from the compiled specialist definition during the agentplane
# cutover. The tool grants reproduce the previous reach — every tool on each
# granted MCP server — so no capability was silently lost. What is new: each
# grant is named, `mutates` comes from the server's own read-only hint, and
# every mutating tool requires a human decision.
#
# Narrowing the read set per specialist is domain review, not mechanical work.
# Role: NB. Compiled only into a `role-nb` build (and the default all-roles build).
apiVersion: agentplane.hupe1980.github.io/v1alpha1
kind: Agent
metadata:
  name: grid-anomaly-agent
  version: "1.0.0"
spec:
  execution:
    kind: tool-calling
    max_turns: 10

  identity:
    role: >-
      NB grid-assignment and contract gap detection. Flags MaLos whose marktd
      malo_grid record is missing or lacks a valid NB contract (Vertrag), which
      would block NB STP auto-decisions (processd check 5).
    constraints: |
      You are the NB grid-assignment and contract specialist.

      ## TRIGGERED BY
      - `de.markt.nb-contract.updated` — NB contract changed
      - `de.markt.malo.updated` — MaLo master data changed

      ## PROCEDURE

      1. Extract `malo_id` from event payload.
      2. Call marktd `get_malo_grid` for the current NB assignment (nb_mp_id, Bilanzierungsgebiet).
      3. If no malo_grid record: MISSING — the NB-role grid PUT has not been provisioned for this MaLo.
      4. Check if marktd has a valid NB contract (Vertrag) for the NB MP-ID.
      5. Without a valid NB contract: NB STP processd `check_anmeldung` would fail check 5.

      ## OUTPUT FORMAT
      ```
      GRID_STATUS: [OK|MISSING]
      NB_MP_ID: [id or MISSING]
      CONTRACT_STATUS: [VALID|MISSING|EXPIRED]
      STP_IMPACT: [NONE|BLOCKING — processd check 5 would fail]
      CORRECTION: [specific action]
      ```

  capabilities:
    provides: [grid.anomaly]

  models:
    privileged:  { provider: anthropic, model: claude-sonnet-5 }

  security:
    max_sensitivity_egress: internal
    max_delegation_depth: 0
    max_sensitivity_journaled: internal

  oversight:
    approval:  tools-only
    approvers: [mako-operations]
    deadline:
      name: grid-anomaly-agent-freigabe
      kind: hours
      params: { n: 4 }
    on_expiry: deny

  budgets:
    max_tokens: 200000
    max_steps: 30
    max_effects: 50
    max_wallclock_secs: 900

  tools:
    - ref: tool://marktd/get_malo
      mutates: false
      max_sensitivity: confidential
      description: "get malo via marktd"
    - ref: tool://marktd/list_partners
      mutates: false
      max_sensitivity: confidential
      description: "list partners via marktd"
    - ref: tool://marktd/get_preisblatt
      mutates: false
      max_sensitivity: confidential
      description: "get preisblatt via marktd"
    - ref: tool://marktd/get_versorgungsstatus
      mutates: false
      max_sensitivity: confidential
      description: "get versorgungsstatus via marktd"
    - ref: tool://marktd/get_nb_contract
      mutates: false
      max_sensitivity: confidential
      description: "get nb contract via marktd"
    - ref: tool://marktd/get_correlation
      mutates: false
      max_sensitivity: confidential
      description: "get correlation via marktd"
    - ref: tool://marktd/list_pricat_versions
      mutates: false
      max_sensitivity: confidential
      description: "list pricat versions via marktd"
    - ref: tool://marktd/dispatch_pricat
      mutates: true
      max_sensitivity: confidential
      requires_approval: true
      description: "dispatch pricat via marktd"
    - ref: tool://marktd/list_malo
      mutates: false
      max_sensitivity: confidential
      description: "list malo via marktd"
    - ref: tool://marktd/get_melo
      mutates: false
      max_sensitivity: confidential
      description: "get melo via marktd"
    - ref: tool://marktd/get_rollenzuordnung
      mutates: false
      max_sensitivity: confidential
      description: "get rollenzuordnung via marktd"
    - ref: tool://marktd/get_versorgungsstatus_history
      mutates: false
      max_sensitivity: confidential
      description: "get versorgungsstatus history via marktd"
    - ref: tool://marktd/get_nb_energiemix
      mutates: false
      max_sensitivity: confidential
      description: "get nb energiemix via marktd"
    - ref: tool://marktd/get_technische_ressource
      mutates: false
      max_sensitivity: confidential
      description: "get technische ressource via marktd"
    - ref: tool://marktd/get_steuerbare_ressource
      mutates: false
      max_sensitivity: confidential
      description: "get steuerbare ressource via marktd"
    - ref: tool://marktd/get_partner
      mutates: false
      max_sensitivity: confidential
      description: "get partner via marktd"
    - ref: tool://marktd/get_melo_standorteigenschaften
      mutates: false
      max_sensitivity: confidential
      description: "get melo standorteigenschaften via marktd"
    - ref: tool://marktd/get_versorgung_at
      mutates: false
      max_sensitivity: confidential
      description: "get versorgung at via marktd"
    - ref: tool://obsd/get_process
      mutates: false
      max_sensitivity: internal
      description: "get process via obsd"
    - ref: tool://obsd/list_overdue_processes
      mutates: true
      max_sensitivity: internal
      requires_approval: true
      description: "list overdue processes via obsd"
    - ref: tool://obsd/get_kpi_report
      mutates: false
      max_sensitivity: internal
      description: "get kpi report via obsd"
    - ref: tool://obsd/get_parity_report
      mutates: false
      max_sensitivity: internal
      description: "get parity report via obsd"
    - ref: tool://obsd/get_stp_rate
