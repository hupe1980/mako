# Customer portal proactive notification orchestrator. Triggers invoice-ready notifications, EEG Förderung expiry alerts, Mahnung reminders, and Tarifwechsel confirmation messages.
#
# Generated from the compiled specialist definition during the agentplane
# cutover. The tool grants reproduce the previous reach — every tool on each
# granted MCP server — so no capability was silently lost. What is new: each
# grant is named, `mutates` comes from the server's own read-only hint, and
# every mutating tool requires a human decision.
#
# Narrowing the read set per specialist is domain review, not mechanical work.
# Role: LF. Compiled only into a `role-lf` build (and the default all-roles build).
apiVersion: agentplane.hupe1980.github.io/v1alpha1
kind: Agent
metadata:
  name: portald-agent
  version: "1.0.0"
spec:
  execution:
    kind: tool-calling
    max_turns: 8

  identity:
    role: >-
      Customer portal proactive notification orchestrator. Triggers invoice-ready
      notifications, EEG Förderung expiry alerts, Mahnung reminders, and
      Tarifwechsel confirmation messages.
    constraints: |
      You are the customer portal notification specialist.

      ## TRIGGERED BY
      - `de.billing.rechnung.erstellt` — new invoice → notify customer
      - `de.eeg.anlage.foerderung-auslaufend` — EEG expiry → notify plant operator
      - `de.accounting.mahnung.issued` — Mahnung → dunning notification
      - `de.vertrag.*` — contract lifecycle → keep the portal view current

      ## PROCEDURE

      1. Determine notification type from event.
      2. Call portald to check if customer has active portal session.
      3. Retrieve relevant data (invoice brutto_eur, EEG foerderendedatum, Mahnstufe).
      4. Compose notification summary for customer-facing display.
      5. Flag if notification requires operator approval before sending.

      ## OUTPUT FORMAT
      ```
      NOTIFICATION_TYPE: [INVOICE_READY|EEG_EXPIRY|DUNNING|TARIFF_CHANGE]
      CUSTOMER_PORTAL_ACTIVE: [YES|NO]
      NOTIFICATION_SAFE: [YES|NEEDS_REVIEW]
      SUMMARY: [customer-friendly one-liner]
      ```

  capabilities:
    provides: [portald]

  models:
    privileged:  { provider: anthropic, model: claude-sonnet-5 }

  security:
    max_sensitivity_egress: internal
    max_delegation_depth: 0
    max_sensitivity_journaled: internal

  oversight:
    approval:  tools-only
    approvers: [mako-operations]
    deadline:
      name: portald-agent-freigabe
      kind: hours
      params: { n: 4 }
    on_expiry: deny

  budgets:
    max_tokens: 200000
    max_steps: 24
    max_effects: 40
    max_wallclock_secs: 900

  tools:
    - ref: tool://portald/get_dashboard
      mutates: false
      max_sensitivity: confidential
      description: "get dashboard via portald"
    - ref: tool://portald/get_lastgang
      mutates: false
      max_sensitivity: confidential
      description: "get lastgang via portald"
    - ref: tool://portald/get_invoices
      mutates: false
      max_sensitivity: confidential
      description: "get invoices via portald"
