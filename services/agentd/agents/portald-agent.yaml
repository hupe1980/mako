# yaml-language-server: $schema=https://hupe1980.github.io/agentplane/agent.schema.json
# Customer portal proactive notification orchestrator. Triggers invoice-ready notifications, EEG Förderung expiry alerts, Mahnung reminders, and Tarifwechsel confirmation messages.
#
# Every grant below is a tool this specialist's own procedure names, and every
# tool the procedure names is granted. `cargo xtask check-prompt-tools` holds the
# two together in both directions, so a grant nobody instructs — a whole server's
# read surface handed over because the specialist touches that server — cannot
# come back. `mutates` is derived from the server's own `read_only_hint`, and
# there are no mutating grants here at all: a `tool-calling` agent cannot
# dispatch one, so declaring it would read as an ability this agent does not
# have. See the note above `budgets`.
# Role: LF. Compiled only into a `role-lf` build (and the default all-roles build).
apiVersion: agentplane.hupe1980.github.io/v1alpha1
kind: Agent
metadata:
  name: portald-agent
  version: "2.0.0"
spec:
  execution:
    kind: tool-calling
    max_turns: 8

  identity:
    role: >-
      Customer portal proactive notification orchestrator. Triggers invoice-ready
      notifications, EEG Förderung expiry alerts, Mahnung reminders, and
      Tarifwechsel confirmation messages.
    constraints: |
      You are the customer portal notification specialist.

      ## TRIGGERED BY
      - `de.billing.rechnung.erstellt` — new invoice → notify customer
      - `de.eeg.anlage.foerderung-auslaufend` — EEG expiry → notify plant operator
      - `de.accounting.mahnung.issued` — Mahnung → dunning notification
      - `de.vertrag.*` — contract lifecycle → keep the portal view current

      ## PROCEDURE

      1. Determine notification type from event.
      2. Call marktd `get_versorgungsstatus` — a notification for a MaLo this LF does
         not supply reaches no customer of its own, and that is worth saying rather
         than composing. `customer_portal_active` is YES only when marktd reports the
         MaLo supplied.
      3. Retrieve what the notification will quote, from the service that owns it:
         - invoice → billingd `list_billing_records` with the `malo_id` for the list
           the customer sees, and billingd `get_billing_record` for the total the
           notification quotes;
         - Mahnung → accountingd `get_balance` for the open amount and accountingd
           `list_dunning` for the stage;
         - EEG expiry → einsd `list_plants` with the `malo_id` for the customer's
           plants and einsd `get_plant` for the Förderende;
         - contract lifecycle → accountingd `get_vorauszahlung` for the Abschlag the
           portal shows after the change.
         Where two of these disagree — a record missing from the list, a balance the
         dunning stage does not explain — the notification is wrong whichever number
         it quotes: report the discrepancy instead.
      4. Compose notification summary for customer-facing display.
      5. Flag if notification requires operator approval before sending.

  # What this agent is in a multi-agent arrangement.
  #
  # MAST — the Multi-Agent System Failure Taxonomy of Cemri et al., „Why Do
  # Multi-Agent LLM Systems Fail?", arXiv:2503.13657 Fig. 4 (210 traces) —
  # measures inter-agent misalignment at 36.9 % of observed multi-agent
  # failures — a class that exists only if you choose it. Declaring the shape is
  # how you choose not to: `single` means one agent, one context, many tools, and
  # the inter-agent failure surface is structurally absent. `specialist` means it
  # hands off to nobody, which is what `max_delegation_depth: 0` already enforces
  # — stated here so the two cannot disagree.
  topology:
    mode: single
    role: specialist

  capabilities:
    provides: [portald]

  models:
    privileged:  { provider: anthropic, model: claude-sonnet-5 }

  security:
    max_sensitivity_egress: internal
    max_delegation_depth: 0
    max_sensitivity_journaled: internal

  # No `oversight` block, and no mutating tool grant: this specialist reads and
  # reports. Both absences are the same fact — a `tool-calling` agent cannot
  # dispatch a mutating call at all, because the arguments come from a model
  # completion, which agentplane labels untrusted by construction, and its taint
  # gate refuses a mutating sink with untrusted arguments. Declaring the grant
  # anyway would read as an ability this agent does not have.
  #

  budgets:
    max_tokens: 200000
    max_steps: 24
    max_effects: 40
    max_wallclock_secs: 900

  # The result contract. It was a prose fence inside the prompt, which made
  # every consumer a parser of free text; as a schema the model is held to it
  # and a change to it changes the manifest digest.
  output:
    schema:
      type: object
      additionalProperties: false
      required:
        - notification_type
        - customer_portal_active
        - notification_safe
        - summary
      properties:
        notification_type:
          type: string
          enum:
            - INVOICE_READY
            - EEG_EXPIRY
            - DUNNING
            - TARIFF_CHANGE
        customer_portal_active:
          type: string
          enum:
            - YES
            - NO
        notification_safe:
          type: string
          enum:
            - YES
            - NEEDS_REVIEW
        summary:
          type: [string, "null"]

  # Knowledge, granted rather than copied.
  #
  # mako's MCP servers publish step-by-step prompts for their own
  # procedures. A specialist names the one it needs; a hand-typed
  # paraphrase in `constraints` would be a second copy with nothing keeping the
  # two in agreement — the server's prompt changes with the code, a paraphrase
  # changes when somebody remembers. einsd's `check-foerderung-expiry` is what
  # the EEG expiry notification needs: when the event fires, and what moves the
  # effective end date away from the stored Förderende.
  #
  # A context grant is not a tool grant. Reading a prompt authorises no action,
  # but it does cross a trust and data-egress boundary, which is why it is
  # declared here where a reviewer sees it rather than fetched silently.
  context:
    prompts:
      - server: einsd
        name: check-foerderung-expiry
        max_input_sensitivity: internal
        output_sensitivity: internal

  tools:
    - ref: tool://marktd/get_versorgungsstatus
      mutates: false
      max_sensitivity: internal
      description: >-
        Whether this LF supplies the MaLo, and so whether there is a customer
        to notify.

    - ref: tool://billingd/list_billing_records
      mutates: false
      max_sensitivity: internal
      description: >-
        The invoice list the notification would point at.

    - ref: tool://billingd/get_billing_record
      mutates: false
      max_sensitivity: internal
      description: >-
        The invoice total the notification quotes.

    - ref: tool://accountingd/get_balance
      mutates: false
      max_sensitivity: internal
      description: >-
        The balance a Mahnung notification must agree with.

    - ref: tool://accountingd/list_dunning
      mutates: false
      max_sensitivity: internal
      description: >-
        The Mahnstufe the reminder is about.

    - ref: tool://accountingd/get_vorauszahlung
      mutates: false
      max_sensitivity: internal
      description: >-
        The Abschlag a contract-change confirmation quotes.

    - ref: tool://einsd/list_plants
      mutates: false
      max_sensitivity: internal
      description: >-
        The customer's plants behind an EEG Förderung expiry notification.

    - ref: tool://einsd/get_plant
      mutates: false
      max_sensitivity: internal
      description: >-
        The Förderende the EEG notification quotes.
