# BNetzA §20 EnWG annual Diskriminierungsbericht generator and quarterly KPI reporter. Aggregates process STP rates, APERAK response times, and parity metrics for regulatory submissions.
#
# Generated from the compiled specialist definition during the agentplane
# cutover. The tool grants reproduce the previous reach — every tool on each
# granted MCP server — so no capability was silently lost. What is new: each
# grant is named, `mutates` comes from the server's own read-only hint, and
# every mutating tool requires a human decision.
#
# Narrowing the read set per specialist is domain review, not mechanical work.
# Cross-cutting: present in every role-scoped build.
apiVersion: agentplane.hupe1980.github.io/v1alpha1
kind: Agent
metadata:
  name: regulatory-reporting-agent
  version: "1.0.0"
spec:
  execution:
    kind: tool-calling
    max_turns: 15

  identity:
    role: >-
      BNetzA §20 EnWG annual Diskriminierungsbericht generator and quarterly KPI
      reporter. Aggregates process STP rates, APERAK response times, and parity
      metrics for regulatory submissions.
    constraints: |
      You are the regulatory reporting specialist.

      ## TRIGGERED BY
      - Manual / scheduled — quarterly or annual reporting cycles

      ## PROCEDURE

      1. Call obsd `get_bnetza_report` for BNetzA Diskriminierungsbericht data.
      2. Call obsd `get_kpi_report` for current KPI metrics.
      3. Call obsd `get_parity_report` for market-role parity comparison.
      4. Validate: STP rate ≥ 95% (§20 EnWG target).
      5. Identify any periods where parity deviation > 5% (reportable to BNetzA).
      6. Structure report for operator review and submission.

      ## OUTPUT FORMAT
      ```
      REPORT_PERIOD: [YYYY-QN or YYYY-ANNUAL]
      STP_RATE_PCT: [number]
      PARITY_MAX_DEVIATION_PCT: [number]
      BNETZA_SUBMISSION_REQUIRED: [YES|NO]
      KPI_SUMMARY: [key metrics]
      ```

  capabilities:
    provides: [regulatory.reporting]

  models:
    privileged:  { provider: anthropic, model: claude-sonnet-5 }

  security:
    max_sensitivity_egress: internal
    max_delegation_depth: 0
    max_sensitivity_journaled: internal

  oversight:
    approval:  tools-only
    approvers: [mako-operations]
    deadline:
      name: regulatory-reporting-agent-freigabe
      kind: hours
      params: { n: 4 }
    on_expiry: deny

  budgets:
    max_tokens: 200000
    max_steps: 45
    max_effects: 75
    max_wallclock_secs: 900

  tools:
    - ref: tool://obsd/get_process
      mutates: false
      max_sensitivity: internal
      description: "get process via obsd"
    - ref: tool://obsd/list_overdue_processes
      mutates: true
      max_sensitivity: internal
      requires_approval: true
      description: "list overdue processes via obsd"
    - ref: tool://obsd/get_kpi_report
      mutates: false
      max_sensitivity: internal
      description: "get kpi report via obsd"
    - ref: tool://obsd/get_parity_report
      mutates: false
      max_sensitivity: internal
      description: "get parity report via obsd"
    - ref: tool://obsd/get_stp_rate
      mutates: false
      max_sensitivity: internal
      description: "get stp rate via obsd"
    - ref: tool://obsd/list_processes_by_family
      mutates: false
      max_sensitivity: internal
      description: "list processes by family via obsd"
    - ref: tool://processd/list_decisions
      mutates: true
      max_sensitivity: internal
      requires_approval: true
      description: "list decisions via processd"
    - ref: tool://processd/get_decision
      mutates: true
      max_sensitivity: internal
      requires_approval: true
      description: "get decision via processd"
    - ref: tool://processd/get_stp_breakdown_by_erc
      mutates: true
      max_sensitivity: internal
