# yaml-language-server: $schema=https://hupe1980.github.io/agentplane/agent.schema.json
# MSCONS meter data quality and § 60 Abs. 2 MsbG substitute value analysis. Detects missing intervals, validates Hampel quality grades, and recommends Ersatzwertbildung methods.
#
# Every grant below is a tool this specialist's own procedure names, and every
# tool the procedure names is granted. `cargo xtask check-prompt-tools` holds the
# two together in both directions, so a grant nobody instructs — a whole server's
# read surface handed over because the specialist touches that server — cannot
# come back. `mutates` is derived from the server's own `read_only_hint`, and
# there are no mutating grants here at all: a `tool-calling` agent cannot
# dispatch one, so declaring it would read as an ability this agent does not
# have. See the note above `budgets`.
# Role: MSB. Compiled only into a `role-msb` build (and the default all-roles build).
apiVersion: agentplane.hupe1980.github.io/v1alpha1
kind: Agent
metadata:
  name: meter-data-agent
  version: "2.0.0"
spec:
  execution:
    kind: tool-calling
    max_turns: 12

  identity:
    role: >-
      MSCONS meter data quality and § 60 Abs. 2 MsbG substitute value analysis.
      Detects missing intervals, validates Hampel quality grades, and recommends
      Ersatzwertbildung methods.
    constraints: |
      You are the energy data management and meter quality specialist.

      ## TRIGGERED BY
      - `de.messwert.reading.quality.warning` — Hampel/V01-V10 quality flag
      - `de.mako.process.completed` — process that may require meter data

      ## PROCEDURE

      1. Extract `malo_id` from event payload.
      2. Call edmd `get_quality_assessments` for current quality grades (A/B/C/F).
      3. For F-grade intervals: call edmd `get_timeseries` to identify gap extent.
      4. Say which of edmd's four substitution methods the gap admits.
         § 60 Abs. 2 MsbG makes the Ersatzwertbildung the MSB's duty and names no
         method, so the choice is edmd's implementation and mako's operating
         default, never a statutory one:
         - bracketed by real readings and inside a day → `LinearInterpolation`;
         - otherwise → `PriorPeriodAverage`, edmd's default, over a 7-day
           reference window it will not look past;
         - `ZeroFill` only where the absence of consumption is established;
         - `LastValueCarryForward` only for a register that cannot decrease.
         There is no load-profile method — recommending one names something edmd
         cannot do. Deciding and applying is replacement-value-agent's and
         edmd's; this specialist reports the gap and what it admits.
      5. Call edmd `get_billing_period` — a gap inside a period about to be billed is
         urgent, and one in a period already settled is a correction, not an alert.

  # What this agent is in a multi-agent arrangement.
  #
  # MAST measures inter-agent misalignment at 36.9 % of observed multi-agent
  # failures — a class that exists only if you choose it. Declaring the shape is
  # how you choose not to: `single` means one agent, one context, many tools, and
  # the inter-agent failure surface is structurally absent. `specialist` means it
  # hands off to nobody, which is what `max_delegation_depth: 0` already enforces
  # — stated here so the two cannot disagree.
  topology:
    mode: single
    role: specialist

  capabilities:
    provides: [meter.data]

  models:
    privileged:  { provider: anthropic, model: claude-sonnet-5 }
    # Reads the agent's own answer during memory formation — model output, and
    # therefore untrusted. A model that cannot call a tool is what should read it.
    quarantined: { provider: anthropic, model: claude-haiku-4-5 }

  # Memory, bound to the party this run is about.
  #
  # `subject` is a **binding**, not a literal: `$correlation/malo` resolves to
  # the Marktlokation this run was correlated on, so one declaration serves every
  # customer without pooling their facts under one key.
  #
  # That distinction is not stylistic. A subject is the unit
  # `MemoryStore::forget_subject` erases, so a literal subject here would mean
  # one customer's history recalled into another customer's run, and a GDPR
  # Art. 17 erasure naming one person unsatisfiable without destroying
  # everybody's. Until agentplane 0.15 the declarative tier could only write a
  # literal, which is why 26 specialists shipped with no memory at all.
  #
  # A binding that cannot resolve fails the run rather than falling back to a
  # default — a memory filed under the wrong scope is worse than none.
  #
  # Formation reads the agent's own answer, which is model output and therefore
  # untrusted, so it runs on the **quarantined** model.
  # 0.19 moved formation under `memory`, beside a `recall` channel this
  # plane does not use: recall order is a ranking signal any writer can
  # influence, and adopting it is a decision somebody makes deliberately.
  memory:
    formation:
      subject: "$correlation/malo"
      purpose: >-
        the data-quality history for this Marktlokation, so a meter that gaps every month is recognised as chronic rather than reported as new
      instruction: >-
        Record at most three durable facts about THIS Marktlokation's meter-data quality: the gap hours seen, the quality grade, and the substitution method applied. Record nothing about any other party.
      max_items: 3
      # Two years: long enough for a year-on-year pattern, short enough that a
      # fact nobody has revisited expires instead of hardening into a standing
      # instruction about a customer.
      retention_seconds: 63113904
      max_sensitivity: internal

  security:
    max_sensitivity_egress: internal
    max_delegation_depth: 0
    max_sensitivity_journaled: internal

  # No mutating tool grant, and no approval: this specialist reads and reports.
  # Both absences are the same fact — a `tool-calling` agent cannot dispatch a
  # mutating call at all, because the arguments come from a model completion,
  # which agentplane labels untrusted by construction, and its taint gate refuses
  # a mutating sink with untrusted arguments. Declaring the grant anyway would
  # read as an ability this agent does not have.
  #
  # It does declare `oversight`, for **triage** — a row beside a finished answer
  # rather than a gate in front of a call. That is the only mode that fits an
  # agent which cannot act: gating its answer would gate nothing while suspending
  # a run per finding.
  #

  # Human-in-the-loop, beside the answer rather than in front of it.
  #
  # `approval: none` — this specialist cannot act, so there is nothing to gate.
  # A `tool-calling` agent's arguments come from a model completion, which the
  # taint gate refuses at a mutating sink; it reads and reports. `tools-only`
  # would therefore gate nothing, and `required` would suspend a run per finding
  # and cost a case row until somebody clears it.
  #
  # `triage` is the third mode agentplane 0.15 added for exactly this: the run
  # completes and returns, and a matching answer *also* opens a worklist row.
  # Reporting, not control flow — which is why a triage rule may carry a
  # predicate where `approval` deliberately may not.
  #
  # Every `path` below is typed against this agent's own `output.schema` at parse
  # time, so a rule that could never fire is refused rather than reading in
  # review exactly like one that does. That check only became possible once the
  # answers were schemas instead of prose.
  oversight:
    approval: none
    # `approval: none` means nothing waits, so this bounds no wait — the field
    # is required and states the same window the rule below uses. One figure
    # written twice is cheaper than one field meaning two things.
    deadline:
      name: meter-data-gap-review
      kind: working-days
      params: { n: 2 }
    # A triage row *is* the finding, so an unanswered one widens rather than
    # closes: `deny` would take it out of the worklist and delete the delivery
    # of a breach that was correctly detected. (gabi-gas-agent's dispatching
    # approval stays `deny` for the opposite reason — it gates, so it must fail
    # closed.)
    on_expiry: escalate
    escalate_to: [mako-operations]
    triage:
      - name: meter-data-gap
        audience: [metering]
        priority: high
        summary: >-
          Metering data is missing for a billing period. §60 Abs. 2 MsbG substitution needs an operator decision before the Rechnung is built.
        when:
          - path: /data_status
            equals: "MISSING"
        deadline:
          name: meter-data-gap-review
          kind: working-days
          params: { n: 2 }

  budgets:
    max_tokens: 200000
    max_steps: 36
    max_effects: 60
    max_wallclock_secs: 900

  # The result contract. It was a prose fence inside the prompt, which made
  # every consumer a parser of free text; as a schema the model is held to it
  # and a change to it changes the manifest digest.
  output:
    schema:
      type: object
      additionalProperties: false
      required:
        - data_status
        - quality_grade
        - gap_hours
      properties:
        data_status:
          type: string
          enum:
            - COMPLETE
            - PARTIAL
            - MISSING
        quality_grade:
          type: string
          enum:
            - A
            - B
            - C
            - F
        gap_hours:
          type: number
        affected_billing_period:
          type: string
          enum:
            - YES
            - NO
        recommended_substitution:
          type: string

  # Knowledge, granted rather than copied.
  #
  # mako's MCP servers publish 57 step-by-step prompts across 15 servers for
  # their own procedures. A specialist names the one it needs; a hand-typed
  # paraphrase in `constraints` would be a second copy with nothing keeping the
  # two in agreement — the server's prompt changes with the code, a paraphrase
  # changes when somebody remembers.
  #
  # A context grant is not a tool grant. Reading a prompt authorises no action,
  # but it does cross a trust and data-egress boundary, which is why it is
  # declared here where a reviewer sees it rather than fetched silently.
  context:
    prompts:
      - server: edmd
        name: quality-assessment
        max_input_sensitivity: internal
        output_sensitivity: internal
      - server: edmd
        name: analyze-consumption
        max_input_sensitivity: internal
        output_sensitivity: internal

  tools:
    - ref: tool://edmd/get_quality_assessments
      mutates: false
      max_sensitivity: internal
      description: >-
        The A/B/C/F quality grades for the period.

    - ref: tool://edmd/get_timeseries
      mutates: false
      max_sensitivity: internal
      description: >-
        The intervals themselves, to measure how wide an F-grade gap is.

    - ref: tool://edmd/get_billing_period
      mutates: false
      max_sensitivity: internal
      description: >-
        Whether the gap falls inside a period that is about to be billed.
