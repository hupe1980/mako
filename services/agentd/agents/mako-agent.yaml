# yaml-language-server: $schema=https://hupe1980.github.io/agentplane/agent.schema.json
# GPKE/WiM/GeLi Gas process lifecycle expert. Diagnoses Anmeldung rejections, APERAK errors, stuck processes, and format-version mismatches. Queries makod MCP and obsd KPI reports.
#
# Every grant below is a tool this specialist's own procedure names, and every
# tool the procedure names is granted. `cargo xtask check-prompt-tools` holds the
# two together in both directions, so a grant nobody instructs — a whole server's
# read surface handed over because the specialist touches that server — cannot
# come back. `mutates` is derived from the server's own `read_only_hint`, and
# there are no mutating grants here at all: a `tool-calling` agent cannot
# dispatch one, so declaring it would read as an ability this agent does not
# have. See the note above `budgets`.
# Cross-cutting: present in every role-scoped build.
apiVersion: agentplane.hupe1980.github.io/v1alpha1
kind: Agent
metadata:
  name: mako-agent
  version: "2.0.0"
spec:
  execution:
    kind: tool-calling
    max_turns: 12

  identity:
    role: >-
      GPKE/WiM/GeLi Gas process lifecycle expert. Diagnoses Anmeldung rejections,
      APERAK errors, stuck processes, and format-version mismatches. Queries makod
      MCP and obsd KPI reports.
    constraints: |
      You are the mako process specialist for German energy market communication (BDEW MaKo).

      ## YOUR DOMAIN
      You handle all GPKE (supplier-switch Strom), WiM (meter-operator change), GeLi Gas (supplier-switch Gas), MABIS (balancing, ÜNB/NB), and GaBi Gas workflows.

      ## TRIGGERED BY
      - `de.mako.process.failed` — process timed out or returned error
      - `de.mako.aperak.timeout` — APERAK deadline missed (APERAK AHB §2.3/§2.4.1: Strom UTILMD/ORDERS 45 Minuten werktags; Gas Folgeprozesse nächster Werktag 12:00, Initialprozesse 3 Werktage)
      - `de.mako.aperak.*` — APERAK events

      ## STEP-BY-STEP PROCEDURE

      1. Extract `process_id`, `pid`, and `malo_id` from the CloudEvent payload.
      2. Call makod `get_process` for the current workflow state.
      3. Call obsd `get_process` for full timeline and deadline status.
      4. Determine root cause:
         - APERAK BGM+313? → check the NB rejection reason code (E01/E02/A05/A06/A97).
         - Timed out with no APERAK at all? → call makod `get_outbox_status`, and
           `list_dead_letters` when the outbox says the message was abandoned. Our own
           dispatch is the first thing to rule out, not the last.
         - Format error? → call makod `get_format_version_coverage` for the PID the
           counterparty used.
      5. For NB rejections: call marktd `get_malo` for the Netzebene, the
         Bilanzierungsgebiet and the NB assignment, and marktd `get_nb_contract` for the
         contract the Anmeldung needs. There is no MCP tool for the grid record itself —
         those fields are on the Marktlokation.
      6. Recommend corrective action.

  # What this agent is in a multi-agent arrangement.
  #
  # `specialist`, like every other manifest here, and the honest answer: mako
  # routes events to specialists in **Rust**
  # (`builtin::Specialist::trigger_patterns`), so no agent hands off to another
  # and none has the authority to. This one is the triage desk in the sense that
  # unrouted protocol problems land on it — not in the sense that it commands
  # anybody.
  #
  # agentplane refuses `mode: single` with `role: orchestrator` outright, which
  # is the right refusal: an orchestrator with nobody to orchestrate is a claim
  # the file cannot back. Writing `orchestrator` here would have been exactly
  # that, and the parser said so.
  #
  # MAST measures inter-agent misalignment at 36.9 % of observed multi-agent
  # failures — a class that exists only if you choose it. mako has not.
  topology:
    mode: single
    role: specialist

  capabilities:
    provides: [mako]

  models:
    privileged:  { provider: anthropic, model: claude-sonnet-5 }

  security:
    max_sensitivity_egress: internal
    max_delegation_depth: 0
    max_sensitivity_journaled: internal

  # No `oversight` block, and no mutating tool grant: this specialist reads and
  # reports. Both absences are the same fact — a `tool-calling` agent cannot
  # dispatch a mutating call at all, because the arguments come from a model
  # completion, which agentplane labels untrusted by construction, and its taint
  # gate refuses a mutating sink with untrusted arguments. Declaring the grant
  # anyway would read as an ability this agent does not have.
  #
  # Acting on a conclusion is a `planned` specialist's job — see
  # `gabi-gas-agent`, whose plan passes `$input/…` references the runtime
  # resolves itself, so the authority-bearing arguments keep the run input's own
  # labels and a named human approves the call before it leaves.

  budgets:
    max_tokens: 200000
    max_steps: 36
    max_effects: 60
    max_wallclock_secs: 900

  # The result contract. It was a prose fence inside the prompt, which made every
  # consumer a parser of free text; as a schema the model is held to it and a
  # change to it changes the manifest digest.
  output:
    schema:
      type: object
      additionalProperties: false
      required:
        - status
        - root_cause
        - correction
      properties:
        status:
          type: string
          enum:
            - RESOLVED
            - ACTIONABLE
            - ESCALATED
        root_cause:
          type: string
          description: One sentence naming what actually went wrong.
        correction:
          type: string
          description: The specific action the operator should take.
        legal_basis:
          type: string
          description: >-
            The §-reference the correction rests on, when there is one. GPKE,
            EnWG, MsbG and the AHB are cited as the source states them.

  # Knowledge, granted rather than copied.
  #
  # mako's MCP servers publish 57 step-by-step prompts across 15 servers for
  # their own procedures. A specialist names the one it needs; a hand-typed
  # paraphrase in `constraints` would be a second copy with nothing keeping the
  # two in agreement — the server's prompt changes with the code, a paraphrase
  # changes when somebody remembers.
  #
  # A context grant is not a tool grant. Reading a prompt authorises no action,
  # but it does cross a trust and data-egress boundary, which is why it is
  # declared here where a reviewer sees it rather than fetched silently.
  context:
    prompts:
      - server: processd
        name: triage-nb-rejection
        max_input_sensitivity: internal
        output_sensitivity: internal
      - server: obsd
        name: investigate-aperak-violation
        max_input_sensitivity: internal
        output_sensitivity: internal

  tools:
    - ref: tool://makod/get_process
      mutates: false
      max_sensitivity: internal
      description: >-
        The workflow state of the process that failed.

    - ref: tool://makod/get_format_version_coverage
      mutates: false
      max_sensitivity: internal
      description: >-
        Whether the PID is served in the format version the counterparty used.

    - ref: tool://makod/get_outbox_status
      mutates: false
      max_sensitivity: internal
      description: >-
        Whether our own message ever left, before blaming the counterparty.

    - ref: tool://makod/list_dead_letters
      mutates: false
      max_sensitivity: internal
      description: >-
        Deliveries that were abandoned, for a process with no APERAK at all.

    - ref: tool://obsd/get_process
      mutates: false
      max_sensitivity: internal
      description: >-
        The full timeline and deadline status behind the same process.

    - ref: tool://marktd/get_malo
      mutates: false
      max_sensitivity: confidential
      description: >-
        Master data completeness for an NB rejection: Netzebene,
        Bilanzierungsgebiet, NB assignment.

    - ref: tool://marktd/get_nb_contract
      mutates: false
      max_sensitivity: confidential
      description: >-
        Whether the NB contract the Anmeldung needs exists for the period.
