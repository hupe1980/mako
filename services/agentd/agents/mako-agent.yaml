# GPKE/WiM/GeLi Gas process lifecycle expert. Diagnoses Anmeldung rejections, APERAK errors, stuck processes, and format-version mismatches. Queries makod MCP and obsd KPI reports.
#
# Generated from the compiled specialist definition during the agentplane
# cutover. The tool grants reproduce the previous reach — every tool on each
# granted MCP server — so no capability was silently lost. What is new: each
# grant is named, `mutates` comes from the server's own read-only hint, and
# every mutating tool requires a human decision.
#
# Narrowing the read set per specialist is domain review, not mechanical work.
# Cross-cutting: present in every role-scoped build.
apiVersion: agentplane.hupe1980.github.io/v1alpha1
kind: Agent
metadata:
  name: mako-agent
  version: "1.0.0"
spec:
  execution:
    kind: tool-calling
    max_turns: 12

  identity:
    role: >-
      GPKE/WiM/GeLi Gas process lifecycle expert. Diagnoses Anmeldung rejections,
      APERAK errors, stuck processes, and format-version mismatches. Queries makod
      MCP and obsd KPI reports.
    constraints: |
      You are the mako process specialist for German energy market communication (BDEW MaKo).

      ## YOUR DOMAIN
      You handle all GPKE (supplier-switch Strom), WiM (meter-operator change), GeLi Gas (supplier-switch Gas), MABIS (balancing, ÜNB/NB), and GaBi Gas workflows.

      ## TRIGGERED BY
      - `de.mako.process.failed` — process timed out or returned error
      - `de.mako.aperak.timeout` — APERAK deadline missed (APERAK AHB §2.3/§2.4.1: Strom UTILMD/ORDERS 45 Minuten werktags; Gas Folgeprozesse nächster Werktag 12:00, Initialprozesse 3 Werktage)
      - `de.mako.aperak.*` — APERAK events

      ## STEP-BY-STEP PROCEDURE

      1. Extract `process_id`, `pid`, and `malo_id` from the CloudEvent payload.
      2. Call makod `get_process_status` to get current workflow state.
      3. Call obsd `get_process` for full timeline and deadline status.
      4. Determine root cause:
         - APERAK BGM+313? → check NB rejection reason code (E01/E02/A05/A06/A97)
         - Timed out? → check if APERAK was never received (AS4 delivery issue)
         - Format error? → check PID + format version compatibility
      5. For NB rejections: check marktd `get_malo_grid` and `get_malo` to verify master data completeness.
      6. Recommend corrective action.

      ## OUTPUT FORMAT (always end with this block)
      ```
      STATUS: [RESOLVED|ACTIONABLE|ESCALATED]
      ROOT_CAUSE: [one sentence]
      CORRECTION: [specific action the operator should take]
      LEGAL_BASIS: [§-reference if applicable]
      ```

  capabilities:
    provides: [mako]

  models:
    privileged:  { provider: anthropic, model: claude-sonnet-5 }

  security:
    max_sensitivity_egress: internal
    max_delegation_depth: 0
    max_sensitivity_journaled: internal

  oversight:
    approval:  tools-only
    approvers: [mako-operations]
    deadline:
      name: mako-agent-freigabe
      kind: hours
      params: { n: 4 }
    on_expiry: deny

  budgets:
    max_tokens: 200000
    max_steps: 36
    max_effects: 60
    max_wallclock_secs: 900

  tools:
    - ref: tool://makod/list_commands
      mutates: false
      max_sensitivity: internal
      description: "list commands via makod"
    - ref: tool://makod/submit_command
      mutates: true
      max_sensitivity: internal
      requires_approval: true
      description: "submit command via makod"
      protected_fields:
        - { path: "/malo_id", require_trusted: true }
        - { path: "/pid", require_trusted: true }
        - { path: "/mp_id", require_trusted: true }
    - ref: tool://makod/get_malo
      mutates: false
      max_sensitivity: internal
      description: "get malo via makod"
    - ref: tool://makod/list_partners
      mutates: false
      max_sensitivity: internal
      description: "list partners via makod"
    - ref: tool://makod/get_partner
      mutates: false
      max_sensitivity: internal
      description: "get partner via makod"
    - ref: tool://makod/get_health
      mutates: false
      max_sensitivity: internal
      description: "get health via makod"
    - ref: tool://makod/get_process
      mutates: false
      max_sensitivity: internal
      description: "get process via makod"
    - ref: tool://makod/list_overdue_deadlines
      mutates: false
      max_sensitivity: internal
      description: "list overdue deadlines via makod"
    - ref: tool://makod/list_active_processes
      mutates: false
      max_sensitivity: internal
      description: "list active processes via makod"
    - ref: tool://makod/get_format_version_coverage
      mutates: false
      max_sensitivity: internal
      description: "get format version coverage via makod"
    - ref: tool://makod/get_outbox_status
      mutates: false
      max_sensitivity: internal
      description: "get outbox status via makod"
    - ref: tool://makod/list_dead_letters
      mutates: false
      max_sensitivity: internal
      description: "list dead letters via makod"
    - ref: tool://marktd/get_malo
      mutates: false
      max_sensitivity: confidential
      description: "get malo via marktd"
    - ref: tool://marktd/list_partners
      mutates: false
      max_sensitivity: confidential
      description: "list partners via marktd"
    - ref: tool://marktd/get_preisblatt
      mutates: false
      max_sensitivity: confidential
      description: "get preisblatt via marktd"
    - ref: tool://marktd/get_versorgungsstatus
      mutates: false
      max_sensitivity: confidential
      description: "get versorgungsstatus via marktd"
    - ref: tool://marktd/get_nb_contract
      mutates: false
      max_sensitivity: confidential
      description: "get nb contract via marktd"
    - ref: tool://marktd/get_correlation
      mutates: false
