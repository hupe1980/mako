    - ref: tool://marktd/get_nb_energiemix
      mutates: false
      max_sensitivity: confidential
      description: "get nb energiemix via marktd"
    - ref: tool://marktd/get_technische_ressource
      mutates: false
      max_sensitivity: confidential
      description: "get technische ressource via marktd"
    - ref: tool://marktd/get_steuerbare_ressource
