# yaml-language-server: $schema=https://hupe1980.github.io/agentplane/agent.schema.json
# WiM Strom MSB-change history and INSRPT reading-order lifecycle. Detects stuck reading orders, quality issues after MSB transitions, and iMSys rollout progress per §31 MsbG.
#
# Every grant below is a tool this specialist's own procedure names, and every
# tool the procedure names is granted. `cargo xtask check-prompt-tools` holds the
# two together in both directions, so a grant nobody instructs — a whole server's
# read surface handed over because the specialist touches that server — cannot
# come back. `mutates` is derived from the server's own `read_only_hint`, and
# there are no mutating grants here at all: a `tool-calling` agent cannot
# dispatch one, so declaring it would read as an ability this agent does not
# have. See the note above `budgets`.
# Role: MSB. Compiled only into a `role-msb` build (and the default all-roles build).
apiVersion: agentplane.hupe1980.github.io/v1alpha1
kind: Agent
metadata:
  name: msb-history-agent
  version: "2.0.0"
spec:
  execution:
    kind: tool-calling
    max_turns: 12

  identity:
    role: >-
      WiM Strom MSB-change history and INSRPT reading-order lifecycle. Detects
      stuck reading orders, quality issues after MSB transitions, and iMSys
      rollout progress per §31 MsbG.
    constraints: |
      You are the MSB history and WiM Strom specialist.

      ## TRIGGERED BY
      - `de.messwert.reading.quality.warning` — quality flag on new meter readings
      - `de.messwert.reading.direct.stored` — iMSys push (verify against expected MSB)
      - `de.mako.process.completed` — WiM MSB-change completed
      - `de.messwert.reading.order.failed` — an INSRPT reading order failed
      - `de.messwert.reading.delivery.overdue` — a reading delivery is past its window

      ## PROCEDURE

      1. Call edmd `get_device_history` for the MaLo — identify current MSB.
      2. Cross-check against marktd `get_malo` for the MSB assignment of record, and
         marktd `get_melo` for the Messlokation the device sits on. A history that
         disagrees with the registry is the finding, whichever side is wrong.
      3. For quality warnings: call edmd `get_quality_warnings` and check whether the
         warning coincides with a recent MSB change — transition reading errors are
         expected and are not a fault of the new MSB.
      4. Report stuck INSRPT reading orders: call edmd `list_reading_orders` for the
         MaLo's orders and `list_overdue_reading_orders` for the ones past their
         window. On `de.messwert.reading.order.failed` or
         `de.messwert.reading.delivery.overdue` the failing order is the subject of
         the run rather than a detail of it: say which order, whose obligation it
         is, and whether the MaLo changed MSB inside the window — a delivery that
         went late across a transition is the outgoing MSB's, and one that went
         late after it is the incoming MSB's.
      5. Gateway health after an iMSys push is smgw-diagnostics-agent's subject, not
         this one's — say so rather than guessing at a session this agent cannot read.

  # What this agent is in a multi-agent arrangement.
  #
  # MAST measures inter-agent misalignment at 36.9 % of observed multi-agent
  # failures — a class that exists only if you choose it. Declaring the shape is
  # how you choose not to: `single` means one agent, one context, many tools, and
  # the inter-agent failure surface is structurally absent. `specialist` means it
  # hands off to nobody, which is what `max_delegation_depth: 0` already enforces
  # — stated here so the two cannot disagree.
  topology:
    mode: single
    role: specialist

  capabilities:
    provides: [msb.history]

  models:
    privileged:  { provider: anthropic, model: claude-sonnet-5 }
    # Reads the agent's own answer during memory formation — model output, and
    # therefore untrusted. A model that cannot call a tool is what should read it.
    quarantined: { provider: anthropic, model: claude-haiku-4-5 }

  # Memory, bound to the party this run is about.
  #
  # `subject` is a **binding**, not a literal: `$correlation/malo` resolves to
  # the Marktlokation this run was correlated on, so one declaration serves every
  # customer without pooling their facts under one key.
  #
  # That distinction is not stylistic. A subject is the unit
  # `MemoryStore::forget_subject` erases, so a literal subject here would mean
  # one customer's history recalled into another customer's run, and a GDPR
  # Art. 17 erasure naming one person unsatisfiable without destroying
  # everybody's. Until agentplane 0.15 the declarative tier could only write a
  # literal, which is why 26 specialists shipped with no memory at all.
  #
  # A binding that cannot resolve fails the run rather than falling back to a
  # default — a memory filed under the wrong scope is worse than none.
  #
  # Formation reads the agent's own answer, which is model output and therefore
  # untrusted, so it runs on the **quarantined** model.
  # 0.19 moved formation under `memory`, beside a `recall` channel this
  # plane does not use: recall order is a ranking signal any writer can
  # influence, and adopting it is a decision somebody makes deliberately.
  memory:
    formation:
      subject: "$correlation/malo"
      purpose: >-
        the MSB transition history for this Marktlokation, which is by definition a sequence and unreadable one run at a time
      instruction: >-
        Record at most three durable facts about THIS Marktlokation's metering-operator history: the MSB MP-ID, the transition date, and whether an iMSys is active. Record nothing about any other party.
      max_items: 3
      # Two years: long enough for a year-on-year pattern, short enough that a
      # fact nobody has revisited expires instead of hardening into a standing
      # instruction about a customer.
      retention_seconds: 63113904
      max_sensitivity: internal

  security:
    max_sensitivity_egress: internal
    max_delegation_depth: 0
    max_sensitivity_journaled: internal

  # No `oversight` block, and no mutating tool grant: this specialist reads and
  # reports. Both absences are the same fact — a `tool-calling` agent cannot
  # dispatch a mutating call at all, because the arguments come from a model
  # completion, which agentplane labels untrusted by construction, and its taint
  # gate refuses a mutating sink with untrusted arguments. Declaring the grant
  # anyway would read as an ability this agent does not have.
  #
  # Acting on a conclusion is a `planned` specialist's job — see
  # `gabi-gas-agent`, whose plan passes `$input/…` references the runtime
  # resolves itself, so the authority-bearing arguments keep the run input's own
  # labels and a named human approves the call before it leaves.

  budgets:
    max_tokens: 200000
    max_steps: 36
    max_effects: 60
    max_wallclock_secs: 900

  # The result contract. It was a prose fence inside the prompt, which made
  # every consumer a parser of free text; as a schema the model is held to it
  # and a change to it changes the manifest digest.
  output:
    schema:
      type: object
      additionalProperties: false
      required:
        - msb_status
        - current_msb
        - last_transition_date
      properties:
        msb_status:
          type: string
          enum:
            - CONSISTENT
            - TRANSITION
            - CONFLICT
            - IMSYS_ACTIVE
        current_msb:
          type: string
        last_transition_date:
          type: string
        quality_issues:
          type: array
          items:
            type: string

  # Knowledge, granted rather than copied.
  #
  # mako's MCP servers publish 57 step-by-step prompts across 15 servers for
  # their own procedures. A specialist names the one it needs; a hand-typed
  # paraphrase in `constraints` would be a second copy with nothing keeping the
  # two in agreement — the server's prompt changes with the code, a paraphrase
  # changes when somebody remembers.
  #
  # A context grant is not a tool grant. Reading a prompt authorises no action,
  # but it does cross a trust and data-egress boundary, which is why it is
  # declared here where a reviewer sees it rather than fetched silently.
  context:
    prompts:
      - server: processd
        name: triage-msb-wechsel
        max_input_sensitivity: internal
        output_sensitivity: internal

  tools:
    - ref: tool://edmd/get_device_history
      mutates: false
      max_sensitivity: internal
      description: >-
        The MaLo's device and MSB timeline.

    - ref: tool://edmd/get_quality_warnings
      mutates: false
      max_sensitivity: internal
      description: >-
        Reading anomalies, to test whether they coincide with an MSB change.

    - ref: tool://edmd/list_reading_orders
      mutates: false
      max_sensitivity: internal
      description: >-
        INSRPT reading orders and their state.

    - ref: tool://edmd/list_overdue_reading_orders
      mutates: false
      max_sensitivity: internal
      description: >-
        Reading orders past their window — the stuck ones.

    - ref: tool://marktd/get_malo
      mutates: false
      max_sensitivity: confidential
      description: >-
        The MSB assignment of record, to compare against edmd's history.

    - ref: tool://marktd/get_melo
      mutates: false
      max_sensitivity: confidential
      description: >-
        The Messlokation the device sits on.
