      mutates: false
      max_sensitivity: internal
      description: "get correction history via edmd"
    - ref: tool://edmd/validate_timeseries
      mutates: false
      max_sensitivity: internal
      description: "validate timeseries via edmd"
    - ref: tool://edmd/get_quality_assessments
      mutates: false
      max_sensitivity: internal
      description: "get quality assessments via edmd"
    - ref: tool://edmd/get_summenzeitreihe
      mutates: false
      max_sensitivity: internal
      description: "get summenzeitreihe via edmd"
    - ref: tool://edmd/get_annual_forecast
      mutates: false
      max_sensitivity: internal
      description: "get annual forecast via edmd"
    - ref: tool://edmd/get_gas_quality
      mutates: false
      max_sensitivity: internal
