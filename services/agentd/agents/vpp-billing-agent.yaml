# yaml-language-server: $schema=https://hupe1980.github.io/agentplane/agent.schema.json
# VPP settlement anomaly monitor. Verifies that every `de.vpp.dispatch.confirmed` event produced a matching `de.vpp.settlement.berechnet` within 5 minutes, alerts on missing settlements, and performs Art. 17 RL (EU) 2019/944 audit checks.
#
# Every grant below is a tool this specialist's own procedure names, and every
# tool the procedure names is granted. `cargo xtask check-prompt-tools` holds the
# two together in both directions, so a grant nobody instructs — a whole server's
# read surface handed over because the specialist touches that server — cannot
# come back. `mutates` is derived from the server's own `read_only_hint`, and
# there are no mutating grants here at all: a `tool-calling` agent cannot
# dispatch one, so declaring it would read as an ability this agent does not
# have. See the note above `budgets`.
# Role: LF. Compiled only into a `role-lf` build (and the default all-roles build).
apiVersion: agentplane.hupe1980.github.io/v1alpha1
kind: Agent
metadata:
  name: vpp-billing-agent
  version: "2.0.0"
spec:
  execution:
    kind: tool-calling
    max_turns: 10

  identity:
    role: >-
      VPP settlement anomaly monitor. Verifies that every
      `de.vpp.dispatch.confirmed` event produced a matching
      `de.vpp.settlement.berechnet` within 5 minutes, alerts on missing
      settlements, and performs Art. 17 RL (EU) 2019/944 audit checks.
    constraints: |
      You are the VPP settlement compliance specialist.

      ## ROLE
      Monitor the automated VPP dispatch-to-billing pipeline for completeness and correctness.
      You do NOT trigger billing — `billingd` auto-bills deterministically via the webhook.
      Your job is anomaly detection, audit, and escalation.

      ## TRIGGERED BY
      - `de.vpp.dispatch.confirmed`   — a new dispatch was confirmed; check billing followed
      - `de.vpp.settlement.berechnet` — a settlement was generated; validate arithmetic
      - Manual run                    — periodic Art. 17 RL (EU) 2019/944 audit sweep

      ## CHECKS (run in order)

      1. **Settlement completeness**: For each `de.vpp.dispatch.confirmed` event in the last
         24 hours, verify a `de.vpp.settlement.berechnet` exists with the same `tx_id`.
         Call billingd `list_vpp_settlements` to read the settlements by `tx_id`.

      2. **Arithmetic validation**: Call billingd `get_billing_record` for the triggering
         settlement and verify:
         - `flexibility_kwh = max_power_kw × (execution_time_until − execution_time_from) / 3600`
         - `netto_eur = flexibility_kwh × capacity_price_eur_per_kwh` (from vpp_contracts)
         - `brutto_eur = netto_eur × 1.19` (standard MwSt)

      3. **Missing contract guard**: If `de.vpp.dispatch.confirmed` arrived but no contract
         exists in `vpp_contracts` for the SR-ID, escalate to operator immediately.
         Call marktd `get_steuerbare_ressource` for the SR-ID first: a dispatch naming a
         resource marktd does not know is a different fault from one naming a resource
         with no billing contract, and only the second is a configuration gap.

      4. **Duplicate check**: Verify `tx_id` appears exactly once in `vpp_dispatch_ledger`.
         More than once = double-billing risk.

      5. **Art. 17 RL (EU) 2019/944 audit**: Confirm each settled `Rechnung` carries:
         - `zusatzAttribute[].name = 'regulatory_basis'` with value `'Art. 17 RL (EU) 2019/944'`
         - `zusatzAttribute[].name = 'tx_id'` cross-referencing the dispatch event
         - `zusatzAttribute[].name = 'sr_id'` identifying the controlled resource

      ## ESCALATION RULES
      - Missing settlement after 5 minutes: CRITICAL — operator must manually settle via
        `POST /api/v1/billing/vpp/{vpp_id}`
      - Missing VPP contract: HIGH — configure `PUT /api/v1/billing/vpp-contracts/{sr_id}`
      - Arithmetic deviation > 0.01 EUR: MEDIUM — review capacity_price in vpp_contracts

  # What this agent is in a multi-agent arrangement.
  #
  # MAST measures inter-agent misalignment at 36.9 % of observed multi-agent
  # failures — a class that exists only if you choose it. Declaring the shape is
  # how you choose not to: `single` means one agent, one context, many tools, and
  # the inter-agent failure surface is structurally absent. `specialist` means it
  # hands off to nobody, which is what `max_delegation_depth: 0` already enforces
  # — stated here so the two cannot disagree.
  topology:
    mode: single
    role: specialist

  capabilities:
    provides: [vpp.billing]

  models:
    privileged:  { provider: anthropic, model: claude-sonnet-5 }

  security:
    max_sensitivity_egress: internal
    max_delegation_depth: 0
    max_sensitivity_journaled: internal

  # No `oversight` block, and no mutating tool grant: this specialist reads and
  # reports. Both absences are the same fact — a `tool-calling` agent cannot
  # dispatch a mutating call at all, because the arguments come from a model
  # completion, which agentplane labels untrusted by construction, and its taint
  # gate refuses a mutating sink with untrusted arguments. Declaring the grant
  # anyway would read as an ability this agent does not have.
  #
  # Acting on a conclusion is a `planned` specialist's job — see
  # `gabi-gas-agent`, whose plan passes `$input/…` references the runtime
  # resolves itself, so the authority-bearing arguments keep the run input's own
  # labels and a named human approves the call before it leaves.

  budgets:
    max_tokens: 200000
    max_steps: 30
    max_effects: 50
    max_wallclock_secs: 900

  # The result contract. It was a prose fence inside the prompt, which made
  # every consumer a parser of free text; as a schema the model is held to it
  # and a change to it changes the manifest digest.
  output:
    schema:
      type: object
      additionalProperties: false
      required:
        - dispatch_tx_id
        - sr_id
        - settlement_found
      properties:
        dispatch_tx_id:
          type: string
        sr_id:
          type: string
        settlement_found:
          type: string
          enum:
            - YES
            - NO
            - PENDING
        billing_record_id:
          type: string
        arithmetic_ok:
          type: string
        audit_fields_present:
          type: string
          enum:
            - YES
            - NO
        action:
          type: string
          enum:
            - NONE
            - ESCALATE_MISSING_SETTLEMENT
            - ESCALATE_MISSING_CONTRACT
            - REVIEW_ARITHMETIC
        detail:
          type: string

  # Knowledge, granted rather than copied.
  #
  # mako's MCP servers publish 57 step-by-step prompts across 15 servers for
  # their own procedures. A specialist names the one it needs; a hand-typed
  # paraphrase in `constraints` would be a second copy with nothing keeping the
  # two in agreement — the server's prompt changes with the code, a paraphrase
  # changes when somebody remembers.
  #
  # A context grant is not a tool grant. Reading a prompt authorises no action,
  # but it does cross a trust and data-egress boundary, which is why it is
  # declared here where a reviewer sees it rather than fetched silently.
  context:
    prompts:
      - server: billingd
        name: eeg-billing
        max_input_sensitivity: internal
        output_sensitivity: internal

  tools:
    - ref: tool://billingd/list_vpp_settlements
      mutates: false
      max_sensitivity: internal
      description: >-
        Settlements by `tx_id`, for the completeness and duplicate checks.

    - ref: tool://billingd/get_billing_record
      mutates: false
      max_sensitivity: internal
      description: >-
        One settlement in full, for the arithmetic and Art. 17 attribute checks.

    - ref: tool://marktd/get_steuerbare_ressource
      mutates: false
      max_sensitivity: confidential
      description: >-
        Whether the SR-ID the dispatch names exists as a steuerbare Ressource.
