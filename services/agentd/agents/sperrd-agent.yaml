# yaml-language-server: $schema=https://hupe1980.github.io/agentplane/agent.schema.json
# Sperr-/Entsperrauftrag execution monitor (NB role). Tracks the queue (pending→executed/failed/cancelled), flags orders past the date the Lieferant asked for, and diagnoses IFTSTA 21039 dispatches that never reached the LF.
#
# Every grant below is a tool this specialist's own procedure names, and every
# tool the procedure names is granted. `cargo xtask check-prompt-tools` holds the
# two together in both directions, so a grant nobody instructs — a whole server's
# read surface handed over because the specialist touches that server — cannot
# come back. `mutates` is derived from the server's own `read_only_hint`, and
# there are no mutating grants here at all: a `tool-calling` agent cannot
# dispatch one, so declaring it would read as an ability this agent does not
# have. See the note above `budgets`.
# Role: NB. Compiled only into a `role-nb` build (and the default all-roles build).
apiVersion: agentplane.hupe1980.github.io/v1alpha1
kind: Agent
metadata:
  name: sperrd-agent
  version: "2.0.0"
spec:
  execution:
    kind: tool-calling
    max_turns: 10

  identity:
    role: >-
      Sperr-/Entsperrauftrag execution monitor (NB role). Tracks the queue
      (pending→executed/failed/cancelled), flags orders past the date the
      Lieferant asked for, and diagnoses IFTSTA 21039 dispatches that never
      reached the LF.
    constraints: |
      You are the Sperrung execution and compliance specialist (NB role).

      ## TRIGGERED BY
      - `de.accounting.sperrauftrag` — the LF's §41f ORDERS 17115 went out
      - `de.sperr.*` — the NB-side queue: auftrag.eingegangen, ausgefuehrt,
        fehlgeschlagen, storniert, iftsta.ausstehend
      - `de.mako.process.completed` — the Sperrung ORDERS process closed

      ## PROCEDURE

      1. Call sperrd `get_sperr_stats`.
      2. `iftsta_stuck > 0` is the finding that matters. Those orders are
         terminal here and unreported to the Lieferant, whose gpke-sperrung-lf
         process cannot close. Classify BREACH.
      3. `iftsta_outstanding > 0` with `iftsta_stuck = 0` is a dispatch in
         flight — the retry worker is on it. Not a finding on its own.
      4. `frist_ueberschritten > 0` is the **regulatory** miss: those orders are
         past the 6 Werktage of GPKE Teil 2 § 3.5.1.2 Nr. 1. Classify BREACH, and
         separately from `overdue_pending`, which is only past the date the
         Lieferant asked for.
      5. `iftsta_ueberfaellig > 0` with `iftsta_stuck = 0` is the 1-Werktag IFTSTA
         window already missed while the retry worker is still trying. Report it —
         it is late, not lost, and it becomes `iftsta_stuck` if the budget runs out.
      6. `overdue_pending > 0` → call `list_due_orders`. Read `ist_fixtermin`:
         a missed DTM+203 fixed date is a broken commitment to the LF; a passed
         DTM+469 earliest-start only means the job is now schedulable.
      7. Diagnose: field-team backlog, makod AS4 delivery, or — the usual cause
         of a stuck IFTSTA — no makod `gpke-sperrung` process in
         `ValidationPassed` for that MaLo. Call makod `get_process` for the MaLo the
         order names, and makod `list_active_processes` when several orders are stuck at
         once: one MaLo without a process is an order, and twenty is a dispatch outage.
      8. Where the queue's own counters are not enough — a dispute about one order, or a
         backlog whose shape matters — call sperrd `get_sperr_order` for the order and
         sperrd `list_sperr_orders` for the period around it.

      ## TIMING — read this before classifying

      Three different clocks run on a Sperrauftrag, and sperrd computes all three.
      Classify against **its** counters, never against a window derived here: an
      agent judging the queue by a different deadline than the service that owns
      it produces findings the service cannot reproduce.

      | Clock | Counter | Source |
      |---|---|---|
      | The Lieferant's own date — DTM+203 Ausführungsdatum, or DTM+469 frühestes Startdatum | `overdue_pending`, and `soll_am` / `ist_fixtermin` on the row | the ORDERS itself |
      | Execution: **6 Werktage** after the earliest possible Sperrtermin | `frist_ueberschritten` | GPKE Teil 2 § 3.5.1.2 Nr. 1 — the regulatory one |
      | IFTSTA back to the Lieferant: **1 Werktag** after the order is closed | `iftsta_ueberfaellig` (of the `iftsta_outstanding`) | GPKE Teil 2 § 3.5 |

      Two things this list is correcting, because both were asserted here and
      classified real orders:

      - There *is* a regulatory execution window, and it is the 6 Werktage of
        GPKE Teil 2 § 3.5.1.2 Nr. 1. This file used to say GPKE fixes none, so
        `frist_ueberschritten` — the counter sperrd computes for exactly that —
        was never read.
      - It is **not** two Werktage from BK6-22-024. That figure appears in no
        BNetzA or BDEW document.

      The ORDRSP window — 1 Werktag for the NB's answer to the ORDERS — belongs to
      makod, not to this queue.

  # What this agent is in a multi-agent arrangement.
  #
  # MAST measures inter-agent misalignment at 36.9 % of observed multi-agent
  # failures — a class that exists only if you choose it. Declaring the shape is
  # how you choose not to: `single` means one agent, one context, many tools, and
  # the inter-agent failure surface is structurally absent. `specialist` means it
  # hands off to nobody, which is what `max_delegation_depth: 0` already enforces
  # — stated here so the two cannot disagree.
  topology:
    mode: single
    role: specialist

  capabilities:
    provides: [sperrd]

  models:
    privileged:  { provider: anthropic, model: claude-sonnet-5 }

  security:
    max_sensitivity_egress: internal
    max_delegation_depth: 0
    max_sensitivity_journaled: internal

  # No mutating tool grant, and no approval: this specialist reads and reports.
  # Both absences are the same fact — a `tool-calling` agent cannot dispatch a
  # mutating call at all, because the arguments come from a model completion,
  # which agentplane labels untrusted by construction, and its taint gate refuses
  # a mutating sink with untrusted arguments. Declaring the grant anyway would
  # read as an ability this agent does not have.
  #
  # It does declare `oversight`, for **triage** — a row beside a finished answer
  # rather than a gate in front of a call. That is the only mode that fits an
  # agent which cannot act: gating its answer would gate nothing while suspending
  # a run per finding.
  #
  # Acting on a conclusion is a `planned` specialist's job — see
  # `gabi-gas-agent`, whose plan passes `$input/…` references the runtime
  # resolves itself, so the authority-bearing arguments keep the run input's own
  # labels and a named human approves the call before it leaves.

  # Human-in-the-loop, beside the answer rather than in front of it.
  #
  # `approval: none` — this specialist cannot act (a `tool-calling` agent's
  # arguments come from a model completion, which the taint gate refuses at a
  # mutating sink), so there is nothing to gate. `triage` opens a worklist row
  # beside the returned answer instead. Every `path` is typed against this
  # agent's own `output.schema` at parse time.
  oversight:
    approval: none
    # `approval: none` means nothing waits, so this bounds no wait — the field
    # is required and states the same window the rule below uses.
    deadline:
      name: sperr-compliance-review
      kind: working-days
      params: { n: 1 }
    # A triage row *is* the finding, so an unanswered one widens rather than
    # closes: `deny` would take it out of the worklist and delete the delivery
    # of a breach that was correctly detected. (gabi-gas-agent's dispatching
    # approval stays `deny` for the opposite reason — it gates, so it must fail
    # closed.)
    on_expiry: escalate
    escalate_to: [mako-operations]
    triage:
      - name: sperr-compliance
        # **The grid desk, not credit control.** This specialist is NB-role: it
        # watches the queue the Netzbetreiber executes from. The §§ 41f/41g
        # notice sequence is the *Lieferant's* and is credit-control's business
        # (payment-reconciliation-agent files that row); what breaches here is
        # the NB's own GPKE execution and IFTSTA obligation. Routing an NB
        # finding to a supply-side desk is also the § 9 EnWG boundary crossed by
        # a worklist row, in a build that may not contain that desk at all.
        audience: [grid-operations]
        priority: urgent
        summary: >-
          A Sperrauftrag queue is out of compliance on the Netzbetreiber's own obligations — an order past the 6 Werktage of GPKE Teil 2 § 3.5.1.2 Nr. 1, or an IFTSTA 21039 that never reached the Lieferant so their gpke-sperrung-lf process cannot close.
        when:
          - path: /sperr_compliance
            equals: "BREACH"
        deadline:
          name: sperr-compliance-review
          kind: working-days
          params: { n: 1 }

  budgets:
    max_tokens: 200000
    max_steps: 30
    max_effects: 50
    max_wallclock_secs: 900

  # The result contract. It was a prose fence inside the prompt, which made
  # every consumer a parser of free text; as a schema the model is held to it
  # and a change to it changes the manifest digest.
  output:
    schema:
      type: object
      additionalProperties: false
      required:
        - sperr_compliance
        - overdue_count
        - frist_ueberschritten_count
        - missing_iftsta_count
      properties:
        sperr_compliance:
          type: string
          enum:
            - COMPLIANT
            - AT_RISK
            - BREACH
        overdue_count:
          type: number
          description: >-
            Orders past the date the **Lieferant** asked for (DTM+203 or
            DTM+469). A commitment, not a regulatory window.
        frist_ueberschritten_count:
          type: number
          description: >-
            Orders past the **6 Werktage** of GPKE Teil 2 § 3.5.1.2 Nr. 1 — the
            regulatory execution window. Separate from `overdue_count` because
            only this one is a breach of a published rule, and reporting them as
            one number makes a missed Frist indistinguishable from a late job.
        missing_iftsta_count:
          type: number
          description: >-
            Terminal orders whose IFTSTA 21039 has not reached the Lieferant, so
            their gpke-sperrung-lf process cannot close.
        iftsta_ueberfaellig_count:
          type: number
          description: >-
            Of those, the ones past the 1-Werktag window after completion. Late
            while the retry worker is still trying — distinct from
            `missing_iftsta_count`, which includes a dispatch in flight.
        oldest_overdue_days:
          type: number
        action:
          type: string
          enum:
            - NONE
            - ESCALATE_OPERATOR
            - TRIGGER_IFTSTA

  # Knowledge, granted rather than copied.
  #
  # mako's MCP servers publish 57 step-by-step prompts across 15 servers for
  # their own procedures. A specialist names the one it needs; a hand-typed
  # paraphrase in `constraints` would be a second copy with nothing keeping the
  # two in agreement — the server's prompt changes with the code, a paraphrase
  # changes when somebody remembers.
  #
  # A context grant is not a tool grant. Reading a prompt authorises no action,
  # but it does cross a trust and data-egress boundary, which is why it is
  # declared here where a reviewer sees it rather than fetched silently.
  context:
    prompts:
      - server: sperrd
        name: execute-sperrung
        max_input_sensitivity: internal
        output_sensitivity: internal
      - server: sperrd
        name: iftsta-sweep
        max_input_sensitivity: internal
        output_sensitivity: internal

  tools:
    - ref: tool://sperrd/get_sperr_stats
      mutates: false
      max_sensitivity: internal
      description: >-
        The queue's own counters — `iftsta_stuck` is the finding that matters.

    - ref: tool://sperrd/list_due_orders
      mutates: false
      max_sensitivity: internal
      description: >-
        Orders past the date the Lieferant asked for, with `ist_fixtermin` and
        `soll_am`.

    - ref: tool://sperrd/get_sperr_order
      mutates: false
      max_sensitivity: internal
      description: >-
        One order in full, once the queue says which.

    - ref: tool://sperrd/list_sperr_orders
      mutates: false
      max_sensitivity: internal
      description: >-
        Orders across the period, to tell a backlog from a single failure.

    - ref: tool://makod/get_process
      mutates: false
      max_sensitivity: internal
      description: >-
        Whether a `gpke-sperrung` process reached ValidationPassed for the MaLo.

    - ref: tool://makod/list_active_processes
      mutates: false
      max_sensitivity: internal
      description: >-
        Sperrung processes in flight, for a queue-wide diagnosis.
