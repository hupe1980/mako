# Sperrung execution SLA monitor. Tracks sperr_orders lifecycle (pending→executed/failed/cancelled), flags overdue orders that risk BK6-22-024 compliance, and diagnoses IFTSTA 21039 dispatch failures.
#
# Generated from the compiled specialist definition during the agentplane
# cutover. The tool grants reproduce the previous reach — every tool on each
# granted MCP server — so no capability was silently lost. What is new: each
# grant is named, `mutates` comes from the server's own read-only hint, and
# every mutating tool requires a human decision.
#
# Narrowing the read set per specialist is domain review, not mechanical work.
# Role: NB. Compiled only into a `role-nb` build (and the default all-roles build).
apiVersion: agentplane.hupe1980.github.io/v1alpha1
kind: Agent
metadata:
  name: sperrd-agent
  version: "1.0.0"
spec:
  execution:
    kind: tool-calling
    max_turns: 10

  identity:
    role: >-
      Sperrung execution SLA monitor. Tracks sperr_orders lifecycle
      (pending→executed/failed/cancelled), flags overdue orders that risk
      BK6-22-024 compliance, and diagnoses IFTSTA 21039 dispatch failures.
    constraints: |
      You are the Sperrung execution and compliance specialist (NB role).

      ## TRIGGERED BY
      - `de.accounting.sperrauftrag` — §41f/§41g Sperrauftrag handed to sperrd
      - `de.sperr.*` — Sperrung order lifecycle events (not emitted yet)
      - `de.mako.process.completed` — after Sperrung ORDERS process completes

      ## PROCEDURE

      1. Call sperrd `get_sperr_stats` for current compliance snapshot.
      2. Check: `overdue_pending` — orders past execution deadline.
      3. Check: `executed_missing_iftsta` — orders marked executed but IFTSTA 21039 not dispatched.
      4. For overdue: call sperrd `list_overdue_orders` for details.
      5. Diagnose cause: NB execution team delay, makod AS4 delivery issue, or wrong state.

      ## BK6-22-024 SLA
      NB must execute Sperrung within contractual window (typically 5 Werktage from ORDERS receipt).

      ## OUTPUT FORMAT
      ```
      SPERR_COMPLIANCE: [COMPLIANT|AT_RISK|BREACH]
      OVERDUE_COUNT: [number]
      MISSING_IFTSTA_COUNT: [number]
      OLDEST_OVERDUE_DAYS: [number]
      ACTION: [NONE|ESCALATE_OPERATOR|TRIGGER_IFTSTA]
      ```

  capabilities:
    provides: [sperrd]

  models:
    privileged:  { provider: anthropic, model: claude-sonnet-5 }
    quarantined: { provider: anthropic, model: claude-haiku-4-5 }

  security:
    max_sensitivity_egress: internal
    max_delegation_depth: 0
    max_sensitivity_journaled: internal

  oversight:
    approval:  tools-only
    approvers: [mako-operations]
    deadline:
      name: sperrd-agent-freigabe
      kind: hours
      params: { n: 4 }
    on_expiry: deny

  budgets:
    max_tokens: 200000
    max_steps: 30
    max_effects: 50
    max_wallclock_secs: 900

  tools:
    - ref: tool://sperrd/list_sperr_orders
      mutates: false
      max_sensitivity: internal
      description: "list sperr orders via sperrd"
    - ref: tool://sperrd/get_sperr_order
      mutates: false
      max_sensitivity: internal
      description: "get sperr order via sperrd"
    - ref: tool://sperrd/get_sperr_stats
      mutates: false
      max_sensitivity: internal
      description: "get sperr stats via sperrd"
    - ref: tool://sperrd/list_overdue_orders
      mutates: false
      max_sensitivity: internal
      description: "list overdue orders via sperrd"
    - ref: tool://sperrd/cancel_sperr_order
      mutates: true
      max_sensitivity: internal
      requires_approval: true
      description: "cancel sperr order via sperrd"
    - ref: tool://makod/list_commands
      mutates: false
      max_sensitivity: internal
      description: "list commands via makod"
    - ref: tool://makod/submit_command
      mutates: true
      max_sensitivity: internal
      requires_approval: true
      description: "submit command via makod"
      protected_fields:
        - { path: "/malo_id", require_trusted: true }
        - { path: "/pid", require_trusted: true }
        - { path: "/mp_id", require_trusted: true }
    - ref: tool://makod/get_malo
      mutates: false
      max_sensitivity: internal
      description: "get malo via makod"
    - ref: tool://makod/list_partners
      mutates: false
      max_sensitivity: internal
      description: "list partners via makod"
    - ref: tool://makod/get_partner
      mutates: false
      max_sensitivity: internal
      description: "get partner via makod"
    - ref: tool://makod/get_health
      mutates: false
      max_sensitivity: internal
      description: "get health via makod"
    - ref: tool://makod/get_process
      mutates: false
      max_sensitivity: internal
      description: "get process via makod"
    - ref: tool://makod/list_overdue_deadlines
      mutates: false
      max_sensitivity: internal
      description: "list overdue deadlines via makod"
    - ref: tool://makod/list_active_processes
      mutates: false
      max_sensitivity: internal
      description: "list active processes via makod"
    - ref: tool://makod/get_format_version_coverage
      mutates: false
      max_sensitivity: internal
      description: "get format version coverage via makod"
    - ref: tool://makod/get_outbox_status
