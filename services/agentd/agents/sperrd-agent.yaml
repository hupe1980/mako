# Sperrung execution SLA monitor. Tracks sperr_orders lifecycle (pending→executed/failed/cancelled), flags overdue orders that risk BK6-22-024 compliance, and diagnoses IFTSTA 21039 dispatch failures.
#
# Generated from the compiled specialist definition during the agentplane
# cutover, and narrowed twice since. `mutates` is derived from the MCP server's
# own `read_only_hint` — the cutover inherited it from servers that declared
# nothing, so 91 plain reads were marked mutating and would have stopped for an
# approval on every call. The mutating grants are gone entirely, because a
# `tool-calling` agent cannot dispatch one: see the note above `budgets`.
#
# Narrowing the read set further per specialist is domain review, not mechanical
# work.
# Role: NB. Compiled only into a `role-nb` build (and the default all-roles build).
apiVersion: agentplane.hupe1980.github.io/v1alpha1
kind: Agent
metadata:
  name: sperrd-agent
  version: "1.0.0"
spec:
  execution:
    kind: tool-calling
    max_turns: 10

  identity:
    role: >-
      Sperrung execution SLA monitor. Tracks sperr_orders lifecycle
      (pending→executed/failed/cancelled), flags overdue orders that risk
      BK6-22-024 compliance, and diagnoses IFTSTA 21039 dispatch failures.
    constraints: |
      You are the Sperrung execution and compliance specialist (NB role).

      ## TRIGGERED BY
      - `de.accounting.sperrauftrag` — §41f/§41g Sperrauftrag handed to sperrd
      - `de.sperr.*` — Sperrung order lifecycle events (not emitted yet)
      - `de.mako.process.completed` — after Sperrung ORDERS process completes

      ## PROCEDURE

      1. Call sperrd `get_sperr_stats` for current compliance snapshot.
      2. Check: `overdue_pending` — orders past execution deadline.
      3. Check: `executed_missing_iftsta` — orders marked executed but IFTSTA 21039 not dispatched.
      4. For overdue: call sperrd `list_overdue_orders` for details.
      5. Diagnose cause: NB execution team delay, makod AS4 delivery issue, or wrong state.

      ## BK6-22-024 SLA
      NB must execute Sperrung within contractual window (typically 5 Werktage from ORDERS receipt).

      ## OUTPUT FORMAT
      ```
      SPERR_COMPLIANCE: [COMPLIANT|AT_RISK|BREACH]
      OVERDUE_COUNT: [number]
      MISSING_IFTSTA_COUNT: [number]
      OLDEST_OVERDUE_DAYS: [number]
      ACTION: [NONE|ESCALATE_OPERATOR|TRIGGER_IFTSTA]
      ```

  capabilities:
    provides: [sperrd]

  models:
    privileged:  { provider: anthropic, model: claude-sonnet-5 }

  security:
    max_sensitivity_egress: internal
    max_delegation_depth: 0
    max_sensitivity_journaled: internal

  # No `oversight` block, and no mutating tool grant: this specialist reads and
  # reports. Both absences are the same fact — a `tool-calling` agent cannot
  # dispatch a mutating call at all, because the arguments come from a model
  # completion, which agentplane labels untrusted by construction, and its taint
  # gate refuses a mutating sink with untrusted arguments. Declaring the grant
  # anyway would read as an ability this agent does not have.
  #
  # Acting on a conclusion is a `planned` specialist's job — see
  # `gabi-gas-agent`, whose plan passes `$input/…` references the runtime
  # resolves itself, so the authority-bearing arguments keep the run input's own
  # labels and a named human approves the call before it leaves.

  budgets:
    max_tokens: 200000
    max_steps: 30
    max_effects: 50
    max_wallclock_secs: 900

  tools:
    - ref: tool://sperrd/list_sperr_orders
      mutates: false
      max_sensitivity: internal
      description: "list sperr orders via sperrd"
    - ref: tool://sperrd/get_sperr_order
      mutates: false
      max_sensitivity: internal
      description: "get sperr order via sperrd"
    - ref: tool://sperrd/get_sperr_stats
