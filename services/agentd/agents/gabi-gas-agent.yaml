# GaBi Gas 2.1 balancing and allocation specialist.
#
# Converted from `builtin::GABI_GAS_AGENT`. Three things moved out of the Rust
# const and into this file, and the file is what a reviewer sees in a diff:
#
#   * the procedure       -> spec.identity.constraints  (digest-covered)
#   * the OUTPUT FORMAT   -> spec.output.schema         (enforced, not hoped for)
#   * the ceilings        -> spec.budgets               (absent is refused)
#
# The tool list is deliberately narrow. The old definition granted four whole MCP
# servers (`makod`, `netzbilanzd`, `marktd`, `obsd`); this names the individual
# tools, marks the one mutating call as needing a human, and binds its
# authority-bearing arguments to trusted sources.
apiVersion: agentplane.hupe1980.github.io/v1alpha1
kind: Agent
metadata:
  name: gabi-gas-agent
  version: "1.0.0"
spec:
  execution:
    # `planned`, not `tool-calling`, and the difference is the whole security
    # argument. One privileged call reads the run's trusted input — the
    # re-validated Bilanzkreis and gas day, nothing a counterparty wrote — and
    # emits a plan: which granted tools, in what order, with which arguments.
    # The runtime executes that plan itself. Control flow is therefore fixed
    # before anything untrusted is read, and step outputs travel by reference
    # (`$step0/...`) rather than back through a model's context, so a hostile
    # tool result cannot steer the steps that follow it.
    #
    # The price is real: a plan cannot react to what it discovers mid-flight.
    # It is the right trade here because the shape of gas balancing is known up
    # front — read the imbalance, check the deadline, decide — while the ALOCAT
    # and NOMRES values it reads are counterparty-authored.
    kind: planned
    max_turns: 12

  identity:
    role: >-
      GaBi Gas 2.1 balancing and allocation specialist (BK7-24-01-008)
    constraints: |
      DOMAIN
      German gas market balancing: ALOCAT (daily allocation), NOMINT/NOMRES
      (nomination and response), IMBNOT (imbalance notification), GasDay
      (06:00 CET), MSCONS 13013 (Allokationsliste, MMMA), GasQuantity
      (Decimal kWh_Hs), AllocationVersion (Initial/Correction/Final per
      KoV §6.4), GasImbalanceSaldo (Mehr/Minder/Balanced).

      ON IMBALANCE NOTIFICATION (IMBNOT, KoV §6.4)
      1. Extract bilanzkreis_id, gas_day and imbalance_kwh from the event.
      2. Call get_gas_imbalance for the full saldo.
      3. Calculate the deviation in kWh_Hs — never m³. The unit must be
         Hs-based per DVGW G 685.
      4. Identify the market participant with the largest contribution.
      5. Check the ALOCAT version against the expected AllocationVersion for
         today's GasDay.

      ON MISSING ALOCAT (deadline: GasDay + 3 hours)
      1. Call list_overdue_deadlines filtered to PID 13013.
      2. Identify which MGV or VNB failed to submit the MSCONS.
      3. Check whether a fallback allocation (Ersatzmenge) applies per KoV §6.5.

      ON NOMINT/NOMRES LIFECYCLE
      1. Verify NOMRES arrived within 30 minutes of NOMINT (KoV §5.2).
      2. Flag any NOMINT without a NOMRES as an unconfirmed nomination.

      INVOICE AUDIT (31007/31008 Gas MMM, 31010 Kapazitätsrechnung)
      1. For 31007/31008, verify MMMA settlement prices against the Gas THE index.
      2. For 31010, verify capacity quantities against contracted capacity
         (BK7-24-01-008 §7).

      KoV §6.4 ALLOCATION VERSIONS
      Initial is issued GasDay + 1 Werktag and is preliminary. Correction is
      issued GasDay + 8 Werktage. Final is issued GasDay + 31 Werktage and is
      binding for billing — billing must use Final (KoV §6.4 Abs. 3).

      Never propose an action whose legal basis you cannot name.

  # What this agent is in a multi-agent arrangement.
  #
  # MAST measures inter-agent misalignment at 36.9 % of observed multi-agent
  # failures — a class that exists only if you choose it. Declaring the shape is
  # how you choose not to: `single` means one agent, one context, many tools, and
  # the inter-agent failure surface is structurally absent. `specialist` means it
  # hands off to nobody, which is what `max_delegation_depth: 0` already enforces
  # — stated here so the two cannot disagree.
  topology:
    mode: single
    role: specialist

  capabilities:
    provides: [gabi.gas.balancing]

  models:
    # The privileged model plans and may call tools. The quarantined model reads
    # counterparty-derived material in a `parse` step, under a declared schema
    # and an extraction-only instruction — the only thing it can say out of band
    # is *not enough information*, which fails the step.
    #
    # Under `execution.kind: planned` this pair is load-bearing rather than
    # decorative: `parse` steps are one of exactly two places the declarative
    # tier points a model at untrusted-derived content, so the quarantined role
    # is actually selected. A `tool-calling` agent declaring the same pair is
    # refused at parse, because every call would have gone to the privileged
    # model while the file read as dual-model isolation.
    privileged:  { provider: anthropic, model: claude-sonnet-5 }
    quarantined: { provider: anthropic, model: claude-haiku-4-5 }

  security:
    max_sensitivity_egress: internal
    max_delegation_depth: 0
    # The "refuse it" half of the erasure story. Anything above `internal` is
    # refused at dispatch rather than discovered at an erasure request — so the
    # `confidential` master data behind `get_malo` can be read and reasoned
    # about, but never written into the chain. Composes with a key ring
    # (`RuntimeBuilder::keyring`), which seals what *is* journaled under a
    # per-case key that `erase_case` destroys.
    max_sensitivity_journaled: internal

  oversight:
    # Reads run unattended; the single mutating tool needs a human.
    approval: tools-only
    approvers: [gas-operations]
    # Required — an oversight block without one is an unbounded wait. `kind` is
    # handed to the deployment's Calendar unchanged, so `working-days` would
    # resolve through mako's own BDEW Werktage calendar. Gas balancing is
    # intraday (ALOCAT is due GasDay + 3 h), so hours is the honest unit here.
    deadline:
      name: gabi-freigabe
      kind: hours
      params: { n: 4 }
    on_expiry: deny

  budgets:
    max_tokens: 200000
    max_steps: 40
    max_effects: 60
    max_wallclock_secs: 900

  tools:
    - ref: tool://makod/list_overdue_deadlines
      mutates: false
      max_sensitivity: internal
      description: >-
        List processes whose regulatory deadline has expired. Used to find a
        missing ALOCAT (MSCONS PID 13013) past GasDay + 3 h.

    - ref: tool://makod/get_process
      mutates: false
      max_sensitivity: internal
      description: >-
        Look up an active MaKo process by business key and return its stream id
        and pending deadlines.

    - ref: tool://netzbilanzd/get_gas_imbalance
      mutates: false
      max_sensitivity: internal
      description: >-
        Return the GaBi Gas imbalance saldo for a Bilanzkreis and GasDay,
        including AllocationVersion and GasImbalanceSaldo.

    - ref: tool://marktd/get_malo
      mutates: false
      max_sensitivity: confidential
      description: >-
        Read Marktlokation master data. Carries customer-identifying fields, so
        its egress ceiling is higher than the other reads.

    - ref: tool://makod/submit_command
      mutates: true
      requires_approval: true
      max_sensitivity: internal
      description: >-
        Submit a MaKo command. The only mutating tool this agent may reach, and
        it dispatches a real market message.
      protected_fields:
        # Authority-bearing arguments. A value derived from counterparty text
        # cannot reach these, so an injected instruction cannot redirect a
        # dispatch at a MaLo or a PID of its choosing.
        - { path: "/malo_id", require_trusted: true }
        - { path: "/pid",     require_trusted: true }
        - { path: "/mp_id",   require_trusted: true }

  output:
    # Was an OUTPUT FORMAT block in the prompt that the model was asked to
    # follow. As a schema it is checked, and it is covered by the manifest
    # digest, so loosening it is a reviewable change.
    schema:
      type: object
      additionalProperties: false
      required: [gas_day, imbalance_status, allocation_version, deadline_compliant, action, legal_basis]
      properties:
        gas_day:
          type: string
          description: "ISO date of the GasDay, or a GasDay designator."
        bilanzkreis:
          type: [string, "null"]
        imbalance_status:
          type: string
          enum: [BALANCED, MEHR, MINDER, UNKNOWN]
        imbalance_kwh_hs:
          type: [number, "null"]
          description: "Always kWh_Hs — never m³ (DVGW G 685)."
        allocation_version:
          type: string
          enum: [Initial, Correction, Final]
        deadline_compliant:
          type: boolean
        action:
          type: string
          enum: [NONE, ESCALATE_MISSING_ALOCAT, REQUEST_CORRECTION, CONTACT_MGV]
        legal_basis:
          type: string
          description: "KoV §x.y or BK7-24-01-008 §n. Required — an action without one is not actionable."
