# yaml-language-server: $schema=https://hupe1980.github.io/agentplane/agent.schema.json
# Missing final ALOCAT triage for GaBi Gas 2.1.
apiVersion: agentplane.hupe1980.github.io/v1alpha1
kind: Agent
metadata:
  name: gabi-gas-agent
  version: "2.0.0"
spec:
  # No execution block and no oversight block: conduct and task creation live
  # in the registered `agentd::skills::GabiAllocationTriage` skill.
  identity:
    role: >-
      Open auditable operator clearing work when the deterministic GaBi Gas
      allocation workflow reports a missing binding final ALOCAT.
    constraints: |
      The procedure is code: agentd::skills::gabi.

      `de.gabi.alocat.missing` is emitted only after makod's deterministic
      `gabi-gas-allocation` workflow closes its final-allocation deadline
      without a binding ALOCAT. The skill validates the event fields, records
      the engine's deadline label, and opens one urgent task for gas-operations.
      It does not ask a model to reconfirm a deterministic deadline and does
      not claim to send an allocation correction that makod cannot dispatch.

      IMBNOT, NOMINT/NOMRES, MMM invoices and capacity invoices are outside
      this specialist. No corresponding events are emitted to this route.

  topology:
    mode: single
    role: specialist

  capabilities:
    provides: [gabi.gas.balancing]

  models: {}

  security:
    max_sensitivity_egress: internal
    max_delegation_depth: 0
    max_sensitivity_journaled: internal

  budgets:
    max_steps: 4
    max_effects: 8
    max_wallclock_secs: 60

  output:
    schema:
      type: object
      additionalProperties: false
      required: [gas_day, status, sender_eic, receiver_eic, action, legal_basis]
      properties:
        gas_day:
          type: string
        status:
          type: string
          enum: [MISSING_FINAL_ALLOCATION]
        sender_eic:
          type: string
        receiver_eic:
          type: string
        action:
          type: string
          enum: [OPEN_CLEARING_CASE]
        legal_basis:
          type: string