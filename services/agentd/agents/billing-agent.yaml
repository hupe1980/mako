# INVOIC dispute resolution and O2C lifecycle. Handles receipt.disputed events, checks REMADV positions against Rechnung, and coordinates with netzbilanzd for settlement corrections.
#
# Generated from the compiled specialist definition during the agentplane
# cutover. The tool grants reproduce the previous reach — every tool on each
# granted MCP server — so no capability was silently lost. What is new: each
# grant is named, `mutates` comes from the server's own read-only hint, and
# every mutating tool requires a human decision.
#
# Narrowing the read set per specialist is domain review, not mechanical work.
# Role: LF. Compiled only into a `role-lf` build (and the default all-roles build).
apiVersion: agentplane.hupe1980.github.io/v1alpha1
kind: Agent
metadata:
  name: billing-agent
  version: "1.0.0"
spec:
  execution:
    kind: tool-calling
    max_turns: 15

  identity:
    role: >-
      INVOIC dispute resolution and O2C lifecycle. Handles receipt.disputed
      events, checks REMADV positions against Rechnung, and coordinates with
      netzbilanzd for settlement corrections.
    constraints: |
      You are the billing lifecycle specialist for the Lieferant (LF) role.

      ## TRIGGERED BY
      - `de.invoic.receipt.disputed` — invoicd disputed an INVOIC
      - `de.accounting.mahnung.issued` — a Mahnung was issued

      ## STEP-BY-STEP PROCEDURE

      1. Extract `malo_id`, `receipt_id`, and `lf_mp_id` from the event.
      2. Call invoicd `get_receipt` to retrieve full check results (6 checks).
      3. Identify which check failed:
         - Check 1 (period): billing period validity
         - Check 2 (arithmetic): position totals match Gesamtbetrag
         - Check 3 (document total): Brutto = Netto + MwSt
         - Check 4 (tariff match): tariff matches PreisblattNetznutzung
         - Check 5 (tariff found): product code exists in marktd
         - Check 6 (MMM settlement): MMM prices match marktd store
      4. For arithmetic errors: call billingd `get_billing_record` to compare positions.
      5. For tariff errors: call marktd to check PreisblattNetznutzung validity dates.
      6. Determine if dispute is valid or can be auto-resolved.

      ## OUTPUT FORMAT
      ```
      DISPUTE_STATUS: [VALID_DISPUTE|AUTO_RESOLVABLE|NB_ERROR]
      FAILED_CHECK: [check number and description]
      CORRECTION_PATH: [specific steps to resolve]
      AMOUNT_AT_RISK_EUR: [amount]
      ```

  capabilities:
    provides: [billing]

  models:
    privileged:  { provider: anthropic, model: claude-sonnet-5 }

  security:
    max_sensitivity_egress: internal
    max_delegation_depth: 0
    max_sensitivity_journaled: internal

  oversight:
    approval:  tools-only
    approvers: [mako-operations]
    deadline:
      name: billing-agent-freigabe
      kind: hours
      params: { n: 4 }
    on_expiry: deny

  budgets:
    max_tokens: 200000
    max_steps: 45
    max_effects: 75
    max_wallclock_secs: 900

  tools:
    - ref: tool://invoicd/get_receipt
      mutates: false
      max_sensitivity: internal
      description: "get receipt via invoicd"
    - ref: tool://invoicd/list_disputes
      mutates: false
      max_sensitivity: internal
      description: "list disputes via invoicd"
    - ref: tool://invoicd/get_check_result
      mutates: false
      max_sensitivity: internal
      description: "get check result via invoicd"
    - ref: tool://invoicd/list_overdue_remadv
