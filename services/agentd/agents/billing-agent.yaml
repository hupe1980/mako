# yaml-language-server: $schema=https://hupe1980.github.io/agentplane/agent.schema.json
# INVOIC dispute resolution and O2C lifecycle. Handles receipt.disputed events, checks REMADV positions against Rechnung, and coordinates with netzbilanzd for settlement corrections.
#
# Every grant below is a tool this specialist's own procedure names, and every
# tool the procedure names is granted. `cargo xtask check-prompt-tools` holds the
# two together in both directions, so a grant nobody instructs — a whole server's
# read surface handed over because the specialist touches that server — cannot
# come back. `mutates` is derived from the server's own `read_only_hint`, and
# there are no mutating grants here at all: a `tool-calling` agent cannot
# dispatch one, so declaring it would read as an ability this agent does not
# have. See the note above `budgets`.
# Role: LF. Compiled only into a `role-lf` build (and the default all-roles build).
apiVersion: agentplane.hupe1980.github.io/v1alpha1
kind: Agent
metadata:
  name: billing-agent
  version: "2.0.0"
spec:
  execution:
    kind: tool-calling
    max_turns: 15

  identity:
    role: >-
      INVOIC dispute resolution and O2C lifecycle. Handles receipt.disputed
      events, checks REMADV positions against Rechnung, and coordinates with
      netzbilanzd for settlement corrections.
    constraints: |
      You are the billing lifecycle specialist for the Lieferant (LF) role.

      ## TRIGGERED BY
      - `de.invoic.receipt.disputed` — invoicd disputed an INVOIC
      - `de.accounting.mahnung.issued` — a Mahnung was issued

      ## STEP-BY-STEP PROCEDURE

      1. Extract `malo_id`, `receipt_id`, and `lf_mp_id` from the event.
      2. Call invoicd `get_receipt` to retrieve full check results (6 checks).
      3. Identify which check failed, and call invoicd `get_check_result` for its detail:
         - Check 1 (period): billing period validity
         - Check 2 (arithmetic): position totals match Gesamtbetrag
         - Check 3 (document total): Brutto = Netto + MwSt
         - Check 4 (tariff match): PRICAT unit price vs INVOIC, within 3 %
         - Check 5 (tariff found): a PRICAT entry exists for the billing period
         - Check 6 (MMM / AufAbschlag): the Strom MMMA reference, the Trading Hub
           Europe MMMA Gas reference, or — on a 31009 — the discount positions
           against the contracted AufAbschlag. Which of the three applies is
           decided by the document, not by the check number.
      4. For arithmetic errors: call billingd `get_billing_record` to compare positions,
         and billingd `explain_invoice_position` for the one that moved.
      5. For tariff errors: call marktd `get_preisblatt` for the PreisblattNetznutzung
         validity dates, and marktd `get_malo` for the Sparte and NB assignment the
         receipt names.
      6. Call invoicd `get_zahlungsstatus` — a dispute over an invoice already paid is a
         different conversation from one over an open item.
      7. On `de.accounting.mahnung.issued`: call accountingd `get_balance` for the open
         amount and `list_dunning` for the Mahnstufe already reached, so an escalation is
         a step rather than a repeat.
      8. Determine if dispute is valid or can be auto-resolved.

  # What this agent is in a multi-agent arrangement.
  #
  # MAST measures inter-agent misalignment at 36.9 % of observed multi-agent
  # failures — a class that exists only if you choose it. Declaring the shape is
  # how you choose not to: `single` means one agent, one context, many tools, and
  # the inter-agent failure surface is structurally absent. `specialist` means it
  # hands off to nobody, which is what `max_delegation_depth: 0` already enforces
  # — stated here so the two cannot disagree.
  topology:
    mode: single
    role: specialist

  capabilities:
    provides: [billing]

  models:
    privileged:  { provider: anthropic, model: claude-sonnet-5 }

  security:
    max_sensitivity_egress: internal
    max_delegation_depth: 0
    max_sensitivity_journaled: internal

  # No approval mode and no mutating tool grant: this specialist reads and
  # reports. Both absences are the same fact — a `tool-calling` agent cannot
  # dispatch a mutating call at all, because the arguments come from a model
  # completion, which agentplane labels untrusted by construction, and its taint
  # gate refuses a mutating sink with untrusted arguments. Declaring the grant
  # anyway would read as an ability this agent does not have.
  #

  oversight:
    approval: none
    deadline: { name: billing-dispute-review, kind: working-days, params: { n: 1 } }
    on_expiry: escalate
    escalate_to: [mako-operations]
    triage:
      - name: billing-dispute
        audience: [billing-operations, billing-compliance]
        priority: urgent
        summary: A valid dispute or network-operator billing error requires resolution.
        when:
          - path: /dispute_status
            in: [VALID_DISPUTE, NB_ERROR]
        deadline: { name: billing-dispute-review, kind: working-days, params: { n: 1 } }

  budgets:
    max_tokens: 200000
    max_steps: 45
    max_effects: 75
    max_wallclock_secs: 900

  # The result contract. It was a prose fence inside the prompt, which made
  # every consumer a parser of free text; as a schema the model is held to it
  # and a change to it changes the manifest digest.
  output:
    schema:
      type: object
      additionalProperties: false
      required:
        - dispute_status
        - failed_check
        - correction_path
      properties:
        dispute_status:
          type: string
          enum:
            - VALID_DISPUTE
            - AUTO_RESOLVABLE
            - NB_ERROR
        failed_check:
          type: number
        correction_path:
          type: string
        amount_at_risk_eur:
          type: number

  # Knowledge, granted rather than copied.
  #
  # mako's MCP servers publish 57 step-by-step prompts across 15 servers for
  # their own procedures. A specialist names the one it needs; a hand-typed
  # paraphrase in `constraints` would be a second copy with nothing keeping the
  # two in agreement — the server's prompt changes with the code, a paraphrase
  # changes when somebody remembers.
  #
  # A context grant is not a tool grant. Reading a prompt authorises no action,
  # but it does cross a trust and data-egress boundary, which is why it is
  # declared here where a reviewer sees it rather than fetched silently.
  context:
    prompts:
      - server: invoicd
        name: resolve-dispute
        max_input_sensitivity: internal
        output_sensitivity: internal
      - server: billingd
        name: order-to-cash
        max_input_sensitivity: internal
        output_sensitivity: internal

  tools:
    - ref: tool://invoicd/get_receipt
      mutates: false
      max_sensitivity: internal
      description: >-
        The disputed INVOIC receipt and the six check results behind the
        dispute.

    - ref: tool://invoicd/get_check_result
      mutates: false
      max_sensitivity: internal
      description: >-
        One check's detail, once `get_receipt` says which of the six failed.

    - ref: tool://invoicd/get_zahlungsstatus
      mutates: false
      max_sensitivity: internal
      description: >-
        Whether the disputed invoice has been paid, partially paid or is still
        open.

    - ref: tool://billingd/get_billing_record
      mutates: false
      max_sensitivity: internal
      description: >-
        The Rechnung behind the receipt, to compare positions against the
        dispute.

    - ref: tool://billingd/explain_invoice_position
      mutates: false
      max_sensitivity: internal
      description: >-
        Why one position holds the amount it does — the arithmetic-error path.

    - ref: tool://marktd/get_preisblatt
      mutates: false
      max_sensitivity: confidential
      description: >-
        PreisblattNetznutzung validity dates, for a check-4 tariff mismatch.

    - ref: tool://marktd/get_malo
      mutates: false
      max_sensitivity: confidential
      description: >-
        The Marktlokation the receipt names, for the Sparte and the NB
        assignment.

    - ref: tool://accountingd/get_balance
      mutates: false
      max_sensitivity: internal
      description: >-
        The open balance behind a Mahnung, on `de.accounting.mahnung.issued`.

    - ref: tool://accountingd/list_dunning
      mutates: false
      max_sensitivity: internal
      description: >-
        Which Mahnstufe the customer is on, so an escalation is not repeated.
