      max_sensitivity: internal
      description: "get zahlungsstatus via invoicd"
    - ref: tool://invoicd/summarize_billing_month
      mutates: false
      max_sensitivity: internal
      description: "summarize billing month via invoicd"
    - ref: tool://invoicd/dispatch_remadv
      mutates: true
      max_sensitivity: internal
      requires_approval: true
      description: "dispatch remadv via invoicd"
    - ref: tool://billingd/list_billing_records
