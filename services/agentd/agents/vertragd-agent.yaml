# yaml-language-server: $schema=https://hupe1980.github.io/agentplane/agent.schema.json
# Contract & customer lifecycle specialist. Preisgarantie Tarifwechsel guards, § 41 Abs. 5 EnWG price-change notices, expiring contract alerts, stuck MaKo workflows (Gleichbehandlung), and B2B Rahmenvertrag.
#
# Every grant below is a tool this specialist's own procedure names, and every
# tool the procedure names is granted. `cargo xtask check-prompt-tools` holds the
# two together in both directions, so a grant nobody instructs — a whole server's
# read surface handed over because the specialist touches that server — cannot
# come back. `mutates` is derived from the server's own `read_only_hint`, and
# there are no mutating grants here at all: a `tool-calling` agent cannot
# dispatch one, so declaring it would read as an ability this agent does not
# have. See the note above `budgets`.
# Role: LF. Compiled only into a `role-lf` build (and the default all-roles build).
apiVersion: agentplane.hupe1980.github.io/v1alpha1
kind: Agent
metadata:
  name: vertragd-agent
  version: "2.0.0"
spec:
  execution:
    kind: tool-calling
    max_turns: 15

  identity:
    role: >-
      Contract & customer lifecycle specialist. Preisgarantie Tarifwechsel guards,
      § 41 Abs. 5 EnWG price-change notices, expiring contract alerts, stuck MaKo
      workflows (Gleichbehandlung), and B2B Rahmenvertrag.
    constraints: |
      You are the contract and customer management specialist for the Lieferant (LF) role.

      ## TRIGGERED BY
      - `de.vertrag.*` — any contract lifecycle event
      - `de.mako.aperak.rejected` — GPKE/GeLi Gas process rejected (contract data issue)
      - `de.vertrag.ablauf.ankuendigung` — contract or price guarantee expiring within 30 days
      - `de.vertrag.preisaenderung.ankuendigung` — § 41 Abs. 5 EnWG price-change notice
      - `de.mako.process.failed` — stuck Lieferbeginn (Gleichbehandlung monitor)

      ## STEP-BY-STEP PROCEDURE

      ### On contract lifecycle event (de.vertrag.*)
      1. Extract `vertrag_id`, `malo_id`, and `kunden_id` from payload.
      2. Call vertragd `get_vertrag_status` — check all Vertragskomponenten.
      3. For ANGEMELDET > 5 WT (Strom) or 10 WT (Gas): call `find_stuck_workflows`.
      4. For ABGELEHNT: call processd `get_decision` for the refusal code behind it
         (A02 = MaLo not in the NB's grid, A05 = LF not registered).
         - A02: call marktd `get_malo` to verify NB assignment.
         - A05: check lf_mp_id published in bdew-codes.de.
      5. For TEILERFUELLUNG: identify which component is pending — escalate if > deadline.

      ### On process rejection (de.mako.aperak.rejected)
      1. Call processd `get_decision` for the refusal and the check behind it.
      2. Call vertragd `get_vertrag_status` to identify the affected Vertragskomponente,
         and vertragd `get_kunde` where the correction touches customer master data.
      3. Determine if contract can be re-Angemeldet after master-data correction.

      ### On expiry notification (de.vertrag.ablauf.ankuendigung)
      1. Call vertragd `list_expiring_contracts` with days=30.
      2. Identify contracts with `auto_renewal=false` needing proactive renewal contact.
      3. Call `compute_kuendigungsfrist` — it answers the earliest lawful end date for
         every reason and names the rule (§ 20 Abs. 1 GVV, § 41b Abs. 5 EnWG,
         § 41 Abs. 5 Satz 4 EnWG, § 309 Nr. 9 lit. c BGB). Never derive a period
         from kuendigungsfrist_monate alone: for a Verbraucher a longer agreed
         period is void, and in the Grundversorgung it does not apply at all.
      4. Call productd `list_products` for what a renewal could be built from, and
         recommend one. Issuing the offer is productd's, on an operator's instruction.

      ### On Preisgarantie Tarifwechsel conflict
      1. Call vertragd `check_preisgarantie` for the MaLo and the intended change date —
         it answers whether the change would cross an active guarantee, which
         `preisgarantie_bis` on its own does not.
      2. Call vertragd `get_vertrag_status` for the components the change would touch.
      3. If operator requests bypass: document customer consent requirement.

      ## §20 EnWG PARITY MONITORING
      Check stuck ANGEMELDET components for correlation with LF-affiliated vs. non-affiliated
      customer segments — report to obsd for BNetzA Diskriminierungsbericht.

  # What this agent is in a multi-agent arrangement.
  #
  # MAST measures inter-agent misalignment at 36.9 % of observed multi-agent
  # failures — a class that exists only if you choose it. Declaring the shape is
  # how you choose not to: `single` means one agent, one context, many tools, and
  # the inter-agent failure surface is structurally absent. `specialist` means it
  # hands off to nobody, which is what `max_delegation_depth: 0` already enforces
  # — stated here so the two cannot disagree.
  topology:
    mode: single
    role: specialist

  capabilities:
    provides: [vertragd]

  models:
    privileged:  { provider: anthropic, model: claude-sonnet-5 }

  security:
    max_sensitivity_egress: internal
    max_delegation_depth: 0
    max_sensitivity_journaled: internal

  # No `oversight` block, and no mutating tool grant: this specialist reads and
  # reports. Both absences are the same fact — a `tool-calling` agent cannot
  # dispatch a mutating call at all, because the arguments come from a model
  # completion, which agentplane labels untrusted by construction, and its taint
  # gate refuses a mutating sink with untrusted arguments. Declaring the grant
  # anyway would read as an ability this agent does not have.
  #

  budgets:
    max_tokens: 200000
    max_steps: 45
    max_effects: 75
    max_wallclock_secs: 900

  # The result contract. It was a prose fence inside the prompt, which made
  # every consumer a parser of free text; as a schema the model is held to it
  # and a change to it changes the manifest digest.
  output:
    schema:
      type: object
      additionalProperties: false
      required:
        - contract_status
        - malo_id
        - stuck_components
      properties:
        contract_status:
          type: string
        malo_id:
          type: string
        stuck_components:
          type: number
        preisgarantie_active:
          type: string
        expiry_risk:
          type: string
        correction:
          type: string
        regulatory_basis:
          type: string

  # Knowledge, granted rather than copied.
  #
  # mako's MCP servers publish 57 step-by-step prompts across 15 servers for
  # their own procedures. A specialist names the one it needs; a hand-typed
  # paraphrase in `constraints` would be a second copy with nothing keeping the
  # two in agreement — the server's prompt changes with the code, a paraphrase
  # changes when somebody remembers.
  #
  # A context grant is not a tool grant. Reading a prompt authorises no action,
  # but it does cross a trust and data-egress boundary, which is why it is
  # declared here where a reviewer sees it rather than fetched silently.
  context:
    prompts:
      - server: processd
        name: trigger-lieferbeginn
        max_input_sensitivity: internal
        output_sensitivity: internal

  tools:
    - ref: tool://vertragd/get_vertrag_status
      mutates: false
      max_sensitivity: confidential
      description: >-
        Every Vertragskomponente and its state, including `preisgarantie_bis`.

    - ref: tool://vertragd/find_stuck_workflows
      mutates: false
      max_sensitivity: confidential
      description: >-
        Components stuck in ANGEMELDET past the Vorlauffrist.

    - ref: tool://vertragd/list_expiring_contracts
      mutates: false
      max_sensitivity: confidential
      description: >-
        Contracts and price guarantees inside the notice window.

    - ref: tool://vertragd/compute_kuendigungsfrist
      mutates: false
      max_sensitivity: confidential
      description: >-
        The earliest lawful end date, with the rule it rests on named.

    - ref: tool://vertragd/check_preisgarantie
      mutates: false
      max_sensitivity: confidential
      description: >-
        Whether a Tarifwechsel would cross an active price guarantee.

    - ref: tool://vertragd/get_kunde
      mutates: false
      max_sensitivity: confidential
      description: >-
        The customer behind the contract, for the notice obligations.

    - ref: tool://processd/get_decision
      mutates: false
      max_sensitivity: internal
      description: >-
        The refusal code behind a rejected Anmeldung.

    - ref: tool://marktd/get_malo
      mutates: false
      max_sensitivity: confidential
      description: >-
        The NB assignment an A02 refusal points at.

    - ref: tool://productd/list_products
      mutates: false
      max_sensitivity: internal
      description: >-
        Products a renewal offer could be built from.
