# yaml-language-server: $schema=https://hupe1980.github.io/agentplane/agent.schema.json
# §41a dynamic tariff upgrade advisor. Identifies iMSys customers not yet on dynamic tariffs, estimates annual savings vs fixed tariff, and recommends product changes in productd.
#
# Every grant below is a tool this specialist's own procedure names, and every
# tool the procedure names is granted. `cargo xtask check-prompt-tools` holds the
# two together in both directions, so a grant nobody instructs — a whole server's
# read surface handed over because the specialist touches that server — cannot
# come back. `mutates` is derived from the server's own `read_only_hint`, and
# there are no mutating grants here at all: a `tool-calling` agent cannot
# dispatch one, so declaring it would read as an ability this agent does not
# have. See the note above `budgets`.
# Role: LF. Compiled only into a `role-lf` build (and the default all-roles build).
apiVersion: agentplane.hupe1980.github.io/v1alpha1
kind: Agent
metadata:
  name: tariff-optimization-agent
  version: "2.0.0"
spec:
  execution:
    kind: tool-calling
    max_turns: 12

  identity:
    role: >-
      §41a dynamic tariff upgrade advisor. Identifies iMSys customers not yet on
      dynamic tariffs, estimates annual savings vs fixed tariff, and recommends
      product changes in productd.
    constraints: |
      You are the tariff optimization specialist.

      ## TRIGGERED BY
      - `de.billing.rechnung.erstellt` — analyse each new invoice for optimization potential
      - `de.mako.process.completed` — WiM completion may indicate new iMSys available

      ## PROCEDURE

      1. Call billingd `get_billing_summary` for the MaLo's 3-month average.
      2. Call edmd `get_timeseries` for 15-min reading availability (iMSys indicator).
      3. Call productd `resolve_product` for the product the MaLo is on today. If 15-min
         data is available and that product is STROM without dynamic_epex:
         UPGRADE_CANDIDATE.
      4. Call productd `list_products` for the dynamic products the customer could move
         to, and productd `check_41a_epex_status` for day-ahead price coverage over the
         period. A saving estimate against a product with no prices behind it is a
         number nobody can act on.
      5. Compare the expected §41a cost against the current fixed tariff with billingd
         `preview_billing` on the same consumption.

      ## UPGRADE CONDITIONS (§41a Abs. 2 EnWG)
      - MeteringMode=iMSys (BSI TR-03109 SMGW active) REQUIRED
      - EPEX price data available in productd for billing period

  # What this agent is in a multi-agent arrangement.
  #
  # MAST measures inter-agent misalignment at 36.9 % of observed multi-agent
  # failures — a class that exists only if you choose it. Declaring the shape is
  # how you choose not to: `single` means one agent, one context, many tools, and
  # the inter-agent failure surface is structurally absent. `specialist` means it
  # hands off to nobody, which is what `max_delegation_depth: 0` already enforces
  # — stated here so the two cannot disagree.
  topology:
    mode: single
    role: specialist

  capabilities:
    provides: [tariff.optimization]

  models:
    privileged:  { provider: anthropic, model: claude-sonnet-5 }

  security:
    max_sensitivity_egress: internal
    max_delegation_depth: 0
    max_sensitivity_journaled: internal

  # No `oversight` block, and no mutating tool grant: this specialist reads and
  # reports. Both absences are the same fact — a `tool-calling` agent cannot
  # dispatch a mutating call at all, because the arguments come from a model
  # completion, which agentplane labels untrusted by construction, and its taint
  # gate refuses a mutating sink with untrusted arguments. Declaring the grant
  # anyway would read as an ability this agent does not have.
  #

  budgets:
    max_tokens: 200000
    max_steps: 36
    max_effects: 60
    max_wallclock_secs: 900

  # The result contract. It was a prose fence inside the prompt, which made
  # every consumer a parser of free text; as a schema the model is held to it
  # and a change to it changes the manifest digest.
  output:
    schema:
      type: object
      additionalProperties: false
      required:
        - optimization_status
        - current_tariff
        - potential_annual_savings_eur
      properties:
        optimization_status:
          type: string
          enum:
            - OPTIMAL
            - UPGRADE_CANDIDATE
            - NOT_ELIGIBLE
        current_tariff:
          type: string
        potential_annual_savings_eur:
          type: string
        eligibility_blocker:
          type: string
        recommended_action:
          type: string

  # Knowledge, granted rather than copied.
  #
  # mako's MCP servers publish 57 step-by-step prompts across 15 servers for
  # their own procedures. A specialist names the one it needs; a hand-typed
  # paraphrase in `constraints` would be a second copy with nothing keeping the
  # two in agreement — the server's prompt changes with the code, a paraphrase
  # changes when somebody remembers.
  #
  # A context grant is not a tool grant. Reading a prompt authorises no action,
  # but it does cross a trust and data-egress boundary, which is why it is
  # declared here where a reviewer sees it rather than fetched silently.
  context:
    prompts:
      - server: productd
        name: configure-41a-tariff
        max_input_sensitivity: internal
        output_sensitivity: internal
      - server: billingd
        name: check-dynamic-tariff
        max_input_sensitivity: internal
        output_sensitivity: internal

  tools:
    - ref: tool://billingd/get_billing_summary
      mutates: false
      max_sensitivity: internal
      description: >-
        The MaLo's rolling three-month average, the baseline for a saving
        estimate.

    - ref: tool://billingd/preview_billing
      mutates: false
      max_sensitivity: internal
      description: >-
        What the same consumption would cost on the candidate product.

    - ref: tool://edmd/get_timeseries
      mutates: false
      max_sensitivity: internal
      description: >-
        Whether 15-minute readings exist — the § 41a Abs. 2 EnWG iMSys
        precondition.

    - ref: tool://productd/check_41a_epex_status
      mutates: false
      max_sensitivity: internal
      description: >-
        Whether day-ahead prices are available for the billing period.

    - ref: tool://productd/list_products
      mutates: false
      max_sensitivity: internal
      description: >-
        Dynamic products the customer could move to.

    - ref: tool://productd/resolve_product
      mutates: false
      max_sensitivity: internal
      description: >-
        The product the MaLo is on today.
