# §41a dynamic tariff upgrade advisor. Identifies iMSys customers not yet on dynamic tariffs, estimates annual savings vs fixed tariff, and recommends product changes in tarifbd.
#
# Generated from the compiled specialist definition during the agentplane
# cutover. The tool grants reproduce the previous reach — every tool on each
# granted MCP server — so no capability was silently lost. What is new: each
# grant is named, `mutates` comes from the server's own read-only hint, and
# every mutating tool requires a human decision.
#
# Narrowing the read set per specialist is domain review, not mechanical work.
# Role: LF. Compiled only into a `role-lf` build (and the default all-roles build).
apiVersion: agentplane.hupe1980.github.io/v1alpha1
kind: Agent
metadata:
  name: tariff-optimization-agent
  version: "1.0.0"
spec:
  execution:
    kind: tool-calling
    max_turns: 12

  identity:
    role: >-
      §41a dynamic tariff upgrade advisor. Identifies iMSys customers not yet on
      dynamic tariffs, estimates annual savings vs fixed tariff, and recommends
      product changes in tarifbd.
    constraints: |
      You are the tariff optimization specialist.

      ## TRIGGERED BY
      - `de.billing.rechnung.erstellt` — analyse each new invoice for optimization potential
      - `de.mako.process.completed` — WiM completion may indicate new iMSys available

      ## PROCEDURE

      1. Call billingd `get_billing_summary` for the MaLo's 3-month average.
      2. Call edmd `get_timeseries` for 15-min reading availability (iMSys indicator).
      3. If 15-min data available and product is STROM without dynamic_epex: UPGRADE_CANDIDATE.
      4. Compare expected §41a cost vs current fixed tariff using billing `preview`.
      5. Check tarifbd for available dynamic EPEX product.

      ## UPGRADE CONDITIONS (§41a Abs. 1 EnWG)
      - MeteringMode=iMSys (BSI TR-03109 SMGW active) REQUIRED
      - EPEX price data available in tarifbd for billing period

      ## OUTPUT FORMAT
      ```
      OPTIMIZATION_STATUS: [OPTIMAL|UPGRADE_CANDIDATE|NOT_ELIGIBLE]
      CURRENT_TARIFF: [category and key price]
      POTENTIAL_ANNUAL_SAVINGS_EUR: [estimate or N/A]
      ELIGIBILITY_BLOCKER: [reason if NOT_ELIGIBLE]
      RECOMMENDED_ACTION: [specific step or NONE]
      ```

  capabilities:
    provides: [tariff.optimization]

  models:
    privileged:  { provider: anthropic, model: claude-sonnet-5 }

  security:
    max_sensitivity_egress: internal
    max_delegation_depth: 0
    max_sensitivity_journaled: internal

  oversight:
    approval:  tools-only
    approvers: [mako-operations]
    deadline:
      name: tariff-optimization-agent-freigabe
      kind: hours
      params: { n: 4 }
    on_expiry: deny

  budgets:
    max_tokens: 200000
    max_steps: 36
    max_effects: 60
    max_wallclock_secs: 900

  tools:
    - ref: tool://billingd/list_billing_records
      mutates: false
      max_sensitivity: internal
      description: "list billing records via billingd"
    - ref: tool://billingd/get_billing_record
      mutates: false
      max_sensitivity: internal
      description: "get billing record via billingd"
    - ref: tool://billingd/preview_billing
      mutates: false
      max_sensitivity: internal
      description: "preview billing via billingd"
