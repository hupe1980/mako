# APERAK / response-window deadline triage.
#
# ## This specialist runs no model, and that is declared
#
# `models: {}` is agentplane's way of saying **no inference at all, on purpose**
# — the thing that distinguishes a rules-only agent from one whose model wiring
# somebody forgot. There is no `execution` block either, so the behaviour is a
# registered skill: `agentd::skills::DeadlineTriage`.
#
# It used to be `execution: { kind: tool-calling }` with an eight-turn ceiling
# and a 200 000-token budget, and its prompt asked a frontier model to
# "classify by severity: < 30 min CRITICAL, < 2h WARNING, already overdue
# BREACH" and to "identify the responsible market participant". That is a
# subtraction, three comparisons, and reading `partner_mp_id` out of the JSON
# obsd returned — per deadline event, at whatever rate mako's counterparties
# approach their Fristen.
#
# Worse, it was untestable. "Is 29 minutes CRITICAL?" could only be answered by
# calling the model, so a drifting threshold was invisible to CI — under BNetzA
# monitoring, which is not where one wants to discover a threshold moved. The
# bands now live in `skills/deadline.rs` and are pinned at every boundary.
#
# Nothing about the governance changed. The tool call is still a journaled
# effect through the policy gate; the clock read is still an effect, so a replay
# classifies against the instant the original run saw; this manifest still binds
# the grant, the ceilings and the egress, and still carries a digest a reviewer
# approves. Governance was never what the model was buying.
#
# ## One grant, because one tool is called
#
# This file used to grant 34 tools across obsd, makod and marktd — inherited
# wholesale from the cutover, which handed every specialist its servers' full
# read surface. A coded skill's reach is legible: it calls
# `obsd/list_overdue_processes`, so that is what it may reach. Everything else
# was authority nobody had reasoned about.
#
# Cross-cutting: present in every role-scoped build.
apiVersion: agentplane.hupe1980.github.io/v1alpha1
kind: Agent
metadata:
  name: deadline-alert-agent
  version: "3.0.0"
spec:
  # No `execution`: the behaviour is `agentd::skills::DeadlineTriage`.
  # No `oversight`: this specialist reads and reports, and oversight without
  # execution is refused by agentplane rather than ignored.

  identity:
    role: >-
      MaKo deadline triage. Classifies processes past or approaching a BDEW
      response window — the business Antwortfrist and the APERAK acknowledgement
      clock, kept apart — by how much time remains, and attributes each to the
      market participant that owes the response.
    constraints: |
      The procedure is code, not prose: agentd::skills::deadline.

      Severity bands, pinned by unit test at every boundary:
        BREACH    the deadline has passed
        CRITICAL  under 30 minutes remain
        WARNING   under 2 hours remain
        COMPLIANT more than 2 hours remain

      The set classified is the union of the **triggering event** and obsd's
      overdue list, deduplicated by process_id. The trigger matters: a
      `de.obs.deadline.approaching` alert carries a deadline that is usually
      still in the future, and a run that ignored it answered only about
      processes that had already breached — saying nothing about the one it was
      woken for.

      Two different clocks produce these deadlines, and this specialist never
      conflates them:

        APERAK Frist   the technical acknowledgement — 45 min Strom weekday,
                       next Werktag 12:00 for a Gas Folgeprozess, 3 Werktage for
                       a Gas Initialprozess. A lapse arrives as
                       `de.mako.aperak.timeout`.
        Antwortfrist   the business answer — 11:00 of the 1. Werktag for a GPKE
                       Anmeldung, 4 Werktage for a Gas Anmeldung, 3/5/7/1 WT for
                       WiM Strom. This is what `deadline_at` holds.

      Both are obsd's to compute, from `mako_fristen` — the same Werktage
      calendar this plane resolves approval windows with. This specialist does
      not re-derive them: it reads `deadline_at`, subtracts, and quotes
      `deadline_source` so the answer cites the Festlegung rather than asserting
      a number.

  # What this agent is in a multi-agent arrangement.
  #
  # MAST measures inter-agent misalignment at 36.9 % of observed multi-agent
  # failures — a class that exists only if you choose it. Declaring the shape is
  # how you choose not to: `single` means one agent, one context, many tools, and
  # the inter-agent failure surface is structurally absent. `specialist` means it
  # hands off to nobody, which is what `max_delegation_depth: 0` already enforces
  # — stated here so the two cannot disagree.
  topology:
    mode: single
    role: specialist

  capabilities:
    provides: [deadline.alert]

  # No inference. Stated, not omitted.
  models: {}

  security:
    max_sensitivity_egress: internal
    max_delegation_depth: 0
    max_sensitivity_journaled: internal

  # A model-free specialist still needs ceilings: a tool server that hangs, or a
  # projection that returns 200 rows every time, is bounded here.
  #
  # No `max_tokens`, deliberately — and it used to say `max_tokens: 0`, which
  # read as "an agent that cannot infer must not be allowed to spend" and
  # actually meant "refuse this agent's first tool call": the budget gate
  # treats a zero ceiling as exhausted before any effect, tokens or not. The
  # agent cannot spend a token regardless (`models: {}` — there is no model to
  # ask); the ceilings that bind something are the ones below.
  budgets:
    max_steps: 4
    max_effects: 8
    max_wallclock_secs: 60

  # The alert is machine-readable, because something has to act on it.
  output:
    schema:
      type: object
      additionalProperties: false
      required: [deadline_status, at_risk_count, processes]
      properties:
        deadline_status:
          type: string
          enum: [COMPLIANT, WARNING, CRITICAL, BREACH]
          description: The worst severity in the set.
        at_risk_count:
          type: integer
          minimum: 0
          description: >-
            Processes classified in this run: the triggering alert plus obsd's
            overdue list, deduplicated by process_id. Was `overdue_count`, which
            was wrong twice over — the set includes the not-yet-overdue process
            the run was woken for.
        unclassifiable:
          type: integer
          minimum: 0
          description: >-
            Rows whose deadline could not be read. Counted rather than treated as
            compliant, so an obsd projection fault cannot hide behind a green
            alert.
        truncated:
          type: boolean
          description: >-
            obsd returned a full batch. At least the cap was waiting — never that
            the cap was all there was.
        by_partner_mp_id:
          type: object
          description: Count of at-risk processes per responsible market partner.
          additionalProperties:
            type: integer
        processes:
          type: array
          items:
            type: object
            required: [process_id, severity, remaining_secs]
            properties:
              process_id:    { type: string }
              pid:           { type: integer }
              state:         { type: string }
              partner_mp_id: { type: string }
              deadline_at:   { type: string }
              deadline_source:
                type: string
                description: >-
                  The Festlegung the deadline came from, as obsd stored it. A
                  recommendation that cites the rule beats one that asserts a
                  number.
              remaining_secs:
                type: integer
                description: Negative once the Frist has passed.
              severity:
                type: string
                enum: [COMPLIANT, WARNING, CRITICAL, BREACH]
        trigger:
          type: object
          description: The event that caused this run, reported back for correlation.

  tools:
    # The one tool the skill calls. obsd computes the deadlines with mako's own
    # BDEW calendar; this specialist classifies what it returns.
    - ref: tool://obsd/list_overdue_processes
      mutates: false
      max_sensitivity: internal
      description: "Processes past their regulatory deadline, most urgent first."
