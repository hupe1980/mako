# APERAK deadline monitor. Detects processes approaching BDEW MaKo response windows (45 min Strom UTILMD, 3 WT Gas APERAK). Triggers operator alerts when SLAs are at risk.
#
# Generated from the compiled specialist definition during the agentplane
# cutover. The tool grants reproduce the previous reach — every tool on each
# granted MCP server — so no capability was silently lost. What is new: each
# grant is named, `mutates` comes from the server's own read-only hint, and
# every mutating tool requires a human decision.
#
# Narrowing the read set per specialist is domain review, not mechanical work.
# Cross-cutting: present in every role-scoped build.
apiVersion: agentplane.hupe1980.github.io/v1alpha1
kind: Agent
metadata:
  name: deadline-alert-agent
  version: "1.0.0"
spec:
  execution:
    kind: tool-calling
    max_turns: 8

  identity:
    role: >-
      APERAK deadline monitor. Detects processes approaching BDEW MaKo response
      windows (45 min Strom UTILMD, 3 WT Gas APERAK). Triggers operator alerts
      when SLAs are at risk.
    constraints: |
      You are the deadline alert specialist for BDEW MaKo regulatory deadlines.

      ## DEADLINE RULES (APERAK AHB 1.0 §2.3 / §2.4.1)
      - STROM UTILMD/ORDERS weekday: 45 minutes
      - STROM UTILMD Saturday: Sonntag 12:00
      - STROM other: next Werktag 12:00
      - GAS Folgeprozesse: next Werktag 12:00
      - GAS Initialprozesse: 3 Werktage

      ## TRIGGERED BY
      - `de.obs.deadline.approaching` — a Frist is close to expiring
      - `de.mako.aperak.timeout` — the APERAK deadline passed unanswered
      - `de.mako.process.failed` — the process ended without a confirmation

      ## STEP-BY-STEP PROCEDURE

      1. Call obsd `list_overdue_processes` to get all processes past their deadline.
      2. For each overdue process, call obsd `get_process` for details.
      3. Classify by severity:
         - < 30 min remaining: CRITICAL
         - < 2h remaining: WARNING
         - Already overdue: BREACH
      4. Identify the responsible market participant and likely cause.
      5. Generate a structured alert for the operator dashboard.

      ## OUTPUT FORMAT
      ```
      DEADLINE_STATUS: [CRITICAL|WARNING|BREACH|COMPLIANT]
      OVERDUE_COUNT: [number]
      CRITICAL_PROCESSES: [list of process_ids with deadline_utc]
      RECOMMENDED_ACTION: [specific next step]
      ```

  capabilities:
    provides: [deadline.alert]

  models:
    privileged:  { provider: anthropic, model: claude-sonnet-5 }

  security:
    max_sensitivity_egress: internal
    max_delegation_depth: 0
    max_sensitivity_journaled: internal

  oversight:
    approval:  tools-only
    approvers: [mako-operations]
    deadline:
      name: deadline-alert-agent-freigabe
      kind: hours
      params: { n: 4 }
    on_expiry: deny

  budgets:
    max_tokens: 200000
    max_steps: 24
    max_effects: 40
    max_wallclock_secs: 900

  tools:
    - ref: tool://obsd/get_process
      mutates: false
      max_sensitivity: internal
      description: "get process via obsd"
    - ref: tool://obsd/list_overdue_processes
      mutates: true
      max_sensitivity: internal
      requires_approval: true
      description: "list overdue processes via obsd"
    - ref: tool://obsd/get_kpi_report
      mutates: false
      max_sensitivity: internal
      description: "get kpi report via obsd"
    - ref: tool://obsd/get_parity_report
      mutates: false
      max_sensitivity: internal
      description: "get parity report via obsd"
    - ref: tool://obsd/get_stp_rate
      mutates: false
      max_sensitivity: internal
      description: "get stp rate via obsd"
    - ref: tool://obsd/list_processes_by_family
      mutates: false
      max_sensitivity: internal
      description: "list processes by family via obsd"
    - ref: tool://makod/list_commands
      mutates: false
      max_sensitivity: internal
      description: "list commands via makod"
    - ref: tool://makod/submit_command
      mutates: true
      max_sensitivity: internal
      requires_approval: true
      description: "submit command via makod"
      protected_fields:
        - { path: "/malo_id", require_trusted: true }
        - { path: "/pid", require_trusted: true }
        - { path: "/mp_id", require_trusted: true }
    - ref: tool://makod/get_malo
      mutates: false
      max_sensitivity: internal
      description: "get malo via makod"
    - ref: tool://makod/list_partners
      mutates: false
      max_sensitivity: internal
      description: "list partners via makod"
    - ref: tool://makod/get_partner
      mutates: false
      max_sensitivity: internal
      description: "get partner via makod"
    - ref: tool://makod/get_health
      mutates: false
      max_sensitivity: internal
      description: "get health via makod"
    - ref: tool://makod/get_process
      mutates: false
      max_sensitivity: internal
      description: "get process via makod"
    - ref: tool://makod/list_overdue_deadlines
      mutates: false
      max_sensitivity: internal
      description: "list overdue deadlines via makod"
    - ref: tool://makod/list_active_processes
