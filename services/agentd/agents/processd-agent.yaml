# NB STP decision trace and LF E_0624 auto-response monitor. Explains why processd rejected an Anmeldung (which of 6 netz-checker checks failed), and tracks approval_queue items.
#
# Generated from the compiled specialist definition during the agentplane
# cutover. The tool grants reproduce the previous reach — every tool on each
# granted MCP server — so no capability was silently lost. What is new: each
# grant is named, `mutates` comes from the server's own read-only hint, and
# every mutating tool requires a human decision.
#
# Narrowing the read set per specialist is domain review, not mechanical work.
# Cross-cutting: present in every role-scoped build.
apiVersion: agentplane.hupe1980.github.io/v1alpha1
kind: Agent
metadata:
  name: processd-agent
  version: "1.0.0"
spec:
  execution:
    kind: tool-calling
    max_turns: 10

  identity:
    role: >-
      NB STP decision trace and LF E_0624 auto-response monitor. Explains why
      processd rejected an Anmeldung (which of 6 netz-checker checks failed), and
      tracks approval_queue items.
    constraints: |
      You are the process decision engine specialist.

      ## TRIGGERED BY
      - `de.mako.process.initiated` — new GPKE/WiM process started
      - `de.mako.aperak.rejected` — the counterparty rejected the Anmeldung
      - `de.mako.process.failed` — the process ended without a confirmation

      ## FOR REJECTED ANMELDUNG (6 netz-checker checks)
      Check 1: malo_id format and registry
      Check 2: Zählpunkt active in marktd
      Check 3: NB contract valid for billing period
      Check 4: Counterparty (LF/MSB) published in bdew-codes.de
      Check 5: NB contract in marktd (malo_grid record)
      Check 6: No active Sperrauftrag blocking delivery

      1. Call processd to get the decision detail (which checks passed/failed).
      2. For each failed check: identify the specific data gap in marktd.
      3. Recommend correction (e.g. malo_grid PUT provisioning, NB contract update).

      ## OUTPUT FORMAT
      ```
      DECISION: [ACCEPTED|REJECTED]
      FAILED_CHECKS: [list of {check_number, description, erc_code}]
      ROOT_CAUSE: [one sentence]
      CORRECTION: [specific step to unblock]
      ```

  capabilities:
    provides: [processd]

  models:
    privileged:  { provider: anthropic, model: claude-sonnet-5 }
    quarantined: { provider: anthropic, model: claude-haiku-4-5 }

  security:
    max_sensitivity_egress: internal
    max_delegation_depth: 0
    max_sensitivity_journaled: internal

  oversight:
    approval:  tools-only
    approvers: [mako-operations]
    deadline:
      name: processd-agent-freigabe
      kind: hours
      params: { n: 4 }
    on_expiry: deny

  budgets:
    max_tokens: 200000
    max_steps: 30
    max_effects: 50
    max_wallclock_secs: 900

  tools:
    - ref: tool://processd/list_decisions
      mutates: true
      max_sensitivity: internal
      requires_approval: true
      description: "list decisions via processd"
    - ref: tool://processd/get_decision
      mutates: true
      max_sensitivity: internal
      requires_approval: true
      description: "get decision via processd"
    - ref: tool://processd/get_stp_breakdown_by_erc
      mutates: true
      max_sensitivity: internal
      requires_approval: true
      description: "get stp breakdown by erc via processd"
    - ref: tool://processd/list_affiliate_decisions
      mutates: true
      max_sensitivity: internal
      requires_approval: true
      description: "list affiliate decisions via processd"
    - ref: tool://processd/get_stp_rate
      mutates: true
      max_sensitivity: internal
      requires_approval: true
      description: "get stp rate via processd"
    - ref: tool://processd/list_pending_approvals
      mutates: true
      max_sensitivity: internal
      requires_approval: true
      description: "list pending approvals via processd"
    - ref: tool://processd/get_queue_entry
      mutates: true
      max_sensitivity: internal
      requires_approval: true
      description: "get queue entry via processd"
    - ref: tool://processd/approve_queue_entry
      mutates: true
      max_sensitivity: internal
      requires_approval: true
      description: "approve queue entry via processd"
    - ref: tool://processd/reject_queue_entry
      mutates: true
      max_sensitivity: internal
      requires_approval: true
      description: "reject queue entry via processd"
    - ref: tool://marktd/get_malo
      mutates: false
      max_sensitivity: confidential
      description: "get malo via marktd"
    - ref: tool://marktd/list_partners
      mutates: false
      max_sensitivity: confidential
      description: "list partners via marktd"
