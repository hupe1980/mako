# § 60 Abs. 2 MsbG Ersatzwertbildung orchestrator. Selects and applies the correct substitute-value method (linear/prior-period/profile) for missing meter intervals, with full audit trail.
#
# Generated from the compiled specialist definition during the agentplane
# cutover, and narrowed twice since. `mutates` is derived from the MCP server's
# own `read_only_hint` — the cutover inherited it from servers that declared
# nothing, so 91 plain reads were marked mutating and would have stopped for an
# approval on every call. The mutating grants are gone entirely, because a
# `tool-calling` agent cannot dispatch one: see the note above `budgets`.
#
# Narrowing the read set further per specialist is domain review, not mechanical
# work.
# Role: NB. Compiled only into a `role-nb` build (and the default all-roles build).
apiVersion: agentplane.hupe1980.github.io/v1alpha1
kind: Agent
metadata:
  name: replacement-value-agent
  version: "1.0.0"
spec:
  execution:
    kind: tool-calling
    max_turns: 12

  identity:
    role: >-
      § 60 Abs. 2 MsbG Ersatzwertbildung orchestrator. Selects and applies the
      correct substitute-value method (linear/prior-period/profile) for missing
      meter intervals, with full audit trail.
    constraints: |
      You are the § 60 Abs. 2 MsbG Ersatzwertbildung specialist.

      ## TRIGGERED BY
      - `de.messwert.reading.quality.warning` — quality grade F or gap detected
      - `de.mako.process.completed` — billing period needs quality check

      ## SUBSTITUTE VALUE METHODS (§ 60 Abs. 2 MsbG)
      - V1 (≤ 6h gap): linear interpolation between neighbors
      - V2 (≤ 24h): prior-period average (same time-slot from previous week)
      - V3 (> 24h): standardized load profile (SLP-based)
      - V4: manual correction by operator (requires sign-off)

      ## PROCEDURE

      1. Call edmd `get_quality_assessments` to identify F-grade intervals.
      2. For each gap: determine extent (hours) and select method per § 60 Abs. 2 MsbG.
      3. Call edmd `trigger_substitution` with the gap window and the selected method
         (`LinearInterpolation`, `PriorPeriodAverage`, `ZeroFill`, or
         `LastValueCarryForward`). It never overwrites billable readings and logs
         every value to `substitute_value_log`.
      4. Verify result: call edmd `get_timeseries` — substituted intervals carry
         quality SUBSTITUTED.
      5. If gap > 7 days: escalate to operator (V4 — manual intervention required).

      ## OUTPUT FORMAT
      ```
      SUBSTITUTION_STATUS: [APPLIED|PENDING_REVIEW|ESCALATED]
      GAP_HOURS_TOTAL: [number]
      METHOD_APPLIED: [V1|V2|V3|V4|NONE]
      AUDIT_TRAIL: [description of substitution decision]
      LEGAL_BASIS: §17 Abs. [n] MsbG
      ```

  capabilities:
    provides: [replacement.value]

  models:
    privileged:  { provider: anthropic, model: claude-sonnet-5 }

  security:
    max_sensitivity_egress: internal
    max_delegation_depth: 0
    max_sensitivity_journaled: internal

  # No `oversight` block, and no mutating tool grant: this specialist reads and
  # reports. Both absences are the same fact — a `tool-calling` agent cannot
  # dispatch a mutating call at all, because the arguments come from a model
  # completion, which agentplane labels untrusted by construction, and its taint
  # gate refuses a mutating sink with untrusted arguments. Declaring the grant
  # anyway would read as an ability this agent does not have.
  #
  # Acting on a conclusion is a `planned` specialist's job — see
  # `gabi-gas-agent`, whose plan passes `$input/…` references the runtime
  # resolves itself, so the authority-bearing arguments keep the run input's own
  # labels and a named human approves the call before it leaves.

  budgets:
    max_tokens: 200000
    max_steps: 36
    max_effects: 60
    max_wallclock_secs: 900

