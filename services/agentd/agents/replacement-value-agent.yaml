# yaml-language-server: $schema=https://hupe1980.github.io/agentplane/agent.schema.json
# § 60 Abs. 2 MsbG Ersatzwertbildung review specialist. Assesses gaps and recommends a substitute-value method with an audit trail.
#
# Every grant below is a tool this specialist's own procedure names, and every
# tool the procedure names is granted. `cargo xtask check-prompt-tools` holds the
# two together in both directions, so a grant nobody instructs — a whole server's
# read surface handed over because the specialist touches that server — cannot
# come back. `mutates` is derived from the server's own `read_only_hint`, and
# there are no mutating grants here at all: a `tool-calling` agent cannot
# dispatch one, so declaring it would read as an ability this agent does not
# have. See the note above `budgets`.
# Role: MSB. Compiled only into a `role-msb` build (and the default all-roles build).
apiVersion: agentplane.hupe1980.github.io/v1alpha1
kind: Agent
metadata:
  name: replacement-value-agent
  version: "2.0.0"
spec:
  execution:
    kind: tool-calling
    max_turns: 12

  identity:
    role: >-
      § 60 Abs. 2 MsbG Ersatzwertbildung review specialist. Assesses missing
      intervals and recommends the method the MSB should apply, with an audit trail.
    constraints: |
      You are the § 60 Abs. 2 MsbG Ersatzwertbildung specialist.

      ## TRIGGERED BY
      - `de.messwert.reading.quality.warning` — quality grade F or gap detected
      - `de.mako.process.completed` — billing period needs quality check

      ## WHAT § 60 Abs. 2 MsbG ACTUALLY SAYS

      It makes the Aufbereitung der Messwerte — *"insbesondere die
      Plausibilisierung und die Ersatzwertbildung"* — the Messstellenbetreiber's
      duty. It names **no method**, no gap length and no threshold. Anything
      below is edmd's implementation and mako's operating default, not statute,
      and must be reported as such: a recommendation that cites § 60 Abs. 2 for a
      *method* is citing it for something it does not contain.

      ## THE METHODS edmd IMPLEMENTS

      Exactly four, and nothing else can be applied:
      - `PriorPeriodAverage` — the **default**. The same time-of-day slot over the
        preceding reference days; the window is 7 days and edmd ignores anything
        past it, because the Vergleichstag rule is a weekday-matched one.
      - `LinearInterpolation` — between the values bracketing the gap. Needs both,
        so it cannot open or close a series.
      - `LastValueCarryForward` — the last value before the gap, held.
      - `ZeroFill` — zero, for a gap where nothing was consumed and that is known
        rather than assumed.

      There is no load-profile method. Recommending an SLP substitution names
      something edmd cannot do, and the step then silently does not happen.

      ## CHOOSING ONE — mako's operating default, not a rule

      - A gap short enough to be bracketed and inside one day: `LinearInterpolation`.
      - Anything longer, or unbracketed: `PriorPeriodAverage`, edmd's own default.
      - `ZeroFill` only where the absence of consumption is established.
      - `LastValueCarryForward` only for a register that does not decrease.
      Say which of these the recommendation rests on. The operator chooses; edmd
      applies; § 60 Abs. 2 MsbG is why somebody has to.

      ## PROCEDURE

      1. Call edmd `get_quality_assessments` to identify F-grade intervals.
      2. For each gap: determine its extent, whether it is bracketed by real
         readings, and which of edmd's four methods fits.
      3. **Recommend** the substitution window and method. Do not call
         `trigger_substitution`: it mutates, and a tool-calling specialist cannot
         dispatch a mutating call — its arguments come from a model completion,
         which the taint gate refuses at a mutating sink
         (`LinearInterpolation`, `PriorPeriodAverage`, `ZeroFill`, or
         `LastValueCarryForward`). It never overwrites billable readings and logs
         every value to `substitute_value_log`.
      4. Verify result: call edmd `get_timeseries` — substituted intervals carry
         quality SUBSTITUTED.
      5. Call edmd `get_correction_history` before recommending anything: a window that
         has already been substituted must not be substituted a second time, and the
         history is the only place that says so.
      6. A gap wider than edmd's 7-day reference window has no comparable days
         behind it, so `PriorPeriodAverage` would average nothing: escalate to
         the operator for a manual correction instead of naming a method.

  # What this agent is in a multi-agent arrangement.
  #
  # MAST measures inter-agent misalignment at 36.9 % of observed multi-agent
  # failures — a class that exists only if you choose it. Declaring the shape is
  # how you choose not to: `single` means one agent, one context, many tools, and
  # the inter-agent failure surface is structurally absent. `specialist` means it
  # hands off to nobody, which is what `max_delegation_depth: 0` already enforces
  # — stated here so the two cannot disagree.
  topology:
    mode: single
    role: specialist

  capabilities:
    provides: [replacement.value]

  models:
    privileged:  { provider: anthropic, model: claude-sonnet-5 }

  security:
    max_sensitivity_egress: internal
    max_delegation_depth: 0
    max_sensitivity_journaled: internal

  # Read-only evidence and recommendations. Terminal outcomes open MSB triage.

  oversight:
    approval: none
    deadline: { name: replacement-value-review, kind: working-days, params: { n: 1 } }
    on_expiry: escalate
    escalate_to: [mako-operations]
    triage:
      - name: replacement-value-escalation
        audience: [metering]
        priority: urgent
        summary: Ersatzwertbildung needs metering-operations review.
        when:
          - path: /substitution_status
            in: [PENDING_REVIEW, ESCALATED]
        deadline: { name: replacement-value-review, kind: working-days, params: { n: 1 } }

  budgets:
    max_tokens: 200000
    max_steps: 36
    max_effects: 60
    max_wallclock_secs: 900

  # The result contract. It was a prose fence inside the prompt, which made
  # every consumer a parser of free text; as a schema the model is held to it
  # and a change to it changes the manifest digest.
  output:
    schema:
      type: object
      additionalProperties: false
      required:
        - substitution_status
        - gap_hours_total
        - method_applied
      properties:
        substitution_status:
          type: string
          enum:
            - RECOMMENDED
            - PENDING_REVIEW
            - ESCALATED
        gap_hours_total:
          type: number
        method_applied:
          type: string
          enum:
            - LINEAR_INTERPOLATION
            - PRIOR_PERIOD_AVERAGE
            - LAST_VALUE_CARRY_FORWARD
            - ZERO_FILL
            - NONE
        audit_trail:
          type: string
        legal_basis:
          type: string

  # Knowledge, granted rather than copied.
  #
  # mako's MCP servers publish 57 step-by-step prompts across 15 servers for
  # their own procedures. A specialist names the one it needs; a hand-typed
  # paraphrase in `constraints` would be a second copy with nothing keeping the
  # two in agreement — the server's prompt changes with the code, a paraphrase
  # changes when somebody remembers.
  #
  # A context grant is not a tool grant. Reading a prompt authorises no action,
  # but it does cross a trust and data-egress boundary, which is why it is
  # declared here where a reviewer sees it rather than fetched silently.
  context:
    prompts:
      - server: edmd
        name: quality-assessment
        max_input_sensitivity: internal
        output_sensitivity: internal

  tools:
    - ref: tool://edmd/get_quality_assessments
      mutates: false
      max_sensitivity: internal
      description: >-
        The F-grade intervals that need a substitute value.

    - ref: tool://edmd/get_timeseries
      mutates: false
      max_sensitivity: internal
      description: >-
        The intervals around the gap, which decide the method and prove the
        result.

    - ref: tool://edmd/get_correction_history
      mutates: false
      max_sensitivity: internal
      description: >-
        Substitutions already applied to the period, so one is not proposed
        twice.
