# yaml-language-server: $schema=https://hupe1980.github.io/agentplane/agent.schema.json
# Post-issuance § 40 / § 41a Abs. 2 / § 42 EnWG compliance review. Detects defects and opens correction work; billingd owns the pre-dispatch gate.
#
# Every grant below is a tool this specialist's own procedure names, and every
# tool the procedure names is granted. `cargo xtask check-prompt-tools` holds the
# two together in both directions, so a grant nobody instructs — a whole server's
# read surface handed over because the specialist touches that server — cannot
# come back. `mutates` is derived from the server's own `read_only_hint`, and
# there are no mutating grants here at all: a `tool-calling` agent cannot
# dispatch one, so declaring it would read as an ability this agent does not
# have. See the note above `budgets`.
# Role: LF. Compiled only into a `role-lf` build (and the default all-roles build).
apiVersion: agentplane.hupe1980.github.io/v1alpha1
kind: Agent
metadata:
  name: billing-regulatory-guard-agent
  version: "2.0.0"
spec:
  execution:
    kind: tool-calling
    max_turns: 12

  identity:
    role: >-
      Post-issuance § 40 / § 41a Abs. 2 / § 42 EnWG compliance review. Validates every
      dispatched invoice for the Pflichtangaben of § 40 Abs. 2, the Berechnungsfaktoren
      of § 40 Abs. 4, the § 41a Abs. 2 iMSys precondition, the Stromkennzeichnung, the
      Preisgarantie the contract states, arithmetic invariants and MwSt validity.
    constraints: |
      You are the regulatory compliance guard for retail energy billing under German EnWG.

      ## TRIGGERED BY
      - `de.billing.rechnung.erstellt` — every new invoice must pass this check

      ## WHICH PARAGRAPH GOVERNS WHAT

      The invoice is § 40 EnWG (Inhalt von Energierechnungen). The **contract** is
      § 41. They are different obligations and the codes below keep them apart, because
      an operator handed the wrong § cannot find the rule they are said to have broken.
      § 40a is neither: it is Verbrauchsermittlung — how a consumption figure may be
      arrived at — and nothing on this list rests on it.

      ## COMPLIANCE CHECKS

      ### § 40 Abs. 1 EnWG — the amount due, and when
      `gesamtbrutto.wert` and the Zahlungsziel must both be set and prominent.
      Missing: ERROR SECT40_BETRAG_OR_FAELLIGKEIT_MISSING.

      ### § 40 Abs. 4 EnWG — Berechnungsfaktoren
      The factors the claim is computed from must be complete and in ordinary language:
      `rechnung_json.zusatzAttribute[name="kilowattstundenpreis"]`, the Arbeitspreis and
      the Grundpreis behind it.
      Missing: WARNING SECT40_BERECHNUNGSFAKTOREN_MISSING.

      ### § 40 Abs. 2 EnWG — Pflichtangaben on the invoice
      - `rechnungsnummer` set and non-empty → ERROR if missing
      - `rechnungsperiode.startdatum` and `enddatum` set (Nr. 6)
      - Anfangs- and Endzählerstand and how the reading was obtained (Nr. 6)
      - `nb_mp_id` — the Codenummer des Netzbetreibers (Nr. 5) → WARNING
        SECT40_NB_CODE_MISSING if absent. Confirm it against marktd `get_malo`.
      - `gesamtbrutto.wert` ≈ Σ(rechnungspositionen[].gesamtpreis.wert) ± 0.01 → ERROR
        if mismatch

      ### § 40 Abs. 3 EnWG — Umlagen und Abgaben gesondert
      Levies that are Kalkulationsbestandteile of the billed price must be shown
      separately. Absent on a Strom invoice: WARNING SECT40_UMLAGEN_NOT_ITEMISED.

      ### Preisgarantie — a contract term, checked against the contract
      Call vertragd `check_preisgarantie` for the MaLo and the billing period. Positions
      repricing a period the guarantee covers must not raise a guaranteed component:
      the contract's own Preisanpassungsklausel is what § 41 Abs. 1 Nr. 5 EnWG requires
      the contract to state, and this invoice contradicts it.
      Violation: ERROR PREISGARANTIE_VIOLATION.
      A price change *outside* a guarantee window is lawful and is not a finding here —
      what it needs is the § 41 Abs. 5 EnWG notice, which vertragd-agent tracks.

      ### § 41a Abs. 2 EnWG — iMSys guard for dynamic tariffs
      If any position has tag `"sect41a"`: verify `metering_mode=IMSYS`.
      SLP/RLM + dynamic tariff → ERROR SECT41A_IMSYS_REQUIRED.

      ### § 42 EnWG — Stromkennzeichnung on the invoice
      For STROM the Energieträgermix (§ 42 Abs. 1 Nr. 1) and the CO₂ and radioactive-waste
      figures (§ 42 Abs. 1 Nr. 2) must reach the customer with the invoice. Read them from
      productd `get_product_energiemix` and check the invoice carries them.
      Missing: WARNING SECT42_ENERGIEMIX_MISSING.

      ### Arithmetic invariants
      `netto_eur + mwst_eur = brutto_eur` (±0.01) → ERROR ARITHMETIC_INVARIANT.
      All MwSt rates ∈ {0%, 7%, 19%} → ERROR INVALID_MWST_RATE if other value.

      ## STEP-BY-STEP PROCEDURE

      1. Extract `record_id` and `malo_id` from the CE payload.
      2. Call billingd `get_billing_record` for full Rechnung JSON.
      3. Run all compliance checks above in sequence.
      4. Call billingd `validate_tariff_config` with the invoice's tariff category.
      5. Aggregate findings and determine overall status. Every finding names the
         Absatz it rests on, not just the §.
      6. If ERROR-severity: emit alert.

  # What this agent is in a multi-agent arrangement.
  #
  # MAST measures inter-agent misalignment at 36.9 % of observed multi-agent
  # failures — a class that exists only if you choose it. Declaring the shape is
  # how you choose not to: `single` means one agent, one context, many tools, and
  # the inter-agent failure surface is structurally absent. `specialist` means it
  # hands off to nobody, which is what `max_delegation_depth: 0` already enforces
  # — stated here so the two cannot disagree.
  topology:
    mode: single
    role: specialist

  capabilities:
    provides: [billing.regulatory.guard]

  models:
    privileged:  { provider: anthropic, model: claude-sonnet-5 }

  security:
    max_sensitivity_egress: internal
    max_delegation_depth: 0
    max_sensitivity_journaled: internal

  # No mutating tool grant, and no approval: this specialist reads and reports.
  # Both absences are the same fact — a `tool-calling` agent cannot dispatch a
  # mutating call at all, because the arguments come from a model completion,
  # which agentplane labels untrusted by construction, and its taint gate refuses
  # a mutating sink with untrusted arguments. Declaring the grant anyway would
  # read as an ability this agent does not have.
  #
  # It does declare `oversight`, for **triage** — a row beside a finished answer
  # rather than a gate in front of a call. That is the only mode that fits an
  # agent which cannot act: gating its answer would gate nothing while suspending
  # a run per finding.
  #

  # Human-in-the-loop, beside the answer rather than in front of it.
  #
  # `approval: none` — this specialist cannot act, so there is nothing to gate.
  # A `tool-calling` agent's arguments come from a model completion, which the
  # taint gate refuses at a mutating sink; it reads and reports. `tools-only`
  # would therefore gate nothing, and `required` would suspend a run per finding
  # and cost a case row until somebody clears it.
  #
  # `triage` is the third mode agentplane 0.15 added for exactly this: the run
  # completes and returns, and a matching answer *also* opens a worklist row.
  # Reporting, not control flow — which is why a triage rule may carry a
  # predicate where `approval` deliberately may not.
  #
  # Every `path` below is typed against this agent's own `output.schema` at parse
  # time, so a rule that could never fire is refused rather than reading in
  # review exactly like one that does. That check only became possible once the
  # answers were schemas instead of prose.
  oversight:
    approval: none
    # `approval: none` means nothing waits, so this bounds no wait — the field
    # is required and states the same window the rule below uses. One figure
    # written twice is cheaper than one field meaning two things.
    deadline:
      name: billing-compliance-review
      kind: hours
      params: { n: 4 }
    # A triage row *is* the finding, so an unanswered one widens rather than
    # closes: `deny` would take it out of the worklist and delete the delivery
    # of a breach that was correctly detected. (gabi-gas-agent's dispatching
    # approval stays `deny` for the opposite reason — it gates, so it must fail
    # closed.)
    on_expiry: escalate
    escalate_to: [mako-operations]
    triage:
      - name: billing-compliance
        audience: [billing-compliance]
        priority: urgent
        summary: >-
          An issued Rechnung failed a § 40 / § 41a / § 42 EnWG check. Review correction or cancellation; pre-dispatch blocking remains billingd's deterministic responsibility.
        when:
          - path: /compliance_status
            equals: "VIOLATIONS"
        deadline:
          name: billing-compliance-review
          kind: hours
          params: { n: 4 }

  budgets:
    max_tokens: 200000
    max_steps: 36
    max_effects: 60
    max_wallclock_secs: 900

  # The result contract. It was a prose fence inside the prompt, which made
  # every consumer a parser of free text; as a schema the model is held to it
  # and a change to it changes the manifest digest.
  output:
    schema:
      type: object
      additionalProperties: false
      required:
        - compliance_status
        - error_count
        - warning_count
      properties:
        compliance_status:
          type: string
          enum:
            - COMPLIANT
            - WARNINGS
            - VIOLATIONS
        error_count:
          type: number
        warning_count:
          type: number
        findings:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [code, severity, paragraph]
            properties:
              # **Closed, because a consumer keys on it.** The procedure defines
              # nine codes; as a free string the model could invent a tenth and a
              # downstream rule matching `SECT41A_IMSYS_REQUIRED` would silently
              # never fire. An enum makes the vocabulary the whole vocabulary.
              code:
                type: string
                enum:
                  - SECT40_BETRAG_OR_FAELLIGKEIT_MISSING
                  - SECT40_BERECHNUNGSFAKTOREN_MISSING
                  - SECT40_NB_CODE_MISSING
                  - SECT40_UMLAGEN_NOT_ITEMISED
                  - PREISGARANTIE_VIOLATION
                  - SECT41A_IMSYS_REQUIRED
                  - SECT42_ENERGIEMIX_MISSING
                  - ARITHMETIC_INVARIANT
                  - INVALID_MWST_RATE
              severity:
                type: string
                enum: [ERROR, WARNING]
              paragraph:
                type: string
                description: >-
                  The Absatz the finding rests on, not just the §. An operator
                  handed "§ 40 EnWG" cannot find the rule; "§ 40 Abs. 2 Nr. 5"
                  is a sentence they can read.
              description:
                type: string
        dispatch_safe:
          type: string
          enum:
            - YES
            - NO

  # Knowledge, granted rather than copied.
  #
  # mako's MCP servers publish 57 step-by-step prompts across 15 servers for
  # their own procedures. A specialist names the one it needs; a hand-typed
  # paraphrase in `constraints` would be a second copy with nothing keeping the
  # two in agreement — the server's prompt changes with the code, a paraphrase
  # changes when somebody remembers.
  #
  # A context grant is not a tool grant. Reading a prompt authorises no action,
  # but it does cross a trust and data-egress boundary, which is why it is
  # declared here where a reviewer sees it rather than fetched silently.
  context:
    prompts:
      - server: billingd
        name: check-dynamic-tariff
        max_input_sensitivity: internal
        output_sensitivity: internal
      - server: billingd
        name: 14a-steuerungsrabatt
        max_input_sensitivity: internal
        output_sensitivity: internal

  tools:
    - ref: tool://billingd/get_billing_record
      mutates: false
      max_sensitivity: internal
      description: >-
        The full Rechnung JSON every § 40 EnWG field check reads.

    - ref: tool://billingd/validate_tariff_config
      mutates: false
      max_sensitivity: internal
      description: >-
        Whether the tariff the invoice was built from is itself well-formed.

    - ref: tool://vertragd/check_preisgarantie
      mutates: false
      max_sensitivity: confidential
      description: >-
        The Preisgarantie window the repricing check needs — without it the
        check is unanswerable.

    - ref: tool://productd/get_product_energiemix
      mutates: false
      max_sensitivity: internal
      description: >-
        The § 42 EnWG Energiemix and CO₂ figures the invoice must carry.

    - ref: tool://marktd/get_malo
      mutates: false
      max_sensitivity: confidential
      description: >-
        The Netzbetreiber code § 40 Abs. 2 Nr. 5 EnWG requires on the invoice.
