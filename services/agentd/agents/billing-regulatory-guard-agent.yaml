# yaml-language-server: $schema=https://hupe1980.github.io/agentplane/agent.schema.json
# Post-billing §40/§41/§41a Abs. 1/§42 EnWG compliance guard. Validates every dispatched invoice for mandatory fields, §41a Abs. 1 iMSys requirement, CO₂ label, arithmetic invariants, and MwSt validity.
#
# Generated from the compiled specialist definition during the agentplane
# cutover, and narrowed twice since. `mutates` is derived from the MCP server's
# own `read_only_hint` — the cutover inherited it from servers that declared
# nothing, so 91 plain reads were marked mutating and would have stopped for an
# approval on every call. The mutating grants are gone entirely, because a
# `tool-calling` agent cannot dispatch one: see the note above `budgets`.
#
# Narrowing the read set further per specialist is domain review, not mechanical
# work.
# Role: LF. Compiled only into a `role-lf` build (and the default all-roles build).
apiVersion: agentplane.hupe1980.github.io/v1alpha1
kind: Agent
metadata:
  name: billing-regulatory-guard-agent
  version: "1.1.0"
spec:
  execution:
    kind: tool-calling
    max_turns: 12

  identity:
    role: >-
      Post-billing §40/§41/§41a Abs. 1/§42 EnWG compliance guard. Validates every
      dispatched invoice for mandatory fields, §41a Abs. 1 iMSys requirement, CO₂
      label, arithmetic invariants, and MwSt validity.
    constraints: |
      You are the regulatory compliance guard for retail energy billing under German EnWG.

      ## TRIGGERED BY
      - `de.billing.rechnung.erstellt` — every new invoice must pass this check

      ## COMPLIANCE CHECKS

      ### §40a EnWG — Kilowattstundenpreis (MANDATORY for Haushalt/Gewerbe)
      Check: `rechnung_json.zusatzAttribute[name="kilowattstundenpreis"]` exists.
      If missing: WARNING SECT40A_MISSING.

      ### §41 EnWG — Pflichtinhalte
      - `rechnungsnummer` set and non-empty → ERROR if missing
      - `rechnungsperiode.startdatum` and `enddatum` set
      - `gesamtbrutto.wert` ≈ Σ(rechnungspositionen[].gesamtpreis.wert) ± 0.01 → ERROR if mismatch
      - `nb_mp_id` present (§41 Abs. 1 Nr. 5) → WARNING SECT41_NB_MISSING if absent

      ### §41 Abs. 5 EnWG — Preisgarantie
      Positions repricing a period covered by an active Preisgarantie (vertragd `preisgarantie_bis` >= period end) must not raise guaranteed price components. Violation: ERROR SECT41_PREISGARANTIE_VIOLATION.

      ### §41a Abs. 1 EnWG — iMSys guard for §41a dynamic tariffs
      If any position has tag `"sect41a"`: verify `metering_mode=IMSYS`.
      SLP/RLM + dynamic tariff → ERROR SECT41A_IMSYS_REQUIRED.

      ### §42 EnWG — Energiemix + CO₂ label
      For STROM: `zusatzAttribute[name="energiemix"]` or `zusatzAttribute[name="co2_g_per_kwh"]` must exist.
      Missing: WARNING SECT42_ENERGIEMIX_MISSING.

      ### Arithmetic invariants
      `netto_eur + mwst_eur = brutto_eur` (±0.01) → ERROR ARITHMETIC_INVARIANT.
      All MwSt rates ∈ {0%, 7%, 19%} → ERROR INVALID_MWST_RATE if other value.

      ## STEP-BY-STEP PROCEDURE

      1. Extract `record_id` and `malo_id` from the CE payload.
      2. Call billingd `get_billing_record` for full Rechnung JSON.
      3. Run all compliance checks above in sequence.
      4. Call billingd `validate_tariff_config` with the invoice's tariff category.
      5. Aggregate findings and determine overall status.
      6. If ERROR-severity: emit alert.

  # What this agent is in a multi-agent arrangement.
  #
  # MAST measures inter-agent misalignment at 36.9 % of observed multi-agent
  # failures — a class that exists only if you choose it. Declaring the shape is
  # how you choose not to: `single` means one agent, one context, many tools, and
  # the inter-agent failure surface is structurally absent. `specialist` means it
  # hands off to nobody, which is what `max_delegation_depth: 0` already enforces
  # — stated here so the two cannot disagree.
  topology:
    mode: single
    role: specialist

  capabilities:
    provides: [billing.regulatory.guard]

  models:
    privileged:  { provider: anthropic, model: claude-sonnet-5 }

  security:
    max_sensitivity_egress: internal
    max_delegation_depth: 0
    max_sensitivity_journaled: internal

  # No `oversight` block, and no mutating tool grant: this specialist reads and
  # reports. Both absences are the same fact — a `tool-calling` agent cannot
  # dispatch a mutating call at all, because the arguments come from a model
  # completion, which agentplane labels untrusted by construction, and its taint
  # gate refuses a mutating sink with untrusted arguments. Declaring the grant
  # anyway would read as an ability this agent does not have.
  #
  # Acting on a conclusion is a `planned` specialist's job — see
  # `gabi-gas-agent`, whose plan passes `$input/…` references the runtime
  # resolves itself, so the authority-bearing arguments keep the run input's own
  # labels and a named human approves the call before it leaves.

  # Human-in-the-loop, beside the answer rather than in front of it.
  #
  # `approval: none` — this specialist cannot act, so there is nothing to gate.
  # A `tool-calling` agent's arguments come from a model completion, which the
  # taint gate refuses at a mutating sink; it reads and reports. `tools-only`
  # would therefore gate nothing, and `required` would suspend a run per finding
  # and cost a case row until somebody clears it.
  #
  # `triage` is the third mode agentplane 0.15 added for exactly this: the run
  # completes and returns, and a matching answer *also* opens a worklist row.
  # Reporting, not control flow — which is why a triage rule may carry a
  # predicate where `approval` deliberately may not.
  #
  # Every `path` below is typed against this agent's own `output.schema` at parse
  # time, so a rule that could never fire is refused rather than reading in
  # review exactly like one that does. That check only became possible once the
  # answers were schemas instead of prose.
  oversight:
    approval: none
    # `approval: none` means nothing waits, so this bounds no wait — the field
    # is required and states the same window the rule below uses. One figure
    # written twice is cheaper than one field meaning two things.
    deadline:
      name: billing-compliance-review
      kind: hours
      params: { n: 4 }
    # A triage row *is* the finding, so an unanswered one widens rather than
    # closes: `deny` would take it out of the worklist and delete the delivery
    # of a breach that was correctly detected. (gabi-gas-agent's dispatching
    # approval stays `deny` for the opposite reason — it gates, so it must fail
    # closed.)
    on_expiry: escalate
    escalate_to: [mako-operations]
    triage:
      - name: billing-compliance
        audience: [billing-compliance]
        priority: urgent
        summary: >-
          A Rechnung failed a §40a/§41/§42 EnWG check. It must not be dispatched until the finding is resolved or overruled.
        when:
          - path: /compliance_status
            equals: "VIOLATIONS"
        deadline:
          name: billing-compliance-review
          kind: hours
          params: { n: 4 }

  budgets:
    max_tokens: 200000
    max_steps: 36
    max_effects: 60
    max_wallclock_secs: 900

  # The result contract. It was a prose fence inside the prompt, which made
  # every consumer a parser of free text; as a schema the model is held to it
  # and a change to it changes the manifest digest.
  output:
    schema:
      type: object
      additionalProperties: false
      required:
        - compliance_status
        - error_count
        - warning_count
      properties:
        compliance_status:
          type: string
          enum:
            - COMPLIANT
            - WARNINGS
            - VIOLATIONS
        error_count:
          type: number
        warning_count:
          type: number
        findings:
          type: array
          items:
            type: object
            properties:
              code:
                type: string
              severity:
                type: string
              paragraph:
                type: string
              description:
                type: string
        dispatch_safe:
          type: string
          enum:
            - YES
            - NO

  # Knowledge, granted rather than copied.
  #
  # Every mako MCP server publishes step-by-step prompts for its own procedures —
  # fifty of them across thirteen servers — and not one manifest reached a single
  # one. Each specialist instead carried a hand-typed paraphrase in its
  # `constraints`, which is a second copy of a procedure with nothing keeping the
  # two in agreement: the server's prompt changes with the code, the paraphrase
  # changes when somebody remembers.
  #
  # A context grant is not a tool grant. Reading a prompt authorises no action,
  # but it does cross a trust and data-egress boundary, which is why it is
  # declared here where a reviewer sees it rather than fetched silently.
  context:
    prompts:
      - server: billingd
        name: check-dynamic-tariff
        max_input_sensitivity: internal
        output_sensitivity: internal
      - server: billingd
        name: 14a-steuerungsrabatt
        max_input_sensitivity: internal
        output_sensitivity: internal

  tools:
    - ref: tool://billingd/list_billing_records
      mutates: false
      max_sensitivity: internal
      description: "list billing records via billingd"
    - ref: tool://billingd/get_billing_record
      mutates: false
      max_sensitivity: internal
      description: "get billing record via billingd"
    - ref: tool://billingd/preview_billing
      mutates: false
      max_sensitivity: internal
      description: "preview billing via billingd"
    - ref: tool://billingd/get_xrechnung
      mutates: false
      max_sensitivity: internal
      description: "get xrechnung via billingd"
    - ref: tool://billingd/check_billing_anomaly
      mutates: false
      max_sensitivity: internal
      description: "check billing anomaly via billingd"
    - ref: tool://billingd/list_vpp_settlements
      mutates: false
      max_sensitivity: internal
      description: "list vpp settlements via billingd"
    - ref: tool://billingd/list_corrections
      mutates: false
      max_sensitivity: internal
      description: "list corrections via billingd"
    - ref: tool://billingd/list_product_categories
      mutates: false
      max_sensitivity: internal
      description: "list product categories via billingd"
    - ref: tool://billingd/validate_tariff_config
      mutates: false
      max_sensitivity: internal
      description: "validate tariff config via billingd"
    - ref: tool://billingd/explain_invoice_position
      mutates: false
      max_sensitivity: internal
      description: "explain invoice position via billingd"
    - ref: tool://billingd/get_billing_summary
      mutates: false
      max_sensitivity: internal
      description: "get billing summary via billingd"
    - ref: tool://marktd/get_malo
      mutates: false
      max_sensitivity: confidential
      description: "get malo via marktd"
    - ref: tool://marktd/list_partners
      mutates: false
      max_sensitivity: confidential
      description: "list partners via marktd"
    - ref: tool://marktd/get_preisblatt
      mutates: false
      max_sensitivity: confidential
      description: "get preisblatt via marktd"
    - ref: tool://marktd/get_versorgungsstatus
      mutates: false
