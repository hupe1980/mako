[package]
name        = "portald"
description = "Customer portal read-model gateway (LF role) — Lastgang, Rechnungen, Dokumente, Kontostand und Versorgungsstatus hinter einer OIDC-API"
version.workspace     = true
authors.workspace     = true
edition.workspace     = true
license.workspace     = true
repository.workspace  = true
rust-version.workspace = true
publish         = false

[lib]
name = "portald"
path = "src/lib.rs"

[[bin]]
name = "portald"
path = "src/main.rs"

[dependencies]
mako-fristen = { workspace = true }
# The BO4E gate. portald is the edge a customer reaches, and the payload it
# forwards to `vertragd` is a `Geschaeftspartner`: gating it here turns a
# mistyped enum into a named field instead of a 502 from one hop away.
mako-markt   = { workspace = true }
mako-service = { workspace = true, features = ["oidc", "cedar", "otel", "metrics"] }
rubo4e       = { workspace = true }
axum         = { version = "0.8" }
tokio        = { version = "1", features = ["full"] }
serde        = { workspace = true, features = ["derive"] }
serde_json   = { workspace = true }
time         = { workspace = true }
uuid         = { workspace = true, features = ["v4", "serde"] }
tracing      = "0.1"
reqwest      = { workspace = true }
anyhow       = "1"
secrecy      = "0.10"
rmcp         = { workspace = true }
tokio-util   = { workspace = true }
futures      = "0.3"

[dev-dependencies]
tower          = "0.5"
http-body-util = "0.1"
toml           = { version = "0.8", default-features = false, features = ["parse"] }
