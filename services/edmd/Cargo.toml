[package]
name             = "edmd"
version.workspace = true
description      = "Energy Data Management daemon — MSCONS storage & time-series API over a meterstore hot/cold tier (PostgreSQL + Apache Iceberg)"
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish          = false

[[bin]]
name = "edmd"
path = "src/main.rs"

[lib]
name = "edmd"
path = "src/lib.rs"

[dependencies]
mako-fristen = { workspace = true }
mako-events = { workspace = true }
mako-markt = { workspace = true, features = ["marktd-client"] }
# The Kapitel-4.6 Messprodukt catalogue: the ESA Typ-2 surveillance sizes its
# silence threshold from the cadence the ordered product publishes.
mako-wim   = { workspace = true }
metering  = { workspace = true, features = ["serde"] }
# `default-features = false` drops meterstore's `rest-catalog` default
# (`iceberg-catalog-rest`): edmd constructs its cold tier with a `SqlCatalog`, not
# the REST *client*. `catalog-facade` is the read-only Iceberg REST *server* edmd
# mounts so external engines (DuckDB/Spark/Trino/PyIceberg) can read the cold tier
# directly — it pulls only `axum` (already a dep), not `reqwest`. `object-store-all`
# enables meterstore's S3/GCS/Azure cold-tier backends: meterstore owns the whole
# Iceberg catalog stack now, so edmd links none of it directly (see below).
meterstore = { version = "0.8", default-features = false, features = ["catalog-facade", "object-store-all"] }
rubo4e     = { workspace = true }

anyhow             = { workspace = true }
thiserror          = { workspace = true }
axum               = { version = "0.8", features = [] }
serde              = { workspace = true }
serde_json         = { workspace = true }
time               = { workspace = true }
uuid               = { workspace = true }
tokio              = { version = "1", features = ["full"] }
tokio-util         = { workspace = true }
tracing            = "0.1"
mako-service       = { workspace = true, features = ["otel", "cedar", "oidc", "rate-limit"] }
krafka             = { workspace = true }
futures            = { version = "0.3", default-features = false, features = ["std"] }
rmcp               = { workspace = true }
# `rust_decimal1` gives `JsonSchema` for `Decimal`, which the MCP tool schemas
# need for their money and energy fields. It used to arrive by accident —
# `rubo4e`'s `schemars` feature selected it, and feature unification handed it
# to edmd, so removing that feature elsewhere broke this build. Declared here
# now, where it is actually used.
schemars           = { workspace = true, features = ["rust_decimal1"] }
secrecy            = "0.10"
subtle             = "2"
reqwest            = { workspace = true }
sqlx               = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "uuid", "time", "json", "rust_decimal"] }
rust_decimal       = { workspace = true }
url                = "2"
bytes              = "1"
num_cpus           = "1"

# ── meterstore cold-tier plumbing ────────────────────────────────────────────
#
# The hot (PostgreSQL) + cold (Apache Iceberg) tiering is owned by `meterstore`,
# including the Iceberg *catalog* stack: `meterstore::IcebergSqlCatalog` builds the
# `SqlCatalog` + object-store backend from a warehouse URI, so edmd links neither
# `iceberg`, `iceberg-catalog-sql` nor `iceberg-storage-opendal` directly — the
# cloud backends come in through meterstore's `object-store-all` feature above.
# `datafusion 53` is here only to name `ScalarValue` for the `tenant` identity
# column; `arrow 58` (workspace) matches the `RecordBatch` major meterstore returns.
datafusion = { version = "53", default-features = false }
arrow      = { workspace = true, features = ["ipc", "prettyprint"] }

[dev-dependencies]
## `test-broker` gives the kafka_ingest e2e test an in-process broker.
krafka              = { workspace = true, features = ["test-broker"] }
tempfile            = "3"
tokio               = { version = "1", features = ["full"] }
tower               = { version = "0.5", features = ["util"] }
## Real-PostgreSQL storage integration tests (`tests/meterstore_integration.rs`).
testcontainers         = { workspace = true }
testcontainers-modules = { workspace = true }
