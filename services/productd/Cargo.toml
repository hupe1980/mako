[package]
name        = "productd"
description = "Product and tariff catalogue daemon (LF role) — Tarifpreisblatt, MaLo-Zuordnung und die EPEX-Spot-Day-Ahead-Reihe für § 41a"
version.workspace     = true
authors.workspace     = true
edition.workspace     = true
license.workspace     = true
repository.workspace  = true
rust-version.workspace = true
publish         = false

[lib]
name = "productd"
path = "src/lib.rs"

[[bin]]
name = "productd"
path = "src/main.rs"

[dependencies]
mako-fristen = { workspace = true }
mako-events = { workspace = true }
# `oidc` implies `cedar`, which is what `policies/productd.cedar` and the
# `CedarEnforcer` in `main` are enforced with — naming it again would be noise.
mako-service = { workspace = true, features = ["oidc", "otel", "metrics"] }
rmcp         = { workspace = true }
schemars     = { workspace = true }
rubo4e       = { workspace = true }
# Shared BO4E boundary helpers (`preistyp` carrier, schema version).
mako-markt   = { workspace = true }
axum         = { version = "0.8" }
sqlx         = { version = "0.8", features = ["postgres", "runtime-tokio-rustls", "time", "uuid", "json", "rust_decimal"] }
tokio        = { version = "1", features = ["full"] }
serde        = { workspace = true, features = ["derive"] }
serde_json   = { workspace = true }
time         = { workspace = true }
time-tz      = { workspace = true }
uuid         = { workspace = true, features = ["v4", "serde"] }
rust_decimal = { workspace = true }
tracing      = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tower-http   = { version = "0.6" }
anyhow       = "1"
secrecy      = { version = "0.10" }
reqwest      = { workspace = true }
tokio-util   = { workspace = true }

[dev-dependencies]
toml = { version = "0.8", default-features = false, features = ["parse"] }
testcontainers = { workspace = true }
testcontainers-modules = { workspace = true }
