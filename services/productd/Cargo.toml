[package]
name        = "productd"
description = "Product and tariff catalogue daemon (LF): Tarifpreisblätter, offers and the EPEX day-ahead series for § 41a tariffs"
version.workspace     = true
authors.workspace     = true
edition.workspace     = true
license.workspace     = true
repository.workspace  = true
rust-version.workspace = true
publish         = false

[lib]
name = "productd"
path = "src/lib.rs"

[[bin]]
name = "productd"
path = "src/main.rs"
# The binary is the one-line runner call; the daemon is tested through the library.
test = false

[dependencies]
mako-fristen = { workspace = true }
mako-events = { workspace = true }
# `oidc` implies `cedar`, which is what `policies/productd.cedar` and the
# `CedarEnforcer` in `main` are enforced with — naming it again would be noise.
mako-service = { workspace = true, features = ["oidc", "otel", "metrics"] }
rmcp         = { workspace = true }
schemars     = { workspace = true }
rubo4e       = { workspace = true }
# Shared BO4E boundary helpers (`preistyp` carrier, schema version).
mako-markt   = { workspace = true }
axum         = { version = "0.8" }
sqlx         = { version = "0.8", features = ["postgres", "runtime-tokio-rustls", "time", "uuid", "json", "rust_decimal"] }
tokio        = { version = "1", features = ["full"] }
serde        = { workspace = true, features = ["derive"] }
serde_json   = { workspace = true }
time         = { workspace = true }
time-tz      = { workspace = true }
uuid         = { workspace = true, features = ["v4", "serde"] }
rust_decimal = { workspace = true }
grid-billing = { workspace = true }
# The BEHG regime, the EBeV emission factor and the § 10 BEHG table — the same
# resolution billingd bills with, so a quotation and its invoice agree.
energy-billing = { workspace = true }
tracing      = "0.1"
anyhow       = "1"
tokio-util   = { workspace = true }

[dev-dependencies]
mako-service = { workspace = true, features = ["testing"] }
toml = { version = "0.8", default-features = false, features = ["parse"] }
testcontainers = { workspace = true }
testcontainers-modules = { workspace = true }

[lints]
workspace = true
