[workspace]
resolver = "2"
members = [
    "crates/edi-energy",
    "makotest",
    "crates/energy-api",
    "crates/mako-engine",
    "crates/mako-gpke",
    "crates/mako-wim",
    "crates/mako-geli-gas",
    "crates/mako-fristen",
    "crates/mako-mabis",
    "crates/mako-as4",
    "crates/mako-redispatch",
    "crates/redispatch-xml",
    "crates/dvgw-edi",
    "crates/mako-gabi-gas",
    "crates/mako-nbw",
    "crates/mako-markt",
    "crates/mako-events",
    "crates/mako-obs",
    "crates/mako-service",
    "crates/mako-plugin",
    "crates/invoic-checker",
    "crates/mako-invoic",
    "crates/mako-pruefung",
    "crates/grid-billing",
    "crates/eeg-billing",
    "crates/energy-billing",
    "services/invoicd",
    "services/makod",
    "services/marktd",
    "services/edmd",
    "services/obsd",
    "services/processd",
    "services/netzbilanzd",
    "services/sperrd",
    "services/einsd",
    "services/productd",
    "services/agentd",
    "services/billingd",
    "services/outputd",
    "services/accountingd",
    "services/portald",
    "services/vertragd",
    "services/mabis-syncd",
    "xtask",
]
exclude = ["fuzz"]

[workspace.package]
version     = "0.17.0"
authors     = ["hupe1980"]
edition     = "2024"
license     = "MIT OR Apache-2.0"
repository  = "https://github.com/hupe1980/mako"
rust-version = "1.94.1"

[workspace.dependencies]
anyhow      = "1"
dashmap     = "6"
edifact-rs   = "~0.16"
miette       = { version = "7", features = ["fancy-no-syscall"] }
# `validate` carries the BO4E cross-field rules (`mako_markt::bo4e`). Off:
# `schemars` (no mako type exposes a rubo4e type in a JSON Schema) and `strum`
# (its `FromStr` accepts the `"UNKNOWN"` catch-all; `from_wire` refuses it).
rubo4e       = { version = "0.13.0", features = ["versioned", "identifiers", "decimal", "time", "validate", "json", "builder"] }
rust_decimal = { version = "1", features = ["db-postgres", "macros"] }
billing      = { version = "0.14.0", features = ["serde"] }
# EN 16931 semantic invoice model + business-rule validation (the `billing`
# adapter bridges the shared money core); en16931-formats renders XRechnung/CII +
# PEPPOL UBL, and its `zugferd` feature *reads* a finished ZUGFeRD PDF — the
# catalogue walk, the CII re-parse and the metadata/payload `Divergence` checks
# outputd's publish gate runs. Writing the carrier is mako's
# (`outputd::document::facturx`), because that crate deliberately ships no
# writer — a position upstream holds by design (fed back to its authors).
en16931         = { version = "0.6.0", features = ["billing", "serde", "time"] }
en16931-formats = { version = "0.6.0", features = ["cii", "ubl", "serde", "zugferd"] }
serde        = { version = "1", features = ["derive"] }
serde_json   = "1"
thiserror    = "2"
time         = { version = "0.3", features = ["std", "macros", "serde-well-known", "serde-human-readable", "parsing", "formatting"] }
time-tz      = { version = "2", features = ["db"] }
uuid         = { version = "1", features = ["v4", "v5", "v7", "serde"] }
tower-http   = { version = "0.6", features = ["trace", "request-id", "propagate-header"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
# OpenTelemetry — used by mako-service (feature=otel) and services
opentelemetry             = "0.32"
opentelemetry_sdk         = { version = "0.32", features = ["rt-tokio"] }
opentelemetry-otlp        = { version = "0.32", features = ["grpc-tonic"] }
opentelemetry-semantic-conventions = "0.32"
cedar-policy              = { version = "4.11", default-features = false }
tracing-opentelemetry     = "0.33"
# jsonwebtoken 11 made crypto pluggable: exactly one backend must be selected or
# every sign/verify panics ("Could not determine the CryptoProvider"). We pick the
# pure-Rust RustCrypto backend (no extra C dependency, unlike aws-lc-rs). `use_pem`
# (default) stays on for the `from_rsa_pem` key loading in mako-service::oidc.
jsonwebtoken              = { version = "11", features = ["rust_crypto"] }
reqwest                   = { version = "0.13", default-features = false, features = ["json", "rustls", "query"] }
tokio-util                = { version = "0.7", features = ["rt"] }
rmcp                      = { version = "3", features = ["transport-io", "transport-streamable-http-server"] }
figment                    = { version = "0.10",  features = ["toml", "env"] }
figment-file-provider-adapter = { version = "0.1", package = "figment_file_provider_adapter" }
schemars                  = { version = "1.2.1" }

# ── Internal workspace crates (path + version so domain crates can be published) ─
edi-energy       = { path = "crates/edi-energy",  version = "0.17" }
mako-engine      = { path = "crates/mako-engine",      version = "0.17" }
mako-markt       = { path = "crates/mako-markt",       version = "0.17" }
mako-events      = { path = "crates/mako-events",      version = "0.17" }
grid-billing     = { path = "crates/grid-billing",     version = "0.17" }
eeg-billing      = { path = "crates/eeg-billing",      version = "0.17" }
mako-obs         = { path = "crates/mako-obs",         version = "0.17" }
mako-wim         = { path = "crates/mako-wim",         version = "0.17" }
mako-gpke        = { path = "crates/mako-gpke",        version = "0.17" }
# The INVOIC settle/dispute state machine, shared by every billing family.
# GPKE, WiM, GaBi Gas and GeLi Gas register a family against it rather than
# re-implementing the process — four copies had already drifted apart.
mako-invoic      = { path = "crates/mako-invoic",      version = "0.17" }
mako-geli-gas    = { path = "crates/mako-geli-gas",    version = "0.17" }
# Every Frist in one leaf crate: BDEW Werktage, the MaKo holiday calendar, and
# the per-Prüfidentifikator Antwortfrist tables. `mako-engine` re-exports it as
# `mako_engine::fristen`, so existing call sites are unchanged.
mako-fristen     = { path = "crates/mako-fristen",     version = "0.17" }
# AS4/ebMS3 stack behind the BDEW MaKo profile. Declared once here because
# mako-as4 and makod both depend on it: independent declarations drift onto two
# versions in one build.
asx-rs           = { version = "0.13" }
mako-service     = { path = "crates/mako-service",     version = "0.17" }
mako-plugin      = { path = "crates/mako-plugin",      version = "0.17" }
invoic-checker   = { path = "crates/invoic-checker",   version = "0.17" }
mako-pruefung      = { path = "crates/mako-pruefung",      version = "0.17" }
energy-billing   = { path = "crates/energy-billing",   version = "0.17" }
dvgw-edi         = { path = "crates/dvgw-edi",         version = "0.17" }
metering         = { version = "0.19" }
sepa             = { version = "0.6.0" }
# Immutable, tamper-evident double-entry ledger kernel (sibling repo). accountingd's
# storage/accounting base. Domain-neutral by design — the BillingDocument→Entry and
# SKR mapping live in accountingd, never in the crate.
doubleentry      = { version = "0.6" }

# Kafka client: pure Rust, MSRV 1.88, zero-unsafe, exactly-once semantics.
# The one consumer is `edmd` (kafka_ingest), for high-volume metering ingest;
# marktd's fan-out is the durable event_log/event_delivery worker and needs no
# broker.
krafka           = { version = "0.20" }

# ── Arrow (edmd meterstore tier) ────────────────────────────────────────────
# `edmd` stores metering time series through the `meterstore` crate, which
# sources Arrow via DataFusion 53 (arrow 58). The workspace `arrow` pin must
# match that major so edmd's Lastgang Arrow-IPC serialisation stays type-
# compatible with the `RecordBatch`es meterstore hands back. meterstore owns the
# cold tier, so edmd declares only the handful of Iceberg catalog crates it needs
# to *construct* one.
arrow                   = { version = "58", default-features = false }

# ── Testing utilities ───────────────────────────────────────────────────────
# testcontainers: spin up Docker containers in Rust integration tests.
# Used by services' `tests/` to validate SQL queries against a real PostgreSQL
# instance (see `just sqlx-prepare` and `just test-integration`).
testcontainers   = { version = "0.23", features = ["blocking"] }
testcontainers-modules = { version = "0.11", features = ["postgres"] }

# ── Release profile ─────────────────────────────────────────────────────────
[profile.release]
opt-level     = 3
lto           = "thin"
codegen-units = 1
strip         = "debuginfo"
