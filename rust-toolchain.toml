[toolchain]
# Pinned to the declared MSRV so every developer and CI lane compiles on exactly
# the same toolchain. Bumping it requires this value and the `msrv` job in
# .github/workflows/ci.yml to move together.
#
# 1.94 is set by `iceberg` (the edmd Iceberg cold tier), which declares
# `rust-version = "1.94"` — the highest of any dependency.
channel    = "1.94"
components = ["rustfmt", "clippy"]
