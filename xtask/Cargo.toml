[package]
name = "xtask"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { workspace = true }
jsonschema = { version = "0.49", default-features = false }
lopdf       = { version = "0.44", default-features = false }
time        = { workspace = true }
zip         = { version = "3", default-features = false, features = ["deflate"] }
quick-xml   = { version = "0.40", features = ["serialize"] }
# The identifier guard validates EIC codes with the same implementation the
# services use, so the check can never disagree with the validator that matters.
rubo4e      = { workspace = true }
# The specialist manifests are YAML, and this check reads two facts out of them
# that decide whether a mutating grant is dispatchable at all. The same parser
# `agentplane` itself uses, so a manifest this accepts is one the runtime loads.
serde_yaml_ng = "0.10"

# `sync-regulatories` mirrors the BDEW document API. `blocking` because xtask is
# a synchronous CLI and an async runtime here would buy nothing; `rustls` to
# match the workspace and avoid a system OpenSSL.
# `gzip` is not an optimisation here: the BDEW server returns a compressed
# body while advertising the *uncompressed* `Content-Length`, so a client
# that does not negotiate and decode gzip sees a short read and reports
# "error decoding response body" on the larger PDFs.
reqwest       = { version = "0.13", default-features = false, features = ["json", "rustls", "blocking", "gzip"] }
# Content hashes in the mirror manifest: BDEW republishes a document under the
# same version when it corrects it, so the version alone cannot say whether the
# local copy is current.
sha2          = "0.10"
