[package]
name        = "mako-conformance"
description = "Checks that a service — mako's own or a replacement — keeps the contract its reference service publishes: REST, events and MCP"
version.workspace      = true
authors.workspace      = true
edition.workspace      = true
license.workspace      = true
repository.workspace   = true
rust-version.workspace = true
publish = false

[[bin]]
name = "mako-conformance"
path = "src/main.rs"

[dependencies]
# The Standard Webhooks check every service runs, never a copy of it.
mako-service = { workspace = true }
mako-events  = { workspace = true }
mako-fristen = { workspace = true }
anyhow       = { workspace = true }
axum         = { version = "0.8" }
jsonschema   = { workspace = true }
reqwest      = { workspace = true }
serde        = { workspace = true }
sha2         = { version = "0.10" }
serde_json   = { workspace = true }
time         = { workspace = true }
tokio        = { version = "1", features = ["full"] }
uuid         = { workspace = true }

tempfile     = "3"

[dev-dependencies]
tokio-stream = "0.1"
vertragd               = { path = "../../services/vertragd" }
sqlx                   = { workspace = true }
testcontainers         = { workspace = true }
testcontainers-modules = { workspace = true }
tokio-util             = { workspace = true }

[lints]
workspace = true
