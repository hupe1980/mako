[build-system]
requires      = ["maturin>=1.9,<2.0"]
build-backend = "maturin"

[project]
name            = "makotest"
# Version comes from Cargo.toml, which inherits `workspace.package.version`,
# so the wheel and the crates it binds can never disagree.
dynamic         = ["version"]
description     = "Test & simulation toolkit for German market-communication (MaKo) platforms"
readme          = "README.md"
requires-python = ">=3.11"
license         = { text = "MIT OR Apache-2.0" }
keywords        = ["energy", "edifact", "bdew", "mako", "testing", "pytest", "bo4e"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Pytest",
    "Intended Audience :: Developers",
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Testing",
]
# No runtime dependencies. Everything regulated is compiled into the extension,
# and the pure-Python layer is stdlib only — including the EPEX generator, whose
# day boundary comes from the platform's own timezone resolution rather than
# from a Python tz database. A test library that pins numpy is a test library
# that fights its consumers' lockfiles.
dependencies = []

[project.optional-dependencies]
# Property-based strategies over the domain types. The only extra: `hypothesis`
# is genuinely imported by `makotest.strategies` and by nothing else.
hypothesis = ["hypothesis>=6.100"]
dev = ["pytest>=8.0", "ruff>=0.6", "makotest[hypothesis]"]

# A domain validator you cannot point at a file from a shell is a library, not a
# toolkit — and the people debugging a real inbound message are not always the
# people writing the tests.
[project.scripts]
makotest = "makotest.cli:main"

[project.urls]
Repository = "https://github.com/hupe1980/mako"

# Discovered by pytest through the standard plugin entry point. The core stays
# importable without pytest — demos and notebooks use the same objects.
[project.entry-points.pytest11]
makotest = "makotest.plugin"

[tool.maturin]
python-source = "python"
module-name   = "makotest._native"
# Enabled only here: declaring `extension-module` as a Cargo feature would make
# `cargo test --workspace --all-features` link the test harness against it and
# fail on undefined Python symbols.
features      = ["pyo3/extension-module"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `tests/` is not a package; conftest.py is imported by the shared helpers.
pythonpath = ["tests"]
# An unknown marker or a typo in an ini key is a silent no-op otherwise, and a
# marker that never applies is a test that never runs.
addopts = "--strict-markers --strict-config"
# A DeprecationWarning from this package is a defect its own suite must not step
# over: consumers run with `-W error` far more often than a library author does.
filterwarnings = ["error"]

[tool.ruff]
line-length = 90
src = ["python", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pycodestyle + pyflakes
    "I",             # import sorting
    "UP",            # pyupgrade — the floor is 3.11
    "B",             # bugbear
    "RUF",
]
# The prose in this package is about a German regulatory domain and quotes it
# directly: „Ablauf des n. Werktages", 92 × 15 min, Δ 12,4 kWh. Rewriting those
# characters as ASCII would make the citations wrong, which is a worse defect
# than the homoglyph confusion the rule guards against.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# The strategy tests import after `importorskip`, which has to run first.
"tests/test_strategies.py" = ["E402"]
