[package]
name        = "makotest-native"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
authors.workspace      = true
description = "PyO3 bindings backing the `makotest` Python toolkit: BDEW identifier check digits, Werktag/Fristen arithmetic, and AHB-validated EDIFACT."
publish     = false

[lib]
# `cdylib` is what maturin packages; `rlib` keeps the Rust logic unit-testable
# with plain `cargo test`.
name       = "makotest_native"
crate-type = ["cdylib", "rlib"]

[dependencies]
mako-events  = { workspace = true }
mako-fristen = { workspace = true }
# The Antwortcode catalogue for every prüfende Rolle: a test toolkit resolves a
# code for any process the platform under test runs, not only the roles that
# platform is deployed as.
#
# `role-nb` is deliberately absent. Only `mako_pruefung::codes` is bound — the
# Codelisten, which are not role-gated — and `role-nb` is the one feature that
# pulls `mako-markt`, and with it `tokio` into a wheel that never runs async.
# The NB trees (`E_0622`, `E_0607`, `E_0623`) are in the catalogue either way;
# `codelisten_do_not_depend_on_the_role_features` pins that.
mako-pruefung = { workspace = true, features = [
    "role-lf", "role-msb", "role-esa", "role-mabis",
] }
edi-energy   = { workspace = true, features = [
    "utilmd", "mscons", "aperak", "contrl", "invoic", "remadv", "orders",
    "iftsta", "insrpt", "reqote", "partin", "ordchg", "ordrsp", "quotes",
    "comdis", "pricat", "utilts",
] }
rubo4e       = { workspace = true }
time         = { workspace = true }

# NOTE: `pyo3/extension-module` is deliberately NOT declared as a feature of this
# package. `maturin` turns it on at build time (see `[tool.maturin] features` in
# pyproject.toml). Declaring it here would make `cargo test --workspace
# --all-features` enable it too, and the test harness would then fail to link
# against libpython.
pyo3 = { version = "0.29", features = ["abi3-py311"] }
