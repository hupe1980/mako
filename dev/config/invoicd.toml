# invoicd.toml — local development: `just dev invoicd` starts invoicd with this file against
# the PostgreSQL of dev/docker-compose.yml (`just infra-up`). Authentication is
# off and the secrets are fixed strings. DO NOT use in production.
#
# Every key can be overridden by an environment variable — `INVOICD_<KEY>`, nested
# keys joined with `__`. `invoicd --help` lists the conventions.

allow_insecure_no_auth = true

[http]
addr = "127.0.0.1:8280"

[database]
url = "postgres://dev:dev@localhost:5432/invoicd"

[identity]
tenant = "9900357000004"

[makod]
url     = "http://127.0.0.1:8080"
api_key = "dev-makod-key"

[marktd]
url     = "http://127.0.0.1:8180"
api_key = "dev-marktd-key"
