# obsd.toml — local development: `just dev obsd` starts obsd with this file against
# the PostgreSQL of dev/docker-compose.yml (`just infra-up`). Authentication is
# off and the secrets are fixed strings. DO NOT use in production.
#
# Every key can be overridden by an environment variable — `OBSD_<KEY>`, nested
# keys joined with `__`. `obsd --help` lists the conventions.

allow_insecure_no_auth = true

[http]
addr = "127.0.0.1:8480"

[database]
url = "postgres://dev:dev@localhost:5432/obsd"

[identity]
tenant = "9900357000004"

[marktd]
url     = "http://127.0.0.1:8180"
api_key = "dev-marktd-key"
