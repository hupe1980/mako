# vertragd.toml — local development: `just dev vertragd` starts vertragd with this file against
# the PostgreSQL of dev/docker-compose.yml (`just infra-up`). Authentication is
# off and the secrets are fixed strings. DO NOT use in production.
#
# Every key can be overridden by an environment variable — `VERTRAGD_<KEY>`, nested
# keys joined with `__`. `vertragd --help` lists the conventions.

allow_insecure_no_auth = true

tenant   = "9900357000004"
lf_mp_id = "9900357000004"

processd_url    = "http://127.0.0.1:8580"
accountingd_url = "http://127.0.0.1:9380"
edmd_url        = "http://127.0.0.1:8380"
outputd_url     = "http://127.0.0.1:9880"

[http]
addr = "127.0.0.1:9780"

[database]
url = "postgres://dev:dev@localhost:5432/vertragd"

[absender]
name         = "Dev Energie GmbH"
line1        = "Musterstr. 1"
post_code    = "10115"
city         = "Berlin"
vat_id       = "DE123456789"
contact_name = "Kundenservice"
phone        = "+49 30 123456"
email        = "service@dev-energie.example"
