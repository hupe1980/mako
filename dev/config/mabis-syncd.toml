# mabis-syncd.toml — local development: `just dev mabis-syncd` starts mabis-syncd with this file against
# the PostgreSQL of dev/docker-compose.yml (`just infra-up`). Authentication is
# off and the secrets are fixed strings. DO NOT use in production.
#
# Every key can be overridden by an environment variable — `MABIS_SYNCD_<KEY>`, nested
# keys joined with `__`. `mabis-syncd --help` lists the conventions.

allow_insecure_no_auth = true

[http]
addr = "127.0.0.1:8880"

[database]
url = "postgres://dev:dev@localhost:5432/mabis_syncd"

# The Netzbetreiber filing, the ÜNB receiving, and the Bilanzierungsgebiet the
# Summenzeitreihen are for — synthetic codes, EIC check character included.
[identity]
tenant                 = "9900357000004"
sender_mp_id           = "9900357000004"
receiver_mp_id         = "9900077000006"
bilanzierungsgebiet_id = "11YMAKO-TEST-01U"

[edmd]
url     = "http://127.0.0.1:8380"
api_key = "dev-edmd-key"

[marktd]
url     = "http://127.0.0.1:8180"
api_key = "dev-marktd-key"

[makod]
url     = "http://127.0.0.1:8080"
api_key = "dev-makod-key"
