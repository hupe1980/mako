# productd.toml — local development: `just dev productd` starts productd with this file against
# the PostgreSQL of dev/docker-compose.yml (`just infra-up`). Authentication is
# off and the secrets are fixed strings. DO NOT use in production.
#
# Every key can be overridden by an environment variable — `PRODUCTD_<KEY>`, nested
# keys joined with `__`. `productd --help` lists the conventions.

allow_insecure_no_auth = true

tenant   = "9900357000004"
lf_mp_id = "9900357000004"

# A Gas quotation for a year § 10 BEHG fixes no price for is priced under
# billingd's `[policy] behg_regime`, read from its GET /api/v1/policy.
billingd_url = "http://127.0.0.1:9280"

[http]
addr = "127.0.0.1:9080"

[database]
url = "postgres://dev:dev@localhost:5432/productd"
