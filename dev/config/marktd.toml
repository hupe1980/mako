# marktd.toml — local development: `just dev marktd` starts marktd with this file against
# the PostgreSQL of dev/docker-compose.yml (`just infra-up`). Authentication is
# off and the secrets are fixed strings. DO NOT use in production.
#
# Every key can be overridden by an environment variable — `MARKTD_<KEY>`, nested
# keys joined with `__`. `marktd --help` lists the conventions.

allow_insecure_no_auth = true

[database]
url = "postgres://dev:dev@localhost:5432/marktd"

[http]
addr = "127.0.0.1:8180"

[markt]
tenant = "9900357000004"

[makod]
base_url = "http://127.0.0.1:8080"
api_key  = "dev-makod-key"

[webhook]
inbound_path   = "/api/v1/events"
inbound_secret = "dev-webhook-secret"
