# sperrd.toml — local development: `just dev sperrd` starts sperrd with this file against
# the PostgreSQL of dev/docker-compose.yml (`just infra-up`). Authentication is
# off and the secrets are fixed strings. DO NOT use in production.
#
# Every key can be overridden by an environment variable — `SPERRD_<KEY>`, nested
# keys joined with `__`. `sperrd --help` lists the conventions.

allow_insecure_no_auth = true

port          = 8780
tenant        = "9900357000004"
makod_url     = "http://127.0.0.1:8080"
makod_api_key = "dev-makod-key"

[database]
url = "postgres://dev:dev@localhost:5432/sperrd"
