# netzbilanzd.toml — local development: `just dev netzbilanzd` starts netzbilanzd with this file against
# the PostgreSQL of dev/docker-compose.yml (`just infra-up`). Authentication is
# off and the secrets are fixed strings. DO NOT use in production.
#
# Every key can be overridden by an environment variable — `NETZBILANZD_<KEY>`, nested
# keys joined with `__`. `netzbilanzd --help` lists the conventions.

allow_insecure_no_auth = true

port           = 8680
tenant         = "9900357000004"
marktd_url     = "http://127.0.0.1:8180"
marktd_api_key = "dev-marktd-key"
makod_url      = "http://127.0.0.1:8080"
makod_api_key  = "dev-makod-key"
edmd_url       = "http://127.0.0.1:8380"
edmd_api_key   = "dev-edmd-key"

[database]
url = "postgres://dev:dev@localhost:5432/netzbilanzd"
