[alias]
xtask = "run --package xtask --"

# `makotest` builds against PyO3 with `abi3-py311`, so any workspace-wide cargo
# command — `cargo test --workspace`, `just ci`, `just doc-check` — needs a
# Python ≥ 3.11. Left unset, PyO3 picks the first `python3` on PATH, which on
# macOS is still the system 3.9, and the whole workspace fails to build on a
# message about a crate nobody was working on.
#
# Cargo does not override an environment variable that is already set, so a dev
# who points PYO3_PYTHON somewhere else keeps their choice. `relative = true`
# resolves against the directory holding `.cargo`, i.e. the workspace root.
[env]
PYO3_PYTHON = { value = ".venv/bin/python", relative = true, force = false }
